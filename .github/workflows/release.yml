name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 55

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron-frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: electron-frontend
        run: npm ci

      - name: Run backend tests
        run: python -m pytest -q

      - name: Frontend lint and build
        working-directory: electron-frontend
        run: |
          npm run lint
          npm run build

      - name: Bundle Python (python-build-standalone)
        # Downloads a self-contained Python 3.11 from astral-sh/python-build-standalone,
        # installs runtime packages into it, and places it at python-bundle/ so
        # Electron Forge can include it as an extraResource in the installer.
        # No .pth file hacks needed — this distribution works out of the box.
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest" `
            -Headers @{ 'User-Agent' = 'JPLearn-CI' }

          $asset = $release.assets | Where-Object {
              $_.name -match 'cpython-3\.11\.' -and
              $_.name -match 'x86_64-pc-windows-msvc' -and
              $_.name -match 'install_only_stripped' -and
              $_.name.EndsWith('.tar.gz')
          } | Select-Object -First 1

          if (-not $asset) {
              Write-Error "Could not find Python 3.11 Windows x64 install_only asset in $($release.tag_name)"
              exit 1
          }

          $sizeMb = [math]::Round($asset.size / 1MB, 1)
          Write-Host "Downloading $($asset.name) ($sizeMb MB) from $($release.tag_name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile python-bundle.tar.gz

          New-Item -ItemType Directory -Path python-bundle -Force | Out-Null
          tar -xzf python-bundle.tar.gz -C python-bundle

          $pythonExe = "python-bundle\python\python.exe"
          if (-not (Test-Path $pythonExe)) {
              Write-Error "python.exe not found at $pythonExe after extraction"
              Get-ChildItem python-bundle -Recurse | Select-Object -First 20
              exit 1
          }

          Write-Host "Installing runtime packages into bundle..."
          & $pythonExe -m pip install psutil --quiet

          Write-Host "Trimming Python test suite to reduce installer size..."
          $toRemove = @(
            "python-bundle\python\Lib\test",
            "python-bundle\python\Lib\unittest\test",
            "python-bundle\python\Lib\email\test",
            "python-bundle\python\Lib\tkinter"
          )
          foreach ($dir in $toRemove) {
            if (Test-Path $dir) {
              Remove-Item -Recurse -Force $dir
              Write-Host "  removed: $dir"
            }
          }

          Write-Host "Python bundle ready: $(& $pythonExe --version)"

      - name: Build Windows installer
        working-directory: electron-frontend
        # JPLEARN_DOCUMENTS_DIR is set to a temp path so the build step
        # doesn't attempt to read/write the developer's Documents folder.
        env:
          JPLEARN_DOCUMENTS_DIR: ${{ runner.temp }}\jplearn-build-data
        run: npm run make:win

      - name: Find installer
        id: find_installer
        working-directory: electron-frontend
        run: |
          $installer = Get-ChildItem -Path "out/make/squirrel.windows/x64" -Filter "JPLearn-Installer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer not found in out/make/squirrel.windows/x64/"
            exit 1
          }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.find_installer.outputs.path }}
          name: JPLearn ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## JPLearn ${{ github.ref_name }}

            **Requirements:** Python 3.11+ must be installed on your system.

            ### Installation
            1. Download and run `${{ steps.find_installer.outputs.name }}`
            2. If Windows shows a SmartScreen warning, click **More info → Run anyway** (the app is unsigned)
            3. On first launch, a setup wizard will offer to download the AI tutor model and Japanese voice engine

            ### Optional components (downloaded by wizard or manually)
            - **AI Tutor:** `python scripts/get_gguf_model.py`
            - **Japanese Voice:** Installed from the in-app setup wizard (optional component)

            ### Building from source
            See the [README](README.md) for full build instructions.
