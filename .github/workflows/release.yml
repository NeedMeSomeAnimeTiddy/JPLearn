name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  build-and-release:
    # Tag pushes only, so there is no fork-PR exposure to guard against here.
    runs-on: [self-hosted, windows]
    # Raised from 55: this took under nine minutes on a hosted runner, but it downloads a
    # Python distribution and builds a Squirrel installer, both of which are slower on one
    # shared VM.
    timeout-minutes: 90

    defaults:
      run:
        # Windows PowerShell 5.1, not pwsh: PowerShell 7 ships with GitHub-hosted
        # runners but not with a plain Windows install, and the self-hosted runner
        # has no pwsh on PATH. Everything here -- including scripts/bundle_python.ps1
        # -- is written to run under 5.1.
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check toolchain
        # actions/setup-python and actions/setup-node are deliberately not used here.
        # setup-python's installer does a per-machine install and rewrites registry
        # entries, which needs administrator rights the runner service does not have --
        # it fails with "Error happened during Python installation". A dedicated build
        # VM is better off with the toolchain installed once anyway: no download and
        # install on every run, and the same interpreter the local checks use.
        run: |
          $problems = @()

          $python = Get-Command python -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $python) {
            $problems += "python is not on PATH"
          } else {
            $version = (& $python.Source --version) -replace '^Python ', ''
            Write-Host "python  $version  ($($python.Source))"
            if ($version -notmatch '^3\.11\.') {
              $problems += "python is $version, expected 3.11.x"
            }
          }

          $node = Get-Command node -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $node) {
            $problems += "node is not on PATH"
          } else {
            $version = (& $node.Source --version) -replace '^v', ''
            Write-Host "node    $version  ($($node.Source))"
            # 22 or newer, not pinned to 22: package.json has no engines field and
            # local development runs 24, which is what every check was verified on.
            $major = [int](($version -split '\.')[0])
            if ($major -lt 22) {
              $problems += "node is $version, expected 22 or newer"
            }
          }

          if ($problems.Count -gt 0) {
            Write-Host ""
            Write-Host "This runner is missing part of the toolchain:" -ForegroundColor Red
            $problems | ForEach-Object { Write-Host "  - $_" -ForegroundColor Red }
            Write-Host ""
            Write-Host "Install Python 3.11 and Node 22+ on the runner machine and restart"
            Write-Host "the runner so it picks up the new PATH."
            exit 1
          }

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: electron-frontend
        run: npm ci

      - name: Run backend tests
        run: python -m pytest -q

      - name: Frontend lint and build
        working-directory: electron-frontend
        run: |
          npm run lint
          npm run build

      - name: Bundle Python (python-build-standalone)
        # Downloads a self-contained Python 3.11, installs runtime packages into it,
        # and places it at python-bundle/ so Electron Forge can include it as an
        # extraResource in the installer. The logic lives in the script rather than
        # here so the installer can also be built locally or on a self-hosted runner.
        #
        # -Force because a self-hosted runner keeps its workspace between runs: a
        # release must never ship a bundle left over from an earlier build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bundle_python.ps1 -Force

      - name: Build Windows installer
        working-directory: electron-frontend
        # JPLEARN_DOCUMENTS_DIR is set to a temp path so the build step
        # doesn't attempt to read/write the developer's Documents folder.
        env:
          JPLEARN_DOCUMENTS_DIR: ${{ runner.temp }}\jplearn-build-data
        run: npm run make:win

      - name: Find installer
        id: find_installer
        working-directory: electron-frontend
        run: |
          $installer = Get-ChildItem -Path "out/make/squirrel.windows/x64" -Filter "JPLearn-Installer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer not found in out/make/squirrel.windows/x64/"
            exit 1
          }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.find_installer.outputs.path }}
          name: JPLearn ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## JPLearn ${{ github.ref_name }}

            **Requirements:** Python 3.11+ must be installed on your system.

            ### Installation
            1. Download and run `${{ steps.find_installer.outputs.name }}`
            2. If Windows shows a SmartScreen warning, click **More info → Run anyway** (the app is unsigned)
            3. On first launch, a setup wizard will offer to download the AI tutor model and Japanese voice engine

            ### Optional components (downloaded by wizard or manually)
            - **AI Tutor:** `python scripts/get_gguf_model.py`
            - **Japanese Voice:** Installed from the in-app setup wizard (optional component)

            ### Building from source
            See the [README](README.md) for full build instructions.
