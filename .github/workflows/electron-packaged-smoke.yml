name: Electron Packaged Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron-frontend/**'
      - '.github/workflows/electron-packaged-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'electron-frontend/**'
      - '.github/workflows/electron-packaged-smoke.yml'

jobs:
  windows-packaged-smoke:
    runs-on: [self-hosted, windows]
    # A self-hosted runner executes workflow code on a personal machine, so pull requests
    # from forks of this public repository are not run here; same-repository branches and
    # pushes are.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Raised from 25: that fitted a hosted runner, where this job took about six minutes.
    # One VM running jobs serially is a good deal slower, and a timeout kill reads exactly
    # like a real failure.
    timeout-minutes: 60

    defaults:
      run:
        # Windows PowerShell 5.1, not pwsh: PowerShell 7 ships with GitHub-hosted
        # runners but not with a plain Windows install, and the self-hosted runner
        # has no pwsh on PATH. Everything here -- including scripts/bundle_python.ps1
        # -- is written to run under 5.1.
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check toolchain
        # actions/setup-python and actions/setup-node are deliberately not used here.
        # setup-python's installer does a per-machine install and rewrites registry
        # entries, which needs administrator rights the runner service does not have --
        # it fails with "Error happened during Python installation". A dedicated build
        # VM is better off with the toolchain installed once anyway: no download and
        # install on every run, and the same interpreter the local checks use.
        run: |
          $problems = @()
          $pythonExe = $null

          $onPath = Get-Command python -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($onPath) {
            $pythonExe = $onPath.Source
          } else {
            # Fall back to the py launcher. It installs to a fixed location for all
            # users and knows every interpreter on the machine, whereas PATH depends on
            # an installer checkbox that defaults to off and on the runner service
            # having been restarted since.
            $launcher = Get-Command py -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($launcher) {
              $resolved = & $launcher.Source -3.11 -c "import sys; print(sys.executable)" 2>$null
              if ($LASTEXITCODE -eq 0 -and $resolved) {
                $pythonExe = "$resolved".Trim()
                Write-Host "python is not on PATH; the py launcher resolved 3.11 instead"
              }
            }
          }

          if (-not $pythonExe) {
            $problems += "no Python 3.11 found, on PATH or via the py launcher"
          } else {
            $version = (& $pythonExe --version) -replace '^Python ', ''
            Write-Host "python  $version  ($pythonExe)"
            if ($version -notmatch '^3\.11\.') {
              $problems += "python is $version, expected 3.11.x"
            }
          }

          $node = Get-Command node -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $node) {
            $problems += "node is not on PATH"
          } else {
            $version = (& $node.Source --version) -replace '^v', ''
            Write-Host "node    $version  ($($node.Source))"
            # 22 or newer, not pinned to 22: package.json has no engines field and
            # local development runs 24, which is what every check was verified on.
            $major = [int](($version -split '\.')[0])
            if ($major -lt 22) {
              $problems += "node is $version, expected 22 or newer"
            }
          }

          if ($problems.Count -gt 0) {
            Write-Host ""
            Write-Host "This runner is missing part of the toolchain:" -ForegroundColor Red
            $problems | ForEach-Object { Write-Host "  - $_" -ForegroundColor Red }

            # A tool that is installed but invisible here looks identical to one that
            # was never installed, and the two have completely different fixes. Report
            # enough to tell them apart.
            Write-Host ""
            Write-Host "Runner account: $(whoami)"
            $candidates = @(
              "$env:LOCALAPPDATA\Programs\Python",
              "$env:ProgramFiles\Python311",
              "${env:ProgramFiles(x86)}\Python311",
              "C:\Python311"
            ) | Where-Object { $_ -and (Test-Path $_) }
            if ($candidates) {
              Write-Host "Python exists here but this process cannot reach it:"
              $candidates | ForEach-Object { Write-Host "  $_" }
              Write-Host "A per-user install belongs to the installing account, not to"
              Write-Host "$(whoami) -- reinstall for all users."
            }

            Write-Host ""
            Write-Host "Install Python 3.11 and Node 22+ for all users, then restart the"
            Write-Host "runner: a running service keeps the PATH it started with."
            exit 1
          }

          # Publish the interpreter to every later step. The packaged app reads
          # JPLEARN_PYTHON first (electron/main.cjs::resolvePythonCommand) and would
          # otherwise fall back to a bare `python` that is not on this runner's PATH,
          # so the packaged smoke test would start an app whose backend never answers.
          Split-Path -Parent $pythonExe | Add-Content -Path $env:GITHUB_PATH -Encoding utf8
          "JPLEARN_PYTHON=$pythonExe" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8

      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: electron-frontend
        run: npm ci

      - name: Run frontend contract tests
        working-directory: electron-frontend
        run: npm run test:ui

      - name: Run backend bridge contract tests
        run: python -m pytest tests/test_desktop_bridge.py -q

      - name: Frontend lint and build
        working-directory: electron-frontend
        run: |
          npm run lint
          npm run build

      - name: Package Electron app
        working-directory: electron-frontend
        run: npm run package

      - name: Run packaged smoke test
        working-directory: electron-frontend
        run: npm run smoke:packaged

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-packaged-smoke-artifacts
          path: |
            electron-frontend/.smoke/**
            electron-frontend/out/**
          if-no-files-found: warn
