name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  build-and-release:
    # Tag pushes only, so there is no fork-PR exposure to guard against here.
    runs-on: [self-hosted, windows]
    # Raised from 55: this took under nine minutes on a hosted runner, but it downloads a
    # Python distribution and builds a Squirrel installer, both of which are slower on one
    # shared VM.
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron-frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: electron-frontend
        run: npm ci

      - name: Run backend tests
        run: python -m pytest -q

      - name: Frontend lint and build
        working-directory: electron-frontend
        run: |
          npm run lint
          npm run build

      - name: Bundle Python (python-build-standalone)
        # Downloads a self-contained Python 3.11, installs runtime packages into it,
        # and places it at python-bundle/ so Electron Forge can include it as an
        # extraResource in the installer. The logic lives in the script rather than
        # here so the installer can also be built locally or on a self-hosted runner.
        #
        # -Force because a self-hosted runner keeps its workspace between runs: a
        # release must never ship a bundle left over from an earlier build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bundle_python.ps1 -Force

      - name: Build Windows installer
        working-directory: electron-frontend
        # JPLEARN_DOCUMENTS_DIR is set to a temp path so the build step
        # doesn't attempt to read/write the developer's Documents folder.
        env:
          JPLEARN_DOCUMENTS_DIR: ${{ runner.temp }}\jplearn-build-data
        run: npm run make:win

      - name: Find installer
        id: find_installer
        working-directory: electron-frontend
        run: |
          $installer = Get-ChildItem -Path "out/make/squirrel.windows/x64" -Filter "JPLearn-Installer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer not found in out/make/squirrel.windows/x64/"
            exit 1
          }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.find_installer.outputs.path }}
          name: JPLearn ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## JPLearn ${{ github.ref_name }}

            **Requirements:** Python 3.11+ must be installed on your system.

            ### Installation
            1. Download and run `${{ steps.find_installer.outputs.name }}`
            2. If Windows shows a SmartScreen warning, click **More info → Run anyway** (the app is unsigned)
            3. On first launch, a setup wizard will offer to download the AI tutor model and Japanese voice engine

            ### Optional components (downloaded by wizard or manually)
            - **AI Tutor:** `python scripts/get_gguf_model.py`
            - **Japanese Voice:** Installed from the in-app setup wizard (optional component)

            ### Building from source
            See the [README](README.md) for full build instructions.
