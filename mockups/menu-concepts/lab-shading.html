   what a stylised scene wants; it is not a real bokeh and does not pretend to be. */
const matDof = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uTexel: { value: new THREE.Vector2() }, radius: POST.dofRadius },
  vertexShader: VS,
  fragmentShader: [
    'varying vec2 vUv; uniform sampler2D tSrc; uniform vec2 uTexel; uniform float radius;',
    'void main() {',
    '  vec3 sum = texture2D( tSrc, vUv ).rgb;',
    '  for ( int i = 0; i < 12; i++ ) {',
    '    float a = float( i ) * 2.39996323;',
    '    float r = sqrt( float( i ) + 0.5 ) * 0.2887;',
    '    sum += texture2D( tSrc, vUv + vec2( cos( a ), sin( a ) ) * r * radius * uTexel * 8.0 ).rgb;',
    '  }',
    '  gl_FragColor = vec4( sum / 13.0, 1.0 );',
    '}',
  ].join('\n'),
});

/* ---- Kuwahara: the painterly one ----
   Four overlapping quadrants around each pixel; take the mean of whichever has the least
   variance. That is what makes it flatten interiors while KEEPING edges sharp, where a blur
   softens both — the result reads as brushwork rather than as a smeared photograph. Thirty-six
   taps a pixel at full resolution, which is why it is off by default. */
const matPaint = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uTexel: { value: new THREE.Vector2() } },
  vertexShader: VS,
  fragmentShader: [
    'varying vec2 vUv; uniform sampler2D tSrc; uniform vec2 uTexel;',
    'void main() {',
    '  vec3 m0 = vec3( 0.0 ), m1 = m0, m2 = m0, m3 = m0;',
    '  vec3 s0 = vec3( 0.0 ), s1 = s0, s2 = s0, s3 = s0;',
    '  const int R = 2;',
    '  for ( int j = 0; j <= R; j++ ) {',
    '    for ( int i = 0; i <= R; i++ ) {',
    '      vec2 o = vec2( float( i ), float( j ) ) * uTexel;',
    '      vec3 a = texture2D( tSrc, vUv + vec2( -o.x, -o.y ) ).rgb; m0 += a; s0 += a * a;',
    '      vec3 b = texture2D( tSrc, vUv + vec2(  o.x, -o.y ) ).rgb; m1 += b; s1 += b * b;',
    '      vec3 cc = texture2D( tSrc, vUv + vec2( -o.x,  o.y ) ).rgb; m2 += cc; s2 += cc * cc;',
    '      vec3 d = texture2D( tSrc, vUv + vec2(  o.x,  o.y ) ).rgb; m3 += d; s3 += d * d;',
    '    }',
    '  }',
    '  float n = float( ( R + 1 ) * ( R + 1 ) );',
    '  m0 /= n; m1 /= n; m2 /= n; m3 /= n;',
    '  s0 = abs( s0 / n - m0 * m0 ); s1 = abs( s1 / n - m1 * m1 );',
    '  s2 = abs( s2 / n - m2 * m2 ); s3 = abs( s3 / n - m3 * m3 );',
    '  float v0 = s0.r + s0.g + s0.b, v1 = s1.r + s1.g + s1.b;',
    '  float v2 = s2.r + s2.g + s2.b, v3 = s3.r + s3.g + s3.b;',
    '  vec3 outc = m0; float best = v0;',
    '  if ( v1 < best ) { outc = m1; best = v1; }',
    '  if ( v2 < best ) { outc = m2; best = v2; }',
    '  if ( v3 < best ) { outc = m3; }',
    '  gl_FragColor = vec4( outc, 1.0 );',
    '}',
  ].join('\n'),
});
/* ============================ THE COMPOSITE ============================
   ORDER IS THE WHOLE DESIGN HERE, and it is not arbitrary. Four stages, and an effect in the
   wrong one is not a subtler version of itself, it is wrong:

     1  GEOMETRY  — distortion and chromatic aberration decide WHERE to read, so they must run
                    before anything reads. Applied afterwards they smear the grain and the ink
                    lines too, which are supposed to be on the paper, not in the lens.
     2  LIGHT     — bloom, halation, streak, shafts. All additive, all in LINEAR light, all
                    before the tone curve, because that is where light adds.
     3  GRADE     — exposure, ACES, lift/contrast/saturation, split tone, bleach. Display space.
     4  PRINT     — ink, posterise, paper, vignette. These are marks ON the image rather than
                    properties OF it, so nothing after them is allowed to blur or tint them. */
const matComposite = new THREE.ShaderMaterial({
  uniforms: {
    tSrc: { value: rtScene.texture }, tBloom: { value: rtB.texture },
    tOcc: { value: rtSharp.texture }, tDof: { value: rtDof.texture },
    tHalo: { value: rtHalo.texture }, tStreak: { value: rtStreak.texture },
    tDepth: { value: rtScene.depthTexture }, tPaper: { value: NOISE_TEX },
    exposure: POST.exposure, bloomAmt: POST.bloomAmt, grain: POST.grain,
    vignette: POST.vignette, splitShadow: POST.splitShadow, splitHigh: POST.splitHigh,
    splitAmt: POST.splitAmt, uTime: POST.uTime, uRes: { value: new THREE.Vector2(1, 1) },
    lift: POST.lift, contrast: POST.contrast, sat: POST.sat, bloomTint: POST.bloomTint,
    shaftAmt: POST.shaftAmt, shaftDensity: POST.shaftDensity, shaftDecay: POST.shaftDecay,
    sunUv: POST.sunUv, sunVis: POST.sunVis,
    dofAmt: POST.dofAmt, dofFocus: POST.dofFocus, dofRange: POST.dofRange, dofMax: POST.dofMax,
    inkAmt: POST.inkAmt, inkThresh: POST.inkThresh, inkWidth: POST.inkWidth,
    creaseAmt: POST.creaseAmt, creaseThresh: POST.creaseThresh, inkDebug: POST.inkDebug,
    creaseGraze: POST.creaseGraze,
    caAmt: POST.caAmt, distortAmt: POST.distortAmt,
    haloAmt: POST.haloAmt, haloTint: POST.haloTint, streakAmt: POST.streakAmt,
    sharpenAmt: POST.sharpenAmt, paperAmt: POST.paperAmt,
    posterAmt: POST.posterAmt, posterLevels: POST.posterLevels, bleachAmt: POST.bleachAmt,
    uNear: POST.uNear, uFar: POST.uFar,
  },
  vertexShader: VS,
  fragmentShader: [
    'varying vec2 vUv;',
    'uniform sampler2D tSrc, tBloom, tOcc, tDof, tHalo, tStreak, tDepth, tPaper;',
    'uniform float exposure, bloomAmt, grain, vignette, splitAmt, uTime;',
    'uniform float lift, contrast, sat;',
    'uniform float shaftAmt, shaftDensity, shaftDecay, sunVis;',
    'uniform float dofAmt, dofFocus, dofRange, dofMax;',
    'uniform float inkAmt, inkThresh, inkWidth, creaseAmt, creaseThresh, inkDebug;',
    'uniform float creaseGraze;',
    'uniform float caAmt, distortAmt, haloAmt, streakAmt;',
    'uniform float sharpenAmt, paperAmt, posterAmt, posterLevels, bleachAmt;',
    'uniform float uNear, uFar;',
    'uniform vec3 bloomTint, splitShadow, splitHigh, haloTint;',
    'uniform vec2 sunUv, uRes;',
    /* Narkowicz ACES: one polynomial, close enough to the real curve at a fraction of the cost */
    'vec3 aces( vec3 x ) {',
    '  return clamp( ( x * ( 2.51 * x + 0.03 ) ) / ( x * ( 2.43 * x + 0.59 ) + 0.14 ), 0.0, 1.0 );',
    '}',
    'vec3 lin2srgb( vec3 c ) {',
    '  c = max( c, vec3( 0.0 ) );',
    '  return mix( 1.055 * pow( c, vec3( 1.0 / 2.4 ) ) - 0.055, c * 12.92, step( c, vec3( 0.0031308 ) ) );',
    '}',
    'float hash( vec2 p ) { return fract( sin( dot( p, vec2( 127.1, 311.7 ) ) ) * 43758.5453 ); }',
    'float luma( vec3 c ) { return dot( c, vec3( 0.2126, 0.7152, 0.0722 ) ); }',
    /* the depth texture is non-linear; every question asked of it wants metres */
    'float linDepth( float dz ) {',
    '  float z = dz * 2.0 - 1.0;',
    '  return ( 2.0 * uNear * uFar ) / ( uFar + uNear - z * ( uFar - uNear ) );',
    '}',
    /* the 4x4 ordered matrix in closed form — GLSL ES 1.0 has no indexable constant array */
    'float bayer2( vec2 a ) { a = floor( a ); return fract( a.x * 0.5 + a.y * a.y * 0.75 ); }',
    'float bayer4( vec2 a ) { return bayer2( a * 0.5 ) * 0.25 + bayer2( a ); }',
    'vec3 overlay( vec3 b, vec3 t ) {',
    '  return mix( 2.0 * b * t, 1.0 - 2.0 * ( 1.0 - b ) * ( 1.0 - t ), step( 0.5, b ) );',
    '}',

    'void main() {',
    /* ---------------- 1. GEOMETRY ---------------- */
    '  vec2 d0 = vUv - 0.5;',
    '  float r2 = dot( d0, d0 );',
    /* barrel distortion: everything reads from slightly further out toward the corners */
    '  vec2 uvD = vUv + d0 * r2 * distortAmt;',
    /* CHROMATIC ABERRATION IS A RADIAL EFFECT, NOT A CONSTANT OFFSET. A fixed shift puts a
       colour fringe on the middle of the frame, where a real lens has none — the whole point is
       that it grows with distance from the axis, which is r2 here. */
    '  vec2 caOff = d0 * r2 * caAmt * 0.06;',
    '  vec3 sharpC = vec3(',
    '    texture2D( tSrc, uvD + caOff ).r,',
    '    texture2D( tSrc, uvD ).g,',
    '    texture2D( tSrc, uvD - caOff ).b );',

    /* ---------------- 2. FOCUS ---------------- */
    /* CoC is symmetric about the focus plane and SMOOTHSTEPPED, because a linear ramp puts a
       visible seam where the blur begins and the eye finds it immediately */
    '  float dep = linDepth( texture2D( tDepth, uvD ).x );',
    '  float coc = clamp( abs( dep - dofFocus ) / max( dofRange, 1.0 ), 0.0, 1.0 );',
    '  coc = coc * coc * ( 3.0 - 2.0 * coc ) * dofMax * dofAmt;',
    '  vec3 c = mix( sharpC, texture2D( tDof, uvD ).rgb, coc );',

    /* ---------------- 3. SHARPEN ---------------- */
    /* unsharp against a four-tap cross, and NEVER on what focus just blurred — sharpening the
       out-of-focus half is how a depth-of-field pass ends up looking like a filter */
    '  if ( sharpenAmt > 0.0 ) {',
    '    vec2 t = 1.0 / uRes;',
    '    vec3 bl = ( texture2D( tSrc, uvD + vec2( t.x, 0.0 ) ).rgb',
    '              + texture2D( tSrc, uvD - vec2( t.x, 0.0 ) ).rgb',
    '              + texture2D( tSrc, uvD + vec2( 0.0, t.y ) ).rgb',
    '              + texture2D( tSrc, uvD - vec2( 0.0, t.y ) ).rgb ) * 0.25;',
    '    c += ( c - bl ) * sharpenAmt * ( 1.0 - coc );',
    '  }',

    /* ---------------- 4. LIGHT, all additive and all pre-curve ---------------- */
    '  c += texture2D( tBloom, uvD ).rgb * bloomAmt * bloomTint;',
    /* HALATION IS NOT BLOOM WITH A BIGGER RADIUS. On film it is light scattering off the back
       of the base and re-exposing the RED layer, so it is wide, weak and warm, and it is the
       warmth that reads — a neutral wide bloom just looks like fog. */
    '  c += texture2D( tHalo, uvD ).rgb * haloAmt * haloTint;',
    '  c += texture2D( tStreak, uvD ).rgb * streakAmt;',
    '  if ( sunVis > 0.0 && shaftAmt > 0.0 ) {',
    '    vec2 dir = ( sunUv - uvD ) * shaftDensity / 18.0;',
    /* JITTER THE FIRST STEP. Eighteen samples along a line is a stair; offsetting each pixel's
       start by a fraction of one step turns the stair into grain, which the paper then hides. */
    '    vec2 uv2 = uvD + dir * hash( vUv * uRes );',
    '    float decay = 1.0;',
    '    vec3 sh = vec3( 0.0 );',
    '    for ( int i = 0; i < 18; i++ ) {',
    '      uv2 += dir;',
    '      sh += texture2D( tOcc, uv2 ).rgb * decay;',
    '      decay *= shaftDecay;',
    '    }',
    '    vec2 sd = abs( sunUv - vec2( 0.5 ) );',
    '    float edge = ( 1.0 - smoothstep( 0.75, 1.45, sd.x ) ) * ( 1.0 - smoothstep( 0.75, 1.45, sd.y ) );',
    '    c += sh * ( shaftAmt / 18.0 ) * sunVis * edge;',
    '  }',

    /* ---------------- 5. GRADE ---------------- */
    '  c *= exposure;',
    '  c = aces( c );',
    /* Lift the floor first, because raising black after adding contrast just greys the whole
       image; pivot contrast around mid grey; desaturate last so the split tone below still has
       something to push against. */
    '  c = mix( vec3( lift ), vec3( 1.0 ), c );',
    '  c = mix( vec3( 0.5 ), c, contrast );',
    '  c = mix( vec3( luma( c ) ), c, sat );',
    /* SPLIT TONE. Dawn is not one colour temperature: the sun is warm and everything it does not
       reach is lit by the sky, which is blue. */
    '  float l = luma( c );',
    '  c = mix( c, c * splitShadow * 2.6, splitAmt * ( 1.0 - smoothstep( 0.0, 0.55, l ) ) );',
    '  c = mix( c, c * splitHigh, splitAmt * smoothstep( 0.45, 1.0, l ) );',
    /* bleach bypass: the silver left in the print. An overlay of the image against its own
       luminance — contrast up, colour down, and not the same thing as doing both by hand */
    '  if ( bleachAmt > 0.0 ) c = mix( c, overlay( c, vec3( luma( c ) ) ), bleachAmt );',

    /* ---------------- 6. PRINT ---------------- */
    /* INK FROM DEPTH, and the difference is measured RELATIVE to the pixel it belongs to. An
       absolute threshold draws every distant silhouette and nothing near, because the same
       metre of separation is a hundredth of the depth at range and half of it up close.
       A Roberts cross on the diagonals: four taps rather than eight, and on a contour that is
       going to be roughened anyway the extra precision buys nothing. */
    '  float lineOut = 0.0;',
    '  if ( inkAmt > 0.0 ) {',
    '    vec2 t = inkWidth / uRes;',
    '    float z0 = texture2D( tDepth, uvD ).x;',
    '    float zl = texture2D( tDepth, uvD - vec2( t.x, 0.0 ) ).x;',
    '    float zr = texture2D( tDepth, uvD + vec2( t.x, 0.0 ) ).x;',
    '    float zu = texture2D( tDepth, uvD - vec2( 0.0, t.y ) ).x;',
    '    float zd = texture2D( tDepth, uvD + vec2( 0.0, t.y ) ).x;',
    '    float lap = abs( zl + zr - 2.0 * z0 ) + abs( zu + zd - 2.0 * z0 );',
    '    float line = smoothstep( inkThresh, inkThresh * 3.5, lap );',
    /* THE CREASE IS THE SAME LAPLACIAN AT A LOWER THRESHOLD. A silhouette is a large second
       difference and a fold is a small one; they are the same measurement, and treating them
       as two detectors is what produced two sets of artefacts to tune independently. */
    '    if ( creaseAmt > 0.0 ) {',
    /* THE GRAZING TEST, NORMALISED SO IT MEASURES TILT AND NOT DISTANCE. Where depth runs
       away fast per pixel the surface is nearly edge-on, its facets are a few pixels across,
       and every one of their edges fires at once — which is scribble, not drawing.

       But raw depth is about 1 - near/z, so the first derivative across a FACE-ON surface
       still scales as near/z: close ground has a steep gradient because it is close. A single
       threshold on that deletes near creases and keeps far ones, exactly backwards. Dividing
       by ( 1 - z ), which is near/z, cancels the distance and leaves the tilt. */
    '      float graze = ( abs( zr - zl ) + abs( zd - zu ) ) / max( 1.0 - z0, 1e-5 );',
    '      float ok = 1.0 - smoothstep( creaseGraze, creaseGraze * 3.0, graze );',
    '      line = max( line, smoothstep( creaseThresh, creaseThresh * 4.0, lap ) * creaseAmt * ok );',
    '    }',
    /* a line of exactly even weight is a filter; ink varies along its length */
    '    line *= 0.62 + 0.38 * texture2D( tPaper, uvD * 4.0 ).r;',
    '    lineOut = line;',
    '    c *= 1.0 - line * inkAmt;',
    '  }',
    /* POSTERISE WITH AN ORDERED DITHER, not without one. Straight quantisation bands every
       gradient in the sky into onion rings; the dither trades those for a regular texture,
       which on a woodblock look is the point rather than a compromise. */
    '  if ( posterAmt > 0.0 ) {',
    '    float bay = bayer4( gl_FragCoord.xy );',
    '    c = mix( c, floor( c * posterLevels + bay ) / posterLevels, posterAmt );',
    '  }',
    /* PAPER, NOT NOISE. Grain sampled square reads as video noise; stretched about 4:1 it reads
       as fibre. Static, because animated grain is film and this is meant to be a sheet. */
    '  vec2 gp = vUv * uRes;',
    '  float fib = hash( floor( vec2( gp.x * 0.25, gp.y ) ) ) - 0.5;',
    '  float fine = hash( floor( gp * 0.85 ) + 17.3 ) - 0.5;',
    '  c += ( fib * 0.65 + fine * 0.35 ) * grain;',
    /* and washi has MOTTLE as well as fibre: slow variation in how much pulp settled where.
       Aspect-corrected so the blotches are round rather than stretched with the window. */
    '  if ( paperAmt > 0.0 ) {',
    '    vec2 pp = vUv * vec2( uRes.x / uRes.y, 1.0 );',
    '    float mo = texture2D( tPaper, pp * 0.9 ).r * 0.62',
    '             + texture2D( tPaper, pp * 3.1 + 0.37 ).r * 0.38;',
    '    c *= 1.0 - paperAmt * 0.20 * ( 0.5 - mo );',
    '  }',
    /* vignette last, so it darkens the paper as well as the picture */
    '  c *= 1.0 - vignette * r2 * 2.2;',
    /* the mask on its own: black ink on white, which is the only view in which a threshold
       can actually be chosen */
    '  if ( inkDebug > 0.5 ) { gl_FragColor = vec4( vec3( 1.0 - lineOut ), 1.0 ); return; }',
    '  gl_FragColor = vec4( lin2srgb( c ), 1.0 );',
    '}',
  ].join('\n'),
});
sizePost();

/* WHERE THE COMPOSITE LANDS, so the finished frame can be read back. Everything downstream of
   here draws to the screen by default; frameSig() points it at a byte target for one frame
   instead, because readPixels on the default framebuffer returns zeros once the frame has been
   presented and the canvas has no preserveDrawingBuffer. */
let POST_TARGET = null;
const SIG_W = 320, SIG_H = 200;
const rtSig = new THREE.WebGLRenderTarget(SIG_W, SIG_H, { type: THREE.UnsignedByteType });
const SIG_BUF = new Uint8Array(SIG_W * SIG_H * 4);
function frameSig() {
  POST_TARGET = rtSig;
  renderFrame();
  POST_TARGET = null;
  renderer.readRenderTargetPixels(rtSig, 0, 0, SIG_W, SIG_H, SIG_BUF);
  let h = 2166136261, mean = 0;
  for (let i = 0; i < SIG_BUF.length; i += 4) {
    h = Math.imul(h ^ SIG_BUF[i], 16777619) ^ SIG_BUF[i + 1] ^ SIG_BUF[i + 2];
    mean += (SIG_BUF[i] + SIG_BUF[i + 1] + SIG_BUF[i + 2]) / 3;
  }
  return { hash: h >>> 0, mean: +(mean / (SIG_BUF.length / 4)).toFixed(2), buf: SIG_BUF };
}
/* how far apart two frames are, in mean absolute pixel difference — the honest answer to
   "is this effect subtle or is it broken" */
function sigDiff(a, b) {
  let sum = 0, n = 0, mx = 0;
  for (let i = 0; i < a.length; i += 4) {
    const d = (Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2])) / 3;
    if (d > mx) mx = d;
    sum += d; n++;
  }
  return { mean: +(sum / n).toFixed(3), max: mx };
}

/* the whole chain, or the plain render if post is off */
function renderFrame() {
  if (!state.post) {
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.setRenderTarget(POST_TARGET);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    return;
  }
  /* linear into the buffer; the curve is applied in the composite */
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);
  /* TWO PASSES OVER THE SAME PIXELS ASKING DIFFERENT QUESTIONS. Bloom wants highlights and
     wants them blurred; the shafts want visible sky near the sun and want it sharp. Sharing one
     buffer meant whichever question was asked second got the wrong answer. */
  /* EVERY PASS IS SKIPPED WHEN ITS EFFECT IS OFF. With all of them on this is ten fullscreen
     passes, and the point of a lab is to be able to turn things off and have that mean
     something — including meaning it in the frame time. */
  let src = rtScene.texture;
  if (state.paint) {
    matPaint.uniforms.tSrc.value = rtScene.texture;
    blit(matPaint, rtPaint);
    src = rtPaint.texture;
  }
  if (state.dof) {
    matDof.uniforms.tSrc.value = src;
    blit(matDof, rtDof);
  }
  /* TWO PASSES OVER THE SAME PIXELS ASKING DIFFERENT QUESTIONS. Bloom wants highlights and
     wants them blurred; the shafts want visible sky near the sun and want it sharp. Sharing one
     buffer meant whichever question was asked second got the wrong answer. */
  if (state.shafts) {
    matOcc.uniforms.tSrc.value = rtScene.texture;
    blit(matOcc, rtSharp);
  }
  matBright.uniforms.tSrc.value = rtScene.texture;
  blit(matBright, rtA);
  matBlurH.uniforms.uScale.value = matBlurV.uniforms.uScale.value = 1;
  matBlurH.uniforms.tSrc.value = rtA.texture;
  blit(matBlurH, rtB);
  matBlurV.uniforms.tSrc.value = rtB.texture;
  blit(matBlurV, rtA);
  if (state.halo) {
    /* halation: the same kernel at four times the stride, off the bloom result, so it is a
       blur OF a blur and gets genuinely wide for two cheap passes at an eighth resolution */
    matBlurH.uniforms.uScale.value = matBlurV.uniforms.uScale.value = 4;
    matBlurH.uniforms.tSrc.value = rtA.texture;
    blit(matBlurH, rtC);
    matBlurV.uniforms.tSrc.value = rtC.texture;
    blit(matBlurV, rtHalo);
    /* and the streak: horizontal only and very wide, which is the whole of what makes an
       anamorphic flare read as one rather than as more bloom */
    matBlurH.uniforms.uScale.value = 16;
    matBlurH.uniforms.tSrc.value = rtA.texture;
    blit(matBlurH, rtStreak);
    matBlurH.uniforms.uScale.value = matBlurV.uniforms.uScale.value = 1;
  }
  matComposite.uniforms.tSrc.value = src;
  matComposite.uniforms.tBloom.value = rtA.texture;
  matComposite.uniforms.tOcc.value = rtSharp.texture;
  matComposite.uniforms.tDof.value = rtDof.texture;
  matComposite.uniforms.tHalo.value = rtHalo.texture;
  matComposite.uniforms.tStreak.value = rtStreak.texture;
  POST.uNear.value = camera.near;
  POST.uFar.value = camera.far;
  /* LOOK AT THE BUFFER, NOT AT THE OUTPUT. An effect that reads from an intermediate target can
     fail because its parameters are wrong or because the target is empty, and the final frame
     looks identical either way. */
  const dbg = window.LAB && window.LAB.show;
  if (!dbg) { blit(matComposite, POST_TARGET); return; }
  /* the VALUES are saved and restored, never the uniform objects — swapping those is how the
     cloud shadows lost their link to the state last time */
  const bs = POST.bloomAmt.value, ss = POST.shaftAmt.value;
  const bs2 = POST.haloAmt.value, ss2 = POST.streakAmt.value, ds = POST.dofAmt.value;
  const is = POST.inkAmt.value;
  matComposite.uniforms.tSrc.value =
    dbg === 'sharp' ? rtSharp.texture : dbg === 'bloom' ? rtA.texture
      : dbg === 'halo' ? rtHalo.texture : dbg === 'streak' ? rtStreak.texture
        : dbg === 'dof' ? rtDof.texture : dbg === 'paint' ? rtPaint.texture : rtScene.texture;
  POST.bloomAmt.value = 0;
  POST.shaftAmt.value = 0;
  POST.haloAmt.value = 0;
  POST.streakAmt.value = 0;
  POST.dofAmt.value = 0;
  POST.inkAmt.value = 0;
  blit(matComposite, POST_TARGET);
  POST.bloomAmt.value = bs;
  POST.shaftAmt.value = ss;
  POST.haloAmt.value = bs2;
  POST.streakAmt.value = ss2;
  POST.dofAmt.value = ds;
  POST.inkAmt.value = is;
}

/* THE AMOUNTS ARE DATA, NOT LITERALS INSIDE apply(). Anything set straight onto a POST uniform
   from the console survives exactly until the next keypress, because apply() rewrites all of
   them; putting the numbers here means LAB.AMT.ca = 0.5 sticks, which is the difference between
   a lab you can tune and one you have to edit.

   ca started at 0.9, which works out to a twenty-one pixel rainbow at the corner of a
   1100-wide frame. A lens fringe is one to four pixels; past that it stops reading as glass
   and starts reading as a broken image. */
const AMT = {
  dof: 1, ink: 0.6, ca: 0.25, distort: 0.055, halo: 0.5, streak: 0.28,
  sharpen: 0.35, paper: 0.6, poster: 0.85, bleach: 0.45,
  /* cel: heavier line, a crease pass, and a wider ink sample so the line has body */
  celInk: 0.95, celCrease: 0.9, celOutline: 2.1, celInkWidth: 2.0,
};

/* ============================ GRADES ============================
   A look cannot be chosen from a description, only by flipping between them on the same frame,
   which is the entire reason these are a keypress and not a set of numbers in a comment.

   Grades own the GRADE only — they never touch shafts, mist, petals or any other toggle — so
   any of them can be judged against any state of the scene. */
const GRADES = [
  { name: 'sumi 墨', note: 'ink wash — where the lab already was',
    exposure: 1.05, bloomAmt: 0.55, bloomCut: 0.72, bloomTint: 0xffe9cf,
    grain: 0.055, vignette: 0.30, splitAmt: 0.22, splitShadow: 0x2a3a5c, splitHigh: 0xffd9a8,
    contrast: 1.00, sat: 1.00, lift: 0.000 },
  { name: 'akatsuki 暁', note: 'dawn — soft, warm, lifted, big bloom',
    exposure: 1.16, bloomAmt: 0.95, bloomCut: 0.55, bloomTint: 0xffd0a0,
    grain: 0.040, vignette: 0.20, splitAmt: 0.36, splitShadow: 0x33456e, splitHigh: 0xffc98e,
    contrast: 0.90, sat: 1.06, lift: 0.050 },
  { name: 'hare 晴', note: 'clear noon — neutral, crisp, almost no grade',
    exposure: 1.00, bloomAmt: 0.28, bloomCut: 0.86, bloomTint: 0xffffff,
    grain: 0.018, vignette: 0.14, splitAmt: 0.10, splitShadow: 0x33465e, splitHigh: 0xfff0d8,
    contrast: 1.14, sat: 1.10, lift: 0.000 },
  { name: 'kasumi 霞', note: 'haze — washed out and flat, heavy paper',
    exposure: 1.02, bloomAmt: 0.62, bloomCut: 0.60, bloomTint: 0xf3e6d2,
    grain: 0.105, vignette: 0.10, splitAmt: 0.16, splitShadow: 0x4b556b, splitHigh: 0xfff2df,
    contrast: 0.80, sat: 0.70, lift: 0.090 },
  { name: 'yuugure 夕暮', note: 'dusk — teal shadow, ember highlight, dark corners',
    exposure: 0.95, bloomAmt: 0.78, bloomCut: 0.62, bloomTint: 0xffb27a,
    grain: 0.050, vignette: 0.46, splitAmt: 0.42, splitShadow: 0x1c3a44, splitHigh: 0xffb07e,
    contrast: 1.08, sat: 1.02, lift: 0.012 },
  { name: 'ukiyo 浮世', note: 'woodblock — flat, cream, no bloom, all fibre',
    exposure: 1.04, bloomAmt: 0.16, bloomCut: 0.90, bloomTint: 0xfff3d6,
    grain: 0.165, vignette: 0.09, splitAmt: 0.30, splitShadow: 0x3d3a52, splitHigh: 0xfff0cc,
    contrast: 0.86, sat: 0.80, lift: 0.105 },
  { name: 'yoru 夜', note: 'night — cool, crushed, heavy vignette',
    exposure: 0.70, bloomAmt: 0.55, bloomCut: 0.52, bloomTint: 0xa8c8ff,
    grain: 0.060, vignette: 0.56, splitAmt: 0.34, splitShadow: 0x18233f, splitHigh: 0xb9d2ff,
    contrast: 1.18, sat: 0.74, lift: 0.020 },
  { name: 'nurie 塗り絵', note: 'colouring book — flat, clean, no lens. Pair with C',
    exposure: 1.08, bloomAmt: 0.10, bloomCut: 0.92, bloomTint: 0xffffff,
    grain: 0.020, vignette: 0.08, splitAmt: 0.12, splitShadow: 0x44557a, splitHigh: 0xfff2d8,
    contrast: 1.06, sat: 1.16, lift: 0.020 },
  { name: 'nama 生', note: 'ungraded — ACES and gamma only, the control',
    exposure: 1.00, bloomAmt: 0.00, bloomCut: 0.99, bloomTint: 0xffffff,
    grain: 0.000, vignette: 0.00, splitAmt: 0.00, splitShadow: 0x808080, splitHigh: 0x808080,
    contrast: 1.00, sat: 1.00, lift: 0.000 },
];
let gradeIx = 0;
/* a `let`, not a `const` assigned later: setGrade is defined above apply() and may run before
   it, and `typeof` on a const still in its temporal dead zone throws rather than returning
   'undefined' — the one place the typeof guard does not guard */
let hudPaint = null;
function setGrade(g) {
  if (typeof g === 'string') g = Math.max(0, GRADES.findIndex((x) => x.name.startsWith(g)));
  gradeIx = ((g % GRADES.length) + GRADES.length) % GRADES.length;
  const G = GRADES[gradeIx];
  for (const k of ['exposure', 'bloomAmt', 'bloomCut', 'grain', 'vignette', 'splitAmt',
    'contrast', 'sat', 'lift']) POST[k].value = G[k];
  POST.splitShadow.value.setHex(G.splitShadow);
  POST.splitHigh.value.setHex(G.splitHigh);
  POST.bloomTint.value.setHex(G.bloomTint);
  if (hudPaint) hudPaint();
  return G.name;
}

/* ============================ TOGGLES ============================ */
const hud = document.getElementById('hud');
function apply() {
  repaintTerrain();
  const toonMats = [];
  scene.traverse((o) => { if (o.isMesh && o.material && o.material.isMeshToonMaterial) toonMats.push(o.material); });
  /* toon off: swap the ramp out so shading goes smooth, which is the Lambert look */
  toonMats.forEach((m) => { if (m === matToon) return; m.gradientMap = state.toon ? RAMP : null; m.needsUpdate = true; });
  /* THE FINDING: terrain always takes smooth shading. A 4-step ramp across a large curved
     surface quantises into contour blotches, while the same ramp reads correctly on the tree
     and the rocks. Toon is for objects; terrain gets ramp colour + baked AO + shadows. */
  ground.material = matPlain;
  /* CEL IS A MODE, NOT A TOGGLE. It swaps the terrain for the flat-shaded copy, puts the hard
     three-step ramp on every toon material, doubles the outline weight and turns on the crease
     pass — and switches OFF the things that fight it. Bloom, halation, depth of field and
     aberration are all photographic: they say "lens", and a cel frame is a drawing, which has
     no lens. Leaving them on is what makes most attempts at this look like a filter. */
  const cel = state.cel;
  ground.visible = !cel;
  groundCel.visible = cel;
  toonMats.forEach((m) => { if (m !== matPlain) m.gradientMap = state.toon ? (cel ? RAMP_CEL : RAMP) : null; });
  OUTLINE.uScale.value = cel ? AMT.celOutline : 1;
  OUTLINE.uCol.value.setHex(cel ? 0x141019 : 0x0e1018);
  outlines.forEach((o) => { o.visible = state.toon; });
  renderer.shadowMap.enabled = state.shadow;
  CLOUD.uCloudAmt.value = state.clouds ? 0.78 : 0;
  HFOG.uHfAmt.value = state.hfog ? 0.85 : 0;
  FX.uRimAmt.value = state.rim ? 0.55 : 0;
  FX.uSwayAmt.value = state.sway ? 7.0 : 0;
  FX.uAerialAmt.value = state.aerial ? 0.85 : 0;
  MIST.uAmt.value = state.mist ? 0.72 : 0;
  MIST.mesh.visible = state.mist;
  POST.shaftAmt.value = state.shafts ? 0.9 : 0;
  /* the post block, from AMT rather than from literals. Amounts are independent of the grade
     on purpose: nine lenses times eight looks compose freely this way, and a toggle that does
     something on some grades and nothing on others is a toggle nobody can learn. */
  POST.dofAmt.value = (state.dof && !cel) ? AMT.dof : 0;
  POST.inkAmt.value = cel ? AMT.celInk : (state.ink ? AMT.ink : 0);
  POST.creaseAmt.value = cel ? AMT.celCrease : 0;
  POST.inkWidth.value = cel ? AMT.celInkWidth : 1.4;
  POST.caAmt.value = (state.lens && !cel) ? AMT.ca : 0;
  POST.distortAmt.value = (state.lens && !cel) ? AMT.distort : 0;
  POST.haloAmt.value = (state.halo && !cel) ? AMT.halo : 0;
  POST.streakAmt.value = (state.halo && !cel) ? AMT.streak : 0;
  POST.sharpenAmt.value = state.sharpen ? AMT.sharpen : 0;
  POST.paperAmt.value = state.paper ? AMT.paper : 0;
  POST.posterAmt.value = state.poster ? AMT.poster : 0;
  POST.bleachAmt.value = state.bleach ? AMT.bleach : 0;
  petalMeshes.forEach((m) => { m.visible = state.petals; });
  scene.traverse((o) => { if (o.isMesh) o.material.needsUpdate = true; });
  const row = (on, k, label) => `<div class="${on ? '' : 'off'}">[${k}] ${on ? '<b>on </b>' : 'off'} ${label}</div>`;
  hud.innerHTML = '<h1>SHADING LAB</h1>'
    + row(state.ao, 1, 'vertex AO (baked)')
    + row(state.ramp, 2, 'slope/height ramp colour')
    + row(state.toon, 3, 'toon ramp + outline (objects only)')
    + row(state.shadow, 4, 'shadow map')
    + row(state.clouds, 5, 'drifting cloud shadows')
    + row(state.hfog, 6, 'height fog (valley mist)')
    + row(state.post, 7, 'post: grade + bloom + grain + vignette')
    + row(state.petals, 8, 'falling petals')
    + row(state.rim, 'Q', 'sky rim light')
    + row(state.sway, 'W', 'wind sway (foliage + its outline)')
    + row(state.aerial, 'E', 'aerial tint (fog warms toward the sun)')
    + row(state.mist, 'R', 'mist ribbons (banks in the low ground)')
    + row(state.shafts, 'T', 'sun shafts (march through the occlusion buffer)')
    + '<div style="margin-top:9px;opacity:.55;letter-spacing:.12em">POST</div>'
    + row(state.cel, 'C', '<b>CEL</b> flat terrain, hard ramp, heavy line, creases')
    + row(state.dof, 'Y', 'depth of field (focus ' + POST.dofFocus.value + ')')
    + row(state.ink, 'U', 'ink contours from depth')
    + row(state.lens, 'I', 'lens: barrel + chromatic aberration')
    + row(state.halo, 'O', 'halation + anamorphic streak')
    + row(state.paint, 'P', 'painterly (Kuwahara — expensive)')
    + row(state.sharpen, 'K', 'sharpen (unsharp, skips the blurred half)')
    + row(state.paper, 'L', 'washi mottle')
    + row(state.poster, ';', 'posterise + ordered dither')
    + row(state.bleach, "'", 'bleach bypass')
    + '<div style="margin-top:8px">[ [ ] ] grade <b>' + (gradeIx + 1) + '/' + GRADES.length
      + '  ' + GRADES[gradeIx].name + '</b></div>'
    + '<div class="off" style="margin-left:22px">' + GRADES[gradeIx].note + '</div>'
    + '<div class="off" style="margin-top:8px">[0] all off &nbsp; [9] all on</div>';
}
hudPaint = apply;
addEventListener('keydown', (e) => {
  if (e.key === '1') state.ao = !state.ao;
  else if (e.key === '2') state.ramp = !state.ramp;
  else if (e.key === '3') state.toon = !state.toon;
  else if (e.key === '4') state.shadow = !state.shadow;
  else if (e.key === '5') state.clouds = !state.clouds;
  else if (e.key === '6') state.hfog = !state.hfog;
  else if (e.key === '7') state.post = !state.post;
  else if (e.key === '8') state.petals = !state.petals;
  else if (e.key === 'q' || e.key === 'Q') state.rim = !state.rim;
  else if (e.key === 'w' || e.key === 'W') state.sway = !state.sway;
  else if (e.key === 'e' || e.key === 'E') state.aerial = !state.aerial;
  else if (e.key === 'r' || e.key === 'R') state.mist = !state.mist;
  else if (e.key === 't' || e.key === 'T') state.shafts = !state.shafts;
  else if (e.key === 'y' || e.key === 'Y') state.dof = !state.dof;
  else if (e.key === 'u' || e.key === 'U') state.ink = !state.ink;
  else if (e.key === 'i' || e.key === 'I') state.lens = !state.lens;
  else if (e.key === 'o' || e.key === 'O') state.halo = !state.halo;
  else if (e.key === 'p' || e.key === 'P') state.paint = !state.paint;
  else if (e.key === 'k' || e.key === 'K') state.sharpen = !state.sharpen;
  else if (e.key === 'l' || e.key === 'L') state.paper = !state.paper;
  else if (e.key === ';') state.poster = !state.poster;
  else if (e.key === "'") state.bleach = !state.bleach;
  else if (e.key === 'c' || e.key === 'C') state.cel = !state.cel;
  /* focus is a distance, not a toggle, so it gets its own pair */
  else if (e.key === '-') { POST.dofFocus.value = Math.max(200, POST.dofFocus.value - 300); }
  else if (e.key === '=') { POST.dofFocus.value += 300; }
  else if (e.key === '[') { setGrade(gradeIx - 1); return; }
  else if (e.key === ']') { setGrade(gradeIx + 1); return; }
  else if (e.key === '0') Object.keys(state).forEach((k) => { state[k] = false; });
  else if (e.key === '9') Object.keys(state).forEach((k) => { state[k] = true; });
  else return;
  apply();
});
apply();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  sizePost();
});

/* MOTION IS INVISIBLE IN A SCREENSHOT. "Too fast" and "too dynamic" are claims about change
   over time, and no number of stills can settle one — which is how an eight-hertz sway survived
   a whole round of review. Hold the camera, read the exact pixels twice a known interval apart,
   report how far they moved.

   Through a RENDER TARGET, not the canvas: the canvas has no preserveDrawingBuffer, and a
   target also bypasses the post chain, whose bloom smears local motion across the whole frame
   and would make a calm tree score like a busy one. */
const MOTION_W = 480, MOTION_H = 320;
const MOTION_RT = new THREE.WebGLRenderTarget(MOTION_W, MOTION_H);
const MOTION_BUF = [new Uint8Array(MOTION_W * MOTION_H * 4), new Uint8Array(MOTION_W * MOTION_H * 4)];
function motionRead(i) {
  const prev = renderer.getRenderTarget();
  renderer.setRenderTarget(MOTION_RT);
  renderer.render(scene, camera);
  renderer.readRenderTargetPixels(MOTION_RT, 0, 0, MOTION_W, MOTION_H, MOTION_BUF[i]);
  renderer.setRenderTarget(prev);
}
function motion(ms) {
  motionRead(0);
  return new Promise((res) => setTimeout(() => {
    motionRead(1);
    const a = MOTION_BUF[0], b = MOTION_BUF[1];
    let moved = 0, sum = 0;
    for (let q = 0; q < a.length; q += 4) {
      const d = Math.abs(a[q] - b[q]) + Math.abs(a[q + 1] - b[q + 1]) + Math.abs(a[q + 2] - b[q + 2]);
      if (d > 8) moved++;
      sum += d / 3;
    }
    const n = a.length / 4;
    res({ ms, pct: +(100 * moved / n).toFixed(2), mean: +(sum / n).toFixed(2) });
  }, ms));
}

/* a lab you cannot take a controlled screenshot of is a worse lab: freeze pins the orbit
   so two toggle states can be compared from the identical camera */
let t = 0, ct = 0;
/* view: [eyeX, eyeY, eyeZ, atX, atY, atZ] pins the camera anywhere — the only way to get
   close enough to an object to judge an outline seam */
window.LAB = {
  state, apply, CLOUD, cloud: CLOUD.uCloudMap.value.image,
  HFOG, POST, PETALS, FX, MIST, petalMeshes, sunAt, SUN_SPRITES,
  GRADES, grade: setGrade, gradeName: () => GRADES[gradeIx].name, AMT,
  scene, camera, renderer, key, ground, motion, THREE, heightAt, frameSig, sigDiff,
  rtSharp, rtBloom: rtA, rtScene, rtDof, rtHalo, rtStreak, rtPaint,
  OUTLINE, groundCel, RAMP, RAMP_CEL,
  freeze: false, view: null, show: null, at: (v) => { t = v; },
};

/* CT ADVANCES PER SECOND, NOT PER FRAME. It used to be `ct += 0.0016` once a tick, which
   makes every animation in the lab a function of frame rate: the same sway is 4.9 rad/s at
   60 fps, 11.8 at 144, and 1.1 in the headless browser where all the measuring happens. That
   is why the rates here were tuned blind for as long as they were — nobody was ever looking
   at the speed anyone else was seeing. 0.096/s is exactly the old per-frame rate at 60 fps,
   so the look is unchanged on a 60 Hz machine and merely correct everywhere else.
   The clamp is for a backgrounded tab, which otherwise resumes with a several-second jump —
   and it is 0.5, not 0.1, because the headless browser this gets measured in runs at 6 fps on
   a software rasteriser and hitches well past that. Every clamped frame drops real time on the
   floor, so a tight clamp silently reintroduces exactly the frame-rate dependence the
   performance.now() clock exists to remove — at 0.1 it ran the world at 69% speed, at 0.25 at
   83%. Half a second still catches a backgrounded tab, which resumes seconds late, not
   milliseconds. */
const CT_RATE = 0.096;
let ctLast = performance.now();
function tick() {
  const now = performance.now();
  const dt = Math.min((now - ctLast) / 1000, 0.5);
  ctLast = now;
  /* the weather clock keeps running while the camera is pinned, so drift can be checked
     on its own instead of being confounded with the orbit */
  ct += dt * CT_RATE;
  if (!window.LAB.freeze) t += dt * CT_RATE;
  /* the cover drifts across the valley — slow enough to read as weather, not as a texture
     being scrolled. Direction is deliberately not the light direction, so the shadow edges
     cross the terminator rather than sliding along it. */
  CLOUD.uCloudOff.value.set(ct * 0.22, ct * -0.08);
  PETALS.uTime.value = ct * 60;
  FX.uTime.value = ct * 60;
  MIST.uTime.value = ct * 60;
  /* the sun's screen position, recomputed every frame because the camera orbits */
  {
    const v = SUN_AT.clone().project(camera);
    POST.sunUv.value.set(v.x * 0.5 + 0.5, -v.y * 0.5 + 0.5);
    POST.sunVis.value = v.z < 1 ? 1 : 0;
  }
  POST.uTime.value = ct;
  for (const m of CLOUD_MATS) m.needsUpdate = true;   /* see THE UNIFORM TRAP above */
  const v = window.LAB.view;
  if (v) { camera.position.set(v[0], v[1], v[2]); camera.lookAt(v[3], v[4], v[5]); }
  else { camera.position.set(Math.cos(t) * 2700, 1450, Math.sin(t) * 2700); camera.lookAt(0, 620, 0); }
  renderFrame();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
