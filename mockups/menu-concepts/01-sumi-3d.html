<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 墨 SUMI — 3D 月夜 — JPLearn menu concept</title>
<style>
  :root {
    --night-hi: #222941;
    --night: #171c2c;
    --night-deep: #10131e;
    --washi: #f2ead8;
    --washi-dim: #cfc6ae;
    --ink: #14110d;
    --hi: #e34a33;
    --hi-deep: #b23320;
    --gold: #cfa45c;
    --gold-hi: #e8c47c;
    --mist: #9fb8d8;
    --jp: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS PMincho", serif;
    --jp-go: "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
    --lat: "Arial Black", "Segoe UI Black", "Arial", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(90% 70% at 70% 8%, var(--night-hi) 0%, transparent 55%),
      radial-gradient(70% 60% at 12% 88%, #1d1a26 0%, transparent 60%),
      linear-gradient(180deg, var(--night) 0%, var(--night-deep) 100%);
    font-family: var(--jp-go);
    color: var(--washi);
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- render stages ---------- */
  #glBack, #cssStage, #glFront { position: fixed; inset: 0; }
  #glBack { z-index: 1; pointer-events: none; }
  #cssStage { z-index: 2; pointer-events: none; }
  #cssStage * { pointer-events: none; }
  #cssStage button { pointer-events: auto; }
  /* NB: neither rule above can govern a CSS3D plane. CSS3DObject's constructor writes
     `style.pointerEvents = 'auto'` *inline* on every element it wraps, and an inline
     declaration beats any selector. Decoration is therefore switched off in JS at the point
     the object is made — see decorPlane(). */
  #glFront { z-index: 3; pointer-events: none; }

  /* ---------- 3D planes: menu items — type IS the button (Persona grammar) ---------- */
  .type-item {
    position: relative;
    width: 620px; height: 128px;
    opacity: 0;
  }
  body[data-menu="b"] .type-item { width: 170px; height: 560px; }
  /* entrance animates ONLY the inner wrapper — the plane root's transform belongs to CSS3DRenderer */
  .t-inner {
    position: absolute; inset: 0;
    display: flex; align-items: center;
    padding-left: 44px;
  }
  body[data-menu="b"] .t-inner {
    flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 44px 0 0;
  }
  .type-item.entered { opacity: 1; }
  .type-item.enter { animation: rootFade 0.5s forwards; animation-delay: calc(var(--i) * 0.07s); }
  @keyframes rootFade { to { opacity: 1; } }
  .type-item.enter .t-inner { animation: innerIn 0.5s cubic-bezier(0.18, 1.35, 0.35, 1) both; animation-delay: calc(var(--i) * 0.07s); }
  @keyframes innerIn {
    from { transform: translateX(-90px); }
    to { transform: translateX(0); }
  }
  .type-item:focus-visible { outline: 3px solid var(--hi); outline-offset: 10px; }

  .t-slash {
    position: absolute; left: 0; right: 0; top: 50%; height: 92px;
    transform: translateY(-50%) rotate(-2deg);
    fill: var(--sec, var(--hi));
    clip-path: inset(0 100% 0 0);
    transition: clip-path 0.26s cubic-bezier(0.2, 1, 0.3, 1);
    z-index: 1;
  }
  body[data-menu="b"] .t-slash {
    left: 50%; right: auto; top: 26px; bottom: 26px; width: 96px; height: auto;
    transform: translateX(-50%);
    clip-path: inset(0 0 100% 0);
  }
  .type-item.is-active .t-slash { clip-path: inset(0 0% 0 0); }
  body[data-menu="b"] .type-item.is-active .t-slash { clip-path: inset(0 0 0% 0); }

  .t-en {
    position: relative; z-index: 2;
    font-family: var(--lat); font-style: italic; font-weight: 900;
    font-size: 62px; letter-spacing: 0.01em;
    color: #ded6bd;
    transform: skewX(-8deg);
    white-space: nowrap;
    /* the hard offset shadow is the Persona look and it only guards the down-right edge; the
       soft halo behind it is what holds the glyph against whatever the world puts there —
       invisible as a shadow, but it lifts local contrast on every side */
    text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.55), 0 0 16px rgba(6, 9, 15, 0.62);
    transition: color 0.2s, transform 0.25s cubic-bezier(0.2, 1.4, 0.3, 1), text-shadow 0.25s;
  }
  body[data-menu="b"] .t-en {
    writing-mode: vertical-rl;
    font-size: 24px; letter-spacing: 0.32em;
    transform: none;
    margin-top: 16px;
    order: 2;
  }
  /* a red tick opens the word; the reading sits beneath it as a sub-caption */
  .t-tick {
    flex: none;
    width: 11px; height: 11px;
    background: var(--sec, var(--hi));
    margin-right: 17px;
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
    transition: background 0.2s, transform 0.25s cubic-bezier(0.2, 1.4, 0.3, 1);
  }
  .type-item.is-active .t-tick { background: var(--gold-hi); transform: rotate(45deg) scale(1.2); }
  body[data-menu="b"] .t-tick { display: none; }
  /* the due-count wears the word like a calling card */
  .t-badge {
    flex: none;
    min-width: 34px; height: 34px; padding: 0 7px;
    margin-left: 16px; align-self: flex-start; margin-top: 12px;
    background: var(--sec, var(--hi)); color: var(--washi);
    font-family: var(--lat); font-size: 19px; font-weight: 900;
    display: grid; place-items: center;
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.45), inset 0 0 0 2px rgba(242, 234, 216, 0.3);
    transition: background 0.2s, color 0.2s;
  }
  .type-item.is-active .t-badge { background: var(--gold-hi); color: var(--ink); }
  body[data-menu="b"] .t-badge { position: absolute; top: 8px; right: -6px; margin: 0; }
  .t-jp {
    position: absolute; left: 74px; top: calc(50% + 23px); z-index: 2;
    font-family: var(--jp-go); font-weight: 700;
    font-size: 14px; letter-spacing: 0.42em;
    color: var(--washi-dim);
    white-space: nowrap;
    transition: color 0.2s, letter-spacing 0.3s;
  }
  .type-item.is-active .t-jp { color: var(--gold-hi); letter-spacing: 0.52em; }
  body[data-menu="b"] .t-jp {
    position: relative; left: auto; top: auto; order: 1;
    font-family: var(--jp);
    writing-mode: vertical-rl;
    font-size: 46px; letter-spacing: 0.18em;
    color: var(--washi);
    text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.55);
  }
  .t-line {
    position: absolute; left: 46px; right: 28%; bottom: 18px; height: 4px; z-index: 2;
    background: linear-gradient(90deg, var(--gold), transparent);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s cubic-bezier(0.2, 1, 0.3, 1);
  }
  body[data-menu="b"] .t-line {
    left: calc(50% + 52px); right: auto; width: 4px; top: 44px; bottom: 30%; height: auto;
    background: linear-gradient(180deg, var(--gold), transparent);
    transform: scaleY(0); transform-origin: top;
  }
  .type-item.is-active .t-line { transform: scaleX(1); }
  body[data-menu="b"] .type-item.is-active .t-line { transform: scaleY(1); }

  /* the seal lands after the word, like a signature after the brushwork */
  .t-stamp {
    flex: none;
    width: 46px; height: 46px;
    margin-left: 22px;
    align-self: center;
    background: var(--hi); color: var(--washi);
    font-family: var(--jp); font-weight: 700; font-size: 26px;
    display: grid; place-items: center;
    transform: scale(0) rotate(-30deg);
    box-shadow: inset 0 0 0 2px var(--washi), inset 0 0 0 4px var(--hi);
    pointer-events: none;
    z-index: 3;
  }
  body[data-menu="b"] .t-stamp { position: absolute; left: 50%; margin-left: -23px; top: auto; bottom: -8px; }
  .type-item.is-active .t-stamp { animation: stampSlam 0.28s cubic-bezier(0.2, 1.6, 0.35, 1) forwards; }
  @keyframes stampSlam {
    0% { transform: scale(2.1) rotate(14deg); opacity: 0; }
    55% { opacity: 1; }
    100% { transform: scale(1) rotate(-9deg); opacity: 1; }
  }
  .type-item.is-active .t-en {
    color: #ffffff;
    transform: skewX(-8deg) scale(1.07) translateX(12px);
    text-shadow: 0 0 30px rgba(232, 196, 124, 0.4), 4px 4px 0 rgba(0, 0, 0, 0.65);
  }
  body[data-menu="b"] .type-item.is-active .t-en { transform: scale(1.05); color: #fff; }
  .type-item.is-active .t-jp { transform: rotate(-10deg) scale(1.12); background: var(--hi-deep); }
  body[data-menu="b"] .type-item.is-active .t-jp { transform: scale(1.08); color: #fff; background: none; }
  .type-item.is-dimmed { filter: brightness(0.66); }

  .drop { position: absolute; background: var(--gold); width: 8px; height: 8px; z-index: 1; opacity: 0; filter: url(#roughEdge); }
  .type-item.is-active .drop { animation: dropFly 0.5s cubic-bezier(0.2, 0.8, 0.4, 1) forwards; }
  .drop:nth-of-type(1) { right: -14px; top: 30%; --dx: 26px; --dy: -18px; }
  .drop:nth-of-type(2) { right: -8px; bottom: 12%; --dx: 34px; --dy: 10px; animation-delay: 0.04s !important; }
  .drop:nth-of-type(3) { left: 30%; top: -10px; --dx: 6px; --dy: -24px; animation-delay: 0.02s !important; }
  @keyframes dropFly {
    0% { opacity: 0.9; transform: translate(0, 0) scale(1.2); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }

  /* ---------- 3D planes: scenery ---------- */
  .plane-wm {
    width: 900px; height: 900px;
    font-family: var(--jp); font-weight: 700;
    font-size: 820px; line-height: 900px; text-align: center;
    color: rgba(242, 234, 216, 0.05);
    transition: opacity 0.35s;
  }
  .plane-enso { width: 700px; height: 700px; opacity: 0.22; }
  .plane-enso circle {
    fill: none; stroke: var(--gold); stroke-width: 34;
    stroke-linecap: round;
    stroke-dasharray: 1460 1600;
    stroke-dashoffset: 1460;
  }
  .plane-enso.draw circle { animation: ensoDraw 1.8s cubic-bezier(0.5, 0, 0.2, 1) 0.5s forwards; }
  @keyframes ensoDraw { to { stroke-dashoffset: 60; } }

  .plane-sheet {
    background: rgba(242, 234, 216, 0.035);
    border: 1px solid rgba(242, 234, 216, 0.07);
    display: flex; gap: 26px; justify-content: center; align-items: flex-start;
    padding: 30px 0;
  }
  .plane-sheet i {
    writing-mode: vertical-rl; font-style: normal;
    font-family: var(--jp); font-weight: 700;
    color: rgba(242, 234, 216, 0.09);
    letter-spacing: 0.32em;
  }
  .plane-stroke { width: 1000px; height: 240px; opacity: 0; }
  .plane-stroke.draw { opacity: 0.10; }
  .plane-stroke path {
    fill: none; stroke: var(--gold); stroke-width: 44; stroke-linecap: round;
    stroke-dasharray: 1300; stroke-dashoffset: 1300;
  }
  .plane-stroke.draw path { animation: strokeDraw 1.4s cubic-bezier(0.6, 0, 0.3, 1) forwards; }
  @keyframes strokeDraw { to { stroke-dashoffset: 0; } }

  .plane-mtn { pointer-events: none; }
  .plane-mtn svg { display: block; filter: blur(1.5px); }

  /* halo confined well inside the plane bounds so it can never clip */
  .plane-moon { width: 1100px; height: 1100px; position: relative; }
  .moon-core {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%,
      rgba(236, 223, 192, 0.34) 0%, rgba(207, 164, 92, 0.16) 22%, rgba(207, 164, 92, 0.05) 36%, transparent 52%);
    animation: moonBreath 8s ease-in-out infinite;
  }
  /* a real disc with maria, a rim, and a halo ring — not just a blur */
  .moon-disc {
    position: absolute; left: 50%; top: 50%;
    width: 340px; height: 340px; margin: -170px 0 0 -170px;
    clip-path: circle(50%);
    background:
      radial-gradient(circle at 38% 32%, #fffdf6 0%, #f6eeda 42%, #e3d4b2 72%, #c7b58e 100%);
    box-shadow: 0 0 70px 18px rgba(236, 223, 192, 0.16);
  }
  .moon-mare { position: absolute; border-radius: 50%; background: rgba(160, 146, 116, 0.34); filter: blur(6px); }
  .moon-mare.a { width: 108px; height: 92px; left: 22%; top: 26%; }
  .moon-mare.b { width: 76px; height: 70px; left: 52%; top: 48%; background: rgba(160, 146, 116, 0.26); }
  .moon-mare.c { width: 54px; height: 48px; left: 30%; top: 62%; background: rgba(160, 146, 116, 0.22); }
  .moon-ring {
    position: absolute; left: 50%; top: 50%;
    width: 560px; height: 560px; margin: -280px 0 0 -280px;
    border: 1px solid rgba(236, 223, 192, 0.10);
    clip-path: circle(50%);
  }
  /* a thin cloud band drifts across the face */
  .moon-cloud {
    position: absolute; left: 50%; top: 50%;
    width: 900px; height: 46px; margin: -6px 0 0 -450px;
    background: linear-gradient(90deg, transparent, rgba(23, 28, 44, 0.66) 22% 78%, transparent);
    filter: blur(7px);
    animation: moonCloud 26s ease-in-out infinite;
  }
  @keyframes moonCloud {
    0%, 100% { transform: translateX(-46%) scaleY(0.7); opacity: 0.5; }
    50% { transform: translateX(46%) scaleY(1.15); opacity: 0.85; }
  }
  @keyframes moonBreath {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }
  .plane-kanji {
    font-family: var(--jp); font-weight: 700;
    color: rgba(242, 234, 216, 0.055);
    line-height: 1;
  }
  .plane-mist {
    width: 2600px; height: 320px;
    background: radial-gradient(50% 50% at 50% 50%, rgba(159, 184, 216, 0.06), transparent 70%);
  }

  /* ---------- destination alcove: a different room in the same night ---------- */
  .plane-shoji {
    width: 2150px; height: 1260px;
    background:
      radial-gradient(55% 45% at 50% 46%, rgba(207, 164, 92, 0.11), transparent 72%),
      repeating-linear-gradient(90deg, #10131e 0 12px, transparent 12px 268px),
      repeating-linear-gradient(180deg, #10131e 0 12px, transparent 12px 308px),
      rgba(242, 234, 216, 0.055);
    border: 16px solid #0b0d16;
  }
  .plane-lantern {
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(232, 196, 124, 0.2) 0%, rgba(232, 196, 124, 0.05) 42%, transparent 62%);
    animation: lanternPulse 5.5s ease-in-out infinite;
  }
  @keyframes lanternPulse { 0%, 100% { opacity: 0.72; } 50% { opacity: 1; } }
  .plane-tatami {
    width: 2400px; height: 1000px;
    background:
      repeating-linear-gradient(90deg, rgba(242, 234, 216, 0.04) 0 350px, rgba(11, 13, 22, 0.55) 350px 360px),
      rgba(242, 234, 216, 0.02);
  }
  .plane-branch { opacity: 0.9; }
  .plane-post {
    width: 96px; height: 1360px;
    background: linear-gradient(90deg, #05060c 0%, #12101c 46%, #1c1626 55%, #05060c 100%);
  }
  .plane-torii { opacity: 0.94; }
  .plane-trefl {
    opacity: 0.15; filter: blur(4px);
    mask-image: linear-gradient(180deg, #000 25%, transparent 88%);
    -webkit-mask-image: linear-gradient(180deg, #000 25%, transparent 88%);
  }
  .trefl-inner { transform: scaleY(-1); }
  .plane-toro {
    width: 130px; height: 150px;
    background: radial-gradient(circle at 50% 42%, rgba(232, 196, 124, 0.5) 0%, rgba(232, 196, 124, 0.12) 38%, transparent 60%);
  }
  .plane-rake {
    width: 2700px; height: 1700px;
    background:
      repeating-radial-gradient(circle at 30% 35%, rgba(242, 234, 216, 0.055) 0 9px, transparent 9px 52px),
      repeating-radial-gradient(circle at 72% 60%, rgba(242, 234, 216, 0.04) 0 9px, transparent 9px 64px),
      linear-gradient(180deg, #131523, #0e1019);
  }
  .plane-gwall {
    width: 2500px; height: 260px;
    background: linear-gradient(180deg, #221c30 0%, #191527 30%, #12101d 100%);
    box-shadow: 0 -8px 0 #2a2438;
  }
  .plane-stone { opacity: 0.96; }
  .plane-bamboo {
    width: 720px; height: 1560px;
    background:
      repeating-linear-gradient(180deg, transparent 0 180px, rgba(9, 12, 20, 0.7) 180px 188px),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(15, 21, 34, 0.92) 46px 68px, rgba(26, 34, 52, 0.9) 68px 74px, transparent 74px 118px);
  }
  .plane-dwall {
    width: 2500px; height: 1300px;
    background:
      repeating-linear-gradient(90deg, rgba(28, 22, 38, 0.6) 0 14px, transparent 14px 300px),
      linear-gradient(180deg, #131120, #0b0a13);
  }
  .plane-dside {
    width: 1900px; height: 1500px;
    background:
      repeating-linear-gradient(90deg, rgba(10, 8, 16, 0.85) 0 16px, transparent 16px 260px),
      linear-gradient(180deg, #0e0c18 0%, #16121f 55%, #08070f 100%);
  }
  .plane-dfloor {
    width: 2400px; height: 1500px;
    background:
      repeating-linear-gradient(90deg, rgba(242, 234, 216, 0.03) 0 300px, rgba(8, 7, 14, 0.8) 300px 310px),
      linear-gradient(180deg, #12101c, #08070f);
  }
  .plane-dbeam {
    width: 2600px; height: 80px;
    background: linear-gradient(180deg, #1d1728 0%, #0c0a14 60%, #070610 100%);
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6);
  }
  .plane-dlamp {
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(232, 196, 124, 0.24) 0%, rgba(232, 196, 124, 0.07) 40%, transparent 62%);
    animation: lanternPulse 6.5s ease-in-out infinite;
  }
  .plane-taiko { filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.6)); }
  .plane-nobori {
    width: 210px; height: 940px;
    background: linear-gradient(180deg, #a3271a, #7e2013);
    box-shadow: inset 0 0 0 6px rgba(11, 13, 22, 0.35), 8px 10px 0 rgba(0, 0, 0, 0.35);
    display: flex; justify-content: center; padding-top: 70px;
  }
  .plane-nobori i {
    font-style: normal; writing-mode: vertical-rl;
    font-family: var(--jp); font-weight: 700; font-size: 110px; letter-spacing: 0.3em;
    color: var(--washi);
    text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
  }
  .plane-cloud {
    width: 1500px; height: 460px;
    background: radial-gradient(50% 50% at 50% 50%, rgba(233, 238, 247, 0.16), rgba(233, 238, 247, 0.05) 55%, transparent 75%);
  }
  .plane-peak { opacity: 0.9; }
  .plane-water {
    width: 3200px; height: 1300px;
    background:
      repeating-linear-gradient(180deg, rgba(159, 184, 216, 0.07) 0 4px, transparent 4px 44px),
      linear-gradient(180deg, rgba(23, 28, 44, 0.45), rgba(13, 16, 26, 0.85));
    animation: waterShift 8s linear infinite;
  }
  @keyframes waterShift { from { background-position: 0 0, 0 0; } to { background-position: 0 44px, 0 0; } }
  .plane-tlantern { opacity: 0.92; }
  .plane-tscroll {
    width: 230px; height: 900px;
    background: rgba(242, 234, 216, 0.07);
    border: 1px solid rgba(242, 234, 216, 0.12);
    display: flex; justify-content: center; padding-top: 60px;
  }
  .plane-tscroll i {
    font-style: normal; writing-mode: vertical-rl;
    font-family: var(--jp); font-weight: 700; font-size: 64px; letter-spacing: 0.5em;
    color: rgba(242, 234, 216, 0.22);
  }

  /* ---------- 3D plane: submenu ---------- */
  /* ---------- 3D plane: submenu ---------- */
  .plane-sub { width: 1150px; height: 660px; position: relative; }
  /* --sec is set per section so each destination has its own colour identity */
  .plane-sub { --sec: #e34a33; --sec-lo: #b23320; --sec-hi: #ef5a41; }

  /* ================================================================================
     LEVEL TWO — graphic design standing in the room.
     The rooms stay; what sits in them is no longer four polite rectangles in a row. The
     rules here are the ones the reference actually follows:
       · nothing is upright or evenly spaced — everything skews, and the run cascades
       · type IS the graphic: the word is 80–210px and the label is 12px, in the same item
       · elements bleed past their own plane bounds (overflow is left visible on purpose)
       · selection is violent — the picked one slams forward, the rest flatten and skew off
       · nothing rests: the objects keep drifting after they land (see the idle wobble in tick)
     CSS3DRenderer owns each plane root's transform, so all of this lives on .w-in.
     ================================================================================ */
  .w-plane { position: absolute; cursor: pointer; }
  .w-in {
    position: absolute; inset: 0;
    transition: transform 0.17s cubic-bezier(0.2,1.7,0.3,1), filter 0.17s, opacity 0.17s;
  }
  .w-plane:focus-visible { outline: none; }
  /* the whole point: picking one is an event for every other item too */
  .w-plane.is-hot .w-in { transform: scale(1.17) translateY(-24px); filter: brightness(1.28) saturate(1.25); }
  .w-plane.is-cold .w-in { transform: scale(0.93) skewY(-2.2deg); filter: brightness(0.46) saturate(0.4); opacity: 0.6; }
  .w-jp { font-family: var(--jp); font-weight: 700; display: block; }
  .w-en { font-family: var(--lat); display: block; }
  .w-meta { font-family: var(--jp-go); display: block; }
  .w-no {
    font-family: var(--lat); font-weight: 900; display: block;
    color: transparent; pointer-events: none;
  }

  /* the section's name, thrown across the room at poster scale */
  .w-sign { width: 340px; height: 200px; }
  .w-sign .w-jp {
    position: absolute; left: 0; top: -34px; font-size: 132px; line-height: 0.88;
    color: var(--sec); text-shadow: 9px 9px 0 rgba(0,0,0,0.55);
    transform: skewX(-10deg); white-space: nowrap;
  }
  .w-sign .w-en {
    position: absolute; left: 8px; top: 116px; font-style: italic; font-size: 21px;
    letter-spacing: 0.34em; color: var(--washi); transform: skewX(-10deg);
  }
  /* BACK IS A SCREEN ELEMENT, NOT A BILLBOARD IN THE WORLD. As a CSS3D plane it was authored
     per-place — 250 x 82 at whatever z suited one composition — which at the shrine's standoff
     came out four hundred pixels of washi filling the corner of the frame and out-shouting the
     thing you had come to look at. A plane in the world can also be walked into, occluded and
     cropped, and it has to be re-placed by hand for all six areas. A fixed tab has none of those
     problems at any viewport, and it belongs with the ESC hint opposite it, which already says
     the same thing. Small, off to the side, and carrying the section's colour so it still reads
     as part of the place. */
  /* the walk's only chrome. You cannot see the whole list from inside a corridor, so the one
     thing the screen has to say is where in it you are — everything else is on the placards. */
  .walk-hud {
    left: 50%; top: 30px; transform: translateX(-50%);
    display: flex; align-items: baseline; gap: 14px;
    opacity: 0; transition: opacity 0.34s ease;
    /* it sits against vermilion for the whole of the walk, so it needs more than a wash */
    background: rgba(12, 10, 8, 0.72); padding: 9px 20px;
    border-bottom: 3px solid var(--sec, var(--hi));
  }
  body.at-walk .walk-hud { opacity: 1; }
  .walk-hud .wh-jp { font-family: var(--jp); font-weight: 700; font-size: 21px; letter-spacing: 0.1em; color: var(--washi); }
  .walk-hud .wh-en { font-family: var(--lat); font-size: 11px; letter-spacing: 0.3em; color: rgba(242,234,216,0.55); }
  .walk-hud .wh-at { font-family: var(--lat); font-size: 13px; letter-spacing: 0.14em; color: var(--sec, var(--hi)); }
  /* THE KEYBOARD CANNOT BE THE ONLY WAY DOWN A CORRIDOR. Two steppers here and the placards
     themselves are both pickable, so the walk is navigable with nothing but a pointer. */
  .walk-hud .wh-step {
    background: none; border: 0; cursor: pointer; padding: 0 6px;
    font: 700 22px/1 var(--lat); color: rgba(242, 234, 216, 0.5);
    transition: color 0.15s;
  }
  .walk-hud .wh-step:hover { color: var(--sec, var(--hi)); }
  .walk-hud .wh-step:disabled { opacity: 0.22; cursor: default; }
  .back-tab { left: 40px; bottom: 62px; opacity: 0; transition: opacity 0.32s ease; }
  body:not(.at-menu) .back-tab { opacity: 1; }
  body.at-menu .back-tab button { pointer-events: none; }
  .back-tab button {
    display: flex; align-items: center; gap: 10px;
    background: rgba(242, 234, 216, 0.09);
    border: 0; border-left: 4px solid var(--sec, var(--hi));
    padding: 7px 15px 7px 11px;
    transform: skewX(-8deg);
    color: var(--washi); cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .back-tab button:hover { background: var(--sec, var(--hi)); }
  .back-tab .bt-ar { font-family: var(--lat); font-size: 13px; opacity: 0.6; }
  .back-tab .bt-jp { font-family: var(--jp-go); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; }
  .back-tab .bt-en { font-family: var(--lat); font-size: 10px; letter-spacing: 0.3em; color: rgba(242,234,216,0.5); }
  .back-tab button:hover .bt-en, .back-tab button:hover .bt-ar { color: var(--washi); opacity: 1; }

  /* ── STUDY · torn shards, the word knocked out of the black ──────────────────── */
  .w-shard { width: 460px; height: 210px; }
  .w-shard .w-in {
    background: #100e0a;
    clip-path: polygon(0 13%, 96% 0, 100% 85%, 4% 100%);
    box-shadow: 15px 15px 0 var(--sec);
    display: grid; align-content: center; padding: 0 36px;
  }
  .w-shard .w-jp {
    font-size: 80px; line-height: 0.98; color: var(--washi);
    transform: skewX(-9deg); white-space: nowrap;
    text-shadow: 5px 5px 0 var(--sec-lo);
  }
  .w-shard .w-en {
    justify-self: start; margin-top: 10px; padding: 3px 13px 2px;
    background: var(--sec); color: #100e0a;
    font-size: 13px; letter-spacing: 0.3em; transform: skewX(-9deg);
  }
  .w-shard .w-no {
    position: absolute; right: -46px; top: -66px; font-size: 158px; line-height: 1;
    -webkit-text-stroke: 3px rgba(242,234,216,0.26);
  }
  .w-shard .w-meta {
    position: absolute; left: 36px; bottom: -30px;
    font-size: 12px; letter-spacing: 0.22em; color: var(--washi-dim);
  }

  /* ── REVIEW · vermillion slashes cutting across the garden ───────────────────── */
  .w-slash { width: 620px; height: 152px; }
  .w-slash .w-in {
    background: linear-gradient(96deg, var(--sec-lo), var(--sec) 34%, var(--sec-hi));
    clip-path: polygon(3% 0, 100% 7%, 97% 100%, 0 93%);
    box-shadow: 0 20px 44px rgba(0,0,0,0.62);
    display: flex; align-items: center; gap: 24px; padding: 0 42px;
  }
  .w-slash .w-jp {
    font-size: 62px; color: #150f0e; transform: skewX(-11deg); white-space: nowrap;
  }
  .w-slash .w-en {
    writing-mode: vertical-rl; font-size: 11px; letter-spacing: 0.3em;
    color: rgba(21,15,14,0.72);
  }
  .w-slash .w-meta {
    margin-left: auto; font-family: var(--lat); font-size: 15px; letter-spacing: 0.18em;
    color: rgba(21,15,14,0.75); text-align: right;
  }
  .w-slash .w-meta b {
    display: block; font-size: 60px; line-height: 0.9; letter-spacing: -0.02em;
    color: #fff; text-shadow: 5px 5px 0 rgba(0,0,0,0.32);
  }
  .w-slash .w-no {
    position: absolute; left: -54px; top: -60px; font-size: 150px;
    -webkit-text-stroke: 3px rgba(227,74,51,0.4);
  }

  /* ── READING · cloth-bound spines standing on the shelf, each a different book ─── */
  .w-spine { width: 214px; height: 560px; }
  .w-spine .w-in {
    background:
      linear-gradient(100deg, rgba(255,255,255,0.10) 0 9px, transparent 9px 26px),
      linear-gradient(100deg, #235438 0%, #163824 44%, #0c2116 100%);
    border-left: 6px solid rgba(0,0,0,0.55);
    border-right: 5px solid rgba(255,255,255,0.07);
    box-shadow: 20px 18px 0 rgba(0,0,0,0.42), inset 0 0 48px rgba(0,0,0,0.55);
    align-items: center; justify-content: flex-start; padding-top: 92px;
  }
  /* the foil bands a bound spine carries top and bottom */
  .w-spine .w-in::before, .w-spine .w-in::after {
    content: ""; position: absolute; left: 0; right: 0; height: 9px;
    background: linear-gradient(90deg, var(--sec-lo), var(--sec-hi) 45%, var(--sec-lo));
    box-shadow: 0 0 14px rgba(111,193,137,0.5);
  }
  .w-spine .w-in::before { top: 58px; }
  .w-spine .w-in::after { bottom: 74px; }
  .w-spine .w-jp {
    writing-mode: vertical-rl; font-size: 58px; letter-spacing: 0.14em;
    color: #f4eeda; text-shadow: 3px 3px 0 rgba(0,0,0,0.65); white-space: nowrap;
  }
  .w-spine .w-en {
    position: absolute; bottom: 22px; left: 0; right: 0; text-align: center;
    font-size: 10.5px; letter-spacing: 0.26em; color: var(--sec-hi);
  }
  .w-spine .w-meta {
    position: absolute; top: 22px; left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: 0.1em; color: rgba(244,238,218,0.5);
  }
  .w-spine .w-no {
    position: absolute; top: -84px; left: 50%; transform: translateX(-50%);
    font-size: 128px; line-height: 1; -webkit-text-stroke: 3px rgba(111,193,137,0.3);
  }

  /* ── DRILLS · impact shards, the Latin word swung hard on the diagonal ───────── */
  .w-impact { width: 520px; height: 192px; }
  .w-impact .w-in {
    background: #0c0409;
    clip-path: polygon(6% 0, 100% 5%, 94% 100%, 0 89%);
    border-left: 11px solid var(--sec);
    box-shadow: 0 0 54px rgba(224,76,98,0.45);
    display: grid; align-content: center; padding: 0 28px 0 42px;
  }
  .w-impact .w-en {
    font-style: italic; font-size: 58px; line-height: 0.94; color: #fff;
    transform: skewX(-13deg); white-space: nowrap; text-shadow: 6px 0 0 var(--sec);
  }
  .w-impact .w-jp {
    margin-top: 8px; font-size: 25px; letter-spacing: 0.3em;
    color: var(--sec-hi); transform: skewX(-13deg);
  }
  .w-impact .w-meta {
    position: absolute; right: -14px; bottom: -28px;
    font-family: var(--lat); font-size: 15px; letter-spacing: 0.2em; color: #ffd9a1;
  }
  .w-impact .w-no {
    position: absolute; left: -58px; top: -70px; font-size: 178px; line-height: 1;
    -webkit-text-stroke: 4px rgba(224,76,98,0.36);
  }

  /* ── JLPT · stencilled level numerals climbing the path ──────────────────────── */
  .w-stencil { width: 400px; height: 300px; }
  .w-stencil .w-no {
    position: absolute; left: -18px; top: -78px; font-size: 212px; line-height: 1;
    -webkit-text-stroke: 5px var(--sec-hi);
  }
  .w-stencil .w-jp {
    position: absolute; left: 46px; top: 118px; font-size: 50px; color: var(--washi);
    text-shadow: 5px 5px 0 var(--sec-lo); white-space: nowrap;
  }
  .w-stencil .w-en {
    position: absolute; left: 48px; top: 186px; padding: 3px 13px 2px;
    background: var(--sec); color: #0b1220; font-size: 12px; letter-spacing: 0.3em;
  }
  .w-stencil .w-meta {
    position: absolute; left: 48px; top: 226px; font-size: 12px; letter-spacing: 0.18em;
    color: var(--washi-dim);
  }

  /* ── RECORDS · the figure is the hero, the label is a footnote ───────────────── */
  .w-figure { width: 460px; height: 280px; }
  .w-figure .w-meta {
    position: absolute; left: 0; top: -62px;
    font-family: var(--lat); font-size: 158px; line-height: 0.9; letter-spacing: -0.03em;
    color: var(--sec-hi); text-shadow: 8px 8px 0 rgba(18,12,6,0.8); white-space: nowrap;
  }
  .w-figure .w-meta i {
    font-style: normal; font-size: 34px; letter-spacing: 0.06em; margin-left: 10px;
    color: var(--washi-dim); text-shadow: none;
  }
  .w-figure .w-jp {
    position: absolute; left: 6px; bottom: 58px; font-size: 42px; color: var(--washi);
    text-shadow: 4px 4px 0 rgba(0,0,0,0.5);
  }
  .w-figure .w-en {
    position: absolute; left: 8px; bottom: 24px; font-size: 12px; letter-spacing: 0.34em;
    color: var(--sec);
  }
  .w-figure .w-no {
    position: absolute; right: -30px; bottom: -40px; font-size: 150px; line-height: 1;
    -webkit-text-stroke: 3px rgba(224,145,58,0.26);
  }
  /* ---- level three: a kakemono dropped into the room, unrolling down its own length ---- */
  .sub-l3 { position: absolute; inset: 0; }
  .sub-l3 {
    background:
      linear-gradient(163deg, #0f1320 0%, #171c2c 52%, #0a0d16 100%);
    box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }
  /* a flat colour rail carrying the section name in tategaki */
  .l3-rail {
    position: absolute; left: 0; top: 0; bottom: 0; width: 132px;
    background: linear-gradient(178deg, var(--sec-hi), var(--sec) 45%, var(--sec-lo));
    display: flex; align-items: center; justify-content: center;
    transform-origin: left center;
  }
  .l3-rail-jp {
    writing-mode: vertical-rl;
    font-family: var(--jp); font-weight: 700; font-size: 46px; letter-spacing: 0.3em;
    color: var(--washi); text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.32);
  }
  /* an enormous ghost glyph bled off the right edge */
  .l3-ghost {
    position: absolute; right: -70px; top: 44%; transform: translateY(-50%) rotate(-7deg);
    font-family: var(--jp); font-weight: 700; font-size: 520px; line-height: 0.8;
    color: rgba(242, 234, 216, 0.035);
    pointer-events: none;
  }
  .l3-head { position: absolute; left: 178px; top: 6px; display: flex; flex-direction: column; gap: 8px; }
  .l3-kicker {
    align-self: flex-start;
    font-family: var(--lat); font-size: 10px; letter-spacing: 0.42em; color: var(--ink);
    background: var(--washi); padding: 5px 11px;
  }
  .l3-title {
    font-family: var(--lat); font-style: italic; font-weight: 900; font-size: 64px; line-height: 0.92;
    color: var(--washi); transform: skewX(-9deg);
    text-shadow: 6px 5px 0 var(--sec);
  }
  .l3-grid {
    position: absolute; left: 178px; right: 26px; top: 158px;
    display: flex; flex-direction: column; gap: 0;
    align-content: start;
  }
  /* editorial rows: hairline rules, an outsized numeral, no boxes at all */
  .l3-row {
    display: grid;
    grid-template-columns: 74px 1fr auto 74px;
    align-items: center; gap: 16px;
    padding: 10px 12px 10px 0;
    border-top: 1px solid rgba(242, 234, 216, 0.14);
    background: transparent; text-align: left;
    transition: background 0.16s, padding-left 0.2s cubic-bezier(0.2, 1.3, 0.3, 1);
  }
  .l3-row:last-child { border-bottom: 1px solid rgba(242, 234, 216, 0.14); }
  .l3-row:hover { background: var(--sec); padding-left: 14px; }
  .l3-row:hover .l3-num { color: rgba(255, 255, 255, 0.55); -webkit-text-stroke-color: transparent; }
  .l3-row:hover .l3-gloss, .l3-row:hover .l3-name,
  .l3-row:hover .l3-count, .l3-row:hover .l3-pct { color: var(--washi); }
  .l3-row:hover .l3-meter i { border-color: rgba(255, 255, 255, 0.65); }
  .l3-row:hover .l3-meter i.on { background: var(--washi); }
  /* the index is a graphic element, not a label */
  .l3-num {
    font-family: var(--lat); font-style: italic; font-weight: 900; font-size: 38px; line-height: 0.8;
    color: transparent; -webkit-text-stroke: 1.5px rgba(242, 234, 216, 0.32);
    text-align: right;
  }
  .l3-row.done .l3-num { color: var(--sec); -webkit-text-stroke-color: transparent; }
  .l3-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .l3-gloss {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: var(--jp-go); font-weight: 700; font-size: 16.5px; letter-spacing: 0.02em; color: var(--washi);
  }
  .l3-name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: var(--jp); font-weight: 700; font-size: 12px; letter-spacing: 0.2em;
    color: rgba(242, 234, 216, 0.45);
  }
  .l3-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .l3-count {
    white-space: nowrap;
    font-family: var(--lat); font-size: 9px; letter-spacing: 0.16em; color: var(--washi-dim);
  }
  /* progress as five discrete blocks, not a smooth bar */
  .l3-meter { display: flex; gap: 3px; }
  .l3-meter i {
    width: 13px; height: 8px; display: block;
    border: 1px solid rgba(242, 234, 216, 0.3);
  }
  .l3-meter i.on { background: var(--gold-hi); border-color: var(--gold-hi); }
  .l3-pct {
    font-family: var(--lat); font-style: italic; font-weight: 900; font-size: 20px;
    text-align: right; color: var(--gold-hi);
  }
  .l3-row.done .l3-pct { font-size: 12px; color: var(--sec); }
  .l3-row.fresh .l3-gloss { color: rgba(242, 234, 216, 0.5); }
  .l3-row.fresh .l3-pct { color: rgba(242, 234, 216, 0.28); }
  .l3-pager {
    position: absolute; right: 26px; top: 20px;
    display: flex; gap: 12px; align-items: center;
    font-family: var(--lat); font-size: 11px; letter-spacing: 0.14em; color: var(--washi-dim);
  }
  .l3-pager button {
    font-size: 18px; line-height: 1; padding: 2px 11px;
    color: var(--washi);
    background: rgba(242, 234, 216, 0.1);
    transition: background 0.15s;
  }
  .l3-pager button:hover { background: var(--sec); }
  .l3-back {
    position: absolute; left: 178px; bottom: 14px;
    font-family: var(--lat); font-size: 12px; letter-spacing: 0.28em;
    color: var(--ink); background: var(--washi);
    padding: 11px 22px;
    transition: background 0.15s, color 0.15s, transform 0.2s cubic-bezier(0.2, 1.4, 0.3, 1);
  }
  .l3-back em { font-style: normal; font-family: var(--jp-go); font-size: 10px; opacity: 0.6; margin-left: 7px; }
  .l3-back:hover { background: var(--sec); color: var(--washi); transform: translateX(6px); }

  /* ---------- screen-space chrome ---------- */
  /* Chrome sits above the 3D stage, so anything decorative here must not hit-test — a faded-out
     .desc-line was silently eating half the back button. Blanket-enabling every button then put
     the up-next ticker back over it: opacity is a look, not a state, and an invisible button
     still catches clicks. So menu-only chrome goes inert the moment we leave the menu. */
  /* A dawn sky is bright and the menu type is cream, so the world has to be pushed down behind
     it. Anchored to the left edge where the stack lives and falling off well before centre, so
     it reads as depth rather than as a panel. Sits under the 3D stage, never over it. */
  /* z-index 1 and placed after #glBack in the DOM, so it darkens the world but is still under
     #cssStage at 2 — the type itself must never be touched by it */
  /* Measured, not guessed: with the type hidden, the background luminance behind each item
     gives contrast ratios of 2.1 and 1.9 for STUDY and REVIEW against 8.3–8.9 for the three
     below them. The weak pair are the TOP two, sitting against the brightest part of the dawn
     sky — not the ones over the bright meadow. An edge-anchored gradient barely reached them,
     so the main shade is now an ellipse centred on the stack itself. */
  #typeShade {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      /* Centred on the middle of the stack, not its top. Anchored at 15% height the ellipse ran
         out before READING and DRILLS, and once the rebuilt wood put sunlit canopy behind them
         their worst-case contrast fell to 2.45. Narrow in x on purpose — 75% keeps it off
         Fuji, which must not be dimmed to make type legible. */
      radial-gradient(78% 128% at 12% 32%, rgba(10,14,22,0.68) 0%, rgba(10,14,22,0.48) 34%,
        rgba(10,14,22,0.20) 62%, rgba(10,14,22,0) 86%),
      linear-gradient(100deg, rgba(10,14,22,0.26) 0%, rgba(10,14,22,0.16) 30%,
        rgba(10,14,22,0) 58%),
      linear-gradient(0deg, rgba(8,11,18,0.26) 0%, rgba(8,11,18,0) 24%);
    opacity: 0; transition: opacity 0.5s ease;
  }
  body.at-menu #typeShade { opacity: 1; }
  /* the focus twins for world-geometry level two. Transparent and pointer-events-free so the
     mouse goes to the raycast, but they are real buttons: Tab reaches them, Enter fires them and
     a screen reader reads them, which is everything moving level two into the scene would
     otherwise have thrown away. */
  #worldPicks { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
  .world-pick {
    position: absolute; display: none;
    background: none; border: 0; padding: 0; color: transparent; font-size: 1px;
    pointer-events: none;
  }
  .world-pick:focus-visible { outline: 3px solid var(--hi); outline-offset: 6px; }
  body.world-l2 .world-pick:not(.walk-pick) { display: block; }
  body.at-walk .walk-pick { display: block; }
  .chrome { position: fixed; z-index: 5; pointer-events: none; }
  .chrome a, .chrome button { pointer-events: auto; }
  body:not(.at-menu) .menu-only, body:not(.at-menu) .menu-only * { pointer-events: none; }
  .brand { top: 30px; left: 40px; display: flex; gap: 13px; align-items: center; }
  .brand-seal {
    width: 38px; height: 38px;
    background: var(--hi); color: var(--washi);
    font-family: var(--jp); font-size: 21px; font-weight: 700;
    display: grid; place-items: center;
    transform: rotate(-7deg);
    box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.45);
  }
  .brand-lat2 {
    font-family: var(--lat); font-size: 16px; letter-spacing: 0.32em;
    color: var(--washi);
  }
  .brand-jp2 {
    margin-top: 5px;
    font-family: var(--jp-go); font-weight: 700; font-size: 11px; letter-spacing: 0.3em;
    color: var(--washi-dim);
  }
  .hud { top: 34px; right: 44px; display: flex; gap: 10px; }
  .hud-chip {
    background: var(--washi); color: var(--ink);
    font-family: var(--lat); font-size: 12px; letter-spacing: 0.08em;
    padding: 8px 14px;
    transform: rotate(-1.6deg) skewX(-6deg);
    box-shadow: 0 6px 18px -6px rgba(0, 0, 0, 0.55);
  }
  .hud-chip b { color: var(--hi); font-size: 14px; }
  .hud-chip.shu { background: var(--hi); color: var(--washi); transform: rotate(1.4deg) skewX(-6deg); }
  .hud-chip.shu b { color: #ffd9a1; }
  .hud-chip .jp { font-family: var(--jp-go); font-weight: 700; letter-spacing: 0.1em; }

  /* Bottom RIGHT, not bottom left. RECORDS is the lowest item in a stack that runs diagonally
     down the frame, and at 1280×720 its box reached x 281–759 while the ticker sat at 77–399 —
     so the 記録 subtitle landed on top of the panel. Nudging either one down only trades the
     collision for one with .desc-line, because the bottom-left corner is already three rows
     deep. The right half below the horizon is empty at every viewport, and putting the ticker
     there balances the frame against the stack instead of queueing under it. */
  .upnext {
    right: 44px; bottom: 88px;
    display: flex; align-items: center; gap: 12px;
    transition: opacity 0.3s;
  }
  .upnext b {
    font-family: var(--lat); font-size: 9px; letter-spacing: 0.3em;
    color: rgba(242, 234, 216, 0.45);
  }
  .upnext-item {
    display: flex; align-items: center; gap: 12px;
    background: rgba(242, 234, 216, 0.08);
    padding: 8px 15px;
    transform: skewX(-8deg);
    font-family: var(--jp-go); font-weight: 700; font-size: 12.5px; letter-spacing: 0.14em;
    color: var(--washi);
    transition: background 0.15s;
  }
  .upnext-item:hover { background: var(--hi); }
  .upnext-item i { font-style: normal; color: var(--gold-hi); }
  .desc-line {
    left: 6vw; bottom: 8vh;
    font-family: var(--jp-go); font-weight: 700;

<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const ITEMS = [
  { jp: '学習', en: 'STUDY',   kanji: '学', desc: 'Kana, kanji and vocabulary by section', descJp: 'かな・漢字・語彙のセクション学習' },
  { jp: '復習', en: 'REVIEW',  kanji: '復', desc: 'Cards due today — 24 waiting', descJp: '期限が来たカード', badge: 24 },
  { jp: '読解', en: 'READING', kanji: '読', desc: 'Graded reading passages, N5 to N2', descJp: 'レベル別の読みもの' },
  { jp: '特訓', en: 'DRILLS',  kanji: '特', desc: 'Daily minigames to sharpen recall', descJp: '毎日のミニゲームで腕試し' },
  { jp: '検定', en: 'JLPT',    kanji: '検', desc: 'Mock exams and JLPT preparation', descJp: 'JLPT 模擬試験と対策' },
  { jp: '記録', en: 'RECORDS', kanji: '記', desc: 'Progress, statistics and streaks', descJp: '進捗・統計・連続記録' },
];
const SUBTILES = {
  STUDY:   [['ひらがな','HIRAGANA','46 chars · 92%'], ['カタカナ','KATAKANA','46 chars · 71%'], ['漢字','KANJI','2,136 kanji'], ['語彙','VOCAB','8,000 words']],
  REVIEW:  [['今日の分','DUE TODAY','24 cards'], ['苦手札','WEAK CARDS','7 cards'], ['先取り','AHEAD','12 cards'], ['総復習','ALL','341 cards']],
  READING: [['短文','SHORT','N5 · 12 texts'], ['物語','STORIES','N4 · 8 stories'], ['記事','ARTICLES','N3 · 15 pieces'], ['随筆','ESSAYS','N2 · 6 essays']],
  DRILLS:  [['聞き取り','LISTENING','4 drills'], ['書き取り','WRITING','4 drills'], ['速読','SPEED','best 42'], ['対戦','VERSUS','weekends']],
  JLPT:    [['文字語彙','VOCAB','5 mock exams'], ['文法','GRAMMAR','5 mock exams'], ['読解','READING','5 mock exams'], ['聴解','LISTENING','5 mock exams']],
  RECORDS: [['連続記録','STREAK','12 days'], ['正答率','ACCURACY','86%'], ['学習時間','TIME','42 hours'], ['級位','RANK','7th grade']],
};
/* each destination carries its own colour, taken from the place it stands in —
   the main-menu slash, tick and badge wear it too, so the word previews its room */
/* ---- what REVIEW's level three actually IS ----
   Its four tiles are QUEUES, not lists — you do not browse "due today", you run it — which is why
   this section has had no level three while four others did. What it can honestly show is what
   the queue is made OF: the same decks every time, with the count and the progress that this
   queue sees. So the placards down the tunnel never change identity, only their numbers, which
   is also why they can be permanent scenery rather than something that spawns. */
const L3_REVIEW = {
  decks: [['漢字 N5', 'KANJI N5'], ['語彙', 'VOCAB'], ['文法', 'GRAMMAR'],
    ['カタカナ', 'KATAKANA'], ['聴解', 'LISTENING'], ['ひらがな', 'HIRAGANA']],
  /* per queue, per deck: [count, percent through] */
  queues: {
    '今日の分': [[8, 74], [7, 61], [5, 88], [4, 42], [0, 100], [0, 100]],
    '苦手札': [[3, 22], [2, 31], [1, 45], [1, 12], [0, 0], [0, 0]],
    '先取り': [[4, 96], [3, 88], [2, 92], [2, 70], [1, 55], [0, 100]],
    '総復習': [[96, 74], [88, 61], [64, 88], [46, 42], [47, 30], [46, 100]],
  },
  unit: 'cards',
};

const SECTION_ACCENT = {
  STUDY:   ['#cfa45c', '#8f713a', '#e8c47c'],
  REVIEW:  ['#e34a33', '#b23320', '#ef5a41'],
  READING: ['#4f9d6b', '#2f6742', '#6fc189'],
  DRILLS:  ['#c2344a', '#8a1f31', '#e04c62'],
  JLPT:    ['#5b86c4', '#365b90', '#7fa8e0'],
  RECORDS: ['#e0913a', '#8f2818', '#f0a24a'],
};

/* ================= renderers ================= */
const W = () => innerWidth, H = () => innerHeight;
const NIGHT = 0x151928;

/* far plane out to 60k: Fuji stands 17,000 away and the horizon rim another 30,000 behind it */
const camera = new THREE.PerspectiveCamera(42, W() / H(), 1, 60000);
/* EVERY FRAMING IN THIS FILE WAS COMPOSED AT 16:9, and a vertical field of view crops the SIDES
   off the moment the window is narrower than that — which is most laptops in a windowed browser
   and every portrait phone. Below the reference aspect the vertical field opens up instead, so
   the horizontal field is the thing held constant and nothing composed against the frame's left
   or right edge can fall out of it. Wider than 16:9 simply gains sky and ground, which costs
   nothing. Every camera in the file goes through this, so it applies to the menu and to all six
   arrivals rather than being patched into one of them. */
const REF_ASPECT = 16 / 9;
function fitFov(fovY) {
  const a = W() / H();
  const half = fovY * 0.5 * Math.PI / 180;
  camera.aspect = a;
  camera.fov = a >= REF_ASPECT ? fovY
    : Math.atan(Math.tan(half) * REF_ASPECT / a) * 2 * 180 / Math.PI;
  camera.updateProjectionMatrix();
}

const backScene = new THREE.Scene();
/* scaled to a real landscape: the near ground stays clear, the foothills soften, and the far
   ranges dissolve into the night rather than ending at a visible edge */
/* EXPONENTIAL, not linear. Linear fog has a C1 kink at its `near` plane, and on ground seen at
   a grazing angle a whole ring of world compresses into a few pixels, so that kink is a
   candidate for a straight seam across the meadow. Exp² has no near plane at all — it starts at
   zero and builds quadratically, so the near ground stays clear and the distance still
   dissolves. At 4.0e-5 that is ~2% haze at 3,500 units, 25% on Fuji at 13,500, 78% on the rim.
   (This is prophylactic, not the fix for the seam that was actually there — see the valley fog
   banks below, which is where that came from.) */
backScene.fog = new THREE.FogExp2(0xd8c1ab, 4.0e-5);
const backRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
backRenderer.setSize(W(), H());
backRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
/* Filmic tone mapping + real shadows, proven in lab-shading.html. Without tone mapping the raw
   framebuffer is what you see, which is a large part of why untreated three.js reads flat.
   The painted sky and the sunrise sprites opt OUT of it further down — they are art, not
   radiance, and ACES would just wash the dawn gradient out. */
backRenderer.toneMapping = THREE.ACESFilmicToneMapping;
backRenderer.toneMappingExposure = 1.0;
backRenderer.shadowMap.enabled = true;
backRenderer.shadowMap.type = THREE.PCFShadowMap;   /* PCFSoft is deprecated in this build */
/* THE SHADOW MAP IS RENDERED ONCE, EVER. The sun does not move and neither does the landscape,
   so re-rendering 4096² of depth on every frame was pure waste — and once the water added a
   second scene render it became waste twice over, because three rebuilds the shadow map per
   render() call. Turning autoUpdate off and asking for a single build took headless from
   0.5 fps back to double digits. */
backRenderer.shadowMap.autoUpdate = false;
document.getElementById('glBack').appendChild(backRenderer.domElement);

const frontScene = new THREE.Scene();
const frontRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
frontRenderer.setSize(W(), H());
frontRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById('glFront').appendChild(frontRenderer.domElement);

const cssScene = new THREE.Scene();
const cssRenderer = new CSS3DRenderer();
cssRenderer.setSize(W(), H());
document.getElementById('cssStage').appendChild(cssRenderer.domElement);

/* The viewport, shared BY REFERENCE with every outline material ever built (see
   `outlineMaterial`). Outlines are now a pixel width, so they need the size of the thing they
   are measured in — and there are dozens of these materials, so handing each one its own copy
   would mean keeping a registry of them just to resize. One object, written once. */
const OUTLINE_RES = { value: new THREE.Vector2(W(), H()) };

addEventListener('resize', () => {
  fitFov(cam ? cam.fov : camera.fov);
  backRenderer.setSize(W(), H());
  frontRenderer.setSize(W(), H());
  cssRenderer.setSize(W(), H());
  OUTLINE_RES.value.set(W(), H());
});

/* ================= textures ================= */
function softDot(r, g, b, size = 64) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, `rgba(${r},${g},${b},0.9)`);
  grad.addColorStop(0.6, `rgba(${r},${g},${b},0.35)`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}
function blotTexture(size, blobs, r, g, b) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  for (let i = 0; i < blobs; i++) {
    const x = size / 2 + (Math.random() - 0.5) * size * 0.5;
    const y = size / 2 + (Math.random() - 0.5) * size * 0.5;
    const rad = size * (0.10 + Math.random() * 0.22);
    const grad = ctx.createRadialGradient(x, y, 0, x, y, rad);
    grad.addColorStop(0, `rgba(${r},${g},${b},0.8)`);
    grad.addColorStop(0.7, `rgba(${r},${g},${b},0.3)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}
function ringTexture(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.strokeStyle = 'rgba(232,196,124,0.7)';
  ctx.lineWidth = size * 0.045;
  ctx.beginPath(); ctx.arc(size/2, size/2, size*0.4, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(232,196,124,0.28)';
  ctx.lineWidth = size * 0.02;
  ctx.beginPath(); ctx.arc(size/2, size/2, size*0.31, 0, 7); ctx.stroke();
  return new THREE.CanvasTexture(c);
}

/* ================= back scene: night atmosphere ================= */
const P_COUNT = 800;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(P_COUNT * 3);
const pVel = new Float32Array(P_COUNT * 2);
for (let i = 0; i < P_COUNT; i++) {
  pPos[i*3]     = -1400 + Math.random() * 4200;
  pPos[i*3 + 1] = -900 + Math.random() * 1900;
  pPos[i*3 + 2] = -2400 + Math.random() * 2700;
  pVel[i*2]     = 0.6 + Math.random() * 1.6;
  pVel[i*2 + 1] = 2 + Math.random() * 7;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 13, map: softDot(214, 224, 240), transparent: true, opacity: 0.4,
  depthWrite: false, sizeAttenuation: true,
}));
/* removed: 2D foreground stylisation — the world carries the scene now */
/* a scattering of gold embers among the mist */
const E_COUNT = 90;
const eGeo = new THREE.BufferGeometry();
const ePos = new Float32Array(E_COUNT * 3);
for (let i = 0; i < E_COUNT; i++) {
  ePos[i*3] = -1200 + Math.random() * 3800;
  ePos[i*3 + 1] = -800 + Math.random() * 1700;
  ePos[i*3 + 2] = -2000 + Math.random() * 2300;
}
eGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
const embers = new THREE.Points(eGeo, new THREE.PointsMaterial({
  size: 10, map: softDot(232, 196, 124), transparent: true, opacity: 0.5,
  depthWrite: false, sizeAttenuation: true,
}));
/* removed: 2D foreground stylisation — the world carries the scene now */

const clouds = [];
const darkCloudTex = blotTexture(512, 7, 8, 10, 18);
const paleCloudTex = blotTexture(512, 6, 190, 205, 228);
for (let i = 0; i < 7; i++) {
  const dark = i < 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: dark ? darkCloudTex : paleCloudTex, transparent: true,
    opacity: dark ? 0.32 : 0.05, depthWrite: false,
  }));
  const scale = 1000 + Math.random() * 1100;
  s.scale.set(scale, scale * (0.55 + Math.random() * 0.4), 1);
  s.position.set(-1100 + Math.random() * 3800, dark ? -650 + Math.random() * 500 : 100 + Math.random() * 700, -2000 + Math.random() * 1000);
  s.userData = { rot: (Math.random() - 0.5) * 0.0005, breathe: 0.7 + Math.random() * 0.9, base: scale };
  clouds.push(s);
}

/* ---- the surrounding world: a painted 360° night panorama ----
   Sector budget, and it is tight: standing at a destination you read az ± 25°, so a sector wants
   ~50° — but six of those is 300° and the menu's own backdrop needs the 75° strip [206°, 281°]
   to itself. So the six destination sectors tile the *other* 260° at 34–52° apart, overlapping
   each other by a few degrees (that reads as one continuous world) and stopping ~12° short of
   the menu strip on both sides. Every sector's density scales with its width — 30 bamboo stalks
   in a 44° sector is a fence, not a grove. */
function paintPanorama() {
  const W = 4096, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#242b45');
  sky.addColorStop(0.45, '#171c2c');
  sky.addColorStop(1, '#0d101a');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);
  for (let i = 0; i < 700; i++) {
    g.fillStyle = `rgba(230,236,248,${0.2 + Math.random() * 0.5})`;
    g.fillRect(Math.random() * W, Math.pow(Math.random(), 1.6) * H * 0.55, 2, 2);
  }
  const hz = g.createLinearGradient(0, H * 0.54, 0, H * 0.76);
  hz.addColorStop(0, 'rgba(159,184,216,0)');
  hz.addColorStop(0.5, 'rgba(159,184,216,0.07)');
  hz.addColorStop(1, 'rgba(159,184,216,0)');
  g.fillStyle = hz;
  g.fillRect(0, H * 0.54, W, H * 0.22);

/* ================= CLOUD SHADOWS =================
   Ported from lab-shading.html. A single directional light on smooth landform always gives the
   same plain diagonal terminator; the fault is that there is only one occluder. Cloud cover is
   the second, and the cheapest large-scale variation available — one texture lookup.

   It multiplies DIRECT light only, so shaded ground falls to the cold fill rather than merely
   going grey, and the lookup is projected along the light onto y = 0 so the cover stays put on
   a hillside instead of sliding up the slope as the ground rises. */
function cloudTexture(S = 512) {
  const hash = (x, y, p) => {
    const xi = ((x % p) + p) % p, yi = ((y % p) + p) % p;
    const n = Math.sin(xi * 127.1 + yi * 311.7) * 43758.5453;
    return n - Math.floor(n);
  };
  const sm = (t) => t * t * (3 - 2 * t);
  const noise = (x, y, p) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const u = sm(x - xi), v = sm(y - yi);
    return hash(xi, yi, p) * (1 - u) * (1 - v) + hash(xi + 1, yi, p) * u * (1 - v)
         + hash(xi, yi + 1, p) * (1 - u) * v + hash(xi + 1, yi + 1, p) * u * v;
  };
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let v = 0, amp = 0.55, f = 3;
      for (let o = 0; o < 5; o++) { v += noise(x / S * f, y / S * f, f) * amp; amp *= 0.5; f *= 2; }
      /* capped at 0.85 so even a cloud's core still passes light — uncapped reads as a hole */
      const lit = Math.round(255 * (1 - THREE.MathUtils.smoothstep(v, 0.40, 0.74) * 0.85));
      const i = (y * S + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = lit; img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* THE UNIFORM TRAP: three.js uploads a built-in material's uniforms only when that material's
   `version` changes, so a custom uniform added through onBeforeCompile is written to the GPU
   exactly once and never again — mutating `.value` per frame does nothing, silently.
   `needsUpdate` is only `version++` (it disposes nothing), so bumping it on the cloud-lit
   materials each frame is the cheap, supported way through. */
const CLOUD_MATS = [];
function cloudy(mat) {
  if (mat.userData.cloudy) return mat;
  mat.userData.cloudy = true;
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, CLOUD);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vCloudPos;')
      /* after project_vertex so `transformed` is final; the instancing branch matters because
         the trees, grass and stones are all InstancedMesh */
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 cwp = vec4( transformed, 1.0 );
        #ifdef USE_INSTANCING
          cwp = instanceMatrix * cwp;
        #endif
        vCloudPos = ( modelMatrix * cwp ).xyz;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vCloudPos;
        uniform sampler2D uCloudMap;
        uniform vec2 uCloudOff;
        uniform vec2 uCloudProj;
        uniform float uCloudScale;
        uniform float uCloudAmt;
        uniform vec3 uMistColor;
        uniform float uMistY, uMistH, uMistAmt;`)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        {
          vec2 cuv = ( vCloudPos.xz - vCloudPos.y * uCloudProj ) * uCloudScale + uCloudOff;
          float cs = texture2D( uCloudMap, cuv ).r;
          reflectedLight.directDiffuse *= mix( 1.0, cs, uCloudAmt );
        }`)
      /* VALLEY MIST AS ATMOSPHERE, NOT AS OBJECTS. Flattened ellipsoids gave you a lid to look
         down on; sprites fixed that but 260 huge alpha-blended quads cost four times the rest
         of the frame put together. Neither is what mist is. This is the analytic integral of an
         exponential height-density field along the view ray: thick when you look the length of
         the valley floor, thin when you look up out of it, automatically pooling in whatever is
         low. It has no geometry, so there is nothing to see the underside of, and it costs a
         handful of instructions on shading that was already happening. */
      .replace('#include <fog_fragment>', `#include <fog_fragment>
        #ifdef USE_FOG
        {
          vec3 mv = vCloudPos - cameraPosition;
          float md = length( mv );
          float mk = 1.0 / uMistH;
          /* CLAMPED AT THE MIST PLANE. The reflection pass renders from a camera mirrored
             below the water — 446 units under the mist reference — and exp(+446/380) put the
             base density at 3.2x, so the reflected world dissolved into mist and left only the
             outline hulls behind. Reflections looked like skeletons of the trees above them. */
          float mbase = uMistAmt * exp( - max( cameraPosition.y - uMistY, 0.0 ) * mk );
          float mdy = mv.y * mk;
          float mint = abs( mdy ) < 1e-4 ? md : md * ( 1.0 - exp( - mdy ) ) / mdy;
          float mf = 1.0 - exp( - max( mbase * mint, 0.0 ) );
          gl_FragColor.rgb = mix( gl_FragColor.rgb, uMistColor, clamp( mf, 0.0, 1.0 ) );
        }
        #endif`);
    /* a String.replace on a chunk name that moved is a silent no-op, and the result looks
       exactly like a working feature with its strength set to zero. Never let it fail quietly */
    if (!shader.vertexShader.includes('vCloudPos = (') || !shader.fragmentShader.includes('texture2D( uCloudMap')) {
      console.error('CLOUD PATCH FAILED', mat.type);
    }
  };
  mat.needsUpdate = true;
  CLOUD_MATS.push(mat);
  return mat;
}

/* ================= THE LANDSCAPE =================
   Step one of the rebuild: terrain, sky, Fuji and the home composition, and nothing else.

   Everything is placed against that axis:

/* ---- terrain ----
   Rebuilt against lab-shading.html. The old version was one flat hex value on a flat-shaded
   plane, which is why the near ground read as a sheet of dark green rather than as land. What
   replaces it costs nothing at runtime — every bit of it is baked into the vertices at build:

     slope/height ramp   grass low, pale dry grass high, rock on anything steep
     coherent mottle     a large expanse of one interpolated green is a smear however well it
                         is lit; this is the cheapest thing that gives it grain
     baked vertex AO     measured as concavity relative to the local tangent plane, so a
                         tilted slope comes out unoccluded and only real hollows darken
     smooth shading      the lab's finding: a toon ramp across a large curved surface quantises
                         into contour blotches. Toon is for objects; terrain gets this. */
/* ---- the lake, and the river that feeds it ----
   Both are authored in SIGHT-LINE coordinates (d down the axis, s across it) and both are cut
   into the heightfield itself, not laid on top of it. That is the only way a body of water sits
   in the land rather than floating over it — and it means every prop, which is already placed
   from the heightfield, gets the shoreline for free. */
/* Sized so BOTH shores are in the picture. At r 4000 centred 3,600 out the near edge sat behind
   the camera and the far edge 7,600 ahead — the frame was nothing but water, and the coast
   planting was too distant and too deep in the mist to read as trees. 300 units of bank in
   front of the eye and a far shore at 5,700 keeps the reflection and gives it a setting. */
const LAKE = { d: 3000, s: 400, r: 2700, level: -70 };
const LAKE_C = { x: AXIS.x * LAKE.d + SIDE.x * LAKE.s, z: AXIS.y * LAKE.d + SIDE.y * LAKE.s };
const LAKE_Y = GROUND_Y + LAKE.level;             /* the water surface, in world space */
const RIVER_FROM = 7200, RIVER_TO = 21000;
function riverSideAt(d) { return 2400 + Math.sin(d * 0.00038 + 0.6) * 2100 - d * 0.055; }

/* > 0 inside the lake, 0 at the shore, negative outside. The radius wobbles with bearing so the
   shoreline is a coast and not a drawn circle. */
function lakeRadiusAt(a) {
  return LAKE.r * (1 + Math.sin(a * 3 + 0.7) * 0.13 + Math.sin(a * 5 - 1.9) * 0.07
                     + Math.sin(a * 2 + 2.4) * 0.09);

function lakeField(x, z) {
  const lx = x - LAKE_C.x, lz = z - LAKE_C.z;
  return 1 - Math.hypot(lx, lz) / lakeRadiusAt(Math.atan2(lz, lx));
}

function landAt(x, z) {
  const rad = Math.hypot(x, z);

     under the type stays calm and the horizon does not heave about. */
  const broad = Math.sin(x * 0.00016) * Math.cos(z * 0.00013) * 430
              + Math.sin(x * 0.00043 + 1.7) * Math.cos(z * 0.00039) * 190
              + Math.sin(x * 0.00097 + 4.1) * Math.cos(z * 0.00088) * 70;
  /* near-field texture, NOT flattened. Scaling the whole heightfield down near the camera is

     composition alone and big enough that the ground catches light unevenly. Wavelengths of
     2400 and 890 against a 206-unit quad, so both survive the tessellation. */
  const fine = Math.sin(x * 0.0026 + 2.3) * Math.cos(z * 0.0022) * 34

     the river running along at bank height and stopping dead at the water. */
  const across = Math.max(0, 1 - Math.abs(ss - riverSideAt(dd)) / 430);

  grp.add(shell);
  addOutline(shell, 7.0);
  grp.position.copy(at(dist, side, GROUND_Y - 120));

/* 13,000 out and 4,200 tall: at the first values (17,000 / 2,700) it subtended barely 7° and
   read as a bump on the horizon. This fills most of the upper frame — which is the point of
   putting it on the sight line. Offset right so it sits clear of the type stack. */
makeFuji(13500, 2600, 6000, 3500);

/* A RIDGE IS NEVER ONE CONE, and it is never one colour either. Each is a cluster of four or
   five masses merged into a single vertex-coloured mesh, coloured by height the same way Fuji
   is — dark forested skirt, bare rock above it, snow on anything that gets high enough, with a
   ragged line between each. Merging matters: as separate cones the shoulders showed their own
   silhouettes through each other and the cluster read as a pile of triangles. */
function mountainRidge(dist, side, w, h, palette) {
  const [SKIRT, ROCK, SNOW] = palette.map((c) => new THREE.Color(c));
  const seed = Math.abs(Math.floor(dist * 7 + side * 3));
  const rnd = (n) => hash01(seed, n * 7919);
  const parts = [[0, 0, 1, 1], [0.74, 0.10, 0.60, 0.72], [-0.68, -0.09, 0.52, 0.58],
    [0.36, -0.22, 0.40, 0.42], [-0.30, 0.24, 0.34, 0.35]];
  const geos = [];
  parts.forEach(([fx, fz, sw, sh], k) => {
    if (k > 2 && rnd(k) < 0.35) return;                       /* not every ridge gets five */
    const cw = w * sw * (0.85 + rnd(k + 9) * 0.35);
    const ch = h * sh * (0.85 + rnd(k + 17) * 0.3);
    const g = new THREE.ConeGeometry(cw, ch, 5 + ((seed + k) % 4));
    g.rotateY(rnd(k + 5) * 6.28);
    /* squashed across the sight line so a ridge is a ridge and not a pyramid */
    g.scale(1, 1, 0.62 + rnd(k + 3) * 0.3);
    const p = at(dist + w * fz, side + w * fx, 0);
    const base = at(dist, side, 0);
    g.translate(p.x - base.x, ch / 2, p.z - base.z);
    geos.push(g);
  });
  /* one merged shell, coloured by absolute height across the whole cluster */
  const merged = mergeParts(geos.map((g) => ({ geo: g, color: 0xffffff })));
  const p = merged.attributes.position;
  const col = merged.attributes.color, tmp = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const t = THREE.MathUtils.clamp(p.getY(i) / h, 0, 1);
    const a = Math.atan2(p.getZ(i), p.getX(i));
    const wob = Math.sin(a * 5 + seed) * 0.05 + Math.sin(a * 11) * 0.025;
    tmp.copy(SKIRT).lerp(ROCK, THREE.MathUtils.smoothstep(t, 0.22 + wob, 0.52 + wob));
    tmp.lerp(SNOW, THREE.MathUtils.smoothstep(t, 0.70 + wob, 0.86 + wob));
    col.setXYZ(i, tmp.r, tmp.g, tmp.b);
  }
  const m = new THREE.Mesh(merged, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
  const b = onGround(dist, side, -140);
  m.position.copy(b);
  backScene.add(m);
  addOutline(m, 6.4);
  /* the cluster reaches the furthest shoulder offset plus its radius: 0.74w + 0.60w */
  blockAdd(b.x, b.z, w * 1.34, h);
}
/* Two layers behind the wood, so the valley reads as having depth rather than as a backdrop.
   HELD BEYOND THE FOREST BELT ON PURPOSE. The first placement put them at 5,200–8,900, right
   inside the band the trees scatter across — and once props correctly refuse to stand inside a
   mountain, seven overlapping footprints plus Fuji's claimed more of that band than existed and
   deleted the wood. A range is a backdrop; it belongs behind the thing it is a backdrop to. */
[[10500, -5600, 2400, 900], [11800, 4200, 2600, 780], [13000, -2600, 3000, 1250], [12200, 7600, 2400, 900]]
  .forEach(([d, s, w, h]) => mountainRidge(d, s, w, h, [0x33452f, 0x4c5771, 0xdcd2d6]));
[[17000, -9500, 4200, 2000], [18000, 9000, 3800, 1750], [20000, -3200, 3400, 1500]]
  .forEach(([d, s, w, h]) => mountainRidge(d, s, w, h, [0x3d4a52, 0x66738c, 0xe6dcdc]));
/* and a rim all the way round, so turning the camera never finds an edge of the world. Nearly
   dissolved by the haze at this range, so it only has to give the horizon a broken edge. */
for (let k = 0; k < 26; k++) {
  /* jittered off the exact spoke — 26 peaks at exactly 13.8° apart reads as a picket fence */
  const a = (k / 26 + (hash01(k, 5) - 0.5) * 0.55 / 26) * Math.PI * 2 + 0.3;
  const r = 24000 + hash01(k, 11) * 6000;
  const h = 1700 + hash01(k, 23) * 2200;
  const cw = 3000 + hash01(k, 37) * 2800;
  const g = new THREE.ConeGeometry(cw, h, 5 + (k % 3));
  g.rotateY(hash01(k, 41) * 6.28);
  g.scale(1, 1, 0.7);
  g.translate(0, h / 2, 0);
  const merged = mergeParts([{ geo: g, color: 0xffffff }]);
  const p = merged.attributes.position, col = merged.attributes.color, tmp = new THREE.Color();
  const LO = new THREE.Color(0x5f6c86), HI = new THREE.Color(0xd8d2d8);
  for (let i = 0; i < p.count; i++) {
    tmp.copy(LO).lerp(HI, THREE.MathUtils.smoothstep(p.getY(i) / h, 0.62, 0.9));
    col.setXYZ(i, tmp.r, tmp.g, tmp.b);
  }
  const m = new THREE.Mesh(merged, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
  m.position.set(EYE.x + Math.cos(a) * r, GROUND_Y - 300, EYE.y + Math.sin(a) * r);
  backScene.add(m);
  addOutline(m, 6.0);
  blockAdd(m.position.x, m.position.z, cw * 1.1, h);
}

/* ---- lighting: the sun coming up behind the ranges, low and warm ----
   KEY-TO-FILL RATIO IS THE WHOLE GAME (lab-shading.html). At sun 2.4 against hemisphere 1.35
   direct sunlight was barely a majority of the ground's light, so cast shadows and cloud
   shadows both moved the final pixel by a percent or two and read as "the shadows are weak"
   when the shadows were fine. Trading one against the other is a false choice: a third light
   — a directional bounce that casts nothing — lifts shadowed surfaces while still SHAPING
   them, which lets the key dominate and the hemisphere drop to a tint. */
/* ONE SUN POSITION, TWO CONSUMERS. The light and the visible disc were placed independently and
   disagreed: the disc sat at at(15000, 6400, 300), which is 3,800 units from Fuji's axis on a
   mountain 6,000 wide — so it was *inside the silhouette*, and the only trace of it was a glow
   leaking round the flank. It now sits 4,600 clear of the axis where the skyline drops to about
   200 units, well below it, and the key light is derived from the same vector so the shading
   agrees with where you can see the sun. 14° of elevation: low enough to be a sunrise, high
   enough that the ground still takes a majority of its light from the key. */
const SUN_AT = at(15000, 7200, 0);
SUN_AT.y = GROUND_Y + Math.hypot(SUN_AT.x - EYE.x, SUN_AT.z - EYE.y) * Math.tan(11 * Math.PI / 180);
{
  /* raised from 3.2 with the sun: dropping the elevation from 20° to 14° cuts cos(incidence) on
     flat ground by a third, and the meadow went with it */
  const sun = new THREE.DirectionalLight(0xffd9b0, 4.6);
  sun.position.copy(SUN_AT);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  /* SIZE THE BOX, THEN COUNT ITS TEXELS. There is no point covering a 70,000-unit valley: at
     4096 that is a 17-unit texel and nothing reads. The shadow box covers the near and middle
     ground the camera actually stands in — ±9000 around a point out along the sight line —
     which is a 4.4-unit texel, and the far ranges simply go unshadowed, where nobody looks
     for contact anyway. */
  sun.target.position.copy(at(3000, 0, GROUND_Y));
  const sc = sun.shadow.camera;
  sc.left = -9000; sc.right = 9000; sc.top = 9000; sc.bottom = -9000;
  sc.near = 500; sc.far = 26000;
  /* the blur must be smaller than what it shadows: at a 4.4-unit texel, radius 2 is ~9 units */
  sun.shadow.radius = 2;
  sun.shadow.bias = -0.0005;
  sun.shadow.normalBias = 12;
  backScene.add(sun, sun.target);

  /* the cold side, so the shadowed flanks read blue rather than black. Casts nothing. */
  const bounce = new THREE.DirectionalLight(0x93b0dc, 0.95);
  bounce.position.copy(at(-3000, -6000, 3400));
  backScene.add(bounce, bounce.target);
  backScene.add(new THREE.HemisphereLight(0xcfd8e6, 0x4a4436, 0.75));
}

/* ---- the sunrise itself: a disc and a wide bloom, aimed rather than baked into the dome ---- */
function radialTex(inner, outer, stops) {
  const S = 256;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(S / 2, S / 2, inner, S / 2, S / 2, outer);
  stops.forEach(([o, col]) => rg.addColorStop(o, col));
  g.fillStyle = rg; g.fillRect(0, 0, S, S);

}
{
  const bloom = new THREE.Sprite(new THREE.SpriteMaterial({
    map: radialTex(0, 128, [[0, 'rgba(255,226,182,0.85)'], [0.28, 'rgba(255,196,136,0.34)'],
      [0.62, 'rgba(232,158,120,0.10)'], [1, 'rgba(232,158,120,0)']]),
    transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending,
  }));
  /* both driven off SUN_AT, so the glow can never drift away from the light again */
  bloom.position.copy(SUN_AT);
  bloom.scale.set(7600, 7600, 1);
  backScene.add(bloom);
  const disc = new THREE.Sprite(new THREE.SpriteMaterial({
    map: radialTex(0, 90, [[0, 'rgba(255,248,232,1)'], [0.5, 'rgba(255,226,178,0.9)'], [1, 'rgba(255,210,150,0)']]),

  }));
  disc.position.copy(SUN_AT).multiplyScalar(0.995);

  backScene.add(disc);

/* ---- valley mist ----
   There is no geometry here on purpose. The mist is an exponential height-density field
   integrated along the view ray inside every lit material's shader (see `cloudy`), so it pools
   in low ground, thins as you look up out of the valley, and has no surface to see the
   underside of. All that is left to do is tell it where the valley floor is. */
CLOUD.uMistY.value = LAKE_Y + 10;

/* ================= WATER =================
   THE OLD RIVER FLOATED 285 UNITS ABOVE THE GROUND, and the reason is worth writing down:
   `TubeGeometry(...); geo.scale(1, 0.05, 1)` scales about the geometry's ORIGIN, not about the
   curve. The control points sat near y = −300, so flattening the tube multiplied that by 0.05
   and lifted the whole river to y ≈ −15. It looked like a ribbon because it *was* the right
   shape — it was simply in the wrong place, and the earlier version had been hiding it with a
   compensating `river.position.y` that did not survive the rebuild.

   Nothing is scaled here. The river is a strip built from ground samples, and the lake is a
   flat plane at the level the basin was cut to. */

/* the lake surface, with a real planar reflection. The scene is rendered a second time from the
   camera mirrored about the water plane, clipped to everything above it, and the result is
   sampled in screen space — which is what puts Fuji in the water rather than a painted hint of
   it. 768 rather than 512: at 512 a reflected tree trunk is under two pixels wide and the ripple
   smeared them into scribbles on the water — the distortion has to stay smaller than the
   features it is distorting. */
const reflectRT = new THREE.WebGLRenderTarget(768, 768, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false,
});
const reflectCam = new THREE.PerspectiveCamera();
const reflectTexM = new THREE.Matrix4();
const lakeWater = (() => {
  const geo = new THREE.PlaneGeometry(LAKE.r * 2.6, LAKE.r * 2.6, 1, 1);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      tReflect: { value: reflectRT.texture },
      texMatrix: { value: reflectTexM },
      uTime: { value: 0 },
      uDeep: { value: new THREE.Color(0x2c3b4e) },
      uShallow: { value: new THREE.Color(0x5c7385) },
      fogColor: { value: backScene.fog.color },
      fogDensity: { value: backScene.fog.density },
      uMistColor: CLOUD.uMistColor,
      uMistY: CLOUD.uMistY,
      uMistH: CLOUD.uMistH,
      uMistAmt: CLOUD.uMistAmt,

      uniform mat4 texMatrix;
      varying vec4 vProj;
      varying vec3 vWorld;
      varying float vDepth;
      void main() {
        vec4 wp = modelMatrix * vec4( position, 1.0 );
        vWorld = wp.xyz;
        vProj = texMatrix * wp;
        vec4 mv = viewMatrix * wp;
        vDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D tReflect;
      uniform float uTime;
      uniform vec3 uDeep, uShallow, fogColor, uMistColor;
      uniform float fogDensity, uMistY, uMistH, uMistAmt;
      varying vec4 vProj;
      varying vec3 vWorld;
      varying float vDepth;
      void main() {
        /* a slow chop, large enough to read at this scale and small enough not to smear the
           mountain into nothing. Two crossed waves, not noise — a still dawn lake is glassy. */
        float w = sin( vWorld.x * 0.0032 + uTime * 0.55 ) * cos( vWorld.z * 0.0027 - uTime * 0.41 )
                + sin( vWorld.z * 0.0071 - uTime * 0.7 ) * 0.4;
        vec2 uv = vProj.xy / vProj.w + vec2( w * 0.0021, w * 0.0008 );
        vec3 refl = texture2D( tReflect, uv ).rgb;

           and the camera IS at a grazing angle here, which is why the reflection carries */
        vec3 v = normalize( cameraPosition - vWorld );
        float f = pow( 1.0 - clamp( v.y, 0.0, 1.0 ), 2.4 );
        vec3 body = mix( uDeep, uShallow, clamp( w * 0.25 + 0.5, 0.0, 1.0 ) );
        vec3 col = mix( body, refl, clamp( f * 1.05, 0.12, 0.94 ) );

           it too instead of staying sharp while the land around it softens */
        vec3 mv2 = vWorld - cameraPosition;
        float mk = 1.0 / uMistH;
        float mbase = uMistAmt * exp( - max( cameraPosition.y - uMistY, 0.0 ) * mk );
        float mdy = mv2.y * mk;
        float mint = abs( mdy ) < 1e-4 ? length( mv2 ) : length( mv2 ) * ( 1.0 - exp( - mdy ) ) / mdy;
        col = mix( col, uMistColor, clamp( 1.0 - exp( - max( mbase * mint, 0.0 ) ), 0.0, 1.0 ) );
        float fg = 1.0 - exp( - fogDensity * fogDensity * vDepth * vDepth );
        gl_FragColor = vec4( mix( col, fogColor, clamp( fg, 0.0, 1.0 ) ), 1.0 );
