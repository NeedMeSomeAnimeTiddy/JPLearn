name: Electron Packaged Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron-frontend/**'
      - '.github/workflows/electron-packaged-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'electron-frontend/**'
      - '.github/workflows/electron-packaged-smoke.yml'

jobs:
  windows-packaged-smoke:
    runs-on: [self-hosted, windows]
    # A self-hosted runner executes workflow code on a personal machine, so pull requests
    # from forks of this public repository are not run here; same-repository branches and
    # pushes are.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Raised from 25: that fitted a hosted runner, where this job took about six minutes.
    # One VM running jobs serially is a good deal slower, and a timeout kill reads exactly
    # like a real failure.
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron-frontend/package-lock.json

      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: electron-frontend
        run: npm ci

      - name: Run frontend contract tests
        working-directory: electron-frontend
        run: npm run test:ui

      - name: Run backend bridge contract tests
        run: python -m pytest tests/test_desktop_bridge.py -q

      - name: Frontend lint and build
        working-directory: electron-frontend
        run: |
          npm run lint
          npm run build

      - name: Package Electron app
        working-directory: electron-frontend
        run: npm run package

      - name: Run packaged smoke test
        working-directory: electron-frontend
        run: npm run smoke:packaged

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-packaged-smoke-artifacts
          path: |
            electron-frontend/.smoke/**
            electron-frontend/out/**
          if-no-files-found: warn
