        /* the disc, and its one percent of limb */
        float disc = 1.0 - smoothstep( uCoreR - uLimb, uCoreR + uLimb, r );
        /* the steep corona: a couple of radii, inverse-square-ish */
        float corona = pow( max( 0.0, 1.0 - r / ( uCoreR * 6.5 ) ), 2.6 );
        /* and the wide aureole, which is nearly all colour and almost no light */
        float aureole = pow( max( 0.0, 1.0 - r ), 2.4 );
        vec3 c = uCore * disc * 1.7 + uMid * corona * 0.85 + uOuter * aureole * 0.30;
        gl_FragColor = vec4( c, 1.0 );
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending,
  });
  const disc = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
  disc.scale.set(SUN_SIZE, SUN_SIZE, 1);
  disc.position.copy(SUN_AT);
  disc.frustumCulled = false;
  disc.name = 'sun-disc';
  backScene.add(disc);
  SUN_MESH = disc;
}

/* ================= CLOUDS =================
   The sky has been a painted dome with faint bands in it since the beginning, which is fine
   until the camera pulls back to a wide shot and the top third of the frame is a flat gradient.
   These are the cheapest thing that fixes that and the only one that suits the style: sprites,
   which is to say camera-facing quads, so a cloud is never seen edge-on and never has to be
   volumetric to survive being looked at.
   (Not the ones that were dropped from the .blend — those were 48 props sitting at the wrong
   altitude over the terrain. These live in the sky and are placed against the sun.) */
function cloudTex(seed) {
  const S = 256;
  const c = document.createElement('canvas'); c.width = S; c.height = S;
  const g = c.getContext('2d');
  const rnd = (i) => hash01(seed * 31 + i, seed + 7);
  /* A CUMULUS IS LUMPS ON A FLAT BOTTOM. Stacking soft radial blobs along a slightly rising
     baseline gives the billow without any of them reading as a circle, and keeping every blob's
     centre above 0.62 of the height keeps the underside flat, which is the whole silhouette. */
  for (let i = 0; i < 11; i++) {
    const x = S * (0.10 + 0.80 * rnd(i * 3));
    const lift = 1 - Math.abs(x / S - 0.5) * 1.5;
    const y = S * (0.66 - 0.20 * lift * rnd(i * 3 + 1));
    const r = S * (0.10 + 0.16 * rnd(i * 3 + 2)) * (0.55 + 0.65 * lift);
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(255,255,255,0.92)');
    rg.addColorStop(0.55, 'rgba(255,255,255,0.55)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
/* where the sun is, as a direction, kept current so the pond glints agree with it */
const SUN_DIR_LIVE = new THREE.Vector3();
const CLOUDS = [];
/* CLOUDS ARE GEOMETRY NOW.
   The first version was billboarded sprites carrying a canvas blob, and it looked like exactly
   that: a sticker, flat under any camera move, in a world where every other object is faceted
   and outlined. The style here is low-poly and flat-shaded, so a cloud that belongs in it is a
   SHAPE — which is also how clouds are drawn in the tradition this whole thing is borrowing
   from. Ukiyo-e and Ghibli clouds are silhouettes with a defined edge and a lit top, not soft
   focus.
   So: each cloud is a cluster of icosahedra, instanced into one draw call, flat-shaded, and lit
   by the same directional sun as the landscape — which means the sun side is warm, the underside
   is mauve, and turning the camera actually moves the form. Sixteen clouds of eight to fourteen
   blobs is about 13k triangles and 16 draw calls, against a scene that already draws five
   million. */
const CLOUD_BLOB = new THREE.IcosahedronGeometry(1, 1);
/* THE SHADOW SIDE OF A CLOUD IS NOT DARK. It is lit by the whole rest of the sky, which is why
   a cumulus at dawn has a bright top and a merely COOLER underside rather than a black one. The
   toon ramp will happily take it to near-black without a strong emissive to sit under it, and at
   0x4a4560 it did — the clouds came out as grey-blue boulders hanging in the air. */
const CLOUD_MAT = new THREE.MeshToonMaterial({
  color: 0xfffdfa, gradientMap: RAMP_MTN, flatShading: true,
  emissive: new THREE.Color(0x9d97b2), fog: true,
});
{
  /* MORE OF THEM, and spread over a wider band of the sky. Sixteen left obvious gaps at the
     edges of a 43-degree frame; thirty-four is dense enough that the ring reads as weather
     rather than as a row of objects, and it is still one draw call each. */
  const N = 34;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  const pos = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < N; i++) {
    /* A RING, NOT A DOME CAP. Anything overhead is out of frame at these fovs and would only
       cost fill; the band that matters runs from a little above the ridgeline to a little above
       the sun. */
    const az = (i / N) * Math.PI * 2 + hash01(i, 91) * 0.30;
    const dist = 19000 + hash01(i, 3) * 21000;
    const y = 5400 + hash01(i, 17) * 5400;
    const blobs = 8 + Math.floor(hash01(i, 29) * 7);
    const im = new THREE.InstancedMesh(CLOUD_BLOB, CLOUD_MAT, blobs);
    /* the cluster: wide, shallow, and with the big blobs low and the small ones piled on top,
       which is the whole read of a cumulus — a flat base with billows growing out of it */
    const W = 1500 + hash01(i, 41) * 2100;
    for (let k = 0; k < blobs; k++) {
      const t = k / blobs;
      const r = 1 - Math.abs(hash01(i * 17 + k, 5) * 2 - 1);
      pos.set((hash01(i * 13 + k, 7) - 0.5) * 2 * W,
        r * W * 0.30 * (0.4 + t),
        (hash01(i * 19 + k, 11) - 0.5) * 2 * W * 0.45);
      const rad = W * (0.30 + hash01(i * 23 + k, 13) * 0.34) * (1 - t * 0.35);
      sc.set(rad * 1.25, rad * (0.62 + hash01(i * 29 + k, 17) * 0.3), rad);
      q.setFromAxisAngle(up, hash01(i * 31 + k, 19) * 6.28);
      m.compose(pos, q, sc);
      im.setMatrixAt(k, m);
    }
    im.instanceMatrix.needsUpdate = true;
    im.position.set(EYE.x + Math.cos(az) * dist, y, EYE.y + Math.sin(az) * dist);
    im.castShadow = false;
    im.receiveShadow = false;
    im.frustumCulled = false;
    im.name = 'sky-cloud';
    im.userData.az = az;
    im.userData.dist = dist;
    im.userData.drift = 0.0009 + hash01(i, 67) * 0.0016;
    backScene.add(im);
    CLOUDS.push(im);
    /* they are worth reflecting — a lake with sky in it and no clouds in the sky is the giveaway
       that the sky is a painting */
  }
}
/* Re-tint against wherever the sun has been put. Called by placeSun so the two can never
   disagree about which side of the sky is warm. */
/* Nothing to re-tint any more: the clouds are geometry and the directional sun lights them the
   same way it lights the mountains, so moving the sun moves their shading for free. This is now
   only here to keep the pond glints pointed at the right place. */
function relightClouds() {
  const sun = backScene.getObjectByName('sun-disc');
  if (!sun) return 0;
  SUN_DIR_LIVE.copy(sun.position).normalize();
  return CLOUDS.length;
}

/* ---- valley mist ----
   There is no geometry here on purpose. The mist is an exponential height-density field
   integrated along the view ray inside every lit material's shader (see `cloudy`), so it pools
   in low ground, thins as you look up out of the valley, and has no surface to see the
   underside of. All that is left to do is tell it where the valley floor is. */
CLOUD.uMistY.value = LAKE_Y + 10;

/* ================= WATER =================
   THE OLD RIVER FLOATED 285 UNITS ABOVE THE GROUND, and the reason is worth writing down:
   `TubeGeometry(...); geo.scale(1, 0.05, 1)` scales about the geometry's ORIGIN, not about the
   curve. The control points sat near y = −300, so flattening the tube multiplied that by 0.05
   and lifted the whole river to y ≈ −15. It looked like a ribbon because it *was* the right
   shape — it was simply in the wrong place, and the earlier version had been hiding it with a
   compensating `river.position.y` that did not survive the rebuild.

   Nothing is scaled here. The river is a strip built from ground samples, and the lake is a
   flat plane at the level the basin was cut to. */

/* the lake surface, with a real planar reflection. The scene is rendered a second time from the
   camera mirrored about the water plane, clipped to everything above it, and the result is
   sampled in screen space — which is what puts Fuji in the water rather than a painted hint of
   it. 768 rather than 512: at 512 a reflected tree trunk is under two pixels wide and the ripple
   smeared them into scribbles on the water — the distortion has to stay smaller than the
   features it is distorting. */
/* 832 x 468, WHICH IS THE VIEW'S OWN SHAPE.
   768 square was rendering a 16:9 view into a 1:1 target and letting the texture matrix sort it
   out, which works but spends a third of its texels on nothing. Matching the aspect is 34% fewer
   texels than 768 square at the same effective resolution, and — since the frustum is the full
   view again — every one of them lands where the water can sample it. */
const reflectRT = new THREE.WebGLRenderTarget(832, 468, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false,
});
/* HOW DEEP IS THE WATER HERE? — baked, not rendered.
   Every stylised-water writeup reaches for the same two things, and they are the two this lake
   did not have: colour driven by DEPTH rather than by the wave, and FOAM where the water meets
   something. Both normally need the scene depth buffer, which means rendering five million
   triangles a second time from the main camera purely to know how far away the lake bed is.
   This world already knows. The environment loader bakes a 384x384 heightfield off the terrain
   so `landAt` can place things; water depth is just the surface height minus that. So it is
   sampled once, into a 256x256 texture covering the lake, and the shader reads a depth per pixel
   for the cost of one texture fetch and no extra geometry pass at all.
   Baked at load rather than per frame because neither the terrain nor the water level moves.
   https://tympanus.net/codrops/2025/03/04/creating-stylized-water-effects-with-react-three-fiber/ */
const SHORE = {
  tex: null,
  origin: new THREE.Vector2(0, 0),
  size: new THREE.Vector2(1, 1),
  maxDepth: { value: 320 },
};
function bakeShoreDepth(centre, half, surfaceY) {
  const N = 256;
  const d = new Uint8Array(N * N * 4);
  const x0 = centre.x - half, z0 = centre.z - half, span = half * 2;
  let deepest = 1;
  const raw = new Float32Array(N * N);
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const x = x0 + (i / (N - 1)) * span;
      const z = z0 + (j / (N - 1)) * span;
      const dep = Math.max(0, surfaceY - landAt(x, z));
      raw[j * N + i] = dep;
      if (dep > deepest) deepest = dep;
    }
  }
  for (let k = 0; k < N * N; k++) {
    const v = Math.min(255, Math.round((raw[k] / deepest) * 255));
    d[k * 4] = d[k * 4 + 1] = d[k * 4 + 2] = v;
    d[k * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(d, N, N, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.needsUpdate = true;
  SHORE.tex = t;
  SHORE.origin.set(x0, z0);
  SHORE.size.set(span, span);
  SHORE.maxDepth.value = deepest;
  return { deepest: Math.round(deepest), span: Math.round(span) };
}

/* A SCROLLING NORMAL MAP, which is the part of the stylised-water recipe that needs no scene
   data at all — unlike the depth pass, which this terrain could not feed.
   Two copies of one tileable normal texture, sampled at different scales and scrolled in
   different directions, summed. That is the standard trick and it works because the beat
   between two incommensurate scroll rates never repeats visibly, so the surface stops looking
   like a moving pattern and starts looking like water. The summed normal drives both the
   reflection's UV offset and the sun glint, so the highlight breaks up on the same ripples the
   reflection bends around, which is the thing that sells it. */
const WATER_NRM = (() => {
  const N = 256;
  const h = new Float32Array(N * N);
  /* tileable value noise: sample a 3D noise on a torus so both axes wrap */
  const oct = [[4, 1], [8, 0.5], [16, 0.25], [32, 0.12]];
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      let v = 0;
      for (const [f, a] of oct) {
        const u = (x / N) * Math.PI * 2, w = (y / N) * Math.PI * 2;
        v += a * jsNoise(Math.cos(u) * f + 8, Math.sin(u) * f + 8, Math.cos(w) * f + 8)
           * jsNoise(Math.sin(w) * f + 3, Math.cos(u) * f + 3, Math.sin(u) * f + 3);
      }
      h[y * N + x] = v;
    }
  }
  const d = new Uint8Array(N * N * 4);
  const at = (x, y) => h[((y + N) % N) * N + ((x + N) % N)];
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const dx = at(x + 1, y) - at(x - 1, y);
      const dy = at(x, y + 1) - at(x, y - 1);
      const i = (y * N + x) * 4;
      d[i] = Math.max(0, Math.min(255, 128 + dx * 900));
      d[i + 1] = Math.max(0, Math.min(255, 128 + dy * 900));
      d[i + 2] = 255;
      d[i + 3] = 255;
    }
  }
  const t = new THREE.DataTexture(d, N, N, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  return t;
})();

const reflectCam = new THREE.PerspectiveCamera();
const reflectTexM = new THREE.Matrix4();
const lakeWater = (() => {
  const geo = new THREE.PlaneGeometry(LAKE.r * 2.6, LAKE.r * 2.6, 1, 1);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      tReflect: { value: reflectRT.texture },
      texMatrix: { value: reflectTexM },
      uTime: { value: 0 },
      uDeep: { value: new THREE.Color(0x2c3b4e) },
      uShallow: { value: new THREE.Color(0x5c7385) },
      /* HOW MUCH OF THE MOUNTAIN THE WATER IS ALLOWED TO KEEP.
         Real water at this depression angle reflects a few percent, and the honest Fresnel curve
         delivered Fuji as a grey smudge on navy. This is a picture of a lake, not a lake: the
         exponent is flattened so the falloff still runs the right way with angle, and the floor
         is lifted so the water never stops being a mirror. Dials rather than literals because
         the home view and these two numbers are one decision — move the eye up and the
         reflection has to be pushed back or the mountain leaves the water. */
      uReflPow: { value: 1.6 },
      uReflMin: { value: 0.30 },
      uReflGain: { value: 1.15 },
      uShore: { value: null },
      uShoreOrigin: { value: SHORE.origin },
      uShoreSize: { value: SHORE.size },
      uShoreMax: SHORE.maxDepth,
      uFoam: { value: 0.0 },
      uNrm: { value: WATER_NRM },
      uNrmScale: { value: 1 / 900 },
      uNrmAmt: { value: 1.0 },
      fogColor: FOG_U.fogColor,
      fogDensity: FOG_U.fogDensity,
      uMistColor: CLOUD.uMistColor,
      uMistY: CLOUD.uMistY,
      uMistH: CLOUD.uMistH,
      uMistAmt: CLOUD.uMistAmt,
    },
    vertexShader: `
      uniform mat4 texMatrix;
      varying vec4 vProj;
      varying vec3 vWorld;
      varying float vDepth;
      void main() {
        vec4 wp = modelMatrix * vec4( position, 1.0 );
        vWorld = wp.xyz;
        vProj = texMatrix * wp;
        vec4 mv = viewMatrix * wp;
        vDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D tReflect;
      uniform float uTime;
      uniform vec3 uDeep, uShallow, fogColor, uMistColor;
      uniform float fogDensity, uMistY, uMistH, uMistAmt;
      uniform float uReflPow, uReflMin, uReflGain, uShoreMax, uFoam, uNrmScale, uNrmAmt;
      uniform sampler2D uShore, uNrm;
      uniform vec2 uShoreOrigin, uShoreSize;
      varying vec4 vProj;
      varying vec3 vWorld;
      varying float vDepth;
      void main() {
        /* a slow chop, large enough to read at this scale and small enough not to smear the
           mountain into nothing. Two crossed waves, not noise — a still dawn lake is glassy. */
        /* TWO LAYERS, CROSSING. One wave set gives a single rolling direction and reads as a
           flag; two at different scales moving different ways is the least that reads as water,
           and it costs three more sines. */
        /* A STILL LAKE, DRAWN RATHER THAN SIMULATED.
           What was here was three wave fields and two scrolls of a normal map all offsetting the
           reflection lookup per pixel. Every one of those was defensible on its own and together
           they were wrong for this water twice over. Artistically, a dawn lake in this scene is
           GLASS, and a surface that busy cannot be still. Technically, the reflection is a
           640-pixel image of a forest, and jittering the lookup of a high-frequency image by a
           different amount at every pixel is a recipe for salt-and-pepper — the speckle across
           the lake was not ripple detail, it was the far treeline being point-sampled at random
           offsets.
           So: one slow, long wave, offsetting the lookup by a quarter of what it used to. The
           reflection stays legible, which is the whole reason to have one.
           "Wind Waker completely foregoes reflection calculations and renders a flat-shaded
           water surface" — the cartoon end of this is flatter still, and flat is the direction. */
        float w = sin( vWorld.x * 0.0016 + uTime * 0.22 ) * cos( vWorld.z * 0.0013 - uTime * 0.17 );
        float chop = w;
        vec2 uv = vProj.xy / vProj.w + vec2( w * 0.0006, w * 0.00022 );
        vec3 refl = texture2D( tReflect, uv ).rgb;
        /* grazing angles reflect almost everything, steep ones show the water's own colour —
           and the camera IS at a grazing angle here, which is why the reflection carries */
        vec3 v = normalize( cameraPosition - vWorld );
        float f = pow( 1.0 - clamp( v.y, 0.0, 1.0 ), uReflPow );
        /* NO DEPTH TERM. The baked shore-depth experiment is removed, and it deserves a note
           because the idea was sound and the DATA was not. Depth-driven colour and shoreline
           foam are what every stylised-water reference reaches for, and getting depth from the
           existing heightfield instead of a second scene render was the right way to afford it.
           But the imported terrain has no basin cut under the lake: the bed varies 74 units end
           to end across a 7,020-unit span. A 256-texel map of an almost-flat field is mostly
           quantisation, which is where the hexagonal patterning came from, and the one genuinely
           deep patch in the middle took no foam and no tint at all — the hole. Any tuning of the
           thresholds just moves those artefacts around; the input cannot support the effect.
           It comes back for free if a basin is ever modelled — bakeShoreDepth and the uniforms
           are left in place and simply unused. */
        vec3 body = mix( uDeep, uShallow, clamp( chop * 0.12 + 0.5, 0.0, 1.0 ) );
        /* POSTERISED, BECAUSE EVERYTHING ELSE IN THIS WORLD IS.
           The mix between the water's own colour and the reflection was a smooth gradient across
           the whole lake — the one continuously shaded surface in a cel-shaded scene, which is
           why it never sat with the rest of the picture no matter how the ripple was tuned.
           Four flat steps put it on the same footing as the toon ramp: the lake reads as a few
           regions of flat colour, and the reflection appears in bands the way it does in a
           painted one. */
        float k = clamp( f * uReflGain, uReflMin, 0.95 );
        k = floor( k * 4.0 + 0.5 ) / 4.0;
        vec3 col = mix( body, refl, k );
        /* AND A FEW DRAWN HIGHLIGHTS. Two long, slow crests picked out as flat pale streaks —
           the cartoon shorthand for a calm surface, and the only thing here that moves fast
           enough to notice. Thresholded, not faded, so they are shapes rather than a sheen. */
        float g1 = sin( vWorld.z * 0.0021 - uTime * 0.16 ) * cos( vWorld.x * 0.0009 + uTime * 0.11 );
        float g2 = sin( ( vWorld.x * 0.6 + vWorld.z ) * 0.0037 + uTime * 0.23 );
        float glint = smoothstep( 0.86, 0.93, g1 ) * 0.7 + smoothstep( 0.90, 0.97, g2 ) * 0.45;
        col = mix( col, uShallow * 1.45 + vec3( 0.06 ), clamp( glint, 0.0, 1.0 ) * 0.5 );
        /* the same valley mist every other surface takes, so the far shore of the lake sits in
           it too instead of staying sharp while the land around it softens */
        vec3 mv2 = vWorld - cameraPosition;
        float mk = 1.0 / uMistH;
        float mbase = uMistAmt * exp( - max( cameraPosition.y - uMistY, 0.0 ) * mk );
        float mdy = mv2.y * mk;
        float mint = abs( mdy ) < 1e-4 ? length( mv2 ) : length( mv2 ) * ( 1.0 - exp( - mdy ) ) / mdy;
        col = mix( col, uMistColor, clamp( 1.0 - exp( - max( mbase * mint, 0.0 ) ), 0.0, 1.0 ) );
        float fg = 1.0 - exp( - fogDensity * fogDensity * vDepth * vDepth );
        gl_FragColor = vec4( mix( col, fogColor, clamp( fg, 0.0, 1.0 ) ), 1.0 );
      }`,
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(EYE.x + LAKE_C.x, LAKE_Y, EYE.y + LAKE_C.z);
  m.renderOrder = 1;
  m.name = 'lake';
  backScene.add(m);
  return m;
})();

/* the river: a strip of quads built from ground samples, sitting in the channel the heightfield
   already cut for it. Width widens toward the mouth so it spills into the lake. */
{
  const N = 90, verts = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const d = RIVER_TO - (i / N) * (RIVER_TO - RIVER_FROM + 900);
    const s = riverSideAt(d);
    const half = 150 + 170 * (i / N);
    for (const o of [-half, half]) {
      const p = at(d, s + o, 0);
      /* 8 units proud of the bed, so it reads as a surface and never z-fights the channel */
      p.y = groundAt(p.x, p.z) + 8;
      verts.push(p.x, p.y, p.z);
    }
    if (i > 0) {
      const b = (i - 1) * 2;
      idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const river = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
    color: 0x8fa8bd, emissive: 0x22303f, side: THREE.DoubleSide,
  }));
  river.name = 'river';
  backScene.add(river);
  /* registered before the woods purely so it can claim its bed first — a tree standing in the
     middle of the water is the same class of mistake as one standing inside a mountain. The
     lake needs no such registration: its bed is below the waterline, which `blocked()` tests. */
  for (let i = 0; i <= 40; i++) {
    const d = RIVER_FROM - 900 + (i / 40) * (RIVER_TO - RIVER_FROM + 900);
    const p = at(d, riverSideAt(d), 0);
    blockAdd(p.x, p.z, 430, 3000);
  }
}

/* ================= WHERE THE SIX PLACES ARE =================
   THE CAMERA NO LONGER ORBITS A PIVOT. It stands on the lake shore and stays there; choosing a
   section turns it to face a place and then flies it toward that place. That is the model this
   was always meant to have — the old one put the camera on a 680-unit circle and slid it round
   to a 2,600-unit one, which meant every "destination" was a bearing rather than somewhere, and
   the arrival framing was whatever the arc happened to leave you looking at.

   The consequence worth stating: a destination is now a POINT IN THE LANDSCAPE, authored in the
   same sight-line frame as the lake, the river and everything else. `bearing` is measured off
   the home sight line, positive to the right; `dist` is how far out along it. Where the ground
   is at that point is looked up, not assumed. */
const HOME_EYE = new THREE.Vector3(170, 60, 830);
/* and what it looks AT. These two are one decision and are written together by setHomeView;
   HOME_LOOK used to be declared beside homeIsOffScreen() at the very bottom of the file, which
   was fine while nothing composed a home until after a fetch, and a temporal-dead-zone throw the
   moment the boot sequence did it synchronously. */
const HOME_LOOK = new THREE.Vector3(-240, 30, -160);
/* how high the camera rides above whatever it is standing on — taken from home so the eye
   keeps a consistent height wherever it goes rather than flying at a fixed altitude */
const EYE_LIFT = HOME_EYE.y - Math.max(groundAt(HOME_EYE.x, HOME_EYE.z), LAKE_Y);
/* how far short of a place the camera stops. It is per-place because the threshold's scale is
   per-place: the gate's tablets are hand-sized objects on a 620-unit structure and want to be
   approached, while a distant hillside wants to be seen whole. */
const STAND_OFF = 1500;

/* OVER WATER, THE SURFACE IS THE GROUND. `groundAt` returns the lake BED, which is 330 units
   down — so a place in the water was authored below the waterline and the camera sent to stand
   on the bottom of the lake, arriving nine units above the surface and skimming it. Everything
   here reads whichever is higher. */
function surfaceAt(x, z) { return Math.max(groundAt(x, z), LAKE_Y); }

/* Where to look from `eye` so the sun lands at screen (u, v). The offset a screen position
   subtends is an angle, so the aim is the eye-to-sun direction rotated by it — yaw about the
   world up, then pitch about the resulting right vector, NEGATED because rotating an aim
   upward pushes its subject down the frame. */
function aimAt(target, eye, fov, u, v) {
  const E = new THREE.Vector3(eye[0], eye[1], eye[2]);
  if (!target) return [E.x, E.y, E.z - 9000];
  const d = target.clone().sub(E).normalize();
  const tanV = Math.tan(THREE.MathUtils.degToRad(fov) / 2);
  const yaw = Math.atan((u - 0.5) * 2 * tanV * camera.aspect);
  const pitch = Math.atan((0.5 - v) * 2 * tanV);
  d.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const right = new THREE.Vector3().crossVectors(d, new THREE.Vector3(0, 1, 0)).normalize();
  d.applyAxisAngle(right, -pitch);
  return E.add(d.multiplyScalar(12000)).toArray();
}
function aimAtSun(eye, fov, u, v) {
  const sun = backScene.getObjectByName('sun-disc');
  return aimAt(sun && sun.position, eye, fov, u, v);
}

/* THE HIGHEST POINT OF THE MOUNTAIN, found in the model rather than written down, so it survives
   a re-export that moves it — except that the home composition is now settled BEFORE the model
   downloads, to stop the old world flashing up first. So there is a measured hint to compose
   against up front, and a check once the real thing arrives: if the model's summit has moved far
   enough to matter the console says so and the framing is redone, rather than the page quietly
   aiming at where a mountain used to be. */
const FUJI_PEAK_HINT = new THREE.Vector3(-1342, 7220, -23319);
function fujiPeak() {
  /* ONLY EVER THE LOADED MODEL'S. Falling back to backScene finds the GENERATED Fuji — which is
     still in the scene, merely hidden, and stands somewhere else entirely — so a pre-load call
     would compose the whole menu against the wrong mountain. No model, no measurement: use the
     hint and let checkFujiHint() correct it when the real one lands. */
  if (!ENV.root) return FUJI_PEAK_HINT;
  let peak = null;
  ENV.root.traverse((o) => {
    if (!o.isMesh || !/fuji/i.test(o.name) || /outline/.test(o.name)) return;
    const pos = o.geometry.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      if (!peak || v.y > peak.y) peak = v.clone();
    }
  });
  return peak || FUJI_PEAK_HINT;
}

/* THE OTHER COMPOSITION: sun in the middle of the frame, Fuji off to the right, the lake and its
   reflection under the mountain rather than under the sun. Both aims are solved — the camera is
   aimed so the measured summit lands at (0.76, 0.24), and the sun is then unprojected to the
   middle of the frame that produces. The sun crosses to the far side of the mountain doing this,
   so the key light goes with it (placeSun moves both) and the whole valley is lit from the new
   direction rather than from a sun that is no longer there. */
function composeSunCentred() {
  const eye = [HOME.px, HOME.py, HOME.pz];
  setHomeView(eye, aimAt(fujiPeak(), eye, HOME.fov, 0.76, 0.24), HOME.fov);
  return placeSun(0.5, 0.30);
}

/* Did the hint the page composed against turn out to be where the mountain is? 400 units is
   about a third of a degree from the home eye — below that nobody could see the difference and
   redoing the framing would only cost a visible lurch on arrival. */
function checkFujiHint() {
  const real = fujiPeak();
  const off = real.distanceTo(FUJI_PEAK_HINT);
  if (off > 400) {
    console.warn(`[fuji] summit moved ${Math.round(off)} units from the composed hint `
      + `[${FUJI_PEAK_HINT.toArray().map(Math.round)}] -> [${real.toArray().map(Math.round)}]; `
      + 'update FUJI_PEAK_HINT. Reframing.');
    ENV.homeMoved = false;
    composeWorldHome();
  }
  return Math.round(off);
}

/* IS THE SUN ACTUALLY IN THE SKY FROM HERE? The old placement was wrong for weeks and the only
   symptom was a glow on a mountainside that read as atmosphere. One raycast answers it. */
function sunClear(eye) {
  const sun = backScene.getObjectByName('sun-disc');
  if (!sun) return null;
  const E = new THREE.Vector3(eye[0], eye[1], eye[2]);
  const d = sun.position.clone().sub(E);
  const targets = [];
  backScene.traverse((o) => {
    if ((o.isMesh || o.isInstancedMesh) && o.visible && o.name !== 'sky-dome'
      && !(o.material && o.material.userData && o.material.userData.outline)) targets.push(o);
  });
  const hit = new THREE.Raycaster(E, d.clone().normalize(), 1, d.length())
    .intersectObjects(targets, false)[0];
  if (hit) {
    console.warn(`[sun] blocked from [${eye.map(Math.round)}] by ${hit.object.name || hit.object.type}`
      + ` at ${Math.round(hit.distance)} of ${Math.round(d.length())}`);
  }
  return hit ? { by: hit.object.name, at: Math.round(hit.distance) } : null;
}

/* Put the sun at a chosen place IN THE FRAME rather than at a chosen place in the world, which
   is how anyone actually thinks about a sunset. Unprojects (u, v) through the home camera and
   walks out `dist` — far enough to be behind Fuji rather than in it. */
function placeSun(u, v, dist = 50000) {
  const c = camera.clone();
  c.position.set(HOME.px, HOME.py, HOME.pz);
  c.lookAt(HOME.tx, HOME.ty, HOME.tz);
  c.fov = HOME.fov;
  c.updateProjectionMatrix();
  c.updateMatrixWorld(true);
  const E = c.position.clone();
  const ray = new THREE.Vector3(u * 2 - 1, 1 - v * 2, 0.5).unproject(c).sub(E).normalize();
  const at = E.clone().addScaledVector(ray, dist);
  /* one object now, and its size still tracks distance so the sun subtends the same angle
     wherever it is put */
  const k = dist / 50000;
  const o = backScene.getObjectByName('sun-disc');
  if (o) { o.position.copy(at); o.scale.set(SUN_SIZE * k, SUN_SIZE * k, 1); }
  /* the key light takes the new direction, keeping its own 14,000-unit stand-off so the shadow
     camera stays valid — see the rig above */
  let key = null;
  backScene.traverse((o) => { if (o.isDirectionalLight && o.castShadow) key = o; });
  if (key) {
    const t = key.target.position;
    key.position.copy(t).addScaledVector(at.clone().sub(t).normalize(), 14000);
    key.updateMatrixWorld(true);
  }
  relightClouds();
  return { at: at.toArray().map(Math.round), blocked: sunClear([HOME.px, HOME.py, HOME.pz]) };
}

function setHomeView(eye, look, fov) {
    /* THE MENU TYPE COMES WITH THE CAMERA. It lives in cssScene at coordinates composed for the
       original eye, so moving the camera left it twenty-six thousand units behind. Rather than
       re-authoring six positions, the whole CSS scene takes the transform that carries the old
       camera onto the new one — every plane keeps exactly the screen position it was composed
       to have, from any eye. */
    if (!window.__camRef) {
      /* THE POSE THE PLANES WERE COMPOSED AGAINST, built from numbers rather than sampled from
         a camera. Reading camera.matrixWorld here captured whatever the intro happened to be
         doing — a fov-63 pose a third of the way through its opening move — and every plane was
         then mapped from an origin that never existed. */
      const ref = camera.clone();
      ref.position.set(170, 60, 830);
      ref.lookAt(-240, 30, -160);
      ref.fov = 42;
      ref.updateProjectionMatrix();
      ref.updateMatrixWorld(true);
      window.__camRef = new THREE.Matrix4().copy(ref.matrixWorld).invert();
    }
    /* HOME IS THE LIVE CAMERA STATE; HOME_EYE and HOME_LOOK are the SITING logic — stand-off
       distances, which way the gate faces, whether the menu's composition is still in shot.
       Writing only the latter moved nothing, which is how five hero-shot candidates came back
       as the same frame twice over. Both have to move, and `cam` has to be pushed too or the
       change waits for the next time something tweens home. */
    /* STOP WHATEVER IS ALREADY FLYING THE CAMERA. The intro tween spread HOME's values in at
       the moment it was created, so it holds the ORIGINAL numbers and will happily spend the
       next few seconds undoing this. */
    gsap.killTweensOf(cam);
    HOME_EYE.set(eye[0], eye[1], eye[2]);
    HOME_LOOK.set(look[0], look[1], look[2]);
    Object.assign(HOME, { px: eye[0], py: eye[1], pz: eye[2],
      tx: look[0], ty: look[1], tz: look[2] });
    if (fov) HOME.fov = fov;
    Object.assign(cam, HOME);
    /* rebuild the camera's world matrix for the NEW pose, then rig the css scene onto it */
    const probe = camera.clone();
    probe.position.set(eye[0], eye[1], eye[2]);
    probe.lookAt(look[0], look[1], look[2]);
    probe.updateMatrixWorld(true);
    cssScene.matrixAutoUpdate = false;
    cssScene.matrix.multiplyMatrices(probe.matrixWorld, window.__camRef);
    cssScene.matrixWorldNeedsUpdate = true;
    return { HOME: { ...HOME } };
  }

/* A HARD RAMP FOR CEL. The world's usual ramp is a stylised gradient; three steps with the
   break pushed late is a lit side, a turn and a shadow side, which is what a painted cel has. */
const RAMP_CEL = (() => {
  const d = new Uint8Array(3 * 4);
  [64, 176, 255].forEach((v, i) => { d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255; });
  const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();

/* ============================ SMALL WATER ============================
   Ponds and baths, as opposed to the lake. See the note in the patch that introduced this. */
const SMALL_WATER = [];
function pondMaterial(opts = {}) {
  const m = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uDeep: { value: new THREE.Color(opts.deep != null ? opts.deep : 0x1d3038) },
      uShallow: { value: new THREE.Color(opts.shallow != null ? opts.shallow : 0x40707a) },
      uSkyLo: { value: new THREE.Color(opts.skyLo != null ? opts.skyLo : 0xf6c79a) },
      uSkyHi: { value: new THREE.Color(opts.skyHi != null ? opts.skyHi : 0x6d6f95) },
      uGlint: { value: opts.glint != null ? opts.glint : 1.0 },
      uChop: { value: opts.chop != null ? opts.chop : 1.0 },
      uSun: { value: new THREE.Vector3() },
      fogColor: FOG_U.fogColor,
      fogDensity: FOG_U.fogDensity,
      uMistColor: CLOUD.uMistColor,
      uMistY: CLOUD.uMistY,
      uMistH: CLOUD.uMistH,
      uMistAmt: CLOUD.uMistAmt,
    },
    /* DOUBLE-SIDED, AND THAT IS THE ACTUAL BUG.
       Raycasting the pond from the menu camera hit `Garden_Surfaces_GardenWater_001-outline` and
       then the big lake and then the terrain — never the pond itself. Its faces are wound with
       their normals pointing DOWN, so a FrontSide material is back-face culled from above and
       the water simply was not drawn: what you were looking at was the pond BED, seen through
       where the surface should have been, under the black inverted-hull outline that was still
       being drawn over the top of it. No shader could have fixed that. */
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec3 vWorld;
      varying float vDepth;
      void main() {
        vec4 wp = modelMatrix * vec4( position, 1.0 );
        vWorld = wp.xyz;
        vec4 mv = viewMatrix * wp;
        vDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform float uTime, uGlint, uChop, fogDensity, uMistY, uMistH, uMistAmt;
      uniform vec3 uDeep, uShallow, uSkyLo, uSkyHi, uSun, fogColor, uMistColor;
      varying vec3 vWorld;
      varying float vDepth;
      void main() {
        /* A POND IS SMALL, so the ripple has to be small too — the lake's wavelength is measured
           in thousands of units and laid over a garden it is a single flat sheet with one
           highlight on it. Three crossed waves at garden scale, no noise: still water in a
           designed garden is deliberate, not choppy. */
        float w = sin( vWorld.x * 0.026 + uTime * 1.10 ) * cos( vWorld.z * 0.021 - uTime * 0.83 )
                + sin( ( vWorld.x + vWorld.z ) * 0.041 - uTime * 1.5 ) * 0.5;
        w *= uChop;
        /* the surface normal the ripple implies, by differencing the same wave field */
        /* ENOUGH TILT TO BREAK THE HIGHLIGHT, NOT ENOUGH TO CHOP THE POND UP. At 0.26 the
           Fresnel swung the full width of its range every half wavelength and the water came out
           as a blue and white checkerboard. A garden pond is still water. */
        vec3 n = normalize( vec3( w * 0.085, 1.0, w * 0.07 ) );
        vec3 v = normalize( cameraPosition - vWorld );
        float f = pow( 1.0 - clamp( dot( v, n ), 0.0, 1.0 ), 2.0 );

        /* THE SKY, ANALYTICALLY. There is one planar-reflection pass in this file and the lake
           owns it. What a pond actually shows is nearly all sky anyway, and the sky here is a
           vertical gradient — so the reflected ray's elevation is enough to look it up, for the
           cost of a mix. */
        vec3 r = reflect( -v, n );
        vec3 sky = mix( uSkyLo, uSkyHi, clamp( r.y * 1.6, 0.0, 1.0 ) );

        vec3 body = mix( uDeep, uShallow, clamp( w * 0.30 + 0.5, 0.0, 1.0 ) );
        /* FLOORED HIGH ON PURPOSE. A garden pond is looked down into from a few metres, where
           real Fresnel returns a few percent and the water reads as a hole cut in the lawn. The
           floor is what makes it water rather than physics does. */
        /* FLOORED, AND ALSO CAPPED. A garden pond is looked down into from a few metres, where
           real Fresnel returns a few percent and the water reads as a hole cut in the lawn — so
           there is a floor. The ceiling is the other half: without it the ripple crests go to
           pure sky and the surface turns to tinfoil. */
        vec3 col = mix( body, sky, clamp( f * 1.2, 0.30, 0.64 ) );

        /* the sun on the water, which is the thing that says "this is wet" more than any of it */
        float spec = pow( max( dot( r, normalize( uSun ) ), 0.0 ), 150.0 );
        col += vec3( 1.0, 0.92, 0.78 ) * spec * uGlint * 1.1;

        /* the same air as everything else */
        vec3 mv = vWorld - cameraPosition;
        float mk = 1.0 / uMistH;
        float mbase = uMistAmt * exp( - max( cameraPosition.y - uMistY, 0.0 ) * mk );
        float mdy = mv.y * mk;
        float mint = abs( mdy ) < 1e-4 ? length( mv ) : length( mv ) * ( 1.0 - exp( - mdy ) ) / mdy;
        col = mix( col, uMistColor, clamp( 1.0 - exp( - max( mbase * mint, 0.0 ) ), 0.0, 1.0 ) );
        float fg = 1.0 - exp( - fogDensity * fogDensity * vDepth * vDepth );
        gl_FragColor = vec4( mix( col, fogColor, clamp( fg, 0.0, 1.0 ) ), 1.0 );
        /* THE TWO CHUNKS A HAND-WRITTEN SHADER HAS TO ASK FOR.
           THREE.Color converts a hex literal from sRGB to LINEAR the moment it is assigned, and
           three only appends tone mapping and the sRGB encode where the shader source includes
           these — built-in materials have them, a ShaderMaterial has whatever you typed. Without
           them the pond wrote linear values straight into an sRGB framebuffer and came out
           looking like a hole cut in the lawn, and no amount of picking lighter colours fixes
           that, because the error is a curve and not an offset. */
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
  SMALL_WATER.push(m);
  return m;
}

/* ============================ CRAGGING THE FAR RANGES ============================
   A hundred and twenty triangles stretched over fifteen thousand units is a silhouette, and a
   silhouette is exactly what a 4,000-unit-tall mountain twenty-five thousand units away is made
   of. So the fidelity has to go into the skyline itself: subdivide, then push every vertex along
   the surface by noise. */

/* MIDPOINT SUBDIVISION. Each triangle becomes four; three passes is sixty-four times the
   triangles, which turns 128 into 8,192 — nothing, at eight ranges. Works on non-indexed
   geometry only, which is also what gives flat shading for free afterwards. */
function splitTris(geo) {
  const src = geo.index ? geo.toNonIndexed() : geo;
  const attrs = ['position', 'normal', 'color'].filter((k) => src.attributes[k]);
  const out = new THREE.BufferGeometry();
  for (const k of attrs) {
    const a = src.attributes[k], n = a.itemSize;
    const dst = new Float32Array(a.count * 4 * n);
    let w = 0;
    const mid = (i, j, o) => { for (let c = 0; c < n; c++) o[c] = (a.array[i * n + c] + a.array[j * n + c]) / 2; };
    const put = (i) => { for (let c = 0; c < n; c++) dst[w++] = a.array[i * n + c]; };
    const putV = (v) => { for (let c = 0; c < n; c++) dst[w++] = v[c]; };
    const ab = new Float32Array(n), bc = new Float32Array(n), ca = new Float32Array(n);
    for (let t = 0; t < a.count; t += 3) {
      mid(t, t + 1, ab); mid(t + 1, t + 2, bc); mid(t + 2, t, ca);
      put(t); putV(ab); putV(ca);
      putV(ab); put(t + 1); putV(bc);
      putV(ca); putV(bc); put(t + 2);
      putV(ab); putV(bc); putV(ca);
    }
    out.setAttribute(k, new THREE.BufferAttribute(dst, n));
  }
  return out;
}

/* WHAT COLOUR IS THIS THING, ACTUALLY? The average of its vertex colours times its material
   colour, which is what reaches the shader. Sampled rather than read off the .blend, so it stays
   true across a re-export. */
function avgVertexColor(mesh) {
  const c = mesh.geometry.attributes.color;
  const m = (mesh.material && mesh.material.color) || { r: 1, g: 1, b: 1 };
  if (!c) return new THREE.Color(m.r, m.g, m.b);
  let r = 0, g = 0, b = 0, n = 0;
  const step = Math.max(1, Math.floor(c.count / 600));
  for (let i = 0; i < c.count; i += step) { r += c.getX(i); g += c.getY(i); b += c.getZ(i); n++; }
  return new THREE.Color(r / n * m.r, g / n * m.g, b / n * m.b);
}

/* PULL A SURFACE TOWARD THE GROUND IT SITS ON.
   Measured, not eyeballed: the map's terrain averages #8f9677, a green olive. The festival
   ground averages #b1a896 and the garden detail #98948c — both pale grey-tans, which is why
   they read as slabs dropped onto the grass rather than as part of it. They are separate meshes
   with separately authored paint and nothing was ever going to reconcile them by itself.
   This shifts each one's vertex colours toward the terrain's average by `amt`, preserving its
   own internal variation (the shift is applied to the mesh's MEAN, and every vertex moves by the
   same delta) so a gravel path stays gravelly and a plaza keeps its markings — it just stops
   being a different planet from the field around it. */
function matchToGround(mesh, target, amt) {
  const c = mesh.geometry.attributes.color;
  if (!c) return false;
  const have = avgVertexColor(mesh);
  const dr = (target.r - have.r) * amt;
  const dg = (target.g - have.g) * amt;
  const db = (target.b - have.b) * amt;
  for (let i = 0; i < c.count; i++) {
    c.setXYZ(i, THREE.MathUtils.clamp(c.getX(i) + dr, 0, 1),
      THREE.MathUtils.clamp(c.getY(i) + dg, 0, 1),
      THREE.MathUtils.clamp(c.getZ(i) + db, 0, 1));
  }
  c.needsUpdate = true;
  return true;
}

/* A TEXTURE, WHICH IS WHAT THIS SHOULD HAVE BEEN THE WHOLE TIME.
   Two things were wrong with painting per vertex. It needed sixteen times the triangles to make
   the gradient finer than the screen — 9,916 became 158,656 on one mountain, for shading — and
   with no shader available it had the sun baked into it, which pins the lighting to wherever the
   sun happened to be at load and is simply not how a scene should work.
   Both go away at once. A gradient is a function of height; a texture IS a function of position,
   sampled PER PIXEL by hardware that is already doing it for everything else. So:
     - `mountainUV` writes v = normalised world height, u = angle about the mountain's axis.
       Two floats per vertex on the ORIGINAL mesh. No subdivision at all.
     - `mountainTex` paints rock, mottle and a noise-jittered snow line into a 1024x512 canvas.
       The snowline varies along u, so it is ragged all the way round rather than a contour.
     - the material is an ordinary lit MeshLambertMaterial with that as its `map`, so the sun
       lights it like everything else in the world and moving the sun moves the shading.
   The one thing genuinely lost with the toon ramp was its 0.37 floor, which was acting as a
   large ambient fill. That is restored honestly with emissiveMap: emissive intensity times the
   SAME texture is a fill proportional to albedo, which is what the ramp's floor was. */
/* TWO TEXTURES OUT OF ONE PASS: the paint, and the paint masked by how much ROCK there is.
   The second is the emissive map, and it is the whole answer to a seam I have now failed at
   four times.
   Every previous attempt matched Fuji's foot COLOUR to the terrain's — and measured at the
   seam it still came out wrong: Fuji renders #948a67 where the terrain beside it renders
   #87855d. The reason is not the colour. The two meshes have different MATERIALS. Fuji carries
   an emissive fill (emissive 0x484848 times an emissive map) that stands in for the toon ramp's
   floor on a mountain seen mostly from its shadow side; the terrain carries none at all. The
   same albedo through two different responses cannot land on the same pixel, so matching the
   albedo was solving an equation that had no solution.
   Masking the emissive by `body` removes the fill exactly where the mountain is still forest
   floor, so the skirt is lit precisely the way the ground it meets is lit — and above the
   treeline, where there is nothing to match, the fill comes back in full. */
function mountainTex(o) {
  const W = 1024, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const img = g.createImageData(W, H);
  const d = img.data;
  const ce = document.createElement('canvas');
  ce.width = W; ce.height = H;
  const ge = ce.getContext('2d');
  const imge = ge.createImageData(W, H);
  const de = imge.data;
  const foot = new THREE.Color(o.foot), rock = new THREE.Color(o.rock);
  const hi = new THREE.Color(o.rockHi), snow = new THREE.Color(o.snow);
  const tmp = new THREE.Color();
  const lin2srgb = (v) => (v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);
  for (let y = 0; y < H; y++) {
    /* v = 0 at the foot, 1 at the summit; the canvas is drawn top-down so flip it */
    const t = 1 - y / (H - 1);
    for (let x = 0; x < W; x++) {
      const a = (x / W) * Math.PI * 2;
      /* sample the noise on a CIRCLE in x/z so the left and right edges of the texture meet:
         a seam down the side of a mountain is the one artefact this mapping can produce */
      const nx = Math.cos(a) * o.noiseR, nz = Math.sin(a) * o.noiseR;
      /* FROM somewhere, not from zero. A ramp anchored at v = 0 puts its whole transition in
         the bottom of the mesh, and on Fuji the bottom of the mesh is underground: the forest and
         the terrain hide everything below v = 0.298, so foot-to-rock finishing anywhere near
         there finishes before the mountain is visible. With both ends free the transition can be
         placed AT the treeline, which is where a mountain actually changes from forest to rock. */
      const body = THREE.MathUtils.smoothstep(t, o.rockFrom || 0, o.rockAt);
      tmp.copy(foot).lerp(rock, body);
      const m = jsFbm(nx * o.grain, t * 900 * o.grain, nz * o.grain);
      /* SCALED BY `body`, so the rock highlight only breaks up ROCK.
         Unscaled, this lerps a third of the way toward the pale rock colour everywhere — including
         the skirt, where the whole point is that the surface is forest floor. The measured result
         was that no matter how green the foot colour was set, the paint at the treeline came out
         a warm grey: the foot was being averaged with rock highlight before the light ever
         reached it. */
      tmp.lerp(hi, THREE.MathUtils.clamp((m - 0.35) * 2.2, 0, 1) * 0.5 * body);
      /* the snow line, jittered around the mountain and again finely, so it has both big lobes
         and small fingers rather than one wobble */
      const line = o.snowAt
        + (jsFbm(nx * o.snowGrain, 0, nz * o.snowGrain) - 0.5) * o.snowJitter
        + (jsFbm(nx * o.snowGrain * 5, 11, nz * o.snowGrain * 5) - 0.5) * o.snowJitter * 0.35;
      tmp.lerp(snow, THREE.MathUtils.smoothstep(t, line, line + o.snowBand));
      const i = (y * W + x) * 4;
      d[i] = lin2srgb(tmp.r) * 255;
      d[i + 1] = lin2srgb(tmp.g) * 255;
      d[i + 2] = lin2srgb(tmp.b) * 255;
      d[i + 3] = 255;
      /* the fill, faded out through the skirt — see the note above */
      const k = body;
      de[i] = lin2srgb(tmp.r * k) * 255;
      de[i + 1] = lin2srgb(tmp.g * k) * 255;
      de[i + 2] = lin2srgb(tmp.b * k) * 255;
      de[i + 3] = 255;
    }
  }
  const mk = (canvas, ctx, image) => {
    ctx.putImageData(image, 0, 0);
    const t = new THREE.CanvasTexture(canvas);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = THREE.RepeatWrapping;
    t.wrapT = THREE.ClampToEdgeWrapping;
    t.anisotropy = 4;
    return t;
  };
  return { map: mk(c, g, img), emis: mk(ce, ge, imge) };
}

/* v from world height, u from the angle about the mountain's own axis. Cheap, and it needs no
   extra vertices — which is the entire point. */
function mountainUV(mesh, axisX, axisZ, minY, maxY) {
  const g = mesh.geometry;
  const pos = g.attributes.position;
  const uv = new Float32Array(pos.count * 2);
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
    uv[i * 2] = (Math.atan2(v.z - axisZ, v.x - axisX) / (Math.PI * 2)) + 0.5;
    uv[i * 2 + 1] = THREE.MathUtils.clamp((v.y - minY) / Math.max(1, maxY - minY), 0, 1);
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return pos.count;
}

/* PAINTED PER VERTEX, ON THE CPU, AFTER SUBDIVIDING — which is what should have been done
   three attempts ago, and it is the suggestion that got there: SUBDIVIDE IT.
   Every previous version drove the snow line from a fragment shader, and that shader has spent
   this whole exercise not executing for reasons I could not pin down — the block is in the
   compiled source, the program is Fuji's own (its cache key ends `cloudy|rock`), the uniforms
   are bound, and forcing the snow line down to sea level still changes nothing on screen.
   So stop depending on it. A colour written into a vertex attribute is interpolated across the
   triangle by the fixed-function rasteriser: it cannot silently not run, and the smoothness of
   the gradient is decided by how many vertices there are, which is a thing I control directly.
   Two subdivisions take Fuji from 9,916 triangles to 158,000 — at that density the snow line is
   a gradient sampled every forty units or so up the cone, which is far finer than the screen.
   The direction question was the right one to ask, too. What matters is not horizontal versus
   vertical: it is that midpoint subdivision splits every triangle FOUR ways, so the new vertices
   land on every edge and the interpolation gets finer in both directions at once. The earlier
   pass did this to the far ranges and never to Fuji. */
function paintMountain(mesh, opts) {
  let g = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry;
  for (let i = 0; i < (opts.split || 0); i++) g = splitTris(g);

  const pos = g.attributes.position.array;
  const n = g.attributes.position.count;
  /* the normal is needed per vertex to keep snow off the cliffs, and it has to be the WELDED
     one or adjacent triangles disagree about whether they are flat and the snow line frays */
  const key = (i) => `${Math.round(pos[i * 3])}|${Math.round(pos[i * 3 + 1])}|${Math.round(pos[i * 3 + 2])}`;
  const acc = new Map();
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), fn = new THREE.Vector3();
  for (let t = 0; t < n; t += 3) {
    a.fromArray(pos, t * 3); b.fromArray(pos, (t + 1) * 3); c.fromArray(pos, (t + 2) * 3);
    fn.crossVectors(ab.subVectors(b, a), ac.subVectors(c, a)).normalize();
    for (let k = 0; k < 3; k++) {
      const kk = key(t + k);
      let v = acc.get(kk);
      if (!v) acc.set(kk, v = new THREE.Vector3());
      v.add(fn);
    }
  }
  acc.forEach((v) => v.normalize());

  const nrm = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  const rock = new THREE.Color(opts.rock);
  const rockHi = new THREE.Color(opts.rockHi != null ? opts.rockHi : opts.rock);
  const foot = new THREE.Color(opts.foot != null ? opts.foot : opts.rock);
  const snow = new THREE.Color(opts.snow != null ? opts.snow : 0xfffdf8);
  const snowLit = new THREE.Color();
  const tmp = new THREE.Color();
  const up = new THREE.Vector3(0, 1, 0);
  const wp = new THREE.Vector3();

  for (let i = 0; i < n; i++) {
    const x = pos[i * 3], y = pos[i * 3 + 1], z = pos[i * 3 + 2];
    const nv = acc.get(key(i)) || up;
    nrm[i * 3] = nv.x; nrm[i * 3 + 1] = nv.y; nrm[i * 3 + 2] = nv.z;
    /* world position, because the noise and the snow line are world quantities and this mesh
       may sit under a transform */
    wp.set(x, y, z).applyMatrix4(mesh.matrixWorld);

    /* THE BODY: a foot colour blending up into rock, so the base sits into the treeline
       instead of ending at it. This is the "depth treatment" — a mountain is not one colour. */
    const up01 = THREE.MathUtils.clamp((wp.y - opts.footY) / Math.max(1, opts.rockY - opts.footY), 0, 1);
    tmp.copy(foot).lerp(rock, up01 * up01 * (3 - 2 * up01));
    /* mottle, from the same value noise the crags use, so colour and form agree */
    const m = (jsFbm(wp.x * opts.grain, wp.y * opts.grain, wp.z * opts.grain) - 0.5) * (opts.mottle || 0);
    tmp.lerp(rockHi, THREE.MathUtils.clamp(0.5 + m * 3, 0, 1) * 0.45);

    /* THE SNOW: a wide height blend with a noisy line, and nothing on the steep faces. Wide is
       the whole point — uSnowBand of 1,500 over a cone 6,100 tall spreads the transition across
       a quarter of its height, which cannot read as a cutoff at any zoom. */
    /* THE LIGHT IS BAKED IN, AND THE MOUNTAINS ARE UNLIT.
       Every attempt to get a white cap has been fighting the rig: the key is a low sunrise sun
       that barely touches the camera-facing flank, and what remains is a 0x93b0dc bounce and a
       0xcfd8e6 hemisphere — both cold — so a warm albedo comes back neutral and a white one
       comes back grey-blue. The toon ramp had been hiding this behind a 37% floor.
       A mountain twenty-six thousand units away is a matte painting. Its shading is baked here,
       with the sun direction the scene actually uses, and the material is unlit: what is painted
       is what is seen. Snow stays snow-coloured, rock stays warm, and nothing downstream can
       tint it by accident. (paintMountain is re-runnable if the sun ever moves far enough to
       matter — NAV.sun does not currently do that.) */
    if (opts.sun) {
      const nl = Math.max(0, nv.x * opts.sun.x + nv.y * opts.sun.y + nv.z * opts.sun.z);
      /* a soft wrap rather than a hard terminator: at this distance the shadow side of a
         mountain is lit by the whole sky, not by nothing */
      const shade = 0.52 + 0.48 * Math.pow(nl, 0.85);
      tmp.multiplyScalar(shade);
      /* and the lit side takes the sunrise's colour, the shadow side a little of the sky's */
      tmp.r *= 1 + 0.16 * nl; tmp.b *= 1 - 0.10 * nl + 0.06 * (1 - nl);
    }
    if (opts.snowY != null) {
      const line = opts.snowY + (jsFbm(wp.x * opts.snowGrain, wp.y * opts.snowGrain, wp.z * opts.snowGrain) - 0.5) * opts.snowJitter;
      let sn = THREE.MathUtils.smoothstep(wp.y, line, line + opts.snowBand);
      sn *= THREE.MathUtils.smoothstep(Math.abs(nv.y), opts.snowSlope, opts.snowSlope + 0.28);
      /* the cap is blended in after the shading, and keeps most of its brightness: snow is the
         one thing in the frame that is genuinely near-white, and letting the terminator drag it
         down to grey is what made every previous version look capless */
      const k = THREE.MathUtils.clamp(sn, 0, 1);
      if (k > 0 && opts.sun) {
        const nl = Math.max(0, nv.x * opts.sun.x + nv.y * opts.sun.y + nv.z * opts.sun.z);
        snowLit.copy(snow).multiplyScalar(0.80 + 0.20 * nl);
        tmp.lerp(snowLit, k);
      } else {
        tmp.lerp(snow, k);
      }
    }
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeBoundingSphere();
  mesh.geometry = g;
  return n;
}

/* WELDED, SMOOTH NORMALS — and this is the "pixelated", not the ramp and not the noise.
   Fuji arrives from the .glb with per-face normals: it was authored flat-shaded, like everything
   else in this world, and at the size of a shrine lantern that is the house style. At twenty-two
   thousand units across it is a cone shaded as a stack of concentric bands, and no ramp
   resolution or surface noise survives being drawn on top of that.
   Averaging the face normals per POSITION (not per vertex index — after toNonIndexed every
   corner exists once per triangle) turns the same triangles into a smooth cone. The silhouette,
   which is the part anyone would call low-poly on purpose, is untouched. */
function smoothNormals(geo) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const pos = g.attributes.position.array;
  const n = g.attributes.position.count;
  const key = (i) => `${Math.round(pos[i * 3])}|${Math.round(pos[i * 3 + 1])}|${Math.round(pos[i * 3 + 2])}`;
  const acc = new Map();
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), fn = new THREE.Vector3();
  for (let t = 0; t < n; t += 3) {
    a.fromArray(pos, t * 3); b.fromArray(pos, (t + 1) * 3); c.fromArray(pos, (t + 2) * 3);
    fn.crossVectors(ab.subVectors(b, a), ac.subVectors(c, a)).normalize();
    for (let k = 0; k < 3; k++) {
      const kk = key(t + k);
      let v = acc.get(kk);
      if (!v) acc.set(kk, v = new THREE.Vector3());
      v.add(fn);
    }
  }
  acc.forEach((v) => v.normalize());
  const out = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = acc.get(key(i)) || new THREE.Vector3(0, 1, 0);
    out[i * 3] = v.x; out[i * 3 + 1] = v.y; out[i * 3 + 2] = v.z;
  }
  g.setAttribute('normal', new THREE.BufferAttribute(out, 3));
  g.computeBoundingSphere();
  return g;
}

/* the same value noise the rock shader uses, so the crags and the shading agree about where the
   rough ground is rather than being two unrelated fields laid over each other */
function jsHash(x, y, z) {
  let a = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return a - Math.floor(a);
}
function jsNoise(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy), sz = fz * fz * (3 - 2 * fz);
  const L = (a, b, t) => a + (b - a) * t;
  return L(
    L(L(jsHash(ix, iy, iz), jsHash(ix + 1, iy, iz), sx),
      L(jsHash(ix, iy + 1, iz), jsHash(ix + 1, iy + 1, iz), sx), sy),
    L(L(jsHash(ix, iy, iz + 1), jsHash(ix + 1, iy, iz + 1), sx),
      L(jsHash(ix, iy + 1, iz + 1), jsHash(ix + 1, iy + 1, iz + 1), sx), sy), sz);
}
function jsFbm(x, y, z) {
  let a = 0.5, s = 0, f = 1;
  for (let i = 0; i < 4; i++) { s += a * jsNoise(x * f, y * f, z * f); f *= 2.07; a *= 0.5; }
  return s;
}
/* RIDGED, WHICH IS THE WHOLE DIFFERENCE BETWEEN A MOUNTAIN AND A LUMP.
   Plain fbm is a field of smooth blobs, and displacing a ridge by it makes a bigger, lumpier
   ridge — which is exactly what the first attempt produced and exactly what "still looks very
   simple" means. Folding each octave about its midpoint (1 - |2n-1|) turns every zero crossing
   into a CREASE, and squaring sharpens it; accumulating those gives crest lines, spurs and
   gullies rather than hills. It is the standard ridged multifractal, and it is standard because
   nothing else this cheap reads as rock. */
function jsRidged(x, y, z) {
  let a = 0.5, s = 0, f = 1, w = 0;
  for (let i = 0; i < 5; i++) {
    let n = 1 - Math.abs(jsNoise(x * f, y * f, z * f) * 2 - 1);
    n *= n;
    s += a * n; w += a;
    f *= 2.11; a *= 0.52;
  }
  return s / w;
}

/* CRACKS ARE THE ONLY REAL RISK HERE. After toNonIndexed every shared corner exists once per
   triangle, so displacing "along the vertex normal" moves the same corner three different ways
   and tears the mesh open. Both the direction AND the amount have to be pure functions of
   POSITION: the normals are re-averaged into a map keyed on the quantised position, so every
   copy of a corner looks up the same one. */
function cragify(geo, amp, freq) {
  let g = geo;
  /* TWO SPLITS, NOT THREE. Three is 64x — it took the far ranges from 128 triangles each to
     8,192, which is 155k across nineteen of them for objects that occupy a few hundred pixels of
     skyline. Two is 16x and still gives every ridge more crest detail than it can show at this
     distance; the difference in the render is not visible and the difference in the frame is
     116,000 triangles. */
  for (let i = 0; i < 2; i++) g = splitTris(g);
  const pos = g.attributes.position.array;
  const n = g.attributes.position.count;

  const key = (i) => `${Math.round(pos[i * 3])}|${Math.round(pos[i * 3 + 1])}|${Math.round(pos[i * 3 + 2])}`;
  const acc = new Map();
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), fn = new THREE.Vector3();
  for (let t = 0; t < n; t += 3) {
    a.fromArray(pos, t * 3); b.fromArray(pos, (t + 1) * 3); c.fromArray(pos, (t + 2) * 3);
    fn.crossVectors(ab.subVectors(b, a), ac.subVectors(c, a)).normalize();
    for (let k = 0; k < 3; k++) {
      const kk = key(t + k);
      const v = acc.get(kk) || acc.set(kk, new THREE.Vector3()).get(kk);
      v.add(fn);
    }
  }
  acc.forEach((v) => v.normalize());

  const d = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    const x = pos[i * 3], y = pos[i * 3 + 1], z = pos[i * 3 + 2];
    d.copy(acc.get(key(i)) || new THREE.Vector3(0, 1, 0));
    /* the ridged field for the shape, plus one fine fbm octave for surface grain */
    const f = (jsRidged(x * freq, y * freq, z * freq) - 0.42) * 2.3
      + (jsFbm(x * freq * 5.3, y * freq * 5.3, z * freq * 5.3) - 0.5) * 0.55;
    /* ridges get the most, valley floors the least — a mountain is rough at the top and buried
       in scree at the bottom, and pushing the base around only makes it float */
    const h = Math.min(1, Math.max(0, (y - 200) / 2600));
    const k = amp * f * (0.35 + 0.65 * h);
    pos[i * 3] += d.x * k;
    pos[i * 3 + 1] += d.y * k + f * amp * 0.45 * h;
    pos[i * 3 + 2] += d.z * k;
  }
  g.attributes.position.needsUpdate = true;
  /* non-indexed, so this is per-face: flat shading without asking for it */
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

/* ============================ THE ENVIRONMENT LOADER ============================
   A .glb replaces the generated world wholesale: the model IS the scene. Four things have to
   happen, and only the first is loading.

   1  MATERIALS ARE REPLACED, NOT KEPT. Whatever Blender exports is a PBR material, and this
      scene's entire look — the toon ramp, drifting cloud shadows, height fog, the sky rim,
      the aerial tint — lives in patched Lambert/Toon shaders. A loaded model that keeps its
      own materials is lit by none of it and reads as a foreign object dropped in the frame.
      Colour is the only thing worth carrying across.

   2  THE HEIGHTFIELD IS REBUILT FROM THE MESH. See landAt above for why.

   3  THE GENERATED WORLD IS HIDDEN, not deleted, so the swap is reversible in the console and
      the two can be compared from the same camera.

   4  IT IS OPT-IN. No model loads unless asked, because the analytic world is still the one
      every measurement in RESEARCH.md was taken against. */
/* BUILT FROM VERTICES, NOT FROM RAYCASTS. A 384x384 grid is 147,000 downward rays against
   250,000 triangles, and three.js has no BVH — that is minutes. Splatting the terrain's own
   vertices into cells is one pass over the geometry, and since the mesh has roughly one vertex
   per cell at this resolution it lands nearly exact. */
function bakeField(meshes, N = 384) {
  const box = new THREE.Box3();
  meshes.forEach((m) => box.expandByObject(m));
  const pad = 1e-3;
  ENV.x0 = box.min.x - pad; ENV.z0 = box.min.z - pad;
  ENV.fw = ENV.fh = N;
  ENV.dx = (box.max.x - box.min.x + 2 * pad) / (N - 1);
  ENV.dz = (box.max.z - box.min.z + 2 * pad) / (N - 1);
  const f = new Float32Array(N * N).fill(NaN);
  const v = new THREE.Vector3();
  for (const m of meshes) {
    const pos = m.geometry.attributes.position;
    m.updateWorldMatrix(true, false);
    for (let k = 0; k < pos.count; k++) {
      v.fromBufferAttribute(pos, k).applyMatrix4(m.matrixWorld);
      const i = Math.round((v.x - ENV.x0) / ENV.dx), j = Math.round((v.z - ENV.z0) / ENV.dz);
      if (i < 0 || j < 0 || i >= N || j >= N) continue;
      const q = j * N + i;
      /* HIGHEST WINS. A terrain mesh has undersides, cliff backfaces and anything tucked below
         it; taking the last vertex written would sample whichever happened to come last in the
         buffer, which is a coin toss per cell and reads as noise in the ground. */
      if (!(f[q] >= v.y)) f[q] = v.y;
    }
  }
  /* fill the cells no vertex landed in, by spreading from the ones that got filled */
  let holes = 0;
  for (let k = 0; k < f.length; k++) if (Number.isNaN(f[k])) holes++;
  const before = holes;
  for (let pass = 0; pass < 64 && holes > 0; pass++) {
    const g = f.slice();
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const q = j * N + i;
        if (!Number.isNaN(f[q])) continue;
        let sum = 0, n = 0;
        for (let dj = -1; dj <= 1; dj++) {
          for (let di = -1; di <= 1; di++) {
            const ii = i + di, jj = j + dj;
            if (ii < 0 || jj < 0 || ii >= N || jj >= N) continue;
            const w = f[jj * N + ii];
            if (!Number.isNaN(w)) { sum += w; n++; }
          }
        }
        if (n) { g[q] = sum / n; holes--; }
      }
    }
    f.set(g);
  }
  /* anything still empty had no neighbours at all — flat ground is a better answer than NaN,
     which would silently poison every placement downstream */
  for (let k = 0; k < f.length; k++) if (Number.isNaN(f[k])) f[k] = GROUND_Y;
  ENV.field = f;
  /* a loop, not Math.min(...f): spreading a 147,000-element array is 147,000 arguments and
     blows the call stack outright */
  let lo = Infinity, hi = -Infinity;
  for (let k = 0; k < f.length; k++) { if (f[k] < lo) lo = f[k]; if (f[k] > hi) hi = f[k]; }
  return { cells: N * N, holes: before, filled: before - holes, min: lo, max: hi };
}

async function loadEnvironment(url = ENV.url, opts = {}) {
  const t0 = performance.now();
  const gltf = await new GLTFLoader().loadAsync(url);
  const root = gltf.scene;

  /* 1. re-material */
  let meshes = 0, converted = 0, dropped = 0;
  const terrainish = [];
  const bin = [];
  /* ONE CONVERTED MATERIAL PER SOURCE MATERIAL. Minting a fresh one per mesh would give
     twenty thousand materials that happen to be identical, and instancing groups on material
     identity — so a per-mesh material silently makes the scene un-instanceable. */
  const matCache = new Map();
  root.traverse((o) => {
    if (!o.isMesh && !o.isInstancedMesh) return;
    if (ENV_ATMOS.test(o.name) && !ENV_SKY.test(o.name)) { bin.push(o); return; }
    meshes++;
    const src = Array.isArray(o.material) ? o.material[0] : o.material;
    const col = (src && src.color) ? src.color.clone() : new THREE.Color(0x8899aa);
    /* A TEXTURE THAT EXISTS IS WORK SOMEBODY DID. MeshToonMaterial takes a map, so an image
       survives the swap to toon shading — only the PBR response is discarded, which is the
       part that was never going to apply here anyway. */
    const map = (src && src.map) ? src.map : null;
    if (ENV_SKY.test(o.name)) {
      /* unlit, and outside the shadow and fog systems entirely */
      o.material = new THREE.MeshBasicMaterial({ color: col, map, side: THREE.BackSide, fog: false });
      o.castShadow = o.receiveShadow = false;
      o.renderOrder = -1;
      converted++;
      return;
    }
    const key = (src ? src.uuid : 'none') + '|' + (o.geometry.attributes.color ? 'vc' : '');
    let m = matCache.get(key);
    if (!m) {
      m = new THREE.MeshToonMaterial({ color: col, map, gradientMap: RAMP });
      if (o.geometry.attributes.color) { m.vertexColors = true; if (!map) m.color.setHex(0xffffff); }
      m = cloudy(m);
      matCache.set(key, m);
    }
    o.material = m;
    o.castShadow = o.receiveShadow = true;
    converted++;
    /* THE WHOLE WORD, or `Nature_GroundCover_Bush0_001` is terrain and the heightfield gets
       baked from the tops of six thousand bushes. `Landscape_` is likewise a prefix on half
       the file and says nothing about what an object is. */
    if (/(^|[_\-.])(terrain|ground|landform|heightfield)([_\-.]|$)/i.test(o.name)) {
      terrainish.push(o);
    }
  });
  bin.forEach((o) => { o.parent.remove(o); dropped++; });
  ENV.modelSky = false;
  root.traverse((o) => { if ((o.isMesh || o.isInstancedMesh) && ENV_SKY.test(o.name)) ENV.modelSky = true; });

  /* 1b. THE MOUNTAINS, which are a different job from everything else in the file.

     after the hulls are built would leave every ridge wearing the silhouette of the shape it
     used to be. */
  /* 1b0. THE GROUND'S OWN COLOUR, read before anything that has to agree with it — the far

  let groundCol = new THREE.Color(0x8f9677);
  root.traverse((o) => {

  root.traverse((o) => {
    if (!o.isMesh || /outline/.test(o.name)) return;

       The festival ground was reported as black. I measured its colour, found #b1a896 against a
       #909778 terrain, concluded the paint disagreed with the ground and shifted four surfaces
       55% toward the terrain's average. That was solving a problem that did not exist: the floor
       was black because an inverted-hull OUTLINE was lying on top of it like a lid, which is the
       flat-sheet rule now in the hull pass. Removing the lid revealed the authored colour — and
       my correction on top of it then made the plaza almost exactly the colour of the grass, so
       it went straight from black to invisible.
       A pale tan festival ground against green field is what the author drew, and it is right.
       matchToGround is kept for the one seam that IS real — Fuji's skirt against the terrain,
       below — where two different meshes have to meet along a line. */
    return;
    if (matchToGround(o, groundCol, 0.55)) matched++;

  /* 1b1. THE HIGH GROUND, before the ranges, because the ranges are painted to agree with it.
     1,400 is measured, not chosen: the valley floor and the near meadow sit between -300 and
     500, and the visible ridges run from 1,700 to 4,200. Nothing anyone would call a field is
     above 1,400 and nothing anyone would call a mountain is below it. */
  let lifted = 0;
  /* the same rule, for the mesh that carries every hill in the valley — see the note on the
     ranges below. Its hull contributed 28-41% of every dark region and nothing anywhere else. */
  terrainish.forEach((o) => { o.userData.noOutline = true; });
  /* THE BIG DARK OVAL IN THE MEADOW IS A TERMINATOR, and measuring it is what finally said so.
     It is not the cloud shadow, not the shadow map and not the paint: turning each off in turn
     moves it by 0, 2 and 0 luminance, and the terrain's own vertex colour there (#778551) is
     within a few per cent of the bright meadow's (#848866). What IS different is the slope. The
     average normal under the patch is (0.10, 0.89, 0.44) against a sun direction of
     (-0.42, 0.21, -0.88): N.L = -0.254. That ground genuinely faces away from the sunrise.
     So the shading is right and the RENDERING of it is what fails — a four-step ramp collapses
     everything at or below zero into one flat value, and the hill is thousands of units across,
     so the honest terminator comes out as a single enormous flat region with a hard rim. It is
     precisely the problem Fuji had, on the largest surface in the frame, and it takes the same
     answer: give it relief. With the normal wobbling, the step edge follows the ground instead
     of cutting an oval across it, and the flat region inside gains the variation that says
     "hillside in shadow" rather than "stain".

     itself. Finer than that and the meadow reads as noise.
     The material is cloned first because the loader shares one material per source material,
     and the ground must not drag every other vertex-coloured surface with it. */
  terrainish.forEach((o) => {
    o.material = rocky(o.material.clone(), {
      mottle: 0, bump: 0.5, scale: 1 / 1400, cloudAmt: CLOUD.uCloudAmt.value,
    });
  });
  /* AND THE REPAINT IS OFF, BECAUSE IT DOES NOTHING.
     liftHighGround was written to fix mountains that read as black. They read as black because
     they were under their own outline hulls, and once the hulls went the lift turned out to be
     invisible: A/B with it on and off, frozen camera, the left ridge measures luminance 149
     either way and the ridge behind the sun 160 against 157. It was repainting 421,000 terrain
     vertices to move nothing — and any repaint of the ground around Fuji's base is exactly the
     thing that can put a ring there. The function stays for the record and for the day the
     terrain is re-exported with a flatter palette. */
  const LIFT = new URLSearchParams(location.search).get('lift') === 'on';
  if (LIFT) terrainish.forEach((o) => {
    /* 1,000 to 3,000, not 1,400 to 4,200 — the first band was aimed above the thing it was for.
       Traced down the frame, the visible ridges sit at y 1,750 to 2,300, and a smoothstep from
       1,400 to 4,200 is barely off zero there: the ridge at y 1,750 was being lifted by 4%.
       The valley floor and the near meadow are between -300 and 500, so 1,000 is still clear of
       everything anyone would call a field. */
    lifted += liftHighGround(o, 1000, 3000, 0x86975f, 0xa9a89c, 0.85);
  });

  root.traverse((o) => {
    if (!o.isMesh || !/(^|[_\-.])(farrange|range|ridge)/i.test(o.name)) return;
    const rb = new THREE.Box3().setFromObject(o);

       thousand across, so a two-hundred-unit wobble on them is a texture, not a landform.

       which is the one thing a texture cannot do. */

    /* TWO LAYERS, PAINTED, AND THAT IS THE WHOLE DISTANCE CUE.
       FarRange_* stands at 33,000-39,000 units and Range_* at 20,000-25,000, and until now both
       took the same palette and the same fill — so ten ridges at four different depths all
       rendered as one flat dark mass with no order to it. In a cel-shaded picture the only thing
       that can separate them is VALUE, decided in advance and painted in: each layer back is
       paler, cooler and lower in contrast than the one in front, until the furthest is nearly the
       sky. It is the oldest device in Japanese landscape painting and it wants no atmosphere
       simulation at all. */
    /* NO INK ON A LANDFORM, AND THIS IS WHAT "THE MOUNTAINS ARE STILL BLACK" WAS.
       Rendering object ids beside colour and joining them per pixel, the dark masses at frame
       left are not rock and are not forest — they are 63% OUTLINE HULL:
           Landscape_Terrain_Terrain_001-outline   28% of that region, luminance 135
           Landscape_Props_FarRange_009-outline    17%                           116
           Landscape_Props_FarRange_008-outline    13%                           129
           Landscape_Props_Range_008-outline        5%                           114
       Hiding just those twenty-one hulls, frozen camera, lifts the ridge behind REVIEW by 14
       luminance and the left mass by 11, and moves Fuji, the meadow and the foreground by
       exactly zero. It is the black festival floor again: I spent three rounds correcting the
       colour of something that was underneath a lid.
       WHY a landform in particular. An inverted hull inks every place the surface turns away from
       the eye — and that is not just the outer edge. A cragged ridge, and a terrain mesh carrying
       every hill in the valley, have HUNDREDS of internal crest lines, each of which gets its own
