name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  build-and-release:
    # Tag pushes only, so there is no fork-PR exposure to guard against here.
    runs-on: [self-hosted, windows]
    # Raised from 55: this took under nine minutes on a hosted runner, but it downloads a
    # Python distribution and builds a Squirrel installer, both of which are slower on one
    # shared VM.
    timeout-minutes: 90

    defaults:
      run:
        # Windows PowerShell 5.1, not pwsh: PowerShell 7 ships with GitHub-hosted
        # runners but not with a plain Windows install, and the self-hosted runner
        # has no pwsh on PATH. Everything here -- including scripts/bundle_python.ps1
        # -- is written to run under 5.1.
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check toolchain
        # actions/setup-python and actions/setup-node are deliberately not used here.
        # setup-python's installer does a per-machine install and rewrites registry
        # entries, which needs administrator rights the runner service does not have --
        # it fails with "Error happened during Python installation". A dedicated build
        # VM is better off with the toolchain installed once anyway: no download and
        # install on every run, and the same interpreter the local checks use.
        run: |
          $problems = @()
          $pythonExe = $null

          $onPath = Get-Command python -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($onPath) {
            $pythonExe = $onPath.Source
          } else {
            # Fall back to the py launcher. It installs to a fixed location for all
            # users and knows every interpreter on the machine, whereas PATH depends on
            # an installer checkbox that defaults to off and on the runner service
            # having been restarted since.
            $launcher = Get-Command py -CommandType Application -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($launcher) {
              # GitHub's powershell wrapper sets $ErrorActionPreference = Stop, under
              # which anything a native command writes to stderr becomes a terminating
              # error. The launcher prints "No installed Python found!" there when it
              # knows of no interpreter, which would kill this step before it could
              # report why -- so failure is detected by exit code instead.
              $previous = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              $resolved = & $launcher.Source -3.11 -c "import sys; print(sys.executable)" 2>&1
              $launcherExit = $LASTEXITCODE
              $ErrorActionPreference = $previous

              if ($launcherExit -eq 0 -and $resolved) {
                $pythonExe = "$resolved".Trim()
                Write-Host "python is not on PATH; the py launcher resolved 3.11 instead"
              } else {
                Write-Host "the py launcher knows of no 3.11: $resolved"
              }
            }
          }

          if (-not $pythonExe) {
            $problems += "no Python 3.11 found, on PATH or via the py launcher"
          } else {
            $version = (& $pythonExe --version) -replace '^Python ', ''
            Write-Host "python  $version  ($pythonExe)"
            if ($version -notmatch '^3\.11\.') {
              $problems += "python is $version, expected 3.11.x"
            }
          }

          $node = Get-Command node -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $node) {
            $problems += "node is not on PATH"
          } else {
            $version = (& $node.Source --version) -replace '^v', ''
            Write-Host "node    $version  ($($node.Source))"
            # 22 or newer, not pinned to 22: package.json has no engines field and
            # local development runs 24, which is what every check was verified on.
            $major = [int](($version -split '\.')[0])
            if ($major -lt 22) {
              $problems += "node is $version, expected 22 or newer"
            }
          }

          if ($problems.Count -gt 0) {
            Write-Host ""
            Write-Host "This runner is missing part of the toolchain:" -ForegroundColor Red
            $problems | ForEach-Object { Write-Host "  - $_" -ForegroundColor Red }

            # A tool that is installed but invisible here looks identical to one that
            # was never installed, and the two have completely different fixes. Report
            # enough to tell them apart.
            Write-Host ""
            Write-Host "Runner account: $(whoami)"
            $candidates = @(
              "$env:LOCALAPPDATA\Programs\Python",
              "$env:ProgramFiles\Python311",
              "${env:ProgramFiles(x86)}\Python311",
              "C:\Python311"
            ) | Where-Object { $_ -and (Test-Path $_) }
            if ($candidates) {
              Write-Host "Python exists here but this process cannot reach it:"
              $candidates | ForEach-Object { Write-Host "  $_" }
              Write-Host "A per-user install belongs to the installing account, not to"
              Write-Host "$(whoami) -- reinstall for all users."
            }

            Write-Host ""
            Write-Host "If Python is installed but invisible here, it was almost certainly"
            Write-Host "installed for one user: the launcher reads per-user registrations"
            Write-Host "from HKCU, and this process's HKCU belongs to $(whoami), not to"
            Write-Host "the account that ran the installer. Re-run the Python 3.11"
            Write-Host "installer with 'Install Python for all users' ticked, then restart"
            Write-Host "the runner."
            exit 1
          }

          # Publish the interpreter to every later step. The packaged app reads
          # JPLEARN_PYTHON first (electron/main.cjs::resolvePythonCommand) and would
          # otherwise fall back to a bare `python` that is not on this runner's PATH,
          # so the packaged smoke test would start an app whose backend never answers.
          Split-Path -Parent $pythonExe | Add-Content -Path $env:GITHUB_PATH -Encoding utf8
          "JPLEARN_PYTHON=$pythonExe" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: electron-frontend
        run: npm ci

      - name: Run backend tests
        run: python -m pytest -q

      - name: Frontend lint and build
        working-directory: electron-frontend
        run: |
          npm run lint
          npm run build

      - name: Bundle Python (python-build-standalone)
        # Downloads a self-contained Python 3.11, installs runtime packages into it,
        # and places it at python-bundle/ so Electron Forge can include it as an
        # extraResource in the installer. The logic lives in the script rather than
        # here so the installer can also be built locally or on a self-hosted runner.
        #
        # -Force because a self-hosted runner keeps its workspace between runs: a
        # release must never ship a bundle left over from an earlier build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bundle_python.ps1 -Force

      - name: Build Windows installer
        working-directory: electron-frontend
        # JPLEARN_DOCUMENTS_DIR is set to a temp path so the build step
        # doesn't attempt to read/write the developer's Documents folder.
        env:
          JPLEARN_DOCUMENTS_DIR: ${{ runner.temp }}\jplearn-build-data
        run: npm run make:win

      - name: Find installer
        id: find_installer
        working-directory: electron-frontend
        run: |
          $installer = Get-ChildItem -Path "out/make/squirrel.windows/x64" -Filter "JPLearn-Installer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer not found in out/make/squirrel.windows/x64/"
            exit 1
          }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ steps.find_installer.outputs.path }}
          name: JPLearn ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## JPLearn ${{ github.ref_name }}

            **Requirements:** Python 3.11+ must be installed on your system.

            ### Installation
            1. Download and run `${{ steps.find_installer.outputs.name }}`
            2. If Windows shows a SmartScreen warning, click **More info → Run anyway** (the app is unsigned)
            3. On first launch, a setup wizard will offer to download the AI tutor model and Japanese voice engine

            ### Optional components (downloaded by wizard or manually)
            - **AI Tutor:** `python scripts/get_gguf_model.py`
            - **Japanese Voice:** Installed from the in-app setup wizard (optional component)

            ### Building from source
            See the [README](README.md) for full build instructions.
