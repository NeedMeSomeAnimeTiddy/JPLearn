/* set above, followed every frame — see the note on the dome */
/* eslint-disable-next-line no-var */
/* ---- terrain ----
   Rebuilt against lab-shading.html. The old version was one flat hex value on a flat-shaded
   plane, which is why the near ground read as a sheet of dark green rather than as land. What
   replaces it costs nothing at runtime — every bit of it is baked into the vertices at build:

     slope/height ramp   grass low, pale dry grass high, rock on anything steep
     coherent mottle     a large expanse of one interpolated green is a smear however well it
                         is lit; this is the cheapest thing that gives it grain
     baked vertex AO     measured as concavity relative to the local tangent plane, so a
                         tilted slope comes out unoccluded and only real hollows darken
     smooth shading      the lab's finding: a toon ramp across a large curved surface quantises
                         into contour blotches. Toon is for objects; terrain gets this. */
/* ---- the lake, and the river that feeds it ----
   Both are authored in SIGHT-LINE coordinates (d down the axis, s across it) and both are cut
   into the heightfield itself, not laid on top of it. That is the only way a body of water sits
   in the land rather than floating over it — and it means every prop, which is already placed
   from the heightfield, gets the shoreline for free. */
/* Sized so BOTH shores are in the picture. At r 4000 centred 3,600 out the near edge sat behind
   the camera and the far edge 7,600 ahead — the frame was nothing but water, and the coast
   planting was too distant and too deep in the mist to read as trees. 300 units of bank in
   front of the eye and a far shore at 5,700 keeps the reflection and gives it a setting. */
const LAKE = { d: 3000, s: 400, r: 2700, level: -70 };
const LAKE_C = { x: AXIS.x * LAKE.d + SIDE.x * LAKE.s, z: AXIS.y * LAKE.d + SIDE.y * LAKE.s };
const LAKE_Y = GROUND_Y + LAKE.level;             /* the water surface, in world space */

  const across = Math.max(0, 1 - Math.abs(ss - riverSideAt(dd)) / 430);

{

        float mk = 1.0 / uMistH;
        float mbase = uMistAmt * exp( - max( cameraPosition.y - uMistY, 0.0 ) * mk );

/* Declared HERE, beside RAMP, and not beside the loader that first needed it: the sky
   clouds are built long before the environment loader is evaluated, and a const read
   from inside its own temporal dead zone throws rather than reading undefined. That is
   six times now in this file. */
/* THE MOUNTAINS GET THEIR OWN RAMP, and this is most of why Fuji looked pixelated.
   RAMP is four steps with NearestFilter. On a shrine lantern that is the house style; on a cone
   twenty-two thousand units wide it is four hard bands across the single largest object in the
   frame, and no amount of surface detail survives being quantised to four levels. Sixteen steps
   with LinearFilter is still a ramp — the terminator still sits where the art direction put it,
   the falloff is still stylised — but it stops shading a mountain like a poster. */
const RAMP_MTN = toonRamp(16, THREE.LinearFilter);

/* A REAL HASH, NOT AN ARITHMETIC PROGRESSION.
   `(i * 9301 + seed * 49297) % 233280` is LINEAR in i — consecutive instances step by exactly
   9301/233280 and wrap, so the values land on a regular lattice. Using two of them as distance
   and side put every tree on a diagonal grid, which is precisely why the wood, the scrub and
   the stones all lined up in rows: nothing about any of it was random. A multiply-shift hash
   decorrelates properly, and the same call with different salts gives independent axes. */
function hash01(a, b) {
  let n = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x165667b1, 0xc2b2ae35);
  n = Math.imul(n ^ (n >>> 15), 0x2545f491);
  n = Math.imul(n ^ (n >>> 13), 0x27d4eb2d);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

/* Ground detail is not worth reflecting: thousands of 15-unit tufts contribute nothing to a
   rippled 768² image of the far shore, and they were being drawn twice a frame for it. */
const NO_REFLECT = [];
/* what each of them was, for the frame the reflection pass borrows it — see renderReflection */
const NO_REFLECT_WAS = [];

/* the same hull for a single mesh. Mountains ask for a much wider line than trees because the
   width sheds past 4,000 units: 7 pixels on something 13,500 away arrives as 2. */
function addOutline(mesh, px) {
  const o = new THREE.Mesh(outlineGeom(mesh.geometry), outlineMaterial(px));
  o.position.copy(mesh.position);
  o.rotation.copy(mesh.rotation);
  o.scale.copy(mesh.scale);
  o.frustumCulled = false;
  (mesh.parent || backScene).add(o);
  return o;
}

/* one shared scatter so trees, rocks and grass agree about where the ground is busy */
function scatter(i, seed, near, far, spread) {
  const a = hash01(i, seed);
  const b = hash01(i, seed + 7919);
  const c = hash01(i, seed + 104729);
  return { d: near + Math.pow(a, 0.62) * (far - near), s: (b - 0.42) * spread, r: c };
}

/* WHAT A PROP MUST NOT STAND INSIDE. Everything is placed from the heightfield, but the ranges,
   Fuji and the river are separate meshes sitting ON it — so anything scattered where a mountain
   is ends up buried in it. Each of them registers a footprint here and every scatter tests it.

   A flat exclusion circle is the wrong shape for this: a 1,900-unit-wide hill only 800 tall
   would carve a 3,000-unit hole in the forest, and the first attempt at it deleted most of the
   wood. What matters is how high the mountain actually IS at that point, so each blocker is
   stored as a cone and the test asks for the surface height rather than for containment —
   a tree at the foot of a slope is fine, one near the axis is buried. */
const BLOCKERS = [];
function blockAdd(x, z, r, h) { BLOCKERS.push({ x, z, r, h }); }
function blockHeight(x, z) {

  for (let i = 0; i < BLOCKERS.length; i++) {

    const dx = x - b.x, dz = z - b.z;
    const d2 = dx * dx + dz * dz;
    if (d2 >= b.r * b.r) continue;
    const y = b.h * (1 - Math.sqrt(d2) / b.r);
    if (y > m) m = y;
  }

}
/* 120 units of rise is about the base flare of a cone at this scale — under it a prop reads as
   standing at the mountain's foot, over it as standing inside the mountain. The waterline is
   folded into the same gate: nothing scatters below it, so the lake and the river bed clear
   themselves of trees, tufts and stones without any of them knowing the lake exists. */
function blocked(x, z) {
  /* WATER CULLS, NOT MERELY LOW GROUND. A global height test looked equivalent and was not: the
     valley's own relief drops below the lake's level in plenty of places that are nowhere near
     it, and those were being cleared of trees for no reason. Only ground that is actually
     inside the basin and under the surface counts. */
  if (lakeField(x - EYE.x, z - EYE.y) > -0.03 && groundAt(x, z) < LAKE_Y + 25) return true;
  return blockHeight(x, z) > 120;
}
/* ---- one tree, one patch of ground ----
   The valley's wood has never had a spacing test: `standSpot` and `ringSpot` draw a position,
   check that it is not inside a mountain, and plant. At the menu's standoff two trees sharing a
   trunk is a texture nobody reads, and it went unnoticed for that reason — but the destination
   cameras stand a few hundred units from the same wood, and at that range an intersection is not
   a texture, it is a fault. The shrine's own planting solved this locally; this is the same idea
   made global, because a local registry cannot see the wood that is planted after it.

   One flat radius per tree rather than the shrine's two, because everything in here is tall:
   there is no "under the canopy" case to allow. A rejected candidate is simply dropped — the
   wood is four hundred trees deep and losing a few to spacing costs nothing. */
const TREE_SPOTS = [];

function treeFits(x, z, r) {
  for (let i = 0; i < TREE_SPOTS.length; i++) {
    const t = TREE_SPOTS[i];

    if (dx * dx + dz * dz < sum * sum) return false;

}
/* wraps any placement function: same contract, but it also claims the ground it lands on */
function spaced(place, radius) {
  return (i) => {
    const p = place(i);
    if (!p) return null;
    const r = radius * p.scale.x;
    if (!treeFits(p.pos.x, p.pos.z, r)) return null;
    treeClaim(p.pos.x, p.pos.z, r);
    return p;
  };
}

/* `outline` is a width, or 0 for none. The twin shares the instance matrices, so it can never
   drift out of register with what it is outlining. */
function instanced(geo, mat, n, place, outlinePx = 0, name = '') {
  const im = new THREE.InstancedMesh(geo, mat, n);
  const mx = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < n; i++) {
    const p = place(i);
    if (!p) { sc.set(0, 0, 0); mx.compose(new THREE.Vector3(), q, sc); im.setMatrixAt(i, mx); continue; }
    q.setFromAxisAngle(up, p.rot || 0);
    sc.copy(p.scale);
    mx.compose(p.pos, q, sc);
    im.setMatrixAt(i, mx);
  }
  im.instanceMatrix.needsUpdate = true;
  im.name = name || 'scatter';
  backScene.add(im);
  if (outlinePx > 0) {
    const ol = new THREE.InstancedMesh(outlineGeom(geo), outlineMaterial(outlinePx), n);
    ol.instanceMatrix.copy(im.instanceMatrix);
    ol.instanceMatrix.needsUpdate = true;
    ol.frustumCulled = false;
    backScene.add(ol);
  }
  return im;
}

/* ---- Fuji, standing on the sight line ---- */
/* A lathe, not a cone: the flanks have to bow inward or it reads as a volcano rather than as
   Fuji. Broad and low — the real thing is 40km across and under 4km high, so the temptation to
   make it steep is the thing to resist. The profile is kept from the version that finally
   worked; what is rebuilt is the shading. */
function makeFuji(dist, side, R, Hh) {
  const grp = new THREE.Group();
  /* A floored radius is what produced the wine-bottle neck: above t=0.88 the floor won and the
     top eighth ran straight up as a cylinder. Interpolating to a real summit radius means it
     tapers all the way and only goes flat at the very top. */
  /* THE SUMMIT IS BROAD, NOT SHARP. At exponent 1.7 with a 1.6% summit radius the top few per
     cent tapered to a stub and read as a nipple on the skyline. The real mountain has a
     600-metre-wide crater rim on a 40km base — about 3% — and its flanks are less concave than
     the instinct to draw a "volcano" suggests. 1.45 and 5.5% give a summit you can believe
     someone stands on. */
  const rTop = R * 0.055;
  const rAt = (t) => rTop + (R - rTop) * Math.pow(1 - t, 1.45);
  const rows = 26;
  const prof = [];
  for (let i = 0; i <= rows; i++) { const t = i / rows; prof.push(new THREE.Vector2(rAt(t), t * Hh)); }
  /* the summit closed off — a bare lathe lets you look straight down the inside of the mountain */
  prof.push(new THREE.Vector2(0, Hh));
  const geo = new THREE.LatheGeometry(prof, 72);

  /* SNOW AS VERTEX COLOUR ON ONE SHELL, not a second shell offset outward. Two shells is what
     broke this three times over — z-fighting at 13,500 away, the rock ending up wider than the
     cap, the cap flaring past the rock like a mushroom. A snowline cannot fight geometry it is
     part of. It is ragged in azimuth, and deeper down the gullies than on the ribs, which is
     what actually happens and what stops it reading as a drawn circle. */
  const p = geo.attributes.position;
  const ROCK = new THREE.Color(0x4d5876), ROCK_HI = new THREE.Color(0x5f6c8c);
  const SNOW = new THREE.Color(0xf7dcd2), SNOW_SH = new THREE.Color(0xcbc0cc);
  const col = new Float32Array(p.count * 3), tmp = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i), t = y / Hh;
    const a = Math.atan2(p.getZ(i), p.getX(i));
    const line = 0.60 + Math.sin(a * 7) * Math.sin(a * 3 + 1.2) * 0.055 + Math.sin(a * 13 + 0.6) * 0.022;
    tmp.copy(ROCK).lerp(ROCK_HI, THREE.MathUtils.smoothstep(t, 0.0, 0.55));
    /* a short blend so the hem has tongues of snow rather than a hard edge */
    tmp.lerp(SNOW, THREE.MathUtils.smoothstep(t, line, line + 0.075));
    /* the dawn catches the very top first */
    tmp.lerp(SNOW_SH, THREE.MathUtils.smoothstep(t, 0.55, 0.72) * (1 - THREE.MathUtils.smoothstep(t, 0.8, 0.95)) * 0.35);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const shell = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
  grp.add(shell);
  addOutline(shell, 7.0);
  grp.position.copy(at(dist, side, GROUND_Y - 120));
  grp.name = 'fuji';
  shell.name = 'fuji-shell';
  backScene.add(grp);
  blockAdd(grp.position.x, grp.position.z, R * 0.94, Hh);
  return grp;
}
/* 13,000 out and 4,200 tall: at the first values (17,000 / 2,700) it subtended barely 7° and
   read as a bump on the horizon. This fills most of the upper frame — which is the point of
   putting it on the sight line. Offset right so it sits clear of the type stack. */
makeFuji(13500, 2600, 6000, 3500);

/* A RIDGE IS NEVER ONE CONE, and it is never one colour either. Each is a cluster of four or
   five masses merged into a single vertex-coloured mesh, coloured by height the same way Fuji
   is — dark forested skirt, bare rock above it, snow on anything that gets high enough, with a
   ragged line between each. Merging matters: as separate cones the shoulders showed their own
   silhouettes through each other and the cluster read as a pile of triangles. */
function mountainRidge(dist, side, w, h, palette) {
  const [SKIRT, ROCK, SNOW] = palette.map((c) => new THREE.Color(c));
  const seed = Math.abs(Math.floor(dist * 7 + side * 3));
  const rnd = (n) => hash01(seed, n * 7919);
  const parts = [[0, 0, 1, 1], [0.74, 0.10, 0.60, 0.72], [-0.68, -0.09, 0.52, 0.58],
    [0.36, -0.22, 0.40, 0.42], [-0.30, 0.24, 0.34, 0.35]];
  const geos = [];
  parts.forEach(([fx, fz, sw, sh], k) => {
    if (k > 2 && rnd(k) < 0.35) return;                       /* not every ridge gets five */
    const cw = w * sw * (0.85 + rnd(k + 9) * 0.35);
    const ch = h * sh * (0.85 + rnd(k + 17) * 0.3);
    const g = new THREE.ConeGeometry(cw, ch, 5 + ((seed + k) % 4));
    g.rotateY(rnd(k + 5) * 6.28);
    /* squashed across the sight line so a ridge is a ridge and not a pyramid */
    g.scale(1, 1, 0.62 + rnd(k + 3) * 0.3);
    const p = at(dist + w * fz, side + w * fx, 0);
    const base = at(dist, side, 0);
    g.translate(p.x - base.x, ch / 2, p.z - base.z);
    geos.push(g);
  });
  /* one merged shell, coloured by absolute height across the whole cluster */
  const merged = mergeParts(geos.map((g) => ({ geo: g, color: 0xffffff })));
  const p = merged.attributes.position;
  const col = merged.attributes.color, tmp = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const t = THREE.MathUtils.clamp(p.getY(i) / h, 0, 1);
    const a = Math.atan2(p.getZ(i), p.getX(i));
    const wob = Math.sin(a * 5 + seed) * 0.05 + Math.sin(a * 11) * 0.025;
    tmp.copy(SKIRT).lerp(ROCK, THREE.MathUtils.smoothstep(t, 0.22 + wob, 0.52 + wob));
    tmp.lerp(SNOW, THREE.MathUtils.smoothstep(t, 0.70 + wob, 0.86 + wob));
    col.setXYZ(i, tmp.r, tmp.g, tmp.b);
  }
  const m = new THREE.Mesh(merged, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
  const b = onGround(dist, side, -140);
  m.position.copy(b);
  m.name = 'range';
  backScene.add(m);
  addOutline(m, 6.4);
  /* the cluster reaches the furthest shoulder offset plus its radius: 0.74w + 0.60w */
  blockAdd(b.x, b.z, w * 1.34, h);
}
/* Two layers behind the wood, so the valley reads as having depth rather than as a backdrop.
   HELD BEYOND THE FOREST BELT ON PURPOSE. The first placement put them at 5,200–8,900, right
   inside the band the trees scatter across — and once props correctly refuse to stand inside a
   mountain, seven overlapping footprints plus Fuji's claimed more of that band than existed and
   deleted the wood. A range is a backdrop; it belongs behind the thing it is a backdrop to. */
[[10500, -5600, 2400, 900], [11800, 4200, 2600, 780], [13000, -2600, 3000, 1250], [12200, 7600, 2400, 900]]
  .forEach(([d, s, w, h]) => mountainRidge(d, s, w, h, [0x33452f, 0x4c5771, 0xdcd2d6]));
[[17000, -9500, 4200, 2000], [18000, 9000, 3800, 1750], [20000, -3200, 3400, 1500]]
  .forEach(([d, s, w, h]) => mountainRidge(d, s, w, h, [0x3d4a52, 0x66738c, 0xe6dcdc]));
/* and a rim all the way round, so turning the camera never finds an edge of the world. Nearly
   dissolved by the haze at this range, so it only has to give the horizon a broken edge. */
for (let k = 0; k < 26; k++) {
  /* jittered off the exact spoke — 26 peaks at exactly 13.8° apart reads as a picket fence */
  const a = (k / 26 + (hash01(k, 5) - 0.5) * 0.55 / 26) * Math.PI * 2 + 0.3;
  const r = 24000 + hash01(k, 11) * 6000;
  const h = 1700 + hash01(k, 23) * 2200;
  const cw = 3000 + hash01(k, 37) * 2800;
  const g = new THREE.ConeGeometry(cw, h, 5 + (k % 3));
  g.rotateY(hash01(k, 41) * 6.28);
  g.scale(1, 1, 0.7);
  g.translate(0, h / 2, 0);
  const merged = mergeParts([{ geo: g, color: 0xffffff }]);
  const p = merged.attributes.position, col = merged.attributes.color, tmp = new THREE.Color();
  const LO = new THREE.Color(0x5f6c86), HI = new THREE.Color(0xd8d2d8);
  for (let i = 0; i < p.count; i++) {
    tmp.copy(LO).lerp(HI, THREE.MathUtils.smoothstep(p.getY(i) / h, 0.62, 0.9));
    col.setXYZ(i, tmp.r, tmp.g, tmp.b);
  }
  const m = new THREE.Mesh(merged, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
  m.position.set(EYE.x + Math.cos(a) * r, GROUND_Y - 300, EYE.y + Math.sin(a) * r);
  m.name = 'far-range';
  backScene.add(m);
  addOutline(m, 6.0);
  blockAdd(m.position.x, m.position.z, cw * 1.1, h);
}

/* ---- lighting: the sun coming up behind the ranges, low and warm ----
   KEY-TO-FILL RATIO IS THE WHOLE GAME (lab-shading.html). At sun 2.4 against hemisphere 1.35
   direct sunlight was barely a majority of the ground's light, so cast shadows and cloud
   shadows both moved the final pixel by a percent or two and read as "the shadows are weak"
   when the shadows were fine. Trading one against the other is a false choice: a third light
   — a directional bounce that casts nothing — lifts shadowed surfaces while still SHAPING
   them, which lets the key dominate and the hemisphere drop to a tint. */
/* ONE SUN POSITION, TWO CONSUMERS. The light and the visible disc were placed independently and
   disagreed: the disc sat at at(15000, 6400, 300), which is 3,800 units from Fuji's axis on a
   mountain 6,000 wide — so it was *inside the silhouette*, and the only trace of it was a glow
   leaking round the flank. It now sits 4,600 clear of the axis where the skyline drops to about
   200 units, well below it, and the key light is derived from the same vector so the shading
   agrees with where you can see the sun. 14° of elevation: low enough to be a sunrise, high
   enough that the ground still takes a majority of its light from the key. */
/* PAST THE MOUNTAIN, NOT INSIDE IT.
   The authored world put Fuji at at(22813, 7431) with an eleven-thousand-unit radius. The sun
   was at at(14930, 7165) — the SAME BEARING to within 270 units, at two thirds of the distance —
   so it stood inside the cone and lit the near flank from within. Raycasting the home eye at it
   is unambiguous: first hit Fuji at 27,748, sun at 27,237.
   Two things fix it and both are needed. It goes out to 44,000 horizontal, well beyond Fuji's
   far extent of 45,243 measured along the sight line, so that wherever the two overlap the
   mountain occludes the sun rather than the reverse. And it swings out to a bearing that clears
   the silhouette, so it is actually in the sky. 10.5 degrees of elevation keeps the low sunrise.
   SUN_CLEAR below turns all of this into something the console complains about, rather than
   something you notice in a screenshot three days later. */
const SUN_AT = at(31800, 31500, 0);
SUN_AT.y = GROUND_Y + Math.hypot(SUN_AT.x - EYE.x, SUN_AT.z - EYE.y) * Math.tan(10.5 * Math.PI / 180);
{
  /* raised from 3.2 with the sun: dropping the elevation from 20° to 14° cuts cos(incidence) on
     flat ground by a third, and the meadow went with it */
  const sun = new THREE.DirectionalLight(0xffd9b0, 4.6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  /* SIZE THE BOX, THEN COUNT ITS TEXELS. There is no point covering a 70,000-unit valley: at
     4096 that is a 17-unit texel and nothing reads. The shadow box covers the near and middle
     ground the camera actually stands in — ±9000 around a point out along the sight line —
     which is a 4.4-unit texel, and the far ranges simply go unshadowed, where nobody looks
     for contact anyway. */
  sun.target.position.copy(at(3000, 0, GROUND_Y));
  /* THE LIGHT STANDS 14,000 FROM ITS TARGET, WHEREVER THE SUN IS.
     A directional light has no position, only a direction — but its SHADOW camera very much has
     one, and it is tuned here with near 500 / far 26,000. Following the sun out to 44,000 would
     put the whole scene behind the shadow camera's far plane and silently delete every shadow in
     the world. So the sprite says where the sun looks like it is and this says where the rig
     stands; only the direction is shared. 14,000 is what the old placement happened to give,
     so the numbers below stay exactly as tuned. */
  sun.position.copy(sun.target.position)
    .addScaledVector(SUN_AT.clone().sub(sun.target.position).normalize(), 14000);
  const sc = sun.shadow.camera;
  sc.left = -9000; sc.right = 9000; sc.top = 9000; sc.bottom = -9000;
  sc.near = 500; sc.far = 26000;
  /* the blur must be smaller than what it shadows: at a 4.4-unit texel, radius 2 is ~9 units */
  sun.shadow.radius = 2;
  sun.shadow.bias = -0.0005;
  sun.shadow.normalBias = 12;
  backScene.add(sun, sun.target);

  /* the cold side, so the shadowed flanks read blue rather than black. Casts nothing. */
  const bounce = new THREE.DirectionalLight(0x93b0dc, 0.95);
  bounce.position.copy(at(-3000, -6000, 3400));
  backScene.add(bounce, bounce.target);
  backScene.add(new THREE.HemisphereLight(0xcfd8e6, 0x4a4436, 0.75));
}

/* ---- the sunrise itself: a disc and a wide bloom, aimed rather than baked into the dome ---- */
function radialTex(inner, outer, stops) {

  const g = c.getContext('2d');

/* THE SUN, DRAWN RATHER THAN PHOTOGRAPHED.

   a fuzzy ball. This is the same thing evaluated per fragment, so it is exactly as sharp as the
   screen no matter how large it is drawn or how far away it stands.

   WHAT THE REFERENCES AGREE ON, for a low sun seen through a lot of air:
     - There is a DISC, with an edge. The single thing that says "sun" rather than "glow" is that
       the core terminates; brightness alone never reads as a star.
     - The edge is soft by about one percent of the radius, not ten. That is refraction in the
       atmosphere, not blur in a lens.
     - Immediately outside it, a corona falling off very steeply — a few radii, no more.
     - Then a broad, faint aureole out to ten or twenty radii, carrying hardly any intensity but
       most of the colour.
     - Colour runs outward white -> gold -> orange, because the longer the path through air the
       more of the blue end has been scattered out of it. At this elevation the aureole is
       already well into orange.
     - And the disc is drawn a little larger than geometry says, because a source this bright
       bleeds in the eye and in every camera ever pointed at one.

{
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uCore: { value: new THREE.Color(0xfff6e8) },

      uCoreR: { value: 0.055 },

    fragmentShader: `
      uniform vec3 uCore, uMid, uOuter;
      uniform float uCoreR, uLimb;
      varying vec2 vUv;
      void main() {
