    o.userData.noOutline = true;

    const far = /farrange/i.test(o.name);
    o.material = mountainMaterial(far ? {
      /* HEIGHT-CONSCIOUS, NOT UNIFORMLY PALE. These were painted pale slate from the foot up
         and read as white cutouts: the whole mountain was one value. A mountain is banded —
         earth and scrub at the bottom, bare rock in the middle, snow only at the very top — and
         it is the BANDS that say how tall it is. rockAt at 0.22 put bare rock almost at the
         waterline; at 0.46 the foot occupies the lower half, which is what the eye reads as
         mass. The cap is narrow and high because a distant range should be tipped, not capped. */
      /* THE GRADIENT HAS TO SIT WHERE THE MOUNTAIN IS VISIBLE.
         Dumping the texture is what showed this: it was a flat pale slate over four fifths of
         its height with a sliver of green at the very bottom. v is normalised over the mesh's
         whole height and these ranges are buried — only their top third clears the terrain — so
         a foot-to-rock ramp finishing at 0.46 finished far below anything on screen, and every
         visible pixel was bare rock. Same mistake as Fuji's skirt, one mountain over.
         With both ends free the ramp is placed across the part that shows: still earthy at 0.5,
         bare rock by 0.82, and a cap that is a TIP rather than a band. */
      foot: 0x6f7566, rock: 0x848c93, rockHi: 0x9aa0a7, snow: 0xdfe2e6,
      rockFrom: 0.42, rockAt: 0.82, grain: 1 / 700, noiseR: 4000,
      /* and a snow line that wanders. At 1/2600 the noise circle spanned 1.5 units, so the line
         had barely one lobe in it and came out as a straight horizontal edge with teeth. */
      snowAt: 0.90, snowBand: 0.07, snowJitter: 0.15, snowGrain: 1 / 900,
      fill: 0x6e6e6e,
      /* the back layer is meant to be flat and quiet, so barely any */
      bump: 0.22, bumpFreq: 1 / 2600, origin: [c.x, rb.min.y, c.z],
    } : {
      /* the middle layer: still clearly a mountain, still clearly in front of the one behind */
      foot: groundCol.clone().lerp(new THREE.Color(0x5f6a5c), 0.62).getHex(),
      rock: 0x757c78, rockHi: 0x8b918b, snow: 0xd6d8da,
      rockFrom: 0.38, rockAt: 0.78, grain: 1 / 700, noiseR: 4000,
      snowAt: 0.93, snowBand: 0.06, snowJitter: 0.15, snowGrain: 1 / 900,
      fill: 0x585858,
      bump: 0.45, bumpFreq: 1 / 1700, origin: [c.x, rb.min.y, c.z],
    });
    cragged++;
    craggedTris += o.geometry.attributes.position.count / 3;
  });
  let ponds = 0;
  root.traverse((o) => {
    if (!o.isMesh) return;
    if (/gardenwater/i.test(o.name)) {
      /* THE LAKE'S OWN MATERIAL, SHARED — not a lookalike.
         I argued this could not be done because the planar reflection belongs to one plane. That
         was true and irrelevant: the reflection is applied by PROJECTIVE texturing from the
         mirrored camera, so it is correct for any point ON that plane and degrades with height
         above it — and the garden pond's surface sits between y -334 and -264 against the lake's
         -370, a hundred units, which at this viewing distance is nothing. Sharing the material
         outright means it cannot drift from the lake's look, which is the actual request.
         DoubleSide because this mesh's faces point downward (see the note in the loader). */
      o.material = lakeWater.material.clone();
      o.material.uniforms = lakeWater.material.uniforms;   /* share, do not copy: cloneUniforms
        would hand this a dead copy of texMatrix that never updates again */
      o.material.side = THREE.DoubleSide;
      o.castShadow = false; o.receiveShadow = false;
      o.userData.noOutline = true;
      /* out of the reflection pass, or the pond appears in its own mirror */
      NO_REFLECT.push(o);
      ponds++;
    } else if (/onsenpool/i.test(o.name)) {
      o.material = pondMaterial({
        deep: 0x4d6f70, shallow: 0x9fc3bd, skyLo: 0xffe0c0, skyHi: 0xa7b0c4,
        chop: 0.45, glint: 0.5,
      });
      o.castShadow = false; o.receiveShadow = false;
      o.userData.noOutline = true;
      ponds++;
    }
  });
  let fujiDone = 0;
  root.traverse((o) => {
    if (!o.isMesh || !/fuji/i.test(o.name) || /forest|props_rock|outline/i.test(o.name)) return;
    const b = new THREE.Box3().setFromObject(o);
    /* NO SUBDIVISION. The previous pass split this twice to make a per-vertex gradient finer
       than the screen — 9,916 triangles became 158,656, on one object, to hold a colour ramp.
       A texture is a colour ramp evaluated per pixel by hardware that is already sampling
       textures for everything else, and it needs no vertices at all. Welding the normals is
       kept, because that fixes the FACETING, which is a different problem and a real one. */
    o.geometry = smoothNormals(o.geometry);
    mountainUV(o, (b.min.x + b.max.x) / 2, (b.min.z + b.max.z) / 2, b.min.y, b.max.y);
    /* FUJI'S FOOT IS THE TERRAIN'S COLOUR, which is the whole of the tree-ring seam.
       The mountain is a separate mesh from the ground, so where its skirt meets the map there
       was a hard edge between a brown-grey rock foot and the terrain's green — measured at
       #8f9677 — with the forest ring straddling it. Taking the foot colour FROM the terrain at
       load means the two cannot disagree, and a re-export that repaints the ground moves the
       mountain's skirt with it. Slightly darkened, because ground under a closed conifer canopy
       is darker than open field and going exactly equal reads as a decal. */
    /* 0.55, NOT 0.82, AND THE DIFFERENCE IS THE RING.
       This already took the skirt colour from the terrain so the two could not disagree, and it
       was still landing as open-meadow green — when what stands on Fuji's lower slope is twenty
       thousand firs. Ground under a closed conifer canopy is about half the brightness of open
       field, and at 0.55 the foot lands near #6d725b, the family the Fuji_Forest trees are
       painted in (#4a523a, #374331). */
    /* THE COLOUR OF A FOREST FLOOR, not of a field dimmed.
       Taking the terrain's average and scaling it keeps the terrain's hue, which is open meadow —

       it are painted #4a523a and #374331: darker, and much further toward blue-green. Mixing
       toward that and then dropping the value lands near #5c634b. */
    /* SOLVED AGAINST THE PIXEL, NOT AGAINST THE PALETTE — which is the fifth attempt at this
       ring and the first one that measures the thing being matched.
       Fuji and the terrain are different materials, so equal albedo does not give equal pixels:
       measured across the seam, Fuji rendered #948a67 where the terrain beside it rendered
       #87855d. Half of that gap was the emissive fill, which the masked emissive map above now
       removes from the skirt. The rest is albedo, and the honest way to set it is to sweep the
       multiplier and read the seam off the framebuffer rather than to derive a colour and hope.
       Swept, reading the last Fuji pixel and the first terrain pixel below it across seven
       columns of the base:
           x0.42  Fuji #65614d  terrain #989269   off by -51 -49 -28
           x0.62  Fuji #6b6752  terrain #9f986c   off by -52 -49 -26
           x1.0   Fuji #737157  terrain #948e67   off by -32 -30 -15
           x2.0   Fuji #8a8768  terrain #989269   off by -14 -11  -1
           x2.6   Fuji #969270  terrain #989269   off by  -2   0   7
       So: 2.6, and the seam is matched to two parts in 255. The HUE still comes from the
       terrain, so a re-export that repaints the ground moves the skirt with it; only the level

    const SK = parseFloat(new URLSearchParams(location.search).get('skirt'));
    const skirt = groundCol.clone().lerp(new THREE.Color(0x3f4a33), 0.55)

    o.material = mountainMaterial({
      foot: skirt.getHex(), rock: 0x9a8f82, rockHi: 0xb4a897,
      /* NOT THE BRIGHTEST THING IN THE FRAME. Measured: the cap rendered at luminance 168 against
         a 151 sky, so the mountain was out-shining the sunrise behind it — which is most of "why

      /* MEASURED AGAINST THE SKY. With the toon ramp back, Fuji's cap rendered at luminance

      snow: 0xcdc8c0,
      /* 0.60, UP FROM 0.30, BECAUSE THE ENTIRE GRADIENT WAS UNDERGROUND.
         v is normalised over the MESH's height (y 1,097 to 7,220), and the forest and terrain in
         front hide everything below about y 2,900 — traced down the cone, the lowest pixel of
         Fuji anyone can see sits at v = 0.298. A foot-to-rock ramp finishing at v = 0.30 finished
         exactly where the mountain becomes visible: every visible pixel was already full rock,
         and the corrected foot was a correction applied entirely to geometry nobody can see. At
         0.60 the ramp is half-done at the treeline, so the skirt reads green where it meets the
         forest and turns to rock climbing out of it. */
      /* 0.24 to 0.46 — measured, not chosen. Tracing rays down the cone, the lowest pixel of
         Fuji anyone can see sits at v = 0.298, so the transition is placed to straddle it: at the
         treeline the skirt is still 82% forest floor, and it is bare rock by v = 0.46. That is
         the ring, and every previous attempt at it painted geometry nobody can see. */
      rockFrom: 0.24, rockAt: 0.46, grain: 1 / 1100, noiseR: 6000,
      /* and the cap sits above the rock rather than starting in the middle of it */
      /* the same wandering line as the ranges — 1/4200 over a 6,000-unit circle is 1.4 noise

         as a splotch where the one lobe it did have happened to dip */
      snowAt: 0.62, snowBand: 0.18, snowJitter: 0.17, snowGrain: 1 / 1300,
      /* THE ONE THAT BANDED. Fuji is the largest smooth surface in the frame and needs the most
         relief to break its terminator — measured against the mesh, 1/2200 is a ~2,200-unit
         undulation, which at 24,000 units away is about the size of a real ridge on the cone. */
      /* 0.32, DOWN FROM 0.62. At the higher value the relief was leaning some patches of the
         cone far enough to jump a whole ramp step, so the snow band grew and lost islands and
         the cone came out spotted — noise, not rock. It only has to break the terminator, not
         re-sculpt the mountain. */
      bump: 0.32, bumpFreq: 1 / 2200,
      origin: [(b.min.x + b.max.x) / 2, b.min.y, (b.min.z + b.max.z) / 2],

  /* 2. INSTANCE WHAT SHARES A SHAPE. glTF deduplicates accessors, so meshes that were linked

  const groups = new Map();
  const loose = [];

    const im = new THREE.InstancedMesh(list[0].geometry, list[0].material, list.length);

       it is valid here because these matrices are written once at load and never touched again. */
    im.computeBoundingSphere();

       darkest large things in the picture are not rock at all — they are the conifers:
           Festival_Vegetation_Sugi1   4.2% of the frame at luminance  89
           Fuji_Forest_Sugi0           1.9%                            91
           Festival_Vegetation_Keyaki2 1.8%                           101
           Fuji_Forest_Fir0 / Fir1     1.7% each                     98 / 99
       Thirteen per cent of the frame in the high 80s and 90s, against a sky at 158 and a meadow
       at 111. Every mountain shape in the middle distance is wearing that as a coat, which is why
       three rounds of work on the rock underneath changed nothing anyone could see.
       So the forest gets a treeline, painted rather than simulated: a per-instance tint that
       leaves the valley exactly as authored and lightens and cools the trees as they climb.
       That is true of real alpine forest — thinner, paler, more sky through it — and it is the
       standard device for the same reason. instanceColor multiplies the vertex colours, so every
       tree keeps its own painted variation and only the value moves.
       Deliberately NOT keyed on distance: distance-keyed anything is fog, and this world is
       cel-shaded. A tree high on a ridge is painted paler whether you are standing under it or
       looking at it from across the valley. */
    if (/(_Vegetation_|_Forest_|Nature_Trees_)/i.test(im.name)) {
      const c = new THREE.Color();
      const mm = new THREE.Matrix4();
      let farSum = 0;

        im.getMatrixAt(i, mm);
        farSum += Math.hypot(mm.elements[12] - LAKE_C.x, mm.elements[14] - LAKE_C.z);
        const t = THREE.MathUtils.smoothstep(mm.elements[13], 1200, 3600);
        /* blue lifted hardest, so the high forest goes cool as well as pale and separates from
           the warm valley green in front of it. Gentle: this was set when the ridges were still
           buried under their own outlines and it was being asked to do that job as well. */
        c.setRGB(1 + t * 0.26, 1 + t * 0.29, 1 + t * 0.44);
        im.setColorAt(i, c);
      }
      if (im.instanceColor) im.instanceColor.needsUpdate = true;
      tinted++;
      /* AND THE FAR HALF OF IT IS NOT WORTH REFLECTING.
         Measured per pass, the reflection is 2,184k triangles and Fuji_Forest alone is 953k of
         them — 46%, twenty thousand trees and shrubs standing 20,000 to 40,000 units from the
         lake. In a 640-pixel mirror rippled by two scrolling normal maps, one of those is under
         a pixel across.
         THE MEASURE IS PER INSTANCE, and that distinction is why this is safe where the last
         attempt was not. Culling by an instanced set's own bounding RADIUS took nine hundred
         near-shore trees out in a single decision and emptied the lake, because a set's radius
         is one member's and says nothing about where the set stands. The mean distance of its
         instances from the lake does say that: the near shore averages a few thousand units, the
         forest on the mountain twenty-odd thousand, and nothing sits between them. */
      if (farSum / im.count > 14000) {
        NO_REFLECT.push(im);
        farCut++;
        farCutTris += ((im.geometry.index ? im.geometry.index.count
          : im.geometry.attributes.position.count) / 3) * im.count;
      }
    }
    root.add(im);
    list.forEach((o) => o.parent && o.parent.remove(o));
    instMeshes++; instTotal += list.length;
  }

  /* 3. the heightfield */
  const src = terrainish.length ? terrainish
    : (() => {
      console.warn('[env] no mesh named terrain/ground/land — baking from EVERY mesh, which '
        + 'will read rooftops as ground. Name the ground object "terrain" in the .glb.');
      const all = [];
      root.traverse((o) => { if (o.isMesh) all.push(o); });
      return all;
    })();
  const stats = bakeField(src, opts.grid || 384);

  /* 4. WHAT IS NOT WORTH REFLECTING. The scene is drawn a second time every frame into a
     768-square target for the lake, and at that resolution an object's contribution is its
     angular size: a 40-unit bush on the far shore is a third of a pixel. Culling by world
     RADIUS rather than by name or collection means it keeps working when the model changes.

     BUT A PER-MEMBER TEST IS THE WRONG TEST FOR AN INSTANCED SET. At 120 units this emptied
     the lake: one tree's radius is under the threshold, so the rule removed nine hundred trees
     in a single decision and took the whole far shore with them. In a reflection a tree is two
     pixels and a FOREST is the entire image — what reads is the mass, not the member.

     So the threshold is what cannot read even in aggregate: grass, groundcover, small clutter.
     A stand of anything tree-sized stays. */
  const REFLECT_MIN_R = 55;
  let culled = 0, culledTris = 0;
  const culledSets = [];
  root.traverse((o) => {
    if (!o.isMesh && !o.isInstancedMesh) return;
    if (terrainish.includes(o) || ENV_SKY.test(o.name)) return;
    o.geometry.computeBoundingSphere();
    const bs = o.geometry.boundingSphere;
    if (!bs) return;
    /* an InstancedMesh's geometry radius is one instance's; the instances carry the scale */
    let sc = 1;
    if (o.isInstancedMesh) {
      const m = new THREE.Matrix4(), v = new THREE.Vector3();
      for (let i = 0; i < Math.min(o.count, 32); i++) {
        o.getMatrixAt(i, m);
        m.decompose(new THREE.Vector3(), new THREE.Quaternion(), v);
        sc = Math.max(sc, Math.max(v.x, v.y, v.z));
      }
    } else {
      sc = Math.max(o.scale.x, o.scale.y, o.scale.z);
    }
    if (bs.radius * sc < REFLECT_MIN_R) {
      NO_REFLECT.push(o);
      culled++;
      const t = (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
      const n = o.isInstancedMesh ? o.count : 1;
      culledTris += t * n;
      /* an instanced set is one entry in the list and can be thousands of objects on screen —
         worth naming, so a mistake like the forest cannot hide inside a total again */
      if (n > 200) culledSets.push([o.name, n, Math.round(bs.radius * sc)]);
    }
  });

  /* 5. OUTLINE HULLS. Loaded geometry had none, which is why a loaded world read flatter than
     the generated one — the black line is most of this scene's language. Instanced sets get an
     instanced hull sharing the same matrices, so it stays one extra draw call per set rather
     than one per tree. Skipped below the same size at which an outline is sub-pixel anyway. */
  /* NO HULLS FOR THE LOADED WORLD. renderInk() draws every line in this scene now — see the
     note at INK. This whole pass is left standing rather than deleted because the generated
     fallback world and the hand-built precincts still call addOutline directly, and because the
     size and flat-sheet rules in it are the record of what an inverted hull cannot do. */
  const OUTLINE_MIN_R = 1e9;
  let hulls = 0;
  const madeFor = [];
  root.traverse((o) => {
    if ((!o.isMesh && !o.isInstancedMesh) || ENV_SKY.test(o.name)) return;
    if (o.userData.noOutline) return;

    /* AN INVERTED HULL IS THE WRONG TOOL FOR A FLAT SHEET, and this is now a RULE rather than a
       list of names. The hull is the same geometry drawn back-faces-only and nudged away from
       the eye. On anything with real thickness that is a silhouette. On a sheet — a ground
       surface, a path, a pond — the back faces sit in the same plane as the front ones, so the
       result is a solid near-black lid laid exactly over the thing it was supposed to outline.
       It turned the garden pond black; it was also, all along, why the festival ground was
       black, because `Festival_Surfaces_FestivalGround_001-outline` is one of these lids and no
       amount of correcting the GROUND's colour was ever going to show through it.
       Measured off the geometry, so it catches every one of them and any added later: if the
       vertical extent is under 4% of the footprint, it is a sheet. */
    o.geometry.computeBoundingBox();
    const bb = o.geometry.boundingBox;
    if (bb) {
      const w = Math.max(bb.max.x - bb.min.x, bb.max.z - bb.min.z);
      if (w > 1 && (bb.max.y - bb.min.y) / w < 0.04) return;
    }

    /* AND NOT THE FOREST. An instanced hull carries one copy of the geometry per instance, so
       outlining 20,328 instanced trees costs as many triangles as the trees themselves — 2.4M of
       a 5.2M frame was inverted hulls, and most of it was vegetation whose line is shedding to
       nothing by 14,000 units anyway (see shedAt). The big single meshes keep their outlines,
       which is where the ink actually reads. */
    if (o.isInstancedMesh) return;

    o.geometry.computeBoundingSphere();
    const bs = o.geometry.boundingSphere;
    if (!bs || bs.radius < OUTLINE_MIN_R) return;
    madeFor.push(o);
  });
  for (const o of madeFor) {
    const g = outlineGeom(o.geometry);
    /* 1.0 rather than 2.2, and shedding from 14,000 rather than 4,000. The old pair drew a
       near tree at 2.2px and the far treeline at about 1 — visibly two different weights in one
       frame. This is one weight everywhere inside the valley, and only the horizon thins. */
    const mat = outlineMaterial(terrainish.includes(o) ? 0.8 : 1.0, 14000);
    let h;
    if (o.isInstancedMesh) {
      h = new THREE.InstancedMesh(g, mat, o.count);
      const m = new THREE.Matrix4();
      for (let i = 0; i < o.count; i++) { o.getMatrixAt(i, m); h.setMatrixAt(i, m); }
      h.instanceMatrix.needsUpdate = true;
    } else {
      h = new THREE.Mesh(g, mat);
      h.position.copy(o.position); h.quaternion.copy(o.quaternion); h.scale.copy(o.scale);
    }
    /* same reasoning as the sets themselves */
    if (h.isInstancedMesh) h.computeBoundingSphere();
    h.frustumCulled = true;
    h.name = (o.name || 'part') + '-outline';
    (o.parent || root).add(h);
    ENV.hulls.push(h);
    /* NOT IN THE REFLECTION. An outline is a width in pixels and the reflection is 768 of them:
       a line sized for the window covers a reflected tree entirely, and 252 hulls turned the
       lake into flat grey. The section above already says ground detail is not worth
       reflecting; a contour line in a rippled 768-pixel image is worth even less. */
    NO_REFLECT.push(h);
    hulls++;
  }

  /* 6. hide what it replaces. Mostly already done before the fetch started — this second call
     catches the sky, which can only be decided once the model has been read. */
  hideGeneratedWorld(root);

  backScene.add(root);
  ENV.root = root;
  /* THE HOME VIEW MOVES WITH THE WORLD. The old eye was sited against a heightfield this
     model replaced, and it faces away from the sun. */
  if (opts.home !== false) {
    composeWorldHome();
    /* THE MENU DOES NOT WAIT FOR AN ANIMATION. Whatever the intro is doing, by the time the
       world is in, the type belongs on screen — a reveal that has not run is a reason to show
       the thing, not to keep hiding it. */
    itemEls.forEach((el) => { el.classList.add('enter', 'entered'); });
  }

  /* the heightfield exists by now, so the lake can be told where its own shore is */
  {
    const lb = new THREE.Box3().setFromObject(lakeWater);
    const c = lb.getCenter(new THREE.Vector3());
    const half = Math.max(lb.max.x - lb.min.x, lb.max.z - lb.min.z) * 0.5;
    const sh = bakeShoreDepth(c, half, LAKE_Y);
    lakeWater.material.uniforms.uShore.value = SHORE.tex;
    console.log(`[water] shore depth baked: ${sh.span} units across, deepest ${sh.deepest}`);
  }

  ENV.culled = culled;
  if (culledSets.length) {
    console.log('[env] large sets cut from the reflection: '
      + culledSets.map((c) => `${c[0]} x${c[1]} (r${c[2]})`).join(', '));
  }
  const ms = Math.round(performance.now() - t0);
  console.log(`[env] ${url}: ${meshes} meshes, ${converted} re-materialled, `
    + `${cragged} ranges cragged to ${Math.round(craggedTris / 1000)}k tris, ${fujiDone} fuji, `
    + `${Math.round(lifted / 1000)}k terrain verts lifted to rock, ${tinted} sets given a treeline, `
    + `${farCut} far vegetation sets out of the reflection (${Math.round(farCutTris / 1000)}k tris), `
    + `${matched} surfaces matched to ground #${groundCol.getHexString()}, `
    + `${ponds} water surfaces, `
    + `${dropped} atmosphere dropped, ${culled} cut from the reflection `
    + `(${Math.round(culledTris / 1000)}k tris/frame saved), ${hulls} outline hulls, `
    + `${instMeshes} instanced meshes carrying ${instTotal} `
    + `(${keptLoose + loose.length} left loose), ${ENV.hidden.length} generated hidden, `
    + `heightfield ${stats.cells} cells (${stats.holes} empty, ${stats.filled} filled), `
    + `y ${stats.min.toFixed(0)}..${stats.max.toFixed(0)}, ${ms} ms`);
  return { meshes, dropped, hidden: ENV.hidden.length, terrainMeshes: src.length,
    culled, culledTris, hulls, culledSets,
    instMeshes, instTotal, keptLoose: keptLoose + loose.length,
    drawCalls: instMeshes + keptLoose + loose.length, ...stats, ms };
}

/* CEL OVER THE LOADED WORLD. Hard ramp everywhere, a much heavier line, and the atmosphere
   turned down — height fog is a smooth continuous gradient laid over an image whose whole
   premise is that tone comes in steps, and it is what washed the look out in the lab. */
function setCel(on) {
  ENV.cel = !!on;
  OUTLINE_SCALE.value = on ? 2.1 : 1;
  backScene.traverse((o) => {
    if (!o.isMesh && !o.isInstancedMesh) return;
    const m = o.material;
    if (!m || !m.isMeshToonMaterial) return;
    m.gradientMap = on ? RAMP_CEL : RAMP;
    m.needsUpdate = true;
  });
  return { cel: ENV.cel, outlineScale: OUTLINE_SCALE.value };
}

/* ?world LOADS IT, ?world&cel LOADS IT SHADED. Opt-in was the right default — every
   measurement in RESEARCH.md was taken against the analytic world, and a page that silently
   swapped it would invalidate all of them without saying so — but "open the console and type
   a function name" is not a way to show somebody a thing. A query string is opt-in and still
   a link you can send. */
{
  const q = new URLSearchParams(location.search);
  /* THE AUTHORED WORLD IS THE WORLD NOW. ?generated keeps the old one, which is worth having
     for two reasons rather than sentiment: it is what every measurement in RESEARCH.md was
     taken against, and it is what the page falls back to if a 53MB fetch fails. It is still
     BUILT first, so a failed load leaves a working page rather than an empty one — but it is no
     longer SHOWN first, which is a separate decision and was the whole of the pop-in. The catch
     below is what makes building it worth the cost. */
  WORLD_PENDING = !q.has('generated');
  if (WORLD_PENDING) {
    addEventListener('load', () => {
      loadEnvironment(q.get('env') || undefined)
        .then(() => {
          if (q.has('cel')) setCel(true);
          /* the framing was composed against FUJI_PEAK_HINT before this file existed on the
             client; now that the real summit is here, confirm it */
          checkFujiHint();
          sunClear([HOME.px, HOME.py, HOME.pz]);
        })
        .catch((e) => {
          console.error('[env] load failed, showing the generated world instead:', e);
          /* the whole reason the generated world is still built: it is the fallback */
          ENV.hidden.forEach((o) => { o.visible = true; });
          ENV.hidden = [];
        });
    });
  }
}

/* THE AUTHORED WORLD'S FRAMING, as one call rather than a block buried in the loader — because
   it now has to happen BEFORE the fetch as well as after it, or the intro tween spends its 1.7
   seconds flying to a composition the world is about to replace.
   THE EYE: 4,200 units to the right of where it was and 5,000 nearer, which is what puts the
   lake between the camera and Fuji. That is the whole trick to the reflection — measured, not
   hoped: the mirrored eye's ray to the summit crosses the water at (-368, -956), and the lake
   spans (-4119..2901, -5605..1415). It was landing 2,900 units short of the near shore before,
   on dry land, which is why there was never a mountain in the water to find.
   BOTH AIMS ARE COMPUTED, NOT TRANSCRIBED. Hard-coding a look vector copied off a sweep is how
   this ended up pointing at the pagoda. The camera is aimed so the summit lands at (0.76, 0.24)
   and the sun is then unprojected into the middle of the frame that produces — sun centred,
   Fuji to the right, the lake and its reflection under the mountain rather than under the sun.
   The sun crosses to the far side of Fuji doing this, so the key light goes with it and the
   valley is lit from where the sun now is. ?sun=shoulder keeps the other framing. */
function composeWorldHome() {
  if (ENV.homeMoved) return null;
  const eye = [0, 2000, 6000];
  const shoulder = new URLSearchParams(location.search).get('sun') === 'shoulder';
  const r = shoulder
    ? setHomeView(eye, aimAtSun(eye, 43, 0.80, 0.30), 43)
    : setHomeView(eye, aimAt(fujiPeak(), eye, 43, 0.76, 0.24), 43);
  if (!shoulder) placeSun(0.5, 0.30);
  /* FOG WAS TUNED FOR A CAMERA 800 UNITS FROM ITS SUBJECT. At 21,000 the same exp2 density
     buries the whole valley, and raising saturation only made the haze more emphatic — the shot
     came back as an orange wash with a mountain in it. Roughly halved, so distance still reads
     as distance and the map is still a map. (FOG_U carries this to the hand-written shaders;
     see the fog uniform above for what happens when it does not.) */
  backScene.fog.density = 0.0000185;
  CLOUD_MATS.forEach((m) => { m.needsUpdate = true; });
  ENV.homeMoved = true;
  return r;
}

/* WHAT THE MODEL REPLACES, HIDDEN. Idempotent and APPENDING, because it is called twice: once
   before the fetch so the old world is never seen, and once after so the generated sky can step
   aside if the model brought its own — which is the one thing that cannot be known in advance.
   Resetting ENV.hidden on the second call would strand the first call's objects invisible for
   good, and NAV.unloadEnv() would put back half a world. */
function hideGeneratedWorld(root) {
  backScene.children.forEach((o) => {
    if (o.isLight || o === root) return;
    /* the water, the clouds and the sun stay generated; the sky steps aside if the model
       brought its own, because a dome is the one piece of atmosphere worth authoring */
    if (ENV_ATMOS.test(o.name) && !(ENV_SKY.test(o.name) && ENV.modelSky)) return;
    if (o.visible) { ENV.hidden.push(o); o.visible = false; }
  });
  return ENV.hidden.length;
}

function unloadEnvironment() {
  /* the hulls live under the loaded root, so removing it takes them — but NO_REFLECT holds
     references into it, and leaving those behind hides objects that no longer exist and, worse,
     keeps the whole loaded scene alive in memory */
  ENV.hulls.length = 0;
  NO_REFLECT.length = 0;
  if (ENV.root) { backScene.remove(ENV.root); ENV.root = null; }
  ENV.hidden.forEach((o) => { o.visible = true; });
  ENV.hidden = [];
  ENV.field = null;
}
function destPlace(bearingDeg, dist, lift = 0) {
  const b = bearingDeg * Math.PI / 180;
  const p = at(Math.cos(b) * dist, Math.sin(b) * dist, 0);
  p.y = surfaceAt(p.x, p.z) + lift;
  return p;
}
/* the camera's standing point: on the line from home to the place, STAND_OFF short of it, at
   eye height above whatever ground is there */
function standOff(place, off = STAND_OFF, lift = EYE_LIFT) {
  const v = place.clone().sub(HOME_EYE).setY(0);
  const len = v.length();
  const e = v.multiplyScalar(Math.max(len - off, 400) / len).add(HOME_EYE);
  /* eye height is per-place too: standing back to look at a valley and standing close to read
     something hanging at chest height are not the same shot */
  e.y = surfaceAt(e.x, e.z) + lift;
  return e;
}

/* Six places around the lake. Fuji sits at bearing +11°, so REVIEW is held out to +27° where it
   has open water and the right half of the frame to itself — it is the one you can see from the
   menu, and it must not stack on the mountain. The rest spread wide enough that each is a real
   turn: two ahead of the shoulders, two abeam, two behind. */
const DEST_SPECS = [
  /* STUDY: 方丈と四方の庭 — one hall with four gardens round it, ON HIGH DRY GROUND.

     THE LAKE OWNS THE WEST. The garden's first site sat 57% in the water with its far wall standing
     in open lake. Asked for dry ground at REVIEW's travel distance the sweep found none anywhere on
     the western arc at any distance — 63% wet at the driest — so the whole circle was swept once
     instead, and the world has a shape worth stating: bearings -140 through +40 are 25-90% water at
     4,600 to 5,800, and +80 through +170 are bone dry. Every viable site is in the east.

     THE FLIGHT IS THE OTHER HALF OF THE SHOT, AND IT IS NOT `dist - stand`. The camera flies to
     `standOff(FOCUS, stand)`, and every place rewrites its own focus — STUDY's sits on the rank of
     path-heads 1,320 short of the nominal place, so `dist - stand` overstated the journey by
     exactly that. Measured from home the travel is |focus| - stand, which is why dist is 6520:
     6520 - 1320 - 1284 = 3,916, the shrine's own flight to the unit. Bearing 170 is also the
     longest turn in the world, nearly straight behind the menu camera, which for the section most
     people land on is the biggest journey available.

     The site is 0% wet over a 207 fall, the lake does not come within 7,500 units, and the ground
     sits at -90 against the valley floor's -300 — 210 up. Not merely away from the water but above
     it, which is the right ground for a walled compound and gives the wall something to frame. */
  { bearing: 170, dist: 6520, lift: 0, stand: 1284, eyeLift: 460 }, /* STUDY — the hall and its gardens */
  { bearing: 105, dist: 5200, lift: 150, stand: 855, eyeLift: 182 }, /* REVIEW — the shrine */
  { bearing: 74, dist: 4600, lift: 0 },   /* READING — the repository under the wood      */
  { bearing: 143, dist: 5600, lift: 0 },   /* DRILLS  — the tower district, across the water */
  { bearing: -101, dist: 5000, lift: 260 }, /* JLPT    — the stair climbing the ridge       */
  { bearing: -164, dist: 4800, lift: 180 }, /* RECORDS — the pagoda on the hill behind      */
].map((d) => ({ ...d, place: destPlace(d.bearing, d.dist, d.lift) }));

/* ---- 鳥居 — the gate standing in the water ----
   REVIEW's place. Myōjin style, which means the top beam (kasagi) sweeps upward at both ends —
   that single detail is what separates a torii from two posts and a lintel, and it is the first
   thing to get right. Everything is proportioned off the overall height so the whole gate can
   be resized with one number.

   Scale is set against the TREES, not against Fuji: the mountain is heavily compressed (3,500
   units for 3,776 metres) while a cedar is near enough life-size, so a gate sized off Fuji
   would come out the size of a fence post. At 620 it stands about two-thirds the height of the
   cedars on the shore behind it, which is roughly Itsukushima's proportion. */
function beamSeg(len, h, d, x, y, rz) {
  const g = new THREE.BoxGeometry(len, h, d);
  g.rotateZ(rz);
  g.translate(x, y, 0);
  return g;
}
function toriiGeo(H) {
  const parts = [];
  const V = 0xbf3b28, V_D = 0xa63020, V_L = 0xcf4a33, STONE = 0x6f6a63;
  const span = H * 0.42, lean = H * 0.024;
  [-1, 1].forEach((sx) => {
    /* tapered and leaning in at the top. Parallel pillars read as goalposts. */
    const ph = H * 0.80;
    const g = new THREE.CylinderGeometry(H * 0.037, H * 0.047, ph, 12);
    g.translate(0, ph / 2, 0);
    g.rotateZ(-sx * Math.atan(lean / ph));
    g.translate(sx * span, 0, 0);
    parts.push({ geo: g, color: V });
    /* the footing where the pillar enters the water */
    const b = new THREE.CylinderGeometry(H * 0.072, H * 0.084, H * 0.06, 12);
    b.translate(sx * span, H * 0.028, 0);
    parts.push({ geo: b, color: STONE });
  });
  /* nuki — the tie beam driven through the pillars, protruding either side */
  parts.push({ geo: beamSeg(span * 2 + H * 0.20, H * 0.055, H * 0.078, 0, H * 0.60, 0), color: V_D });
  /* gakuzuka — the central strut between the tie and the lintel */
  parts.push({ geo: beamSeg(H * 0.05, H * 0.19, H * 0.05, 0, H * 0.705, 0), color: V_D });
  /* shimaki — the straight beam carrying the curved one */
  parts.push({ geo: beamSeg(span * 2 + H * 0.30, H * 0.048, H * 0.095, 0, H * 0.818, 0), color: V });
  /* kasagi — the sweep, as five straight segments along a shallow parabola. A swept surface
     would cost far more and at this size the facets read as the traditional stepped ends. */
  const N = 5, half = span + H * 0.21, rise = H * 0.055;
  for (let i = 0; i < N; i++) {
    const t0 = -1 + (i / N) * 2, t1 = -1 + ((i + 1) / N) * 2;
    const x0 = t0 * half, y0 = t0 * t0 * rise;
    const x1 = t1 * half, y1 = t1 * t1 * rise;
    parts.push({
      geo: beamSeg(Math.hypot(x1 - x0, y1 - y0) * 1.08, H * 0.058, H * 0.115,
        (x0 + x1) / 2, H * 0.878 + (y0 + y1) / 2, Math.atan2(y1 - y0, x1 - x0)),
      color: V_L,
    });
  }
  return mergeParts(parts);
}
let TORII = null;
{
  /* SCENERY, NOT A DESTINATION. A gate standing in water is the picture you want from the
     menu, but it can never be the place: there is nothing behind it to walk toward, which is
     the whole point of a gate. REVIEW's shrine is on land, below. */
  const H = 430;
  const at2 = destPlace(17, 3700, 0);
  const gate = new THREE.Mesh(toriiGeo(H), new THREE.MeshToonMaterial({
    vertexColors: true, gradientMap: RAMP, flatShading: true,
  }));
  /* stands ON the water, not at its own place marker — the marker is where the camera looks,
     which is up at the lintel, and a gate whose feet are 240 units into the air is a gate
     hanging in the sky */
  gate.position.set(at2.x, LAKE_Y - 26, at2.z);
  gate.lookAt(HOME_EYE.x, LAKE_Y, HOME_EYE.z);
  gate.name = 'torii-near';
  backScene.add(gate);
  addOutline(gate, 3.5);
  blockAdd(gate.position.x, gate.position.z, 520, 700);
  TORII = { gate, H };
  /* a second, smaller one further out — it turns a single object into the start of an approach,
     and it is the first gate of the tunnel level three will travel down */
  const far = new THREE.Mesh(toriiGeo(H * 0.66), gate.material);
  const step = new THREE.Vector3().copy(at2).sub(HOME_EYE).setY(0).normalize();
  far.position.copy(gate.position).addScaledVector(step, 900);
  far.position.y = LAKE_Y - 18;
  far.rotation.copy(gate.rotation);
  backScene.add(far);
  addOutline(far, 3.5);
}


/* ================= LEVEL TWO AS WORLD GEOMETRY: 絵馬 =================
   REVIEW's four options are votive tablets on a rack in the water in front of the gate, rather
   than DOM panels hung in front of the scene. The arrival made the case: vermillion panels
   against a vermillion torii merged into it AND drew straight over its posts, because the CSS3D
   layer is architecturally in front of the world and always will be. Objects can be occluded,
   take the same light, and cast into the same water.

   What it costs is the thing DOM was giving away free: hit-testing, hover, focus and keyboard.
   Picking is a raycast now, and a parallel layer of transparent buttons carries focus and Enter
   so the section is still reachable without a mouse — see worldPickEl below. */

/* the tablet: a rectangle with a gabled top, extruded so it has an edge to outline */
function emaGeo(w, h, gable, th) {
  const sh = new THREE.Shape();
  sh.moveTo(-w / 2, -h / 2);
  sh.lineTo(w / 2, -h / 2);
  sh.lineTo(w / 2, h / 2 - gable);
  sh.lineTo(0, h / 2);
  sh.lineTo(-w / 2, h / 2 - gable);
  sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth: th, bevelEnabled: false });
  g.translate(0, 0, -th / 2);
  return g;
}
/* the writing, drawn to a canvas. System fonts throughout this file, so there is no webfont to
   wait on — the one thing that would otherwise have to be redrawn on `document.fonts.ready`. */
/* ---- the tablet face ----
   THE LABEL IS THE CHOICE AND THE COUNT IS A FOOTNOTE, which is what a menu item actually is:
   you pick "weak cards", you do not pick "7". Five other arrangements were built and compared in
   place (the figure leading, a reversed banner, a rule between label and figure, the figure
   struck into a block, and the busy one this replaced) — this is the one that reads as something
   to choose rather than as something to read off.

   English leads and the Japanese is a gloss beneath it. Kanji carry far more detail per glyph
   than Latin capitals do, so at the size this renders — about seventy pixels of screen — 今日の分
   is a grey texture while DUE TODAY is a word. Making the Japanese bigger was tried four times
   and never worked, because size was not what was wrong. It stays as something to grow into,
   which is the call the main menu's description line already makes.

   THE DELIBERATE CHEAT: a real ema is written small, in a hand, edge to edge. This is signage —
   the type is far larger than the object would carry, because the camera stops far enough back
   to keep the shrine and the valley in frame. Games oversize signage for the same reason and
   nobody notices. */

/* a label breaks at its space, because two short lines beat one condensed line at every size */
function emaLines(en) {
  const words = en.split(' ');
  const half = Math.ceil(words.length / 2);
  return words.length > 1 ? [words.slice(0, half).join(' '), words.slice(half).join(' ')] : words;
}
/* THE ROW SHARES ITS SIZES. Sized to fill their own tablets, ALL came out at 112 next to WEAK
   CARDS at 84 and `341 CARDS` was condensed to two-thirds the letter width of `7 CARDS` beside
   it — four labels of the same kind read as four different kinds of thing. The wall asks for the
   largest size every one of its tiles can carry, for the label and for the count separately.

   And it is MEASURED, not assumed: `measureText` scales linearly with the font size for a given
   string, so one measurement gives the size that exactly fills the width. These come from a
   table that will grow, where LISTENING is nine characters and ALL is three. */
const EMA_CAP = 96, EMA_META_CAP = 62;
const _measure = document.createElement('canvas').getContext('2d');
function emaFit(txt, maxW, cap, sp) {
  _measure.letterSpacing = sp;
  _measure.font = `900 ${cap}px "Arial Black", Arial, sans-serif`;
  const w = _measure.measureText(txt).width;
  return w > maxW ? Math.floor(cap * maxW / w) : cap;
}
function emaEnSize(en, maxW) {
  return Math.min(...emaLines(en).map((t) => emaFit(t, maxW, EMA_CAP, '2px')));
}
function emaMetaSize(meta, maxW) { return emaFit(meta.toUpperCase(), maxW, EMA_META_CAP, '0px'); }

function emaTexture(jp, en, meta, accent, size, msize) {
  const W = 384, H = 460, GAB = 96;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.beginPath();
  g.moveTo(0, H); g.lineTo(W, H); g.lineTo(W, GAB); g.lineTo(W / 2, 6); g.lineTo(0, GAB);
  g.closePath();
  /* brighter paper. At #dccaa6 the cream sat in the same mid-tone as the figure printed on it,
     so the two had barely a stop between them and the face read as one warm blur. */
  g.fillStyle = '#f0e5cb'; g.fill();
  /* grain, faint and vertical — enough that the face is not a flat swatch */
  g.save(); g.clip();
  for (let i = 0; i < 26; i++) {
    g.strokeStyle = `rgba(120,94,58,${(0.03 + Math.random() * 0.05).toFixed(3)})`;
    g.lineWidth = 1 + Math.random() * 2.5;
    const x = Math.random() * W;
    g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + 14, H * 0.4, x - 12, H * 0.7, x + 4, H); g.stroke();
  }
  g.restore();
  g.strokeStyle = 'rgba(74,54,34,0.6)'; g.lineWidth = 8; g.stroke();
  g.textAlign = 'center';

  const lines = emaLines(en);
  g.fillStyle = '#2b1c10';
  g.letterSpacing = '2px';
  g.font = `900 ${size}px "Arial Black", Arial, sans-serif`;
  /* a one-line label is centred on where a two-line one sits, so ALL and DUE TODAY are the same
     object at different lengths rather than two different layouts */
  const y0 = 104 + size * (lines.length > 1 ? 0.78 : 1.29);
  lines.forEach((t, k) => g.fillText(t, W / 2, y0 + k * size * 1.02, W - 40));
  g.letterSpacing = '0px';
  g.fillStyle = 'rgba(43,28,16,0.6)';
  g.font = '700 34px "Yu Gothic UI", "Hiragino Kaku Gothic ProN", sans-serif';
  g.fillText(jp, W / 2, 310, W - 56);
  /* THE DARK ACCENT, NOT THE BRIGHT ONE, on paper. Section colours are chosen to sit on
     near-black, where the light end of the ramp is the readable one; on cream it is the light end
     that disappears. REVIEW's #e34a33 on paper is 2.4:1, its #b23320 is 4.4:1. */
  g.fillStyle = accent;
  g.fillRect(W * 0.16, 344, W * 0.68, 6);
  /* the count is anchored by the middle of its own block rather than by a baseline, so a row that
     has had to shrink to fit its longest member stays where it was composed */
  g.font = `900 ${msize}px "Arial Black", Arial, sans-serif`;
  g.fillText(meta.toUpperCase(), W / 2, 396 + msize * 0.36, W - 40);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  /* the tablet is 384 texels wide and lands on about seventy pixels, so it is read four or five
     mip levels down and at a slant. Anisotropy is the whole difference between legible and
     smeared here, and 4 was leaving most of the hardware's capability unused. */
  t.anisotropy = backRenderer.capabilities.getMaxAnisotropy();
  return t;
}

/* ---- 扁額 — the name-board ----
   The section's name as a thing hanging in the shrine rather than as type floating over it. A
   hengaku is black lacquer with the characters raised in gold, which is not a stylistic choice
   so much as the only way a name-board reads at dusk against vermilion: the ground goes darker
   than anything behind it and the letters carry their own light.

   It hangs in the gate, on the gakuzuka. Two other placements were built and looked at in the
   place — over the tablets on the ema wall, and under the water pavilion's near eave — and both
   were readable; the gate wins because it is the only one of the three that says the name
   belongs to the WHOLE PRECINCT rather than to the thing it is bolted to. It is also the one
   spot a real shrine would have used, which is what the gakuzuka is for.
*/
function hengakuTexture(jp, en, w, h) {
  const W = 512, H = Math.round(512 * h / w);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#17120c'; g.fillRect(0, 0, W, H);
  /* lacquer is not flat — a few long soft streaks stop it reading as a hole cut in the scene */
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  for (let i = 0; i < 16; i++) {
    g.strokeStyle = `rgba(232,215,170,${(0.012 + Math.random() * 0.022).toFixed(3)})`;
    g.lineWidth = 2 + Math.random() * 9;
    const y = Math.random() * H;
    g.beginPath(); g.moveTo(-10, y); g.bezierCurveTo(W * 0.4, y + 8, W * 0.7, y - 9, W + 10, y + 3); g.stroke();
  }
  g.restore();
  /* a gold fillet inset from the edge, which is what makes a board look framed rather than cut */
  g.strokeStyle = '#8a6f33'; g.lineWidth = 5;
  g.strokeRect(13, 13, W - 26, H - 26);
  g.strokeStyle = 'rgba(216,178,92,0.30)'; g.lineWidth = 2;
  g.strokeRect(24, 24, W - 48, H - 48);

  const wide = w / h > 2.1;
  g.textBaseline = 'alphabetic';
  const gold = '#dcb75f';
  if (wide) {
    /* side by side: the kanji carries it and the latin sits after it on the same line */
    g.textAlign = 'left';
    const size = Math.round(H * 0.56);
    g.font = `700 ${size}px "Yu Mincho", "Hiragino Mincho ProN", serif`;
    const jw = g.measureText(jp).width;
    const total = jw + 26 + en.length * (size * 0.30);
    let x = (W - total) / 2;
    g.fillStyle = 'rgba(0,0,0,0.55)';
    g.fillText(jp, x + 4, H * 0.72 + 4);
    g.fillStyle = gold;
    g.fillText(jp, x, H * 0.72);
    x += jw + 26;
    g.letterSpacing = '7px';
    g.font = `700 ${Math.round(size * 0.26)}px "Arial Black", Arial, sans-serif`;
    g.fillStyle = 'rgba(232,223,200,0.82)';
    g.fillText(en, x, H * 0.66);
    g.letterSpacing = '0px';
  } else {
    g.textAlign = 'center';
    const size = Math.round(H * 0.44);
    g.font = `700 ${size}px "Yu Mincho", "Hiragino Mincho ProN", serif`;
    g.fillStyle = 'rgba(0,0,0,0.55)';
    g.fillText(jp, W / 2 + 4, H * 0.60 + 4, W - 90);
    g.fillStyle = gold;
    g.fillText(jp, W / 2, H * 0.60, W - 90);
    g.letterSpacing = '8px';
    g.font = `700 ${Math.round(H * 0.11)}px "Arial Black", Arial, sans-serif`;
    g.fillStyle = 'rgba(232,223,200,0.8)';
    g.fillText(en, W / 2, H * 0.82, W - 100);
    g.letterSpacing = '0px';
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = backRenderer.capabilities.getMaxAnisotropy();
  return t;
}
/* the board itself: a lacquered panel in a frame, with a cap over it. Returned as a group so the
   caller can hang it, mount it or stand it on something. */
function hengaku(jp, en, w, h) {
  const grp = new THREE.Group();
  const TH = w * 0.045;
  const parts = [];
  parts.push({ geo: beamSeg(w, h, TH, 0, 0, 0), color: 0x241d15 });
  /* stiles and rails, standing proud of the panel */
  const r = Math.max(w, h) * 0.045;
  parts.push({ geo: beamSeg(w + r * 2, r, TH * 1.7, 0, h / 2 + r / 2, 0), color: 0x3a2c1c });
  parts.push({ geo: beamSeg(w + r * 2, r, TH * 1.7, 0, -h / 2 - r / 2, 0), color: 0x3a2c1c });
  [-1, 1].forEach((sx) => {
    parts.push({ geo: beamSeg(r, h + r * 2, TH * 1.7, sx * (w / 2 + r / 2), 0, 0), color: 0x3a2c1c });
  });
  const frame = new THREE.Mesh(mergeParts(parts), new THREE.MeshToonMaterial({
    vertexColors: true, gradientMap: RAMP, flatShading: true,
  }));
  grp.add(frame);
  const tex = hengakuTexture(jp, en, w, h);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshToonMaterial({
    map: tex, emissiveMap: tex, emissive: new THREE.Color(0xd8cfb8), gradientMap: RAMP,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
  }));
  face.position.z = TH / 2 + 1.6;
  grp.add(face);
  const o = new THREE.Mesh(outlineGeom(frame.geometry), outlineMaterial(3.2));
  o.frustumCulled = false;
  grp.add(o);
  return grp;
}

/* 神額 — the placard on a gate. Landscape rather than portrait, so it is a different object
   from the ema and reads as one: the deck's name across it, its count and how far through it you
   are down the right, and the row's number struck into the corner. Same rules as the tablet —
   English leads, the Japanese is a gloss, the figure shares no size with anything because there
   is only one of it on each board. */
/* DRAWN INTO A CANVAS THE SIGN ALREADY OWNS. Building a fresh CanvasTexture per queue meant
   assigning a new `map` and a new `emissiveMap` to a material that had been compiled without
   either, which forces a shader rebuild — a visible hitch, and the first frame after it is the
   sign appearing out of nowhere. Redrawing the same canvas and setting `texture.needsUpdate`
   costs one upload and nothing else. */
function drawSign(c, jp, en, count, unit, pct, accent) {
  const W = c.width, H = c.height;
  const g = c.getContext('2d');
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#f0e5cb';
  g.fillRect(0, 0, W, H);
  g.save();
  g.beginPath(); g.rect(0, 0, W, H); g.clip();
  for (let i = 0; i < 22; i++) {
    g.strokeStyle = `rgba(120,94,58,${(0.03 + Math.random() * 0.05).toFixed(3)})`;
    g.lineWidth = 1 + Math.random() * 2.5;
    const y = Math.random() * H;
    g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(W * 0.4, y + 10, W * 0.7, y - 12, W, y + 4); g.stroke();
  }
  g.restore();
  g.strokeStyle = 'rgba(74,54,34,0.55)'; g.lineWidth = 10; g.strokeRect(0, 0, W, H);

  const INK = '#2b1c10';
  g.textAlign = 'left';
  g.fillStyle = INK;
  g.letterSpacing = '2px';
  const size = emaFit(en, W - 170, 78, '2px');
  g.font = `900 ${size}px "Arial Black", Arial, sans-serif`;
  g.fillText(en, 28, 124, W - 170);
  g.letterSpacing = '0px';
  g.fillStyle = 'rgba(43,28,16,0.6)';
  g.font = '700 34px "Yu Gothic UI", "Hiragino Kaku Gothic ProN", sans-serif';
  g.fillText(jp, 30, 172, W - 180);
  /* the rule and the count, the same two moves the tablet makes */
  g.fillStyle = accent;
  g.fillRect(28, 204, W * 0.52, 6);
  g.font = '900 56px "Arial Black", Arial, sans-serif';
  g.fillText(`${count} ${unit}`.toUpperCase(), 28, 274, W * 0.54);
  /* how far through it you are: five segments, filled */
  const segs = Math.round(pct / 20);
  for (let i = 0; i < 5; i++) {
    g.fillStyle = i < segs ? accent : 'rgba(43,28,16,0.16)';
    g.fillRect(W - 44 - i * 34, 246, 26, 30);
  }
  g.textAlign = 'right';
  g.fillStyle = 'rgba(43,28,16,0.5)';
  g.font = '700 30px "Yu Gothic UI", sans-serif';
  g.fillText(pct === 100 ? 'DONE' : (pct === 0 ? '\u2014' : pct + '%'), W - 36, 200);
}
function signCanvas() {
  const c = document.createElement('canvas'); c.width = 520; c.height = 316;
  return c;
}

const backTab = document.getElementById('backTab');
backTab.querySelector('button').addEventListener('click', () => goBack());

/* the transparent twin that carries focus and Enter. Pointer events stay off so the mouse goes
   to the raycast, but Tab still reaches it and a screen reader still reads it. */
const worldPickLayer = document.createElement('div');
worldPickLayer.id = 'worldPicks';
document.body.appendChild(worldPickLayer);
function worldPickEl(label, onPick) {
  const b = document.createElement('button');
  b.className = 'world-pick';
  b.type = 'button';
  b.textContent = label;
  b.addEventListener('click', onPick);
  worldPickLayer.appendChild(b);
  return b;
}

/* things in the world that answer a click without being a menu item at all */
const AMBIENT = [];
const WORLD_L2 = {};
/* a section whose level three is a walk registers it here: the placards, how to letter them, and
   where the camera stands to read each one */
const WORLD_L3 = {};
/* the name-board, per section. The safe-zone rule that used to apply to a DOM title still applies
   to a board hanging in a gate — it is just no longer something the browser can measure for you,
   so the board has to be reachable from outside to be asserted at all. */
const WORLD_TITLE = {};
/* LANDMARKS WHOSE PLACE IN THE FRAME IS A DESIGN QUESTION. Whether a tree clears a roof is not
   decided by how far apart they are on the ground — it is decided by the angle from the eye, and
   the only way to settle that from a screenshot is to look, guess, move it and look again. These
   are registered so `NAV.rectOf` can project them instead: one round trip, and the answer is a
   number rather than an impression. */
const MARKS = {};
/* THE APPROACH'S OWN COORDINATES, PROJECTED. Everything in a precinct is placed in (f, sd) and
   judged in screen pixels, and until now the only bridge between the two was: move it, rebuild,
   look, guess again. Three placements went that way. A section registers its `at3` here and a
   whole grid of candidates can be evaluated in one page load. */
const PROBE = {};
const WORLD_SWAY = [];
/* THE RACK IS GONE. It was 974 units wide against a gate 781 wide and cedars 800 tall — a
   fifteen-metre timber structure standing in front of the landmark and out-massing it, which
   inverts the hierarchy: the furniture cannot be bigger than the thing it belongs to. Hanging
   the tablets from the gate's own tie beam removes the competing structure outright and makes
   the threshold part of the architecture rather than an object parked in front of it.

   And they are PERMANENT. Fading them in on arrival and out on leaving was the same mistake the
   scenery made before the single-landscape rebuild — nothing in this world appears or vanishes,
   you only ever get closer to it. From the menu they are a detail on the shrine; the fly-in is
   the only animation there needs to be. */
/* 絵馬掛所 — the wall the tablets actually hang on.
   The gate is a landmark and its opening is a void you pass through; hanging the interface in
   it fought what the object is for, which is why it read as wrong at any size. The wall is the
   correct object and it solves more than the framing: a real one is a CROWD of hundreds of
   tablets, so the blanks are not padding, they are accuracy — and four live ones standing out
   of a crowd read as CHOSEN rather than as a row of four rectangles, which is the failure this
   design has fallen into at every previous attempt. */
/* W and HH are ARGUMENTS now, and the caller states the ratio it wants. Hard-coded here they
   drifted upward every time the tablets needed to be more readable, until the wall was 620 wide
   against a 590-wide gate — the same size as the landmark, which is exactly what it must never
   be. A rack of votive tablets is a piece of furniture; the gate is a building. */
function buildEmaWall(sec, place, faceTowards, W, HH) {
  const tiles = SUBTILES[sec];
  const accent = SECTION_ACCENT[sec][1];
  const POST = W * 0.05;
  const grp = new THREE.Group();
  grp.position.copy(place);
  grp.lookAt(faceTowards.x, place.y, faceTowards.z);
  backScene.add(grp);

  /* the structure: two posts, a rail and a shallow roof — small, and read at a glance */
  const frame = [];
  [-1, 1].forEach((sx) => {
    const g = new THREE.CylinderGeometry(POST * 0.42, POST * 0.5, HH + HH * 0.2, 8);
    g.translate(sx * W / 2, (HH + HH * 0.2) / 2, 0);
    frame.push({ geo: g, color: 0x4a3a2b });
  });
  frame.push({ geo: beamSeg(W + W * 0.11, HH * 0.067, HH * 0.1, 0, HH + HH * 0.13, 0), color: 0x54422f });
  frame.push({ geo: beamSeg(W + W * 0.05, HH * 0.043, HH * 0.073, 0, HH - HH * 0.027, 0), color: 0x46372a });
  /* THE BOARD THE CROWD HANGS ON. Without it the blanks hung in mid-air behind the posts with
     nothing behind them, which reads as geometry poking through rather than as tablets on a
     wall — and a real ema wall is boarded anyway. */
  /* and a shade lighter than it was: the board faces away from the sun at this bearing, and at
     0x59493a it came out near-black, which is not a surface a weathered tablet reads against */
  frame.push({ geo: beamSeg(W * 0.97, HH * 0.86, HH * 0.05, 0, HH * 0.46, 0), color: 0x51402f });
  /* THE RAILS THE CROWD HANGS FROM. Without them the blanks are rectangles lying flat on a
     board, and a board covered in close-packed tilted rectangles is crazy paving — which is what
     it kept reading as, however the tone was adjusted. One thin bar above each row turns the
     same rectangles into things that are hanging, and that reading does not depend on being able
     to make out an individual tablet. */
  for (let r = 0; r < 3; r++) {
    const g = new THREE.BoxGeometry(W * 0.93, HH * 0.024, HH * 0.03);
    g.translate(0, HH * 0.42 - r * HH * 0.155 + W * 0.055, W * 0.05 - r * W * 0.008 + 2);
    frame.push({ geo: g, color: 0x453828 });
  }
  /* and a ridge over the join, because two roof slopes meeting at an angle leave a seam */
  frame.push({ geo: beamSeg(W * 0.62, HH * 0.07, W * 0.21, 0, HH + HH * 0.3, 0), color: 0x332c25 });
  [-1, 1].forEach((sx) => {
    const g = new THREE.BoxGeometry(W / 2 + W * 0.1, HH * 0.037, W * 0.19);
    g.rotateZ(-sx * 0.20);
    g.translate(sx * (W / 4 + W * 0.02), HH + HH * 0.26, 0);
    frame.push({ geo: g, color: 0x3f3428 });
  });
  /* 基壇 — the stone footing. The wall stands at the edge of a 360-wide paved approach, and the
     paving is 26 units proud of the ground it is laid on, so a post planted at ground level
     comes up THROUGH the stone. Every attempt to solve that by moving the wall further out ran
     into the frame's left edge instead, because at this standoff there is only about thirty
     degrees between the gate and the edge of the picture. A footing solves it where it actually
     happens: the wall sits on something that is MEANT to overlap the paving, which is what real
     ema-kake stand on anyway.

     It has to go in before the merge. Pushed after `mergeParts(frame)` it is a line of code that
     runs, allocates a box, and has no effect whatsoever — which is precisely what happened, and
     is worth remembering: a list you are appending to is only a list until somebody consumes it,
     and after that an append is silence rather than an error.

     And the wall stands ON it rather than in it. Wrapped around the wall's lower half — which is
     what a block centred on the base actually is — it rose to within a few units of the bottom
     course of tablets and swallowed it. A plinth goes UNDERNEATH: the group is lifted clear of
     the ground by `WALL_LIFT` and the stone fills the gap that opens up beneath, so it can be as
     deep as the paving needs without taking a single unit away from the board. */
  frame.push({ geo: beamSeg(W * 1.2, HH * 0.72, W * 0.42, 0, -HH * 0.33, 0), color: 0x6b6459 });
  frame.push({ geo: beamSeg(W * 1.27, HH * 0.06, W * 0.47, 0, -HH * 0.026, 0), color: 0x7a7368 });
  const frameMesh = new THREE.Mesh(mergeParts(frame), new THREE.MeshToonMaterial({
    vertexColors: true, gradientMap: RAMP, flatShading: true,
  }));
  grp.add(frameMesh);
  addOutline(frameMesh, 3.2);
  /* piles, so it stands in the shallows rather than floating on them */
  const piles = [];
  for (let i = -2; i <= 2; i++) {
    const g = new THREE.CylinderGeometry(W * 0.021, W * 0.024, HH, 7);
    g.translate(i * W / 4.4, -HH / 2, hash01(i + 5, 3) * 30 - 15);
    piles.push({ geo: g, color: 0x3b3026 });
  }
  const pileMesh = new THREE.Mesh(mergeParts(piles), new THREE.MeshToonMaterial({
    vertexColors: true, emissive: 0x241d16, gradientMap: RAMP, flatShading: true,
  }));
  grp.add(pileMesh);

  /* the crowd: small, weathered, unreadable at any distance, hung at every angle. Instanced,
     so several dozen cost one draw call. */
  /* A CROWD HAS TO SHOW ITS EDGES. Packed 24 to a row at 54 wide they overlapped into a
     continuous tan slab and read as a solid board — the opposite of the point. Fewer per row
     than the width allows, a wide spread of size and tilt, and a real range of weathering, so
     every tablet has a dark line either side of it and the four live ones sit against texture
     rather than against a panel. */
  /* AND IT HANGS BELOW THE LIVE ROW, NOT BEHIND IT. Three rows starting at 0.76 HH put rows one
     and two exactly where the four live tablets are, and the live ones are nearer the viewer, so
     the crowd was invisible and the wall read as a bare brown slab with four cards on it — the
     board is 162 units tall and only its top third was doing anything. Four rows through the
     lower two-thirds fills it, and the arrangement is then the true one: the four that are yours
     hung at eye level on the rail, the rest crowded underneath. */
  /* AND EACH ONE HAS TO BE READABLE AS A TABLET. Thirteen to a row at 0.075 W is denser than a
     real ema wall and truer to it, but at this distance they overlap into a field of small brown
     lozenges and the eye files the whole thing as rubble. Bigger and fewer keeps the gabled
     silhouette, which is the only thing that says "votive tablet" rather than "stone". */
  /* A ROW HAS TO HOLD ITS ROW. At 0.085 W the blanks stood 23 units tall in a 25-unit pitch and
     the vertical jitter pushed the lower edge of one row through the rail of the next, which
     reads as the wall being over-stuffed rather than as a crowd. Smaller, one more per row, and
     the jitter cut to what a hung object actually has. */
  const bw = W * 0.072;
  const PER = 8, ROWS = 3;
  const blanks = new THREE.InstancedMesh(
    emaGeo(bw, bw * 1.2, bw * 0.25, bw * 0.05),
    /* THE WALL FACES AWAY FROM THE SUN and always will, because it is turned toward the path
       and the path runs away from the light. Everything on it is therefore lit by fill alone, so
       the emissive floor is doing most of the work — at 0x3d3428 the crowd came out as dark
       even blocks and read as coursed masonry rather than as a hundred wooden tablets. */
    new THREE.MeshToonMaterial({ vertexColors: true, emissive: 0x6d5f49, gradientMap: RAMP, flatShading: true }),
    PER * ROWS);
  const mx = new THREE.Matrix4(), qt = new THREE.Quaternion(), sc = new THREE.Vector3();
  const zc = new THREE.Vector3(0, 0, 1), col = new THREE.Color();
  for (let i = 0; i < blanks.count; i++) {
    const row = Math.floor(i / PER), k = i % PER;

       surface this far from the key light it dominates, and it lifts the ink exactly as much as

/* ---- the woods ----
   Three species, each a merged multi-part model rather than a repeated primitive. A repeated
   cone is a pattern, and the eye reads a pattern as wallpaper however many of them you put
   down — which is exactly what the old wood did. Each species is one InstancedMesh plus one
   outline twin sharing its instance matrices, so the whole forest is six draw calls. */

/* 杉 — cedar. A bare trunk carrying three stacked skirts: the tall dark verticals that give
   the valley its rhythm. */
function cedarGeo() {
  const parts = [];
  const trunk = new THREE.CylinderGeometry(5, 13, 160, 6);
  trunk.translate(0, 80, 0);
  parts.push({ geo: trunk, color: 0x46362b });
  [[140, 58, 175, 0x2c4634], [258, 44, 148, 0x243c2c], [360, 27, 118, 0x35543b]]
    .forEach(([y, r, h, c]) => {
      const g = new THREE.ConeGeometry(r, h, 7);
      g.translate(0, y + h / 2, 0);
      parts.push({ geo: g, color: c });
    });
  return mergeParts(parts);
}

/* 欅 — broadleaf. A short trunk under a bundle of canopy masses, which is what stops a round
   tree reading as a lollipop: the silhouette has to have more than one bump in it. */
function broadleafGeo() {
  const parts = [];
  const trunk = new THREE.CylinderGeometry(9, 19, 130, 6);
  trunk.translate(0, 65, 0);
  parts.push({ geo: trunk, color: 0x4a3a2b });

    [8, 252, -12, 44, 0x4b6a2f]]
    .forEach(([x, y, z, r, c]) => {
      const g = new THREE.IcosahedronGeometry(r, 1);
      g.scale(1.16, 0.9, 1.06);
      g.translate(x, y, z);
      parts.push({ geo: g, color: c });
    });

}

/* 桜 — sakura. Leaning trunk, two branches thrown out sideways, four blossom masses. Kept
   for the near ground where a tree is big enough to be read as a tree and not as a colour. */
function sakuraGeo() {
  const parts = [];
  const trunk = new THREE.CylinderGeometry(8, 17, 150, 7);
  trunk.translate(0, 75, 0);
  parts.push({ geo: trunk, color: 0x3d2e29 });
  /* BUILD A BRANCH FROM ITS BASE, NOT FROM ITS MIDDLE. Placing a rotated cylinder by its centre
     means its inner end lands wherever the trigonometry puts it — for the first pass, seven
     units clear of the trunk, so the branches hung in the air beside it. Translating the
     cylinder so its base is at the origin BEFORE rotating means the base stays put whatever the
     angle, and can then be dropped straight onto the trunk axis where it is guaranteed to be
     buried inside the wood. */
  const tips = [];
  [[0.66, 118, 128], [-0.58, 132, 116], [0.30, 150, 92]].forEach(([rz, atY, len]) => {
    const g = new THREE.CylinderGeometry(4, 9, len, 5);
    g.translate(0, len / 2, 0);
    g.rotateZ(rz);
    g.translate(0, atY, 0);
    parts.push({ geo: g, color: 0x3d2e29 });
    tips.push([-Math.sin(rz) * len, atY + Math.cos(rz) * len]);
  });

     coordinate that has to be re-guessed every time a branch angle changes */
  const blossom = [[tips[0][0], tips[0][1], 18, 58, 0xe5a2b5], [tips[1][0], tips[1][1], -20, 54, 0xf3c3cf],
    [tips[2][0], tips[2][1], 24, 48, 0xeeb3c3], [6, 268, -14, 46, 0xe9adbe]];
  blossom.forEach(([x, y, z, r, c]) => {
    const g = new THREE.IcosahedronGeometry(r, 1);
    g.scale(1.2, 0.82, 1.1);
    g.translate(x, y, z);
    parts.push({ geo: g, color: c });

function standSpot(seed, near, far, spread, off, lo, hi) {

    if (blocked(x, z)) return null;
    const k = lo + c * (hi - lo);
    return {
      pos: new THREE.Vector3(x, groundAt(x, z) - 14, z),
      rot: hash01(i, seed + 331) * 6.28,
      scale: new THREE.Vector3(k, k * (0.82 + hash01(i, seed + 617) * 0.42), k),

{

    if (!m) return;
    /* the sky dome, the valley fog banks and the sunrise sprites are ART: they are already the
       colour they should end up, so tone mapping would only wash the dawn gradient out */
    if (m.isMeshBasicMaterial || m.isSpriteMaterial) { m.toneMapped = false; return; }

       and letting them cast would put every silhouette into the shadow map twice */

/* ---- the reflection pass ----
   Mirror the camera about the water plane, clip away everything below it, render backScene into
   the target. The texture matrix maps a world position into that render's clip space, so the
   water shader can look itself up in screen space. */
let reflectTick = 0;
const REFLECT_CLIP = [new THREE.Plane(new THREE.Vector3(0, 1, 0), -LAKE_Y + 4)];
const _rfwd = new THREE.Vector3(), _rtgt = new THREE.Vector3();
const BIAS = new THREE.Matrix4().set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
/* EVERY REFLECTIVE SURFACE, IN THE MIRRORED CAMERA'S OWN SPACE — and that qualifier is the
   whole of it.
   The lake and the garden pond share one material and one texture matrix, so the pass has to
   cover both or the pond samples outside what was rendered.
   The first version projected them through the MAIN camera, on the reasoning that the shader
   looks the reflection up at the water pixel's screen position, so the water's screen rectangle
   is the region that gets sampled. That reasoning is right about the sampling and wrong about
   the space: `vProj = texMatrix * worldPos`, and texMatrix is built from the MIRRORED camera.
   The mirrored camera sits below the water looking up, so a point on the plane nearer the eye
   appears BELOW centre in the main view and ABOVE centre in the mirrored one — the image is
   flipped about the centre, not about the horizon. Rendering the bottom band of the mirror when
   the water occupies the top band of it produced a target that was measurably, entirely black:
   mean pixel value 0 over 640x384, and a lake that went navy.
   Measured in the right camera it needs no sign-juggling and no reasoning about flips at all,
   which is the point of computing it there. */
const _rbox = new THREE.Box3(), _rv = new THREE.Vector3();
const REFLECT_SURFACES = [];
function reflectRect(cam) {
  if (!REFLECT_SURFACES.length) {
    backScene.traverse((o) => {
      if (o.isMesh && o.material && o.material.uniforms && o.material.uniforms.tReflect) {
        REFLECT_SURFACES.push(o);
      }
    });
  }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, any = false;
  for (const o of REFLECT_SURFACES) {
    if (!o.visible) continue;
    _rbox.setFromObject(o);
    if (_rbox.isEmpty()) continue;
    for (let i = 0; i < 8; i++) {
      _rv.set(i & 1 ? _rbox.max.x : _rbox.min.x, i & 2 ? _rbox.max.y : _rbox.min.y,
        i & 4 ? _rbox.max.z : _rbox.min.z);
      _rv.project(cam);
      /* a corner BEHIND the eye projects to a mirrored, meaningless point — including it
         silently blows the rectangle out to the whole screen, which is the failure mode where
         this optimisation looks like it is working and is doing nothing */
      if (_rv.z > 1) continue;
      x0 = Math.min(x0, _rv.x); x1 = Math.max(x1, _rv.x);
      y0 = Math.min(y0, _rv.y); y1 = Math.max(y1, _rv.y);
      any = true;
    }
  }
  if (!any) return null;
  /* margin for the ripple: the shader offsets its lookup by the wave and the normal map, so the
     rendered region has to be a little larger than the water itself */
  const M = 0.07;
  x0 = Math.max(-1, x0 - M); x1 = Math.min(1, x1 + M);
  y0 = Math.max(-1, y0 - M); y1 = Math.min(1, y1 + M);
  if (x1 - x0 < 0.05 || y1 - y0 < 0.05) return null;
  return { x0, y0, x1, y1 };
}

function renderReflection() {
  reflectCam.fov = camera.fov; reflectCam.aspect = camera.aspect;
  reflectCam.near = camera.near; reflectCam.far = camera.far;
  reflectCam.position.set(camera.position.x, 2 * LAKE_Y - camera.position.y, camera.position.z);
  _rfwd.set(0, 0, -1).applyQuaternion(camera.quaternion).multiplyScalar(2000).add(camera.position);
  _rtgt.set(_rfwd.x, 2 * LAKE_Y - _rfwd.y, _rfwd.z);
  reflectCam.up.set(0, 1, 0);
  reflectCam.lookAt(_rtgt);
  reflectCam.updateMatrixWorld();
  /* the full frustum first, because the rectangle is measured through it */
  reflectCam.clearViewOffset();
  reflectCam.updateProjectionMatrix();

  /* IS THERE ANY WATER ON SCREEN AT ALL? If not there is nothing to reflect — which is most
     of the level-two and level-three menus, where the camera has flown to a destination. The
     pass was running anyway, rendering two million triangles into a texture nothing would read.
     The old texture stays bound and is simply not sampled. */
  const r = reflectRect(reflectCam);
  if (!r) return false;
  /* AND THE FRUSTUM IS NO LONGER NARROWED TO IT, WHICH IS WHAT STRETCHED THE LAKE.
     The idea was sound: the water looks the reflection up at its own screen position, so every
     texel outside the water's rectangle is rendered and discarded. The arithmetic was not.
     Measured, that rectangle in the mirrored camera runs from NDC x -0.86 to 1.995 and y 0.42
     to 1.83 — the lake extends half a screen-width PAST the edge of the view. Clamping the
     rendered sub-frustum to [-1,1] therefore clipped away part of what the water samples, and
     every pixel beyond the clamp read the texture's clamped edge: a smear, worst on the right
     of the lake where the overrun is largest. That is the stretch.
     Covering the true rectangle instead would mean rendering a frustum half again as wide as
     the screen, which costs more than it saves — and it only ever saved 2% of the triangles and
     15% of the draw calls, because the water fills most of the mirror. So it goes. What stays is
     the part that was worth having: skipping the pass when there is no water, and the far
     vegetation cull, which is where the real 60% came from. */
  reflectCam.clearViewOffset();
  reflectCam.updateProjectionMatrix();

  reflectTexM.copy(BIAS)
    .multiply(reflectCam.projectionMatrix)
    .multiply(reflectCam.matrixWorldInverse);

  lakeWater.visible = false;
  /* PUT BACK WHAT WAS THERE, NOT `true`.
     The generated grass, scrub and stones are all in NO_REFLECT, and restoring them to `true`
     every frame silently overrode anything else that had hidden them — so the environment
     loader's "hide what this replaces" lasted exactly one frame for two thousand instanced
     tufts, and the old world's ground cover went on being drawn, floating, over the new one's
     terrain. A per-frame writer of a shared flag has to be a stack, not an assignment. */
  for (let i = 0; i < NO_REFLECT.length; i++) {
    NO_REFLECT_WAS[i] = NO_REFLECT[i].visible;
    NO_REFLECT[i].visible = false;
  }
  const prevClip = backRenderer.clippingPlanes;
  backRenderer.clippingPlanes = REFLECT_CLIP;
  /* An outline is a width in pixels, and this pass is 768 pixels wide rather than the window —
     leaving the window's size in there draws every line in the reflection two and a half times
     too thin. The pass has to say what it is being measured in. */
  const prevRes = OUTLINE_RES.value.clone();
  OUTLINE_RES.value.set(reflectRT.width, reflectRT.height);
  backRenderer.setRenderTarget(reflectRT);
  backRenderer.clear();
  backRenderer.render(backScene, reflectCam);
  backRenderer.setRenderTarget(null);
  OUTLINE_RES.value.copy(prevRes);
  backRenderer.clippingPlanes = prevClip;
  for (let i = 0; i < NO_REFLECT.length; i++) NO_REFLECT[i].visible = NO_REFLECT_WAS[i];
  lakeWater.visible = true;
  return true;
}

/* ---- the origami crane (orizuru) ---- */
const swan = new THREE.Group();
{
  const gold = new THREE.MeshBasicMaterial({ color: 0xcfa45c, side: THREE.DoubleSide });
  const goldHi = new THREE.MeshBasicMaterial({ color: 0xe8c47c, side: THREE.DoubleSide });
  const goldLo = new THREE.MeshBasicMaterial({ color: 0x8f713a, side: THREE.DoubleSide });
  const beakM = new THREE.MeshBasicMaterial({ color: 0xe34a33, side: THREE.DoubleSide });
  function tri(mat, ax, ay, az, bx, by, bz, cx, cy, cz) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([ax, ay, az, bx, by, bz, cx, cy, cz]), 3));
    return new THREE.Mesh(g, mat);
  }
  /* body: faceted diamond along +z (forward) */
  const body = new THREE.Group();
  body.add(tri(gold,   0, 8, 26,   -12, 0, 0,   0, -7, 8));
  body.add(tri(goldLo, 0, 8, 26,    12, 0, 0,   0, -7, 8));
  body.add(tri(goldLo, 0, 8, 26,   -12, 0, 0,   0, 2, -26));
  body.add(tri(gold,   0, 8, 26,    12, 0, 0,   0, 2, -26));
  swan.add(body);
  /* neck + head: rising forward crease */
  const neck = new THREE.Group();
  neck.add(tri(goldHi, 0, 8, 24,   -3, 10, 30,  0, 34, 46));
  neck.add(tri(gold,   0, 8, 24,    3, 10, 30,  0, 34, 46));
  neck.add(tri(goldHi, 0, 34, 46,  -2, 30, 50,  0, 26, 60));
  neck.add(tri(gold,   0, 34, 46,   2, 30, 50,  0, 26, 60));
  neck.add(tri(beakM,  0, 26, 60,   0, 30, 56,  0, 24, 70));
  swan.add(neck);
  /* tail spike */
  swan.add(tri(goldLo, 0, 6, -24,  -2, 2, -26,  0, 26, -52));
  swan.add(tri(gold,   0, 6, -24,   2, 2, -26,  0, 26, -52));
  /* wings: big folded triangles, pivoted at the spine */
  const wingL = new THREE.Group(), wingR = new THREE.Group();
  wingL.add(tri(goldHi, 0, 6, 14,   -64, 26, -6,  0, 4, -18));
  wingL.add(tri(gold,   0, 6, 14,   -50, 18, -22, 0, 4, -18));
  wingR.add(tri(gold,   0, 6, 14,    64, 26, -6,  0, 4, -18));
  wingR.add(tri(goldLo, 0, 6, 14,    50, 18, -22, 0, 4, -18));
  swan.add(wingL, wingR);
