<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 墨 SUMI — JPLearn menu concept</title>
<style>
  :root {
    --paper: #efe8da;
    --paper-deep: #e3d9c4;
    --ink: #16130f;
    --ink-soft: #2c2620;
    --shu: #c93a2b;
    --shu-deep: #a02818;
    --gold: #b8923a;
    --jp: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "MS PMincho", serif;
    --jp-go: "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
    --lat: "Arial Black", "Segoe UI Black", "Arial", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--paper);
    font-family: var(--jp-go);
    color: var(--ink);
    cursor: default;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .screen { position: fixed; inset: 0; visibility: hidden; }
  body.state-menu #menuScreen { visibility: visible; }
  body.state-sub #subScreen { visibility: visible; }

  /* ---------- paper atmosphere ---------- */
  .grain {
    position: absolute; inset: -10%;
    background:
      radial-gradient(60% 50% at 18% 22%, rgba(184,146,58,0.10), transparent 60%),
      radial-gradient(50% 60% at 84% 78%, rgba(22,19,15,0.08), transparent 60%),
      radial-gradient(40% 40% at 70% 12%, rgba(201,58,43,0.05), transparent 55%);
    animation: grainDrift 26s ease-in-out infinite alternate;
  }
  @keyframes grainDrift {
    from { transform: translate(-1.5%, -1%) scale(1); }
    to   { transform: translate(1.5%, 1.5%) scale(1.04); }
  }

  .enso {
    position: absolute; right: -6vw; top: 50%;
    width: 56vw; height: 56vw;
    transform: translateY(-50%) rotate(-14deg);
    opacity: 0.09;
    pointer-events: none;
  }
  .enso circle {
    fill: none; stroke: var(--ink); stroke-width: 34;
    stroke-linecap: round;
    stroke-dasharray: 1460 1600;
    stroke-dashoffset: 1460;
    animation: ensoDraw 1.6s cubic-bezier(0.5, 0, 0.2, 1) 0.3s forwards;
  }
  @keyframes ensoDraw { to { stroke-dashoffset: 60; } }

  .watermark {
    position: absolute; right: 4vw; top: 50%;
    transform: translateY(-54%);
    font-family: var(--jp); font-weight: 700;
    font-size: 38vw; line-height: 1;
    color: rgba(22, 19, 15, 0.07);
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .watermark.swap { animation: wmark 0.45s cubic-bezier(0.2, 1.2, 0.3, 1); }
  @keyframes wmark {
    0% { opacity: 0; transform: translateY(-54%) scale(1.18) rotate(3deg); }
    100% { opacity: 1; transform: translateY(-54%) scale(1) rotate(0deg); }
  }

  /* splats scattered on the paper */
  .splat { position: absolute; fill: var(--ink); opacity: 0.85; filter: url(#roughEdge); }

  /* ---------- brand + HUD ---------- */
  .brand {
    position: absolute; top: 34px; left: 40px;
    display: flex; gap: 14px; align-items: flex-start;
    z-index: 4;
  }
  .brand-vert {
    writing-mode: vertical-rl;
    font-family: var(--jp); font-weight: 700;
    font-size: 25px; letter-spacing: 0.34em;
    color: var(--ink);
  }
  .brand-seal {
    width: 34px; height: 34px;
    background: var(--shu);
    color: var(--paper);
    font-family: var(--jp); font-size: 19px; font-weight: 700;
    display: grid; place-items: center;
    transform: rotate(-7deg);
    box-shadow: 2px 2px 0 rgba(22,19,15,0.25);
  }
  .brand-lat {
    position: absolute; left: 0; top: calc(100% + 12px);
    font-family: var(--lat); font-size: 11px; letter-spacing: 0.42em;
    color: rgba(22,19,15,0.55);
    white-space: nowrap;
  }

  .hud {
    position: absolute; top: 34px; right: 44px;
    display: flex; gap: 10px; z-index: 4;
  }
  .hud-chip {
    background: var(--ink); color: var(--paper);
    font-family: var(--lat); font-size: 12px; letter-spacing: 0.08em;
    padding: 8px 14px;
    transform: rotate(-1.6deg) skewX(-6deg);
  }
  .hud-chip b { color: #f0c66c; font-size: 14px; }
  .hud-chip.shu { background: var(--shu); transform: rotate(1.4deg) skewX(-6deg); }
  .hud-chip .jp { font-family: var(--jp-go); font-weight: 700; letter-spacing: 0.1em; }

  /* ---------- ink menu ---------- */
  .ink-menu {
    position: absolute; left: 6.5vw; top: 53%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 1.6vh;
    z-index: 3;
  }
  .ink-item {
    --rot: 0deg; --arc: 0px;
    position: relative;
    height: 8.8vh; min-height: 60px;
    padding: 0 5.5vh 0 7vh;
    display: flex; align-items: center;
    transform: translateX(var(--arc)) rotate(var(--rot));
    opacity: 0;
    animation: itemIn 0.5s cubic-bezier(0.18, 1.35, 0.35, 1) forwards;
    animation-delay: calc(0.12s + var(--i) * 0.07s);
    outline-offset: 6px;
  }
  @keyframes itemIn {
    0% { opacity: 0; transform: translateX(calc(var(--arc) - 70px)) rotate(calc(var(--rot) - 5deg)); }
    100% { opacity: 1; transform: translateX(var(--arc)) rotate(var(--rot)); }
  }
  /* once the entry animation ends, drop it so hover/dim opacity+transform apply again */
  .ink-item.entered { animation: none; opacity: 1; }
  .ink-item:focus-visible { outline: 3px solid var(--shu); }

  .shard {
    position: absolute; inset: 0;
    background: var(--ink);
    filter: url(#roughEdge);
    clip-path: polygon(0% 18%, 4% 2%, 97% 0%, 100% 30%, 98% 82%, 94% 100%, 3% 96%, 1% 60%);
    transition: transform 0.22s cubic-bezier(0.2, 1.4, 0.3, 1), background 0.18s;
  }
  .ink-item:nth-child(even) .shard {
    clip-path: polygon(1% 8%, 6% 0%, 95% 4%, 100% 22%, 99% 74%, 96% 98%, 5% 100%, 0% 70%);
  }

  .ink-en {
    position: relative; z-index: 2;
    font-family: var(--lat); font-style: italic;
    font-size: clamp(26px, 4.4vh, 42px);
    letter-spacing: 0.04em;
    color: var(--paper);
    transform: skewX(-8deg);
    white-space: nowrap;
    transition: transform 0.22s cubic-bezier(0.2, 1.4, 0.3, 1), color 0.18s;
  }
  .ink-jp {
    position: absolute; left: -3.2vh; top: 50%; z-index: 3;
    transform: translateY(-50%) rotate(4deg);
    background: var(--paper);
    border: 2px solid var(--ink);
    color: var(--ink);
    font-family: var(--jp); font-weight: 700;
    font-size: clamp(15px, 2.3vh, 21px);
    letter-spacing: 0.22em;
    padding: 0.55vh 0.8vh 0.55vh 1vh;
    white-space: nowrap;
    transition: transform 0.22s cubic-bezier(0.2, 1.4, 0.3, 1), background 0.18s, color 0.18s;
  }
  .ink-stamp {
    position: absolute; right: -1.8vh; top: -2.6vh; z-index: 4;
    width: 6vh; height: 6vh;
    background: var(--shu);
    color: var(--paper);
    font-family: var(--jp); font-weight: 700;
    font-size: 3.4vh;
    display: grid; place-items: center;
    transform: scale(0) rotate(-30deg);
    box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 4px var(--shu);
    pointer-events: none;
  }
  .ink-item.is-active .ink-stamp { animation: stampSlam 0.28s cubic-bezier(0.2, 1.6, 0.35, 1) forwards; }
  @keyframes stampSlam {
    0% { transform: scale(2.1) rotate(14deg); opacity: 0; }
    55% { opacity: 1; }
    100% { transform: scale(1) rotate(-9deg); opacity: 1; }
  }

  .ink-item.is-active { z-index: 5; }
  .ink-item.is-active .shard { transform: scale(1.1, 1.16) rotate(0.6deg); background: var(--ink); }
  .ink-item.is-active .ink-en { transform: skewX(-8deg) scale(1.06) translateX(8px); color: #fff; }
  .ink-item.is-active .ink-jp { transform: translateY(-50%) rotate(-3deg) scale(1.12); background: var(--shu); border-color: var(--shu-deep); color: var(--paper); }
  .menu-dimmed .ink-item:not(.is-active) { opacity: 0.32; filter: grayscale(0.4); transition: opacity 0.2s, filter 0.2s; }

  .drop { position: absolute; background: var(--ink); width: 9px; height: 9px; z-index: 1; opacity: 0; filter: url(#roughEdge); }
  .ink-item.is-active .drop { animation: dropFly 0.5s cubic-bezier(0.2, 0.8, 0.4, 1) forwards; }
  .drop:nth-child(1) { right: -14px; top: 30%; --dx: 26px; --dy: -18px; }
  .drop:nth-child(2) { right: -8px; bottom: 12%; --dx: 34px; --dy: 10px; animation-delay: 0.04s !important; }
  .drop:nth-child(3) { left: 30%; top: -10px; --dx: 6px; --dy: -24px; animation-delay: 0.02s !important; }
  @keyframes dropFly {
    0% { opacity: 0.9; transform: translate(0, 0) scale(1.2); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }

  .desc-line {
    position: absolute; left: 6vw; bottom: 9vh;
    font-family: var(--jp-go); font-weight: 700;
    font-size: 15px; letter-spacing: 0.28em;
    color: rgba(22,19,15,0.78);
    border-left: 6px solid var(--shu);
    padding: 4px 0 4px 14px;
    max-width: 44vw;
    z-index: 3;
  }

  .hints {
    position: absolute; right: 44px; bottom: 30px;
    display: flex; gap: 18px; z-index: 4;
    font-family: var(--jp-go); font-weight: 700; font-size: 12.5px; letter-spacing: 0.14em;
    color: rgba(22,19,15,0.75);
  }
  .hints b {
    font-family: var(--lat); font-size: 11px;
    background: var(--ink); color: var(--paper);
    padding: 3px 8px; margin-right: 7px;
    transform: skewX(-8deg); display: inline-block;
  }

  /* ---------- transition veil ---------- */
  #veil { position: fixed; inset: 0; z-index: 60; pointer-events: none; visibility: hidden; }
  #veil.on { visibility: visible; }
  .veil-blob {
    position: absolute; left: var(--vx, 30%); top: var(--vy, 50%);
    width: 40px; height: 40px;
    transform: translate(-50%, -50%) scale(0);
  }
  .veil-blob svg { position: absolute; left: 50%; top: 50%; width: 340vmax; height: 340vmax; transform: translate(-50%, -50%); }
  #veil.flood .veil-blob { animation: bloomIn 0.42s cubic-bezier(0.6, 0, 0.8, 0.4) forwards; }
  @keyframes bloomIn { to { transform: translate(-50%, -50%) scale(1); } }
  #veil.drain .veil-blob { transform: translate(-50%, -50%) scale(1); animation: bloomOut 0.5s cubic-bezier(0.3, 0, 0.2, 1) 0.12s forwards; }
  @keyframes bloomOut { to { transform: translate(-50%, -50%) scale(0); opacity: 0; } }

  .veil-card {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    opacity: 0;
  }
  #veil.card .veil-card { animation: cardSlam 0.86s cubic-bezier(0.16, 1.2, 0.3, 1) 0.3s forwards; }
  @keyframes cardSlam {
    0% { opacity: 0; transform: scale(1.9) rotate(-4deg); }
    18% { opacity: 1; transform: scale(1) rotate(-2deg); }
    82% { opacity: 1; transform: scale(0.98) rotate(-2deg); }
    100% { opacity: 0; transform: scale(0.94) rotate(-2deg); }
  }
  .veil-card-inner { text-align: center; }
  .veil-card-en {
    font-family: var(--lat); font-style: italic; font-weight: 900;
    font-size: 11vw; line-height: 0.9; letter-spacing: 0.02em;
    color: var(--paper);
    text-shadow: 0.6vw 0.6vw 0 var(--shu);
    transform: skewX(-8deg);
  }
  .veil-card-jp {
    font-family: var(--jp); font-weight: 700;
    font-size: 3.4vw; letter-spacing: 1em; text-indent: 1em;
    color: var(--shu); margin-top: 2.4vh;
  }

  /* ---------- submenu ---------- */
  .sub-band {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 17vw; min-width: 190px;
    background: var(--shu);
    clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .sub-band-kanji {
    writing-mode: vertical-rl;
    font-family: var(--jp); font-weight: 700;
    font-size: 8.4vw; line-height: 1; letter-spacing: 0.1em;
    color: var(--paper);
    text-shadow: 0.4vw 0.4vw 0 var(--shu-deep);
  }
  .sub-head {
    position: absolute; left: 21vw; top: 9vh;
  }
  .sub-head-en {
    font-family: var(--lat); font-style: italic; font-weight: 900;
    font-size: 5.6vw; line-height: 1;
    color: var(--ink); transform: skewX(-8deg);
  }
  .sub-head-desc {
    margin-top: 1.6vh;
    font-family: var(--jp-go); font-weight: 700; font-size: 15px; letter-spacing: 0.3em;
    color: rgba(22,19,15,0.7);
    border-left: 6px solid var(--ink); padding-left: 12px;
  }
  .sub-grid {
    position: absolute; left: 21vw; right: 5vw; top: 30vh;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.4vw;
  }
  .scroll-tile {
    position: relative;
    height: 46vh;
    background: linear-gradient(178deg, #f7f2e6 0%, var(--paper) 60%, var(--paper-deep) 100%);
    border: 1px solid rgba(22,19,15,0.25);
    box-shadow: 0 14px 24px -14px rgba(22,19,15,0.5);
    transform-origin: top center;
    transform: scaleY(0);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
    transition: transform 0.2s cubic-bezier(0.2, 1.4, 0.3, 1), box-shadow 0.2s;
  }
  body.state-sub .scroll-tile { animation: unroll 0.5s cubic-bezier(0.2, 1.25, 0.3, 1) forwards; animation-delay: calc(var(--i) * 0.08s); }
  @keyframes unroll { to { transform: scaleY(1); } }
  .scroll-tile::before, .scroll-tile::after {
    content: ""; position: absolute; left: -5%; right: -5%; height: 10px; background: var(--ink);
  }
  .scroll-tile::before { top: -5px; } .scroll-tile::after { bottom: -5px; }
  .scroll-kanji { font-family: var(--jp); font-weight: 700; font-size: 4.6vw; writing-mode: vertical-rl; letter-spacing: 0.2em; }
  .scroll-label { font-family: var(--lat); font-size: 12px; letter-spacing: 0.3em; color: rgba(22,19,15,0.6); }
  .scroll-meta { font-family: var(--jp-go); font-weight: 700; font-size: 13px; color: var(--shu); letter-spacing: 0.12em; }
  .scroll-tile:hover, .scroll-tile:focus-visible { transform: scaleY(1) translateY(-10px) rotate(-0.8deg) !important; box-shadow: 0 26px 30px -16px rgba(22,19,15,0.55); outline: none; }
  .scroll-tile:hover .scroll-meta { color: var(--shu-deep); }

  .back-chip {
    position: absolute; left: 21vw; bottom: 6vh;
    background: var(--ink); color: var(--paper);
    font-family: var(--jp-go); font-weight: 700; font-size: 15px; letter-spacing: 0.3em;
    padding: 12px 26px;
    transform: skewX(-8deg);
    transition: background 0.15s, transform 0.2s cubic-bezier(0.2, 1.4, 0.3, 1);
  }
  .back-chip:hover, .back-chip:focus-visible { background: var(--shu); transform: skewX(-8deg) scale(1.08); outline: none; }

  .concept-back {
    position: fixed; left: 12px; bottom: 12px; z-index: 90;
    font-family: var(--lat); font-size: 10px; letter-spacing: 0.2em;
    color: rgba(22,19,15,0.4); text-decoration: none;
  }
  .concept-back:hover { color: var(--shu); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001s !important; animation-delay: 0s !important; transition-duration: 0.001s !important; }
  }
</style>
</head>
<body class="state-menu">

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="roughEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.11 0.4" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
    </filter>
    <path id="blobPath" d="M50 4 C66 2 78 10 84 22 C92 34 98 44 94 58 C90 74 80 86 66 92 C52 98 36 96 24 88 C12 80 4 66 6 50 C8 34 14 20 26 12 C34 6 42 6 50 4 Z"/>
  </defs>
</svg>

<a class="concept-back" href="index.html">◂ CONCEPTS</a>

<!-- ======== MAIN MENU ======== -->
<section class="screen" id="menuScreen" aria-label="メインメニュー">
  <div class="grain"></div>

  <svg class="enso" viewBox="0 0 520 520"><circle cx="260" cy="260" r="232"/></svg>
  <div class="watermark" id="watermark">学</div>

  <svg class="splat" style="left:46vw; top:8vh; width:70px; height:70px" viewBox="0 0 100 100"><use href="#blobPath"/></svg>
  <svg class="splat" style="left:57vw; bottom:12vh; width:34px; height:34px; opacity:.6" viewBox="0 0 100 100"><use href="#blobPath"/></svg>
  <svg class="splat" style="right:8vw; top:14vh; width:26px; height:26px; opacity:.4" viewBox="0 0 100 100"><use href="#blobPath"/></svg>

  <header class="brand">
    <div class="brand-seal">語</div>
    <div class="brand-vert">日本語</div>
    <div class="brand-lat">JPLEARN — SUMI</div>
  </header>

  <div class="hud">
    <div class="hud-chip"><span id="hudDate">8/1 土</span></div>
    <div class="hud-chip shu"><span class="jp">連続</span> <b>12</b>日</div>
    <div class="hud-chip"><span>LV</span> <b>7</b></div>
  </div>

  <nav class="ink-menu" id="inkMenu" aria-label="セクション"></nav>

  <div class="desc-line" id="descLine">かな・漢字・語彙のセクション学習</div>

  <div class="hints">
    <span><b>↑↓</b>選択</span>
    <span><b>ENTER</b>決定</span>
    <span><b>ESC</b>戻る</span>
  </div>
</section>

<!-- ======== SUBMENU ======== -->
<section class="screen" id="subScreen" aria-label="サブメニュー">
  <div class="grain"></div>
  <div class="sub-band"><div class="sub-band-kanji" id="subKanji">学習</div></div>
  <div class="sub-head">
    <div class="sub-head-en" id="subEn">STUDY</div>
    <div class="sub-head-desc" id="subDesc">かな・漢字・語彙のセクション学習</div>
  </div>
  <div class="sub-grid" id="subGrid"></div>
  <button class="back-chip" id="backBtn">← 戻る BACK</button>
</section>

<!-- ======== TRANSITION ======== -->
<div id="veil">
  <div class="veil-blob"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><use href="#blobPath" fill="#16130f"/></svg></div>
  <div class="veil-card">
    <div class="veil-card-inner">
      <div class="veil-card-en" id="veilEn">STUDY</div>
      <div class="veil-card-jp" id="veilJp">学習</div>
    </div>
  </div>
</div>

<script>
const ITEMS = [
  { jp: '学習', en: 'STUDY',   kanji: '学', desc: 'かな・漢字・語彙のセクション学習', rot: -2.2, arc: 0 },
  { jp: '復習', en: 'REVIEW',  kanji: '復', desc: '期限が来たカード ─ 今日は24枚',   rot: 1.4,  arc: 34 },
  { jp: '読解', en: 'READING', kanji: '読', desc: 'レベル別の読みもの',               rot: -1.2, arc: 58 },
  { jp: '特訓', en: 'DRILLS',  kanji: '特', desc: '毎日のミニゲームで腕試し',         rot: 1.8,  arc: 62 },
  { jp: '検定', en: 'JLPT',    kanji: '検', desc: 'JLPT 模擬試験と対策',              rot: -1.7, arc: 44 },
  { jp: '記録', en: 'RECORDS', kanji: '記', desc: '進捗・統計・連続記録',             rot: 1.2,  arc: 12 },
];
const SUBTILES = {
  STUDY:   [['ひらがな','HIRAGANA','46字 · 92%'], ['カタカナ','KATAKANA','46字 · 71%'], ['漢字','KANJI','N5–N1 · 2136字'], ['語彙','VOCAB','8000語']],
  REVIEW:  [['今日の分','DUE TODAY','24枚'], ['苦手札','WEAK CARDS','7枚'], ['先取り','AHEAD','12枚'], ['総復習','ALL','341枚']],
  READING: [['短文','SHORT','N5 · 12本'], ['物語','STORIES','N4 · 8本'], ['記事','ARTICLES','N3 · 15本'], ['随筆','ESSAYS','N2 · 6本']],
  DRILLS:  [['聞き取り','LISTENING','毎日'], ['書き取り','WRITING','毎日'], ['速読','SPEED','ベスト 42'], ['対戦','VERSUS','週末']],
  JLPT:    [['文字語彙','VOCAB','模試 3回'], ['文法','GRAMMAR','模試 3回'], ['読解','READING','模試 2回'], ['聴解','LISTENING','模試 2回']],
  RECORDS: [['連続記録','STREAK','12日'], ['正答率','ACCURACY','86%'], ['学習時間','TIME','42時間'], ['級位','RANK','七級']],
};

const menu = document.getElementById('inkMenu');
const watermark = document.getElementById('watermark');
const descLine = document.getElementById('descLine');
const veil = document.getElementById('veil');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let active = 0, busy = false;

ITEMS.forEach((it, i) => {
  const b = document.createElement('button');
  b.className = 'ink-item';
  b.style.setProperty('--i', i);
  b.style.setProperty('--rot', it.rot + 'deg');
  b.style.setProperty('--arc', it.arc + 'px');
  b.innerHTML = `
    <span class="shard"></span>
    <span class="drop"></span><span class="drop"></span><span class="drop"></span>
    <span class="ink-jp">${it.jp}</span>
    <span class="ink-en">${it.en}</span>
    <span class="ink-stamp">${it.kanji}</span>`;
  b.addEventListener('mouseenter', () => setActive(i));
  b.addEventListener('focus', () => setActive(i));
  b.addEventListener('click', (e) => select(i, e.clientX, e.clientY));
  b.addEventListener('animationend', (e) => { if (e.target === b) b.classList.add('entered'); });
  menu.appendChild(b);
});
const itemEls = [...menu.children];

function setActive(i) {
  if (busy) return;
  active = i;
  menu.classList.add('menu-dimmed');
  itemEls.forEach((el, j) => el.classList.toggle('is-active', j === i));
  watermark.textContent = ITEMS[i].kanji;
  watermark.classList.remove('swap'); void watermark.offsetWidth;
  watermark.classList.add('swap');
  descLine.textContent = ITEMS[i].desc;
}
menu.addEventListener('mouseleave', () => { if (!busy) menu.classList.remove('menu-dimmed'); });

function buildSub(i) {
  const it = ITEMS[i];
  document.getElementById('subKanji').textContent = it.jp;
  document.getElementById('subEn').textContent = it.en;
  document.getElementById('subDesc').textContent = it.desc;
  const grid = document.getElementById('subGrid');
  grid.innerHTML = '';
  SUBTILES[it.en].forEach(([jp, en, meta], j) => {
    const t = document.createElement('button');
    t.className = 'scroll-tile';
    t.style.setProperty('--i', j);
    t.innerHTML = `<span class="scroll-kanji">${jp}</span><span class="scroll-label">${en}</span><span class="scroll-meta">${meta}</span>`;
    grid.appendChild(t);
  });
}

function select(i, x, y) {
  if (busy) return;
  busy = true;
  setActive(i);
  buildSub(i);
  document.getElementById('veilEn').textContent = ITEMS[i].en;
  document.getElementById('veilJp').textContent = ITEMS[i].jp;
  veil.style.setProperty('--vx', (x ?? innerWidth * 0.3) + 'px');
  veil.style.setProperty('--vy', (y ?? innerHeight * 0.5) + 'px');

  if (reduced) {
    document.body.className = 'state-sub';
    busy = false;
    return;
  }
  veil.className = 'on flood card';
  setTimeout(() => { document.body.className = 'state-sub'; }, 500);
  setTimeout(() => { veil.className = 'on drain'; }, 1150);
  setTimeout(() => { veil.className = ''; busy = false; }, 1800);
}

function goBack() {
  if (busy || document.body.className !== 'state-sub') return;
  busy = true;
  if (reduced) {
    document.body.className = 'state-menu';
    busy = false;
    return;
  }
  veil.style.setProperty('--vx', '18vw');
  veil.style.setProperty('--vy', '50vh');
  veil.className = 'on flood';
  setTimeout(() => { document.body.className = 'state-menu'; menu.classList.remove('menu-dimmed'); itemEls.forEach(el => el.classList.remove('is-active')); }, 480);
  setTimeout(() => { veil.className = 'on drain'; }, 560);
  setTimeout(() => { veil.className = ''; busy = false; }, 1200);
}
document.getElementById('backBtn').addEventListener('click', goBack);

document.getElementById('hudDate').textContent =
  `${new Date().getMonth() + 1}/${new Date().getDate()} ${'日月火水木金土'[new Date().getDay()]}`;

addEventListener('keydown', (e) => {
  if (document.body.className === 'state-menu') {
    if (e.key === 'ArrowDown') { setActive((active + 1) % ITEMS.length); itemEls[active].focus(); }
    else if (e.key === 'ArrowUp') { setActive((active + ITEMS.length - 1) % ITEMS.length); itemEls[active].focus(); }
    else if (e.key === 'Enter') { const r = itemEls[active].getBoundingClientRect(); select(active, r.right, r.top + r.height / 2); }
    else if (e.key >= '1' && e.key <= '6') { const i = +e.key - 1; setActive(i); itemEls[i].focus(); }
  } else if (e.key === 'Escape' || e.key === 'Backspace') { goBack(); }
});
</script>
