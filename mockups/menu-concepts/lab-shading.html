<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shading lab — one hill, one tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0d1018; }
  #stage { position: fixed; inset: 0; }
  .hud {
    position: fixed; left: 18px; top: 16px; z-index: 5;
    font: 12px/1.7 "Consolas", "Courier New", monospace;
    color: #dfe6f2; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    letter-spacing: 0.06em; pointer-events: none;
  }
  .hud b { color: #ffd9a1; font-weight: 400; }
  .hud .off { color: #6a7488; }
  .hud h1 { font: 600 13px/1.9 "Consolas", monospace; letter-spacing: 0.22em; color: #ffd9a1; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud" id="hud"></div>

<script type="module">
import * as THREE from './lib/three.module.min.js';

/* ============================================================================
   SHADING LAB — one hill, one tree.

   The point is not the scene. It is to isolate the four things the main mockup
   was missing, and to make each one switchable so its contribution is visible
   rather than asserted:

     1  vertex AO      shading baked into the mesh at build time, so ground
                       contact and concavity read without any runtime cost
     2  ramp colour    terrain colour driven by slope and height instead of one
                       flat material value
     3  toon + outline the look is authored rather than simulated — which makes
                       simple geometry an asset instead of a liability
     4  shadows        a real shadow map, so things are attached to the ground
     5  cloud shadows  drifting sky occlusion, which breaks up the terminator a
                       single directional light otherwise leaves as a plain diagonal
     6  height fog     mist pooling in low ground, so the valley floor separates from
                       the ridge behind it instead of washing into one grey
     7  post           one fullscreen pass: ACES + split tone, thresholded bloom,
                       paper grain, vignette
     8  petals         cherry and maple falling — the one VFX that IS the design,
                       since the four gardens are the four seasons
     Q  rim            a cool edge from the sky, so things sit in FRONT of the mist
                       rather than dissolving into it
     W  sway           foliage moves, and so does its outline hull — displace one and
                       not the other and the black shell walks off the crown
     E  aerial         fog that warms toward the sun, because haze looking into the
                       light is not the colour of haze looking away from it
     R  mist           visible banks lying in the low ground — height fog is atmosphere
                       and has no shape; this is what gives the air strands. The density is
                       noise, not a plateau: a soft edge round a flat interior is a lozenge
     T  shafts         a radial march through a DEDICATED occlusion buffer — sky near the
                       sun, black on everything solid — so the trees cast their own rays

     [ ]  grade        eight looks, cycled. They touch the grade only and never the
                       toggles, so any of them can be judged against any scene state

   Press 1-8 to toggle, 0 for all off (which is roughly what the main mockup
   was doing), 9 for all on.
   ============================================================================ */

const state = { ao: true, ramp: true, toon: true, shadow: true, clouds: true,
  hfog: true, post: true, petals: true, rim: true, sway: true, aerial: true,
  mist: true, shafts: true };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
/* filmic tone mapping + sRGB out. Without this the raw framebuffer is what you
   see, which is a large part of why untreated three.js looks flat. */
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
/* PCFSoftShadowMap is deprecated in this three build and silently falls back to PCFShadowMap
   — asking for it just produced a console warning and shadows that behaved differently than
   the code claimed. Ask for what actually runs. */
renderer.shadowMap.type = THREE.PCFShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY_LO = new THREE.Color(0xf2c89a), SKY_HI = new THREE.Color(0x35508c);
scene.fog = new THREE.Fog(0xd9c3a8, 2600, 7200);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 1, 20000);
camera.position.set(2700, 1450, 0);
camera.lookAt(0, 620, 0);

/* ---- sky: a gradient dome, so the horizon has somewhere to fade into ---- */
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.00, '#25396e');
  grad.addColorStop(0.42, '#6d7fa6');
  grad.addColorStop(0.60, '#c9a184');
  grad.addColorStop(0.70, '#f4d3a6');
  grad.addColorStop(1.00, '#c9b49c');
  g.fillStyle = grad; g.fillRect(0, 0, 4, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(9000, 32, 20),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false })));
}

/* ---- the sun itself ----
   THE LAB HAD NO SUN, ONLY A DIRECTIONAL LIGHT AND A GRADIENT SKY — and sun shafts turned out to
   be untestable because of it: the bright pass found a broad band of horizon rather than a disc,
   and a radial blur of something uniform is that same uniform thing. Shafts need a small, very
   bright source with the scene able to stand in front of it. The main mockup already has exactly
   this (`sun-disc` and `sun-bloom`), so the lab was simply missing a thing it is meant to model. */
const SUN_AT = new THREE.Vector3(-1500, 1900, 900).normalize().multiplyScalar(7200);
const SUN_SPRITES = [];
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  rg.addColorStop(0.00, 'rgba(255,255,255,1)');
  rg.addColorStop(0.22, 'rgba(255,240,205,0.92)');
  rg.addColorStop(0.55, 'rgba(255,205,150,0.30)');
  rg.addColorStop(1.00, 'rgba(255,190,140,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  /* A SPRITE, NOT A PLANE. The first pass used a PlaneGeometry, which faces world +Z and is
     FrontSide by default — so from a camera looking up at it from the side there was simply
     nothing there, and the shafts had a source that could not be seen. A Sprite always faces the
     eye, which is what a sun is. */
  const mk = (scale, opacity) => {
    const m = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, transparent: true, depthWrite: false, fog: false,
      blending: THREE.AdditiveBlending, opacity,
    }));
    m.position.copy(SUN_AT);
    m.scale.setScalar(scale);
    scene.add(m);
    return m;
  };
  /* the disc, and a much wider glow around it — the glow is what the bright pass mostly finds */
  SUN_SPRITES.push(mk(360, 1.0), mk(2600, 0.55));
}

/* ---- the sun's elevation, as a knob ----
   SHAFTS NEED A LOW SUN, and that is not a tuning detail — it is the whole precondition. A
   crepuscular ray is the GAP between things that block the glow, so something has to be able to
   get in front of it; at the key light's 47 degrees nothing on the ground ever can, and the
   radial blur simply makes the halo rounder. The mockup is a dawn scene with the sun sitting just
   above the treeline, so the lab was modelling the wrong time of day to test its own effect.
   Moves the light and the sprites together — a visible sun in one place and its shadows coming
   from another is the kind of wrong that is hard to see and impossible to unsee. */
function sunAt(elevDeg, azDeg) {
  const e = elevDeg * Math.PI / 180, a = azDeg * Math.PI / 180;
  const dir = new THREE.Vector3(Math.cos(e) * Math.cos(a), Math.sin(e), Math.cos(e) * Math.sin(a));
  /* far enough out that the shadow camera's near plane still clears the terrain when the sun
     is near the horizon; at a few degrees the box cannot hold the shadows anyway, which is a
     limit of one directional light and not worth a cascade in a lab */
  key.position.copy(dir).multiplyScalar(4600);
  FX.uSunDir.value.copy(dir);
  SUN_AT.copy(dir).multiplyScalar(7200);
  SUN_SPRITES.forEach((m) => m.position.copy(SUN_AT));
  key.target.position.set(0, 0, 0);
  key.target.updateMatrixWorld();
  key.shadow.camera.updateProjectionMatrix();
}

/* ---- the toon ramp: 4 hard steps. NearestFilter is what makes it band ---- */
function toonRamp(steps) {
  const d = new Uint8Array(steps * 4);
  for (let i = 0; i < steps; i++) {
    /* weighted so the lit side holds and the terminator sits where it reads */
    const v = Math.round(255 * Math.pow((i + 1) / steps, 0.72));
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(d, steps, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}
const RAMP = toonRamp(4);

/* ---- height fog: mist lying in the valley ----
   Distance fog alone flattens a landscape into one grey wash: everything far is equally hazy,
   so nothing reads as ABOVE anything else. Real morning mist pools in low ground, which is what
   separates a valley floor from the ridge behind it and is most of what sumi-e distance is.
   Driven off world height, which `cloudy()` already carries into the fragment shader as
   `vCloudPos` — so this costs one varying that was already being paid for. */
/* ---- three more, sharing one uniform block ----
   rim   a cool edge from the sky opposite the sun. With height fog in, distant objects dissolve
         INTO the mist; a rim is what puts them back in front of it, and it is the cheapest
         separation there is.
   sway  the world is dead still. Foliage that moves is most of the difference between a render
         and a place — and it has to move the OUTLINE too, or the hull parts company with the
         thing it wraps.
   air   aerial perspective with a direction to it: haze looking into the sun is not the same
         colour as haze looking away from it, and one flat fog colour is what makes a dawn read
         as a grey afternoon. */
const FX = {
  uTime: { value: 0 },
  uRimAmt: { value: 0.55 },
  uRimPow: { value: 2.6 },
  uRimCol: { value: new THREE.Color(0x9fc0e8) },
  uSwayAmt: { value: 7.0 },
  uAerialAmt: { value: 0.85 },
  uAerialWarm: { value: new THREE.Color(0xf6c9a8) },
  uSunDir: { value: new THREE.Vector3(-1500, 1900, 900).normalize() },
};
const HFOG = {
  uHfAmt: { value: 0.85 },
  uHfTop: { value: 520 },      /* mist ceiling: above this, none */
  uHfBot: { value: -120 },     /* and below this, full */
  uHfCol: { value: new THREE.Color(0xd8c9b6) },
};

/* ---- lights ---- */
/* KEY-TO-FILL RATIO IS THE WHOLE GAME. Last round I pushed the fill to 1.9 to stop shadows
   going black, and that quietly broke everything downstream: with fill nearly matching key,
   direct sunlight became a minority of the terrain's light, so anything that modulates
   direct light — cast shadows, cloud shadows — moved the final pixel by ~1%. The fix is
   not stronger shadows, it is a key that dominates and a fill that only lifts the floor. */
const key = new THREE.DirectionalLight(0xffe6c4, 3.2);
key.position.set(-1500, 1900, 900);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
const sc = key.shadow.camera;
/* SIZE THE BOX, THEN COUNT THE TEXELS. The hard straight edge across the hill was the edge
   of the shadow camera: a 3600-unit box cannot hold a 3000-unit terrain once the light is
   at 47°, because the terrain projects much longer than itself along the light direction.
   Half-diagonal 2121 plus the height shift (760 / tan 47°, halved) lands at ~2470, so 2600
   covers it with margin — and every unit past that is texel resolution thrown away. */
/* the terrain grew from 3000 to 4400, so the box grows with it: half-diagonal is now 3111,
   plus the height shift along the light direction. 4096 texels over 7400 units is 1.8 per
   texel, and radius 2.5 is still a ~4-unit blur — soft on terrain, harmless on a rock. */
sc.left = -3700; sc.right = 3700; sc.top = 3700; sc.bottom = -3700; sc.near = 200; sc.far = 12000;

/* THE BLUR MUST BE SMALLER THAN WHAT IT SHADOWS. At 2048 over a 6400-unit box a texel was
   3.1 units, so radius 7 meant a ±22-unit PCF kernel — wider than the 54-unit rocks. Every
   object sampled its own far side and went fully black, which read as "the rocks are unlit"
   rather than as a shadow bug. 4096 over 5200 units gives a 1.27-unit texel; radius 2.5 is
   then a ~3-unit blur, soft on the terrain and harmless on a rock. */
key.shadow.radius = 2.5;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 3;
scene.add(key, key.target);
/* THREE LIGHTS, NOT TWO. Trading key against hemisphere is a false choice: raise the fill
   and shadows stop reading, drop it and everything in shadow crushes to black. The way out
   is a second DIRECTIONAL light from the opposite side, casting nothing — it lifts shadowed
   surfaces while still SHAPING them, because it arrives from a different angle. The
   hemisphere then only has to tint, so it can stay low and the key can stay dominant. */
const bounce = new THREE.DirectionalLight(0x8fb4e8, 0.95);
bounce.position.set(1700, 700, -1300);
scene.add(bounce, bounce.target);
const fill = new THREE.HemisphereLight(0xa8c4ea, 0x6d6046, 0.7);
scene.add(fill);

/* ======================= 5. CLOUD SHADOWS =======================
   One directional light on a smooth landform always gives the same plain diagonal
   terminator, and no amount of tuning the light fixes that — the fault is that there
   is only one occluder. Real skies have a second: cloud cover. This is the cheapest
   large-scale variation available, and it costs one texture lookup.

   Two things make it read as sky rather than as a dirty texture:
     - it multiplies DIRECT light only, so shaded ground falls to the cold hemisphere
       fill instead of just going grey — same colour shift as a real cloud shadow
     - the lookup is projected along the light direction onto y = 0, not taken straight
       down, so the shadow stays put on a hillside instead of sliding up the slope */

/* tileable fBm on a canvas: wrapping value noise, then shaped so there is open sky
   between the blobs rather than an even grey mush */
function cloudTex(S = 512) {
  const hash = (x, y, p) => {
    const xi = ((x % p) + p) % p, yi = ((y % p) + p) % p;
    const n = Math.sin(xi * 127.1 + yi * 311.7) * 43758.5453;
    return n - Math.floor(n);
  };
  const smooth = (t) => t * t * (3 - 2 * t);
  const noise = (x, y, p) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const u = smooth(x - xi), v = smooth(y - yi);
    return hash(xi, yi, p) * (1 - u) * (1 - v) + hash(xi + 1, yi, p) * u * (1 - v)
         + hash(xi, yi + 1, p) * (1 - u) * v + hash(xi + 1, yi + 1, p) * u * v;
  };
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let v = 0, amp = 0.55, f = 3;
      for (let o = 0; o < 5; o++) { v += noise(x / S * f, y / S * f, f) * amp; amp *= 0.5; f *= 2; }
      /* smoothstep with a high floor: ~40% coverage, soft edges. Capped at 0.85 so even
         the core of a cloud still passes light — an uncapped core reads as a hole */
      const cover = THREE.MathUtils.smoothstep(v, 0.40, 0.74) * 0.85;
      const lit = Math.round(255 * (1 - cover));
      const i = (y * S + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = lit; img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* one shared set of uniform objects, handed to every patched material by reference,
   so drifting the offset once in the tick moves the cover across the whole scene */
const CLOUD = {
  uCloudMap: { value: cloudTex() },
  uCloudOff: { value: new THREE.Vector2() },
  uCloudProj: { value: new THREE.Vector2() },
  /* the tile repeats every 1/scale world units and holds ~3 blobs across, so this is
     roughly a 900-unit cloud on a 3000-unit hill — several in frame, none dominating */
  uCloudScale: { value: 1 / 2600 },
  uCloudAmt: { value: 0.78 },
};
{
  /* project along the light: from a point P, travelling toward the light until y = 0
     lands at P.xz - P.y * (L.xz / L.y) */
  const L = key.position.clone().normalize();
  CLOUD.uCloudProj.value.set(L.x / L.y, L.z / L.y);
}

/* THE UNIFORM TRAP. three.js uploads a built-in material's uniforms only when that
   material's `version` changes — so a custom uniform added through onBeforeCompile is
   written to the GPU exactly once and then never again. Mutating `.value` per frame does
   nothing, silently: the shader is correct, the texture is correct, and the effect simply
   never moves. `needsUpdate` is only `version++` (it disposes nothing), so bumping it on
   the handful of cloud-lit materials each frame is the cheap, supported way through.
   Anything animated through onBeforeCompile in the real scene needs this same registry. */
const CLOUD_MATS = [];

/* ONE SNIPPET, TWO SHADERS. The crown and its outline hull have to be displaced by exactly
   the same expression or the hull parts company with the thing it wraps — which is the whole
   reason the outline system exists. Written once and pasted into both. */
/* RIM IS FOR OBJECTS, NOT FOR TERRAIN — the same shape of finding as the toon ramp.
   `1 - dot(N, V)` is the edge term, and on a large surface seen at grazing incidence it is near
   1 across the WHOLE visible area: the hill went uniformly milky blue and stopped reading as a
   hill at all. On something with curvature and a silhouette it does exactly what it should. So
   it is opt-in per material, and the ground does not opt in. */
const RIM_GLSL = `
  {
    vec3 Vv = normalize( vViewPosition );
    float rimF = pow( 1.0 - clamp( dot( normal, Vv ), 0.0, 1.0 ), uRimPow );
    /* weighted by how much sky the surface can see, so it never lands on an underside — a rim
       on a downward face is a highlight with no source */
    float sky = clamp( vWorldN.y * 0.5 + 0.5, 0.0, 1.0 );
    reflectedLight.indirectDiffuse += uRimCol * ( rimF * uRimAmt * sky );
  }`;
const SWAY_GLSL = `
  {
    /* AN INSTANCED CROWN IS NOT AT THE MODEL ORIGIN. Without this every tree in a stand
       reads the phase at the same point and the whole line sways as one object. */
    vec3 swp = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;
    #ifdef USE_INSTANCING
      swp = ( modelMatrix * instanceMatrix * vec4( transformed, 1.0 ) ).xyz;
    #endif
    /* uTime advances 5.76 per real second, so 0.85 was 4.9 rad/s: a
       one-and-a-quarter-second swing — a shiver, not a breeze. Foliage wants three or four
       seconds, which is 0.273. The complaint landed on the OUTLINE because a solid black shows
       motion far more clearly than the green mass underneath it — but the outline was
       innocent. It moved exactly as much as what it wraps, and what it wraps was shivering. */
    float sph = uTime * 0.273 + swp.x * 0.0013 + swp.z * 0.0011;
    /* ONE TREE IS ONE THING. The phase gradient was 0.0042 per unit — a full wave across a
       500-unit crown, so its near and far sides travelled in opposite directions and the mass
       went rubbery. A third of that: the crown moves together, with a lag across it. */
    float gust = 0.4 + 0.6 * ( 0.5 + 0.5 * sin( uTime * 0.100 + swp.z * 0.00035 ) );
    /* AND WIND IS NOT A METRONOME. At one fixed amplitude the eye finds the period inside two
       seconds and the tree reads as a shader. The gust swells over about ten seconds. */
    float amp = uSwayAmt * gust;
    transformed.x += sin( sph ) * amp;
    transformed.z += cos( sph * 0.83 ) * amp * 0.62;
  }`;
function cloudy(mat) {
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, CLOUD);
    Object.assign(shader.uniforms, HFOG, FX);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        varying vec3 vCloudPos;
        varying vec3 vWorldN;
        uniform float uTime;
        uniform float uSwayAmt;`)
      /* SWAY GOES IN BEFORE project_vertex, and only on what is flagged foliage. It displaces
         `transformed`, which is what every downstream chunk reads, so shadows and the cloud
         lookup follow it for free. */
      .replace('#include <begin_vertex>', '#include <begin_vertex>' + (mat.userData.sway ? SWAY_GLSL : ''))
      /* after project_vertex so `transformed` is final; the instancing branch matters
         because everything in the real scene will be an InstancedMesh */
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 cwp = vec4( transformed, 1.0 );
        #ifdef USE_INSTANCING
          cwp = instanceMatrix * cwp;
        #endif
        vCloudPos = ( modelMatrix * cwp ).xyz;
        vWorldN = normalize( mat3( modelMatrix ) * objectNormal );`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vCloudPos;
        varying vec3 vWorldN;
        uniform float uRimAmt;
        uniform float uRimPow;
        uniform vec3  uRimCol;
        uniform float uAerialAmt;
        uniform vec3  uAerialWarm;
        uniform vec3  uSunDir;
        uniform sampler2D uCloudMap;
        uniform vec2 uCloudOff;
        uniform vec2 uCloudProj;
        uniform float uCloudScale;
        uniform float uCloudAmt;
        uniform float uHfAmt;
        uniform float uHfTop;
        uniform float uHfBot;
        uniform vec3  uHfCol;`)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        {
          vec2 cuv = ( vCloudPos.xz - vCloudPos.y * uCloudProj ) * uCloudScale + uCloudOff;
          float cs = texture2D( uCloudMap, cuv ).r;
          reflectedLight.directDiffuse *= mix( 1.0, cs, uCloudAmt );
        }
        ${mat.userData.rim ? RIM_GLSL : ''}`)
      /* AFTER the standard fog, not instead of it. Distance fog is still doing the far-field
         work; this only adds the pooling near the ground. `vFogDepth` is the built-in, so the
         mist thins to nothing at the camera — mist you are standing in is not mist. */
      /* THE WHOLE FOG, REPLACED. Appending height fog after the stock chunk meant two mixes
         toward two different colours, so the aerial tint could only ever affect one of them and
         the mist stayed stubbornly grey looking into the sun. One expression, one colour. */
      .replace('#include <fog_fragment>', `
        {
          vec3 Vw = normalize( vCloudPos - cameraPosition );
          float sunF = pow( max( dot( Vw, uSunDir ), 0.0 ), 3.0 ) * uAerialAmt;
          vec3 fogC = mix( fogColor, uAerialWarm, sunF );
          float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
          gl_FragColor.rgb = mix( gl_FragColor.rgb, fogC, fogFactor );
          float hfH = clamp( ( uHfTop - vCloudPos.y ) / max( uHfTop - uHfBot, 1.0 ), 0.0, 1.0 );
          float hfD = 1.0 - exp( - vFogDepth * 0.00042 );
          gl_FragColor.rgb = mix( gl_FragColor.rgb, mix( uHfCol, uAerialWarm, sunF * 0.7 ),
            clamp( uHfAmt * hfH * hfH * hfD, 0.0, 1.0 ) );
        }`);
    /* String.replace on a chunk name that moved is a silent no-op — which looks exactly
       like a working feature with the effect turned off. Never let it fail quietly. */
    const wroteVarying = shader.vertexShader.includes('vCloudPos = (');
    const wroteSample = shader.fragmentShader.includes('texture2D( uCloudMap');
    /* AND THE UNIFORMS THEY USE. The height-fog injection landed while its four `uniform`
       declarations did not — the anchor's indentation had changed — so every Lambert failed to
       compile with "undeclared identifier". A guard that checks the code went in but not that
       what the code REFERS TO went in is half a guard. */
    const wantRim = !!mat.userData.rim, gotRim = shader.fragmentShader.includes('uRimPow )');
    const wantSway = !!mat.userData.sway, gotSway = shader.vertexShader.includes('sin( sph )');
    if (wantRim !== gotRim || wantSway !== gotSway) {
      console.error('FX PATCH FAILED', mat.type, 'rim', wantRim, gotRim, 'sway', wantSway, gotSway);
    }
    const wroteFog = shader.fragmentShader.includes('uHfTop - vCloudPos.y');
    const wroteFogUni = shader.fragmentShader.includes('uniform float uHfTop;');
    if (!wroteVarying || !wroteSample || wroteFog !== wroteFogUni) {
      console.error('SHADER PATCH FAILED', mat.type, 'vert:', wroteVarying, 'cloud:', wroteSample,
        'hfog body:', wroteFog, 'hfog uniforms:', wroteFogUni);
    }
  };
  CLOUD_MATS.push(mat);
  return mat;
}

/* ============================ THE TERRAIN ============================
   ONE HILL COULD NOT ANSWER TWO OF THE QUESTIONS PUT TO IT. Mist has nowhere to lie on a dome
   — scatter it and it either floats over the slope like cards or lies on it like a stain —
   and crepuscular rays are the GAPS in an occluder, which a smooth silhouette has none of.
   Both gaps are the same gap, and one landform closes both: a ridge with notches cut through
   it, a treeline along its crest, and a hollow between it and the hill. */
const SIZE = 4400, SEG = 256;
const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position;

/* a hill, a ridge across the far side, a hollow between them, and enough small relief that
   nothing is glassy */
const RIDGE_Z = -1500, HOLLOW_Z = -780;
function heightAt(x, z) {
  const d = Math.hypot(x, z);
  const hill = Math.exp(-(d * d) / (2 * 620 * 620)) * 760;          /* the hill */
  const shoulder = Math.exp(-(Math.hypot(x + 900, z - 500) ** 2) / (2 * 520 * 520)) * 260;
  /* THE RIDGE, AND THE NOTCHES ARE THE POINT OF IT. An unbroken crest is just a second smooth
     silhouette and would leave the shaft question exactly where it was; two saddles cut down
     through it give the sun somewhere to come through from behind. */
  const rz = z - RIDGE_Z;
  const crest = 560 + Math.sin(x * 0.0021) * 130 + Math.sin(x * 0.0053 + 1.7) * 55;
  const notch = 1
    - 0.78 * Math.exp(-((x - 250) ** 2) / (2 * 210 * 210))
    - 0.58 * Math.exp(-((x + 1150) ** 2) / (2 * 250 * 250));
  const ridge = Math.exp(-(rz * rz) / (2 * 380 * 380)) * crest * Math.max(notch, 0.10);
  /* THE HOLLOW. Mist needs low ground with high ground on BOTH sides, or it has no depth to
     sit in and reads as a stain on whatever single slope is behind it. */
  const hollow = -Math.exp(-((z - HOLLOW_Z) ** 2) / (2 * 330 * 330))
                 * Math.exp(-((x - 150) ** 2) / (2 * 1150 * 1150)) * 215;
  const relief = Math.sin(x * 0.0042) * Math.cos(z * 0.0037) * 46
               + Math.sin(x * 0.0111 + 2.1) * Math.cos(z * 0.0093) * 17
               + Math.sin(x * 0.027 + 4.4) * Math.cos(z * 0.023) * 5.5;
  return hill + shoulder + ridge + hollow + relief;
}
for (let i = 0; i < pos.count; i++) pos.setY(i, heightAt(pos.getX(i), pos.getZ(i)));
geo.computeVertexNormals();

/* ---- 1. VERTEX AO, baked at build time ----
   AO must measure CONCAVITY, not "some neighbours are higher". The first version summed
   every uphill sample, so on any uniform slope half the ring counted as occlusion and the
   whole hillside darkened in proportion to its steepness — which is what made the near
   ground read as mud rather than as grass in shade.

   The fix is to measure the horizon in each direction RELATIVE TO THE LOCAL TANGENT PLANE:
   take the highest rise over several radii, then subtract the height the tangent plane
   would have had there. A planar surface — flat or steeply tilted — comes out at exactly
   zero, and only ground that genuinely closes in above the tangent plane darkens. */
const aoAttr = new Float32Array(pos.count);
{
  const norm = geo.attributes.normal;
  const DIRS = 8, RADII = [38, 105, 240, 470];
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const nx = norm.getX(i), ny = Math.max(norm.getY(i), 0.25), nz = norm.getZ(i);
    let occ = 0;
    for (let d = 0; d < DIRS; d++) {
      const th = (d / DIRS) * Math.PI * 2 + (i % 4) * 0.19;   /* stagger to avoid a grid pattern */
      const cx = Math.cos(th), cz = Math.sin(th);
      let horizon = 0;
      for (const r of RADII) {
        const hn = heightAt(x + cx * r, z + cz * r);
        const plane = -(nx * cx * r + nz * cz * r) / ny;      /* tangent plane height at that offset */
        const rise = (hn - y - plane) / r;
        if (rise > horizon) horizon = rise;
      }
      occ += Math.min(horizon, 1);
    }
    aoAttr[i] = 1 - (occ / DIRS) * 1.15;
  }
}

/* ---- 2. RAMP COLOUR from slope and height ----
   Faces pointing up take grass, steep faces take rock, altitude pushes toward
   pale dry grass. This is what replaces "the ground is one hex value". */
const nrm = geo.attributes.normal;
/* the low tone is a SHADE of the grass, not a different, darker green. GRASS_D at 0x445b2c
   was dark enough that low ground went olive before any light touched it, and AO on top of
   that is what turned the near slope to mud. */
const GRASS = new THREE.Color(0x7b9450), GRASS_D = new THREE.Color(0x5e7a3c);
const ROCK = new THREE.Color(0x7d7466), DRY = new THREE.Color(0xb2ad76);
const FLAT = new THREE.Color(0x6f7a52);
const col = new Float32Array(pos.count * 3);
const tmp = new THREE.Color();

function repaintTerrain() {
  const a = geo.attributes.color.array;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const slope = 1 - nrm.getY(i);                      /* 0 flat, 1 vertical */
    const alt = THREE.MathUtils.clamp(y / 700, 0, 1);
    if (state.ramp) {
      tmp.copy(GRASS_D).lerp(GRASS, THREE.MathUtils.smoothstep(alt, -0.05, 0.55));
      tmp.lerp(DRY, THREE.MathUtils.smoothstep(alt, 0.5, 0.95) * 0.75);
      tmp.lerp(ROCK, THREE.MathUtils.smoothstep(slope, 0.14, 0.42));
      /* coherent patchiness. A large expanse of one interpolated green reads as a smear
         however well it is lit — this is the cheapest thing that gives it grain */
      tmp.multiplyScalar(1 + Math.sin(x * 0.0131 + z * 0.0073) * Math.cos(z * 0.0106 - x * 0.0047) * 0.06
                           + Math.sin(x * 0.041 - z * 0.036) * 0.022);
    } else {
      tmp.copy(FLAT);
    }
    tmp.multiplyScalar(THREE.MathUtils.clamp(state.ao ? aoAttr[i] : 1, 0.45, 1.1));
    a[i * 3] = tmp.r; a[i * 3 + 1] = tmp.g; a[i * 3 + 2] = tmp.b;
  }
  geo.attributes.color.needsUpdate = true;
}
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
repaintTerrain();

const matToon = cloudy(new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: RAMP }));
const matPlain = cloudy(new THREE.MeshLambertMaterial({ vertexColors: true }));
const ground = new THREE.Mesh(geo, matToon);
ground.receiveShadow = true;
ground.castShadow = true;
scene.add(ground);

/* ============================ THE TREE ============================ */
/* ---- 3. OUTLINE: inverted hull, extruded along the normal in a vertex shader.
   Scaling the mesh does not work on anything non-spherical; extruding does. */

/* THE GAP BUG. A flat-shaded polyhedron — DodecahedronGeometry(r, 0), a cylinder's rim —
   has its vertices DUPLICATED per face, each copy carrying its own face normal. Extruding
   those sends the two copies of a shared corner in different directions, so the hull tears
   itself open along every edge and you see through the seam. The mesh looks fine because
   the seam is exactly where the faces still meet; only the offset hull comes apart.

   So the outline gets its own geometry with normals averaged across coincident vertices —
   the shaded mesh keeps the original flat normals, which is the whole point of it.

   Averaging alone under-extrudes at corners, though: a smoothed normal sits at an angle
   to each face it came from, so a width of w only clears w*cos(that angle). Keeping the
   original normal in `aFlat` lets the shader divide it back out and clear w on every
   adjacent face — that is what closes the corners rather than merely narrowing the gap. */
function outlineGeom(src) {
  const g = src.clone();
  const p = g.attributes.position, n = g.attributes.normal;
  g.setAttribute('aFlat', new THREE.BufferAttribute(new Float32Array(n.array), 3));
  const buckets = new Map();
  for (let i = 0; i < p.count; i++) {
    /* quantised so vertices that are meant to be coincident actually collide */
    const k = `${Math.round(p.getX(i) * 64)},${Math.round(p.getY(i) * 64)},${Math.round(p.getZ(i) * 64)}`;
    let b = buckets.get(k);
    if (!b) { b = { x: 0, y: 0, z: 0, at: [] }; buckets.set(k, b); }
    b.x += n.getX(i); b.y += n.getY(i); b.z += n.getZ(i); b.at.push(i);
  }
  const v = new THREE.Vector3();
  buckets.forEach((b) => {
    v.set(b.x, b.y, b.z);
    if (v.lengthSq() < 1e-8) return;            /* opposed normals cancelled — leave them */
    v.normalize();
    b.at.forEach((i) => n.setXYZ(i, v.x, v.y, v.z));
  });
  n.needsUpdate = true;
  return g;
}

function outlineFor(mesh, w, sway) {
  /* THE HULL HAS TO MOVE WITH WHAT IT WRAPS. An inverted-hull outline is a second copy of the
     geometry; displace one in a vertex shader and not the other and the black shell walks off
     the crown, which looks exactly like the outline bug this whole system was built to fix.
     The same snippet, pasted into both. */
  const m = new THREE.Mesh(outlineGeom(mesh.geometry), new THREE.ShaderMaterial({
    uniforms: sway ? { w: { value: w }, uTime: FX.uTime, uSwayAmt: FX.uSwayAmt } : { w: { value: w } },
    vertexShader: `uniform float w;
      ${sway ? 'uniform float uTime; uniform float uSwayAmt;' : ''}
      attribute vec3 aFlat;
      void main(){
      vec3 transformed = position;
      ${sway ? SWAY_GLSL : ''}
      vec4 mv = modelViewMatrix * vec4(transformed, 1.0);
      float k = 1.0 / max( dot( normal, aFlat ), 0.30 );
      vec3 p = transformed + normal * (w * -mv.z * k);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`,
    fragmentShader: `void main(){ gl_FragColor = vec4(0.055, 0.06, 0.085, 1.0); }`,
    side: THREE.BackSide,
  }));
  m.position.copy(mesh.position);
  m.rotation.copy(mesh.rotation);
  m.scale.copy(mesh.scale);
  return m;
}

const outlines = [];
function tree(x, z, s) {
  const g = new THREE.Group();
  const y = heightAt(x, z);
  g.position.set(x, y, z);
  g.scale.setScalar(s);
  scene.add(g);

  const barkMat = new THREE.MeshToonMaterial({ color: 0x584234, gradientMap: RAMP });
  barkMat.userData.rim = 1;
  const bark = cloudy(barkMat);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(13, 22, 190, 7), bark);
  trunk.position.y = 95; trunk.castShadow = true; trunk.receiveShadow = true;
  g.add(trunk);
  const ot = outlineFor(trunk, 0.0022); g.add(ot); outlines.push(ot);

  [[0, 236, 0, 96], [-52, 200, 26, 66], [58, 208, -20, 72], [8, 292, -30, 58]]
    .forEach(([bx, by, bz, r], i) => {
      const leafMat = new THREE.MeshToonMaterial({
        color: [0x5d7d3a, 0x51702f, 0x678a42, 0x4a672c][i], gradientMap: RAMP,
      });
      leafMat.userData.sway = 1;      /* foliage moves; the trunk does not */
      leafMat.userData.rim = 1;
      const leaf = cloudy(leafMat);
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), leaf);
      m.position.set(bx, by, bz);
      m.scale.set(1.18, 0.92, 1.1);
      m.castShadow = true; m.receiveShadow = true;
      g.add(m);
      const o = outlineFor(m, 0.0026, true); g.add(o); outlines.push(o);
    });
  return g;
}
tree(-120, 130, 1.9);

/* ---- THE TREELINE ----
   Sugi along the ridge crest, because what shafts need is a silhouette with GAPS in it and a
   row of narrow cones is the cheapest thing that has them. Instanced: two draw calls for the
   whole stand instead of eighty, which matters because this lab gets driven on a software
   rasteriser. No outline hull — the outline system is already proven on the near tree and the
   rocks, and an inverted hull per instance is not worth the draw calls to prove it twice.
   They stop short of the notches on purpose: a saddle packed with trees is not a saddle. */
{
  const N = 34;
  const trunkG = new THREE.CylinderGeometry(9, 15, 120, 5);
  const crownG = new THREE.ConeGeometry(74, 300, 6);
  const trunkM = new THREE.MeshToonMaterial({ color: 0x4b3a2e, gradientMap: RAMP });
  const crownM = new THREE.MeshToonMaterial({ color: 0x3f5c30, gradientMap: RAMP });
  crownM.userData.sway = 1;
  crownM.userData.rim = 1;
  trunkM.userData.rim = 1;
  const trunks = new THREE.InstancedMesh(trunkG, cloudy(trunkM), N);
  const crowns = new THREE.InstancedMesh(crownG, cloudy(crownM), N);
  trunks.castShadow = crowns.castShadow = true;
  trunks.receiveShadow = crowns.receiveShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  const pv = new THREE.Vector3(), sv = new THREE.Vector3();
  let n = 0;
  for (let i = 0; i < N; i++) {
    const x = -2050 + (i / (N - 1)) * 4100 + (Math.sin(i * 7.3) * 46);
    /* the two saddles stay open */
    if (Math.abs(x - 250) < 240 || Math.abs(x + 1150) < 250) continue;
    const z = RIDGE_Z + Math.sin(i * 2.9) * 130;
    const y = heightAt(x, z);
    const s = 0.78 + ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1 * 0.55;
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), i * 1.31);
    pv.set(x, y + 60 * s, z); sv.setScalar(s);
    trunks.setMatrixAt(n, m.compose(pv, q, sv));
    pv.set(x, y + (120 + 130) * s, z);
    crowns.setMatrixAt(n, m.compose(pv, q, sv));
    n++;
  }
  trunks.count = crowns.count = n;
  trunks.instanceMatrix.needsUpdate = crowns.instanceMatrix.needsUpdate = true;
  scene.add(trunks, crowns);
}

/* a couple of rocks, so the shadow test has more than one caster */
[[380, -260, 54], [-520, -420, 38], [190, 420, 30]].forEach(([x, z, r]) => {
  const rockMat = new THREE.MeshToonMaterial({ color: 0x8a8275, gradientMap: RAMP });
  rockMat.userData.rim = 1;
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), cloudy(rockMat));
  m.position.set(x, heightAt(x, z) + r * 0.45, z);
  m.rotation.set(0.5, x * 0.01, 0.3);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  const o = outlineFor(m, 0.0024); scene.add(o); outlines.push(o);
});


/* ============================ PETALS ============================
   The one VFX that IS the design rather than decoration on it: STUDY's four gardens are the four
   seasons, so falling cherry and maple are the subject, not an effect laid over it. One
   InstancedMesh each, all the motion in the vertex shader off a per-instance seed, so a thousand
   of them cost one draw call and nothing per frame on the CPU. */
const PETALS = { uTime: { value: 0 }, uAmt: { value: 1 } };
function petalField(count, colorA, colorB, box) {
  const g = new THREE.PlaneGeometry(1, 1);
  const seed = new Float32Array(count * 4);
  for (let i = 0; i < count; i++) {
    seed[i * 4] = Math.random();          /* across    */
    seed[i * 4 + 1] = Math.random();      /* fall phase */
    seed[i * 4 + 2] = Math.random();      /* rate       */
    seed[i * 4 + 3] = Math.random();      /* depth, size, colour mix */
  }
  g.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seed, 4));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: {
      uTime: PETALS.uTime, uAmt: PETALS.uAmt,
      uA: { value: new THREE.Color(colorA) }, uB: { value: new THREE.Color(colorB) },
      uBox: { value: new THREE.Vector3(box[0], box[1], box[2]) },
      uOrigin: { value: new THREE.Vector3(box[3], box[4], box[5]) },
      fogColor: { value: scene.fog.color },
      fogNear: { value: scene.fog.near }, fogFar: { value: scene.fog.far },
    },
    vertexShader: [
      'attribute vec4 aSeed;',
      'uniform float uTime; uniform vec3 uBox; uniform vec3 uOrigin;',
      'uniform vec3 uA; uniform vec3 uB;',
      'varying vec3 vCol; varying float vFog; varying vec2 vUv; varying float vFall;',
      'void main() {',
      '  vUv = uv;',
      /* FALL IS A SAWTOOTH, NOT A SIMULATION. A petal that reappears at the top the instant it
         lands needs no state, never drifts out of its box, and cannot desynchronise. */
      /* THE BOX IS 620 UNITS, WHICH IS 25 METRES. The old rate crossed it in 3.5 to 6
         seconds — five metres a second, which is a stone, not a petal. 14 to 22 seconds is
         about 1.2 m/s, brisk for a real petal and slow enough to read as drifting. */
      '  float fall = fract( aSeed.y + uTime * ( 0.0079 + aSeed.z * 0.0045 ) );',
      '  vec3 p = uOrigin;',
      '  p.x += ( aSeed.x - 0.5 ) * uBox.x;',
      '  p.z += ( aSeed.w - 0.5 ) * uBox.z;',
      '  p.y += ( 1.0 - fall ) * uBox.y;',
      /* THE SLIP AND THE TUMBLE ARE TWO DIFFERENT RATES, and running both off one phase was
         the other half of the speed problem — the same number cannot be right for a turn and
         for a drift. A petal turns over every two or three seconds and MEANDERS across seven
         to twelve, so they get separate clocks. */
      '  float tum = uTime * ( 0.273 + aSeed.z * 0.164 ) + aSeed.x * 30.0;',
      '  float ph = uTime * ( 0.091 + aSeed.z * 0.065 ) + aSeed.x * 17.0;',
      '  p.x += sin( ph ) * 30.0;',
      '  p.z += cos( ph * 0.77 ) * 26.0;',
      /* SIZE AND SPREAD ARE THE WHOLE EFFECT. The first pass ran 1,600 petals at 5-10 units
         across a 1,700-unit box and it read as DUST - an even rash of specks over the whole
         frame including empty sky, which is what a particle system looks like when nobody
         decided where the particles come FROM. A quarter as many, twice the size, in a box
         that hugs the tree they fell off. */
      '  float sz = 13.0 + aSeed.w * 11.0;',
      '  vec3 right = vec3( modelViewMatrix[0][0], modelViewMatrix[1][0], modelViewMatrix[2][0] );',
      '  vec3 up    = vec3( modelViewMatrix[0][1], modelViewMatrix[1][1], modelViewMatrix[2][1] );',
      '  float r = tum;',
      '  vec2 q = vec2( position.x * cos( r ) - position.y * sin( r ),',
      '                 position.x * sin( r ) + position.y * cos( r ) );',
      /* squashed on one axis by the same phase, which is what reads as a petal turning over
         rather than as a disc spinning in its own plane */
      '  q.x *= 0.35 + 0.65 * abs( sin( tum * 0.5 ) );',
      '  vec3 wp = p + ( right * q.x + up * q.y ) * sz;',
      '  vec4 mv = viewMatrix * vec4( wp, 1.0 );',
      '  vFog = -mv.z;',
      '  vCol = mix( uA, uB, aSeed.w );',
      '  vFall = fall;',
      '  gl_Position = projectionMatrix * mv;',
      '}',
    ].join('\n'),
    fragmentShader: [
      'varying vec3 vCol; varying float vFog; varying vec2 vUv; varying float vFall;',
      'uniform float uAmt;',
      'uniform vec3 fogColor; uniform float fogNear; uniform float fogFar;',
      'void main() {',
      /* a petal shape, not a square: an ellipse pinched on one axis */
      '  vec2 d = vUv - 0.5;',
      '  float rr = length( vec2( d.x * 1.7, d.y ) );',
      '  if ( rr > 0.5 ) discard;',
      '  vec3 c = mix( vCol, vec3( 1.0 ), 0.25 * ( 1.0 - rr * 2.0 ) );',
      '  float f = smoothstep( fogNear, fogFar, vFog );',
      /* BOTH ENDS. fall = 0 is the TOP of the box, so the single smoothstep here only ever
         faded petals out at the bottom and let them snap into existence at full opacity at the
         top — invisible while they crossed the box three times a second, obvious now. */
      '  float born = smoothstep( 0.0, 0.06, vFall ) * smoothstep( 1.0, 0.90, vFall );',
      '  gl_FragColor = vec4( mix( c, fogColor, f ), uAmt * born * ( 1.0 - f ) );',
      '}',
    ].join('\n'),
  });
  const im = new THREE.InstancedMesh(g, mat, count);
  im.frustumCulled = false;
  scene.add(im);
  return im;
}
/* cherry over the near ground and maple further out, so both are judged in one frame */
const petalMeshes = [
  petalField(240, 0xf0c8d4, 0xe093ad, [640, 620, 560, -140, 300, 150]),
  petalField(180, 0xd4703e, 0xa8402a, [560, 560, 520, 330, 250, -420]),
];

/* A TILING VALUE-NOISE TEXTURE, built once. The mist needs several octaves sampled twice per
   fragment across thirty large overlapping transparent cards; doing that with hash-and-sin in
   the shader is ~40 transcendentals per pixel of heavy overdraw. A 256px texture is two fetches.
   The lattice wraps, so the texture repeats without a seam. */
function noiseTexture(size, octaves) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  const layers = [];
  let amp = 0;
  for (let o = 0; o < octaves; o++) {
    const n = 4 << o;
    const g = new Float32Array(n * n);
    for (let i = 0; i < n * n; i++) g[i] = Math.random();
    layers.push({ n, g, a: 1 / (1 << o) });
    amp += 1 / (1 << o);
  }
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let v = 0;
      for (const l of layers) {
        const fx = x / size * l.n, fy = y / size * l.n;
        const x0 = Math.floor(fx), y0 = Math.floor(fy);
        const tx = fx - x0, ty = fy - y0;
        const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
        const i0 = x0 % l.n, i1 = (i0 + 1) % l.n;
        const j0 = y0 % l.n, j1 = (j0 + 1) % l.n;
        const a0 = l.g[j0 * l.n + i0], b0 = l.g[j0 * l.n + i1];
        const a1 = l.g[j1 * l.n + i0], b1 = l.g[j1 * l.n + i1];
        const top = a0 + (b0 - a0) * sx, bot = a1 + (b1 - a1) * sx;
        v += l.a * (top + (bot - top) * sy);
      }
      const q = (y * size + x) * 4;
      img.data[q] = img.data[q + 1] = img.data[q + 2] = (v / amp) * 255;
      img.data[q + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const NOISE_TEX = noiseTexture(256, 5);

/* ============================ MIST RIBBONS ============================
   Height fog is atmosphere — it has no shape. What a valley at dawn actually has is STRANDS: a
   few visible banks lying along the low ground, which is what tells you the air has depth rather
   than just haze in it. One InstancedMesh of soft billboards, turned about the vertical axis only
   so they stay horizontal — a mist bank that tilts to face the camera is a sprite.

   THEY DO NOT INTERSECT THE GROUND. Soft-particle depth fade needs the scene's depth texture, and
   these are drawn INTO that same buffer, so it cannot sample itself. Placing each one a known
   clearance above the terrain avoids the hard intersection line entirely, which for a stylised
   look is the cheaper answer to the same problem. */
const MIST = { uTime: { value: 0 }, uAmt: { value: 0.5 } };
{

       lowest of eight candidates lands, so the low corners still get some. */
    const inValley = i % 3 !== 0;
    for (let t = 0; t < 8; t++) {
      const cx = (Math.random() - 0.5) * (inValley ? 2600 : 4000) + (inValley ? 150 : 0);
      const cz = inValley ? HOLLOW_Z + (Math.random() - 0.5) * 620

       and a 15-unit clearance ended up with half its body underground, showing only its top
       half as a stain lying on the slope. Place the foot, then add half the height. */
    const h = 90 + Math.random() * 150;           /* wide and thin, not square */
    off[i * 3] = x;
    off[i * 3 + 1] = gy + 40 + Math.random() * 90 + h * 0.5;

    seed[i * 4 + 1] = h;

      '  vec3 toCam = normalize( vec3( cameraPosition.x - c.x, 0.0, cameraPosition.z - c.z ) );',

      '          + texture2D( tNoise, vNz * 4.60 + vec2( uTime * 0.0016, uTime * -0.0022 ) ).r * 0.18;',

      '  float a = env * smoothstep( 0.34, 0.74, n + env * 0.20 ) * vOp * uAmt;',
      /* IT FADES OUT CLOSE AS WELL AS FAR. 120 units was far too near: a 1,500-unit bank seen

         point of being detail. Nothing shows until 300 and it is not full until 1,500. */
      '  a *= smoothstep( 300.0, 1500.0, vFog ) * ( 1.0 - smoothstep( fogNear, fogFar, vFog ) );',

  im.frustumCulled = false;
  im.renderOrder = 2;
  scene.add(im);

/* ============================ POST ============================
   ONE PASS, NOT A CHAIN. The main mockup has no EffectComposer, already renders the scene twice a
   frame for the planar reflection, and does it inside a CSS3D sandwich. So the grade, the bloom
   composite, the vignette and the grain are a single fullscreen shader; only the bloom's blur
   costs extra draws and it runs at quarter resolution where nobody can tell.

   TONE MAPPING MOVES OFF THE RENDERER AND INTO THE COMPOSITE. The scene has to reach the bloom
   threshold in LINEAR light — tone mapping first flattens exactly the highlights bloom is
   supposed to find, so a bright-pass after ACES finds almost nothing and the effect reads as
   broken rather than as subtle. */
const POST = {
  exposure: { value: 1.05 },
  bloomAmt: { value: 0.55 },
  bloomCut: { value: 0.72 },
  grain: { value: 0.055 },
  vignette: { value: 0.30 },
  splitShadow: { value: new THREE.Color(0x2a3a5c) },
  splitHigh: { value: new THREE.Color(0xffd9a8) },
  splitAmt: { value: 0.22 },
  /* LIFT, CONTRAST AND SATURATION are what separate one look from another; exposure and bloom
     alone only make the same picture brighter or softer. Lift in particular is the whole
     difference between a cinematic grade and an ink-wash one — paper has no black on it. */

  contrast: { value: 1.0 },
  sat: { value: 1.0 },
  bloomTint: { value: new THREE.Color(0xffe9cf) },
  uTime: { value: 0 },
  /* SUN SHAFTS COME OUT OF THE BLOOM BUFFER, NOT OUT OF GEOMETRY. The bright pass already holds
     the sky and the sun and nothing else — the hill and the tree are black in it — so a radial
     blur toward the sun's screen position produces shafts that are occluded by the scene for
     free. Cones of geometry would cost more and be harder to make behave. */

  /* the occlusion pass's own threshold, an order of magnitude below bloom's, because it is
     asking where the SKY is rather than where the highlights are */
  shaftCut: { value: 0.20 },
  shaftReach: { value: 0.62 },
  shaftDensity: { value: 1.0 },
  shaftDecay: { value: 0.93 },
  sunUv: { value: new THREE.Vector2(0.5, 0.5) },
  sunVis: { value: 0 },

const fsGeo = new THREE.BufferGeometry();
fsGeo.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
fsGeo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 2, 0, 0, 2], 2));
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fsScene = new THREE.Scene();
const fsQuad = new THREE.Mesh(fsGeo, null);
fsQuad.frustumCulled = false;
fsScene.add(fsQuad);
function blit(mat, target) {

  renderer.setRenderTarget(target || null);
  renderer.render(fsScene, fsCam);
}

const rtA = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: false });
const rtB = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: false });

   its own target instead of being blurred in place. A crepuscular ray is the silhouette of an
   occluder printed through the glow; at quarter res under two blur passes a tree trunk is about
   two texels wide and the blur removes it entirely, which is why the effect kept coming back as
   a rounder halo however it was tuned. Half res keeps the crowns readable and still costs a
   quarter of the fill. */

  const dpr = Math.min(devicePixelRatio, 2);

  rtB.setSize(Math.max(1, w >> 2), Math.max(1, h >> 2));

    '  vec3 c = texture2D( tSrc, vUv ).rgb;',

    vignette: POST.vignette, splitShadow: POST.splitShadow, splitHigh: POST.splitHigh,
    splitAmt: POST.splitAmt, uTime: POST.uTime, uRes: { value: new THREE.Vector2(1, 1) },

  fragmentShader: [
    'varying vec2 vUv;',
    'uniform sampler2D tSrc; uniform sampler2D tBloom; uniform sampler2D tOcc;',
    'uniform float exposure, bloomAmt, grain, vignette, splitAmt, uTime;',
    'uniform float lift, contrast, sat;',
    'uniform vec3 bloomTint;',
    'uniform float shaftAmt, shaftDensity, shaftDecay, sunVis;',
    'uniform vec2 sunUv;',
    'uniform vec3 splitShadow, splitHigh;',
    'uniform vec2 uRes;',
    /* Narkowicz ACES: one polynomial, close enough to the real curve at a fraction of the cost */
    'vec3 aces( vec3 x ) {',
    '  return clamp( ( x * ( 2.51 * x + 0.03 ) ) / ( x * ( 2.43 * x + 0.59 ) + 0.14 ), 0.0, 1.0 );',
    '}',
    'vec3 lin2srgb( vec3 c ) {',
    '  c = max( c, vec3( 0.0 ) );',
    '  return mix( 1.055 * pow( c, vec3( 1.0 / 2.4 ) ) - 0.055, c * 12.92, step( c, vec3( 0.0031308 ) ) );',

    'float hash( vec2 p ) { return fract( sin( dot( p, vec2( 127.1, 311.7 ) ) ) * 43758.5453 ); }',
    'void main() {',
    '  vec3 c = texture2D( tSrc, vUv ).rgb;',

    '  if ( sunVis > 0.0 && shaftAmt > 0.0 ) {',

    /* JITTER THE FIRST STEP. Eighteen samples along a line is a stair; offsetting each pixel's
       start by a fraction of one step turns the stair into grain, which the paper texture then
       hides completely. */

    '    vec3 sh = vec3( 0.0 );',

    '    vec2 sd = abs( sunUv - vec2( 0.5 ) );',

       adding contrast just greys the whole image; pivot contrast around mid grey; desaturate

    '  vec2 d = vUv - 0.5;',

/* the whole chain, or the plain render if post is off */
function renderFrame() {
  if (!state.post) {
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
    return;
  }
  /* linear into the buffer; the curve is applied in the composite */
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);
  /* TWO PASSES OVER THE SAME PIXELS ASKING DIFFERENT QUESTIONS. Bloom wants highlights and
     wants them blurred; the shafts want visible sky near the sun and want it sharp. Sharing one
     buffer meant whichever question was asked second got the wrong answer. */
  matOcc.uniforms.tSrc.value = rtScene.texture;
  blit(matOcc, rtSharp);
  matBright.uniforms.tSrc.value = rtScene.texture;
  blit(matBright, rtA);
  matBlurH.uniforms.tSrc.value = rtA.texture;
  blit(matBlurH, rtB);
  matBlurV.uniforms.tSrc.value = rtB.texture;
  blit(matBlurV, rtA);
  matComposite.uniforms.tSrc.value = rtScene.texture;
  matComposite.uniforms.tBloom.value = rtA.texture;
  matComposite.uniforms.tOcc.value = rtSharp.texture;
  /* LOOK AT THE BUFFER, NOT AT THE OUTPUT. An effect that reads from an intermediate target can
     fail because its parameters are wrong or because the target is empty, and the final frame
     looks identical either way. */
  const dbg = window.LAB && window.LAB.show;
  if (!dbg) { blit(matComposite, null); return; }
  /* the VALUES are saved and restored, never the uniform objects — swapping those is how the
     cloud shadows lost their link to the state last time */
  const bs = POST.bloomAmt.value, ss = POST.shaftAmt.value;
  matComposite.uniforms.tSrc.value =
    dbg === 'sharp' ? rtSharp.texture : dbg === 'bloom' ? rtA.texture : rtScene.texture;
  POST.bloomAmt.value = 0;
  POST.shaftAmt.value = 0;
  blit(matComposite, null);
  POST.bloomAmt.value = bs;
  POST.shaftAmt.value = ss;
}

  { name: 'yuugure 夕暮', note: 'dusk — teal shadow, ember highlight, dark corners',
    exposure: 0.95, bloomAmt: 0.78, bloomCut: 0.62, bloomTint: 0xffb27a,
    grain: 0.050, vignette: 0.46, splitAmt: 0.42, splitShadow: 0x1c3a44, splitHigh: 0xffb07e,
    contrast: 1.08, sat: 1.02, lift: 0.012 },
  { name: 'ukiyo 浮世', note: 'woodblock — flat, cream, no bloom, all fibre',
    exposure: 1.04, bloomAmt: 0.16, bloomCut: 0.90, bloomTint: 0xfff3d6,
    grain: 0.165, vignette: 0.09, splitAmt: 0.30, splitShadow: 0x3d3a52, splitHigh: 0xfff0cc,
    contrast: 0.86, sat: 0.80, lift: 0.105 },
  { name: 'yoru 夜', note: 'night — cool, crushed, heavy vignette',
    exposure: 0.70, bloomAmt: 0.55, bloomCut: 0.52, bloomTint: 0xa8c8ff,
    grain: 0.060, vignette: 0.56, splitAmt: 0.34, splitShadow: 0x18233f, splitHigh: 0xb9d2ff,
    contrast: 1.18, sat: 0.74, lift: 0.020 },
  { name: 'nama 生', note: 'ungraded — ACES and gamma only, the control',
    exposure: 1.00, bloomAmt: 0.00, bloomCut: 0.99, bloomTint: 0xffffff,
    grain: 0.000, vignette: 0.00, splitAmt: 0.00, splitShadow: 0x808080, splitHigh: 0x808080,
    contrast: 1.00, sat: 1.00, lift: 0.000 },
];
let gradeIx = 0;
/* a `let`, not a `const` assigned later: setGrade is defined above apply() and may run before
   it, and `typeof` on a const still in its temporal dead zone throws rather than returning
   'undefined' — the one place the typeof guard does not guard */
let hudPaint = null;
function setGrade(g) {
  if (typeof g === 'string') g = Math.max(0, GRADES.findIndex((x) => x.name.startsWith(g)));
  gradeIx = ((g % GRADES.length) + GRADES.length) % GRADES.length;
  const G = GRADES[gradeIx];
  for (const k of ['exposure', 'bloomAmt', 'bloomCut', 'grain', 'vignette', 'splitAmt',
    'contrast', 'sat', 'lift']) POST[k].value = G[k];
  POST.splitShadow.value.setHex(G.splitShadow);
  POST.splitHigh.value.setHex(G.splitHigh);
  POST.bloomTint.value.setHex(G.bloomTint);
  if (hudPaint) hudPaint();
  return G.name;
}

/* ============================ TOGGLES ============================ */
const hud = document.getElementById('hud');
function apply() {
  repaintTerrain();
  const toonMats = [];
  scene.traverse((o) => { if (o.isMesh && o.material && o.material.isMeshToonMaterial) toonMats.push(o.material); });
  /* toon off: swap the ramp out so shading goes smooth, which is the Lambert look */
  toonMats.forEach((m) => { if (m === matToon) return; m.gradientMap = state.toon ? RAMP : null; m.needsUpdate = true; });
  /* THE FINDING: terrain always takes smooth shading. A 4-step ramp across a large curved
     surface quantises into contour blotches, while the same ramp reads correctly on the tree
     and the rocks. Toon is for objects; terrain gets ramp colour + baked AO + shadows. */
  ground.material = matPlain;
  outlines.forEach((o) => { o.visible = state.toon; });
  renderer.shadowMap.enabled = state.shadow;
  CLOUD.uCloudAmt.value = state.clouds ? 0.78 : 0;
  HFOG.uHfAmt.value = state.hfog ? 0.85 : 0;
  FX.uRimAmt.value = state.rim ? 0.55 : 0;
  FX.uSwayAmt.value = state.sway ? 7.0 : 0;
  FX.uAerialAmt.value = state.aerial ? 0.85 : 0;
  MIST.uAmt.value = state.mist ? 0.72 : 0;
  MIST.mesh.visible = state.mist;
  POST.shaftAmt.value = state.shafts ? 0.9 : 0;
  petalMeshes.forEach((m) => { m.visible = state.petals; });
  scene.traverse((o) => { if (o.isMesh) o.material.needsUpdate = true; });
  const row = (on, k, label) => `<div class="${on ? '' : 'off'}">[${k}] ${on ? '<b>on </b>' : 'off'} ${label}</div>`;
  hud.innerHTML = '<h1>SHADING LAB</h1>'
    + row(state.ao, 1, 'vertex AO (baked)')
    + row(state.ramp, 2, 'slope/height ramp colour')
    + row(state.toon, 3, 'toon ramp + outline (objects only)')
    + row(state.shadow, 4, 'shadow map')
    + row(state.clouds, 5, 'drifting cloud shadows')
    + row(state.hfog, 6, 'height fog (valley mist)')
    + row(state.post, 7, 'post: grade + bloom + grain + vignette')
    + row(state.petals, 8, 'falling petals')
    + row(state.rim, 'Q', 'sky rim light')
    + row(state.sway, 'W', 'wind sway (foliage + its outline)')
    + row(state.aerial, 'E', 'aerial tint (fog warms toward the sun)')
    + row(state.mist, 'R', 'mist ribbons (banks in the low ground)')
    + row(state.shafts, 'T', 'sun shafts (march through the occlusion buffer)')
    + '<div style="margin-top:8px">[ [ ] ] grade <b>' + (gradeIx + 1) + '/' + GRADES.length
      + '  ' + GRADES[gradeIx].name + '</b></div>'
    + '<div class="off" style="margin-left:22px">' + GRADES[gradeIx].note + '</div>'
    + '<div class="off" style="margin-top:8px">[0] all off &nbsp; [9] all on</div>';
}
hudPaint = apply;
addEventListener('keydown', (e) => {
  if (e.key === '1') state.ao = !state.ao;
  else if (e.key === '2') state.ramp = !state.ramp;
  else if (e.key === '3') state.toon = !state.toon;
  else if (e.key === '4') state.shadow = !state.shadow;
  else if (e.key === '5') state.clouds = !state.clouds;
  else if (e.key === '6') state.hfog = !state.hfog;
  else if (e.key === '7') state.post = !state.post;
  else if (e.key === '8') state.petals = !state.petals;
  else if (e.key === 'q' || e.key === 'Q') state.rim = !state.rim;
  else if (e.key === 'w' || e.key === 'W') state.sway = !state.sway;
  else if (e.key === 'e' || e.key === 'E') state.aerial = !state.aerial;
  else if (e.key === 'r' || e.key === 'R') state.mist = !state.mist;
  else if (e.key === 't' || e.key === 'T') state.shafts = !state.shafts;
  else if (e.key === '[') { setGrade(gradeIx - 1); return; }
  else if (e.key === ']') { setGrade(gradeIx + 1); return; }
  else if (e.key === '0') Object.keys(state).forEach((k) => { state[k] = false; });
  else if (e.key === '9') Object.keys(state).forEach((k) => { state[k] = true; });
  else return;
  apply();
});
apply();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  sizePost();
});

/* MOTION IS INVISIBLE IN A SCREENSHOT. "Too fast" and "too dynamic" are claims about change
   over time, and no number of stills can settle one — which is how an eight-hertz sway survived
   a whole round of review. Hold the camera, read the exact pixels twice a known interval apart,
   report how far they moved.

   Through a RENDER TARGET, not the canvas: the canvas has no preserveDrawingBuffer, and a
   target also bypasses the post chain, whose bloom smears local motion across the whole frame
   and would make a calm tree score like a busy one. */
const MOTION_W = 480, MOTION_H = 320;
const MOTION_RT = new THREE.WebGLRenderTarget(MOTION_W, MOTION_H);
const MOTION_BUF = [new Uint8Array(MOTION_W * MOTION_H * 4), new Uint8Array(MOTION_W * MOTION_H * 4)];
function motionRead(i) {
  const prev = renderer.getRenderTarget();
  renderer.setRenderTarget(MOTION_RT);
  renderer.render(scene, camera);
  renderer.readRenderTargetPixels(MOTION_RT, 0, 0, MOTION_W, MOTION_H, MOTION_BUF[i]);
  renderer.setRenderTarget(prev);
}
function motion(ms) {
  motionRead(0);
  return new Promise((res) => setTimeout(() => {
    motionRead(1);
    const a = MOTION_BUF[0], b = MOTION_BUF[1];
    let moved = 0, sum = 0;
    for (let q = 0; q < a.length; q += 4) {
      const d = Math.abs(a[q] - b[q]) + Math.abs(a[q + 1] - b[q + 1]) + Math.abs(a[q + 2] - b[q + 2]);
      if (d > 8) moved++;
      sum += d / 3;
    }
    const n = a.length / 4;
    res({ ms, pct: +(100 * moved / n).toFixed(2), mean: +(sum / n).toFixed(2) });
  }, ms));
}

/* a lab you cannot take a controlled screenshot of is a worse lab: freeze pins the orbit
   so two toggle states can be compared from the identical camera */
let t = 0, ct = 0;
/* view: [eyeX, eyeY, eyeZ, atX, atY, atZ] pins the camera anywhere — the only way to get
   close enough to an object to judge an outline seam */
window.LAB = {
  state, apply, CLOUD, cloud: CLOUD.uCloudMap.value.image,
  HFOG, POST, PETALS, FX, MIST, petalMeshes, sunAt, SUN_SPRITES,
  GRADES, grade: setGrade, gradeName: () => GRADES[gradeIx].name,
  scene, camera, renderer, key, ground, motion, THREE, heightAt,
  rtSharp, rtBloom: rtA, rtScene,
  freeze: false, view: null, show: null, at: (v) => { t = v; },
};

/* CT ADVANCES PER SECOND, NOT PER FRAME. It used to be `ct += 0.0016` once a tick, which
   makes every animation in the lab a function of frame rate: the same sway is 4.9 rad/s at
   60 fps, 11.8 at 144, and 1.1 in the headless browser where all the measuring happens. That
   is why the rates here were tuned blind for as long as they were — nobody was ever looking
   at the speed anyone else was seeing. 0.096/s is exactly the old per-frame rate at 60 fps,
   so the look is unchanged on a 60 Hz machine and merely correct everywhere else.
   The clamp is for a backgrounded tab, which otherwise resumes with a several-second jump —
   and it is 0.5, not 0.1, because the headless browser this gets measured in runs at 6 fps on
   a software rasteriser and hitches well past that. Every clamped frame drops real time on the
   floor, so a tight clamp silently reintroduces exactly the frame-rate dependence the
   performance.now() clock exists to remove — at 0.1 it ran the world at 69% speed, at 0.25 at
   83%. Half a second still catches a backgrounded tab, which resumes seconds late, not
   milliseconds. */
const CT_RATE = 0.096;
let ctLast = performance.now();
function tick() {
  const now = performance.now();
  const dt = Math.min((now - ctLast) / 1000, 0.5);
  ctLast = now;
  /* the weather clock keeps running while the camera is pinned, so drift can be checked
     on its own instead of being confounded with the orbit */
  ct += dt * CT_RATE;
  if (!window.LAB.freeze) t += dt * CT_RATE;
  /* the cover drifts across the valley — slow enough to read as weather, not as a texture
     being scrolled. Direction is deliberately not the light direction, so the shadow edges
     cross the terminator rather than sliding along it. */
  CLOUD.uCloudOff.value.set(ct * 0.22, ct * -0.08);
  PETALS.uTime.value = ct * 60;
  FX.uTime.value = ct * 60;
  MIST.uTime.value = ct * 60;
  /* the sun's screen position, recomputed every frame because the camera orbits */
  {
    const v = SUN_AT.clone().project(camera);
    POST.sunUv.value.set(v.x * 0.5 + 0.5, -v.y * 0.5 + 0.5);
    POST.sunVis.value = v.z < 1 ? 1 : 0;
  }
  POST.uTime.value = ct;
  for (const m of CLOUD_MATS) m.needsUpdate = true;   /* see THE UNIFORM TRAP above */
  const v = window.LAB.view;
  if (v) { camera.position.set(v[0], v[1], v[2]); camera.lookAt(v[3], v[4], v[5]); }
  else { camera.position.set(Math.cos(t) * 2700, 1450, Math.sin(t) * 2700); camera.lookAt(0, 620, 0); }
  renderFrame();
  requestAnimationFrame(tick);
}
tick();
</script>
