}
swan.scale.setScalar(0.9);
frontScene.add(swan);

const swanState = {
  pos: new THREE.Vector3(300, 100, 420),
  vel: new THREE.Vector3(),
  target: new THREE.Vector3(300, 100, 420),
  bank: 0, heading: 0, flap: 0, idleT: 0,
  lastTrail: 0,
};
let mouseNX = 0, mouseNY = 0;
addEventListener('mousemove', (e) => {
  mouseNX = (e.clientX / W()) * 2 - 1;
  mouseNY = -((e.clientY / H()) * 2 - 1);
});
/* the crane keeps its own counsel: drifting waypoints, not the pointer */
const wander = { nx: 0.55, ny: 0.25, depth: 430, next: 6, dashT: 0, dashDir: 0 };
function retarget(t) {
  wander.next = t + 5 + Math.random() * 4.5;
  if (state === 'menu') {
    wander.nx = -0.8 + Math.random() * 1.65;
    wander.ny = -0.35 + Math.random() * 1.05;
  } else {
    /* a menu is open — keep to the edges rather than flying across the content */
    wander.nx = (Math.random() < 0.5 ? -1 : 1) * (0.62 + Math.random() * 0.28);
    wander.ny = 0.3 + Math.random() * 0.5;
  }
  wander.depth = 410 + Math.random() * 190;
}
const _unproj = new THREE.Vector3();
function swanTargetUpdate(t) {
  if (t > wander.next) retarget(t);
  let nx = wander.nx + Math.sin(t * 0.7) * 0.06;
  let ny = wander.ny + Math.sin(t * 1.1) * 0.05 + Math.sin(t * 0.35) * 0.03;
  /* shy: slips aside if the pointer crowds it */
  const dx = nx - mouseNX, dy = ny - mouseNY;
  const d2 = dx * dx + dy * dy;
  if (d2 < 0.09) { const d = Math.sqrt(d2) || 0.01; nx += (dx / d) * (0.3 - d); ny += (dy / d) * (0.3 - d) * 0.7; }
  nx = THREE.MathUtils.clamp(nx, -0.85, 0.9);
  ny = THREE.MathUtils.clamp(ny, -0.6, 0.75);
  _unproj.set(nx, ny, 0.5).unproject(camera).sub(camera.position).normalize();
  swanState.target.copy(camera.position).addScaledVector(_unproj, wander.depth);
  if (t < wander.dashT) swanState.target.x += wander.dashDir * 900;
}
function swanDash(dir) { wander.dashT = clock.elapsedTime + 0.5; wander.dashDir = dir; swanState.vel.x += dir * 700; }
const _swanLook = new THREE.Vector3();
function swanTick(dt, t) {
  if (reduced) { swan.position.set(camera.position.x + 260, camera.position.y + 60, camera.position.z - 320); return; }
  swanTargetUpdate(t);
  const s = swanState;
  /* soft spring with drag — the crane glides, laggy and calm */
  s.vel.x += (s.target.x - s.pos.x) * 2.1 * dt; s.vel.y += (s.target.y - s.pos.y) * 2.1 * dt; s.vel.z += (s.target.z - s.pos.z) * 2.1 * dt;
  s.vel.multiplyScalar(Math.max(0, 1 - 2.6 * dt));
  const cap = t < wander.dashT ? 1500 : 720;
  const sp = s.vel.length();
  if (sp > cap) s.vel.multiplyScalar(cap / sp);
  s.pos.addScaledVector(s.vel, dt);
  swan.position.copy(s.pos);
  /* face travel, bank into turns */
  if (sp > 12) {
    const newHeading = Math.atan2(s.vel.x, s.vel.z);
    let dh = newHeading - s.heading;
    if (dh > Math.PI) dh -= Math.PI * 2; if (dh < -Math.PI) dh += Math.PI * 2;
    s.bank += (THREE.MathUtils.clamp(-dh * 14, -0.55, 0.55) - s.bank) * 0.1;
    s.heading = newHeading;
    _swanLook.copy(s.pos).addScaledVector(s.vel, 0.5);
    swan.lookAt(_swanLook);
    swan.rotateZ(s.bank);
  }
  /* flap: brisk when pushing, slow glide when cruising */
  const amp = sp > 320 ? 0.24 : 0.52;
  s.flap += dt * (4.2 + sp * 0.011);
  const w = Math.sin(s.flap) * amp;
  swan.userData.wingL.rotation.z = w;
  swan.userData.wingR.rotation.z = -w;
  swan.userData.neck.rotation.x = Math.sin(s.flap * 0.5) * 0.05;
  /* gold paper-dust trail when it hurries */
  if (sp > 260 && t - s.lastTrail > 0.09) {
    s.lastTrail = t;
    const p = new THREE.Sprite(new THREE.SpriteMaterial({ map: softDot(232, 196, 124, 32), transparent: true, opacity: 0.7, depthWrite: false }));
    p.position.copy(s.pos);
    p.scale.set(10, 10, 1);
    frontScene.add(p);
    gsap.to(p.material, { opacity: 0, duration: 0.6, onComplete: () => frontScene.remove(p) });
    gsap.to(p.position, { y: p.position.y - 26, duration: 0.6, ease: 'power1.in' });
  }
}

/* CSS3DObject writes `pointer-events: auto` inline on every element it wraps, so no stylesheet
   rule can make scenery click-through — it has to be undone per object. Anything that is not a
   control is decoration and gets switched off here; the giant ghost watermark alone was covering
   the two rearmost options outright in READING and JLPT.
   Must run AFTER the object is constructed: the constructor is what writes 'auto', so setting
   it beforehand simply gets overwritten. */
function decorPlane(el) {
  if (el.tagName !== 'BUTTON' && !el.classList.contains('type-item') && !el.classList.contains('plane-sub')) {
    el.style.pointerEvents = 'none';
  }
  return el;
}
function cssPlane(el, x, y, z, ry = 0, rz = 0) {
  const obj = new CSS3DObject(el);
  decorPlane(el);
  obj.position.set(x, y, z);
  obj.rotation.y = ry;
  obj.rotation.z = rz;

}

/* ================= camera ================= */
const HOME = { px: 170, py: 60, pz: 830, tx: -240, ty: 30, tz: -160, fov: 42, roll: 0 };
/* `var`, deliberately: the resize handler is installed with the renderers, hundreds of lines
   above this, and a `const` would leave it reading a name in its temporal dead zone if the
   window is resized during the first frames. */
var cam = { ...HOME };

/* The guard that used to live here enforced "no room may fall inside the menu's frustum", and it
   earned its keep for as long as the scenery was CSS3D — an unculled plane really did paint
   through the menu. With depth-buffered geometry a room in shot is just a building in the
   distance, which is the point of a continuous world, so the rule is retired rather than
   silenced. (`?envs=all` still exists but only affects the CSS3D interface groups now — the
   scenery is unconditionally lit.) */
const breath = { y: 0, x: 0 };
const shake = { x: 0, y: 0 };
let parX = 0, parY = 0, parTX = 0, parTY = 0;

if (!reduced) {
  gsap.to(breath, { y: 9, duration: 4.2, yoyo: true, repeat: -1, ease: 'sine.inOut' });
  gsap.to(breath, { x: 6, duration: 6.4, yoyo: true, repeat: -1, ease: 'sine.inOut' });
}
addEventListener('mousemove', (e) => {
  parTX = (e.clientX / W() - 0.5) * 2;
  parTY = (e.clientY / H() - 0.5) * 2;
});

const _target = new THREE.Vector3();
function applyCamera() {
  parX += (parTX - parX) * 0.05;
  parY += (parTY - parY) * 0.05;
  camera.position.set(cam.px + breath.x + parX * 26 + shake.x, cam.py + breath.y - parY * 18 + shake.y, cam.pz);
  fitFov(cam.fov);
  _target.set(cam.tx + parX * 10, cam.ty - parY * 7, cam.tz);
  camera.lookAt(_target);
  camera.rotateZ(cam.roll * D2R);
}

const _wp = new THREE.Vector3();
function depthDress() {
  /* This is a *resting* effect: it gives the settled menu its near/far falloff. It must not run
     during a transition — the camera now dollies 1900 units outward on the way to a room, which
     drove every item to minimum opacity and maximum blur within a few frames, so the menu
     visibly dissolved while still on screen. Hold the resting look and let the camera carry it
     out of frame instead. */
  if (state !== 'menu') return;
  itemObjs.forEach((obj, i) => {
    obj.getWorldPosition(_wp);
    const d = camera.position.distanceTo(_wp);
    const el = itemEls[i];
    if (!el.classList.contains('entered')) return;
    if (el.classList.contains('is-consumed')) return;
    if (el.classList.contains('is-active')) {
      el.style.opacity = 1;
      el.style.filter = '';
      return;
    }
    const fade = THREE.MathUtils.clamp(1 - (d - 1150) / 950, 0.35, 1);
    const blur = THREE.MathUtils.clamp((d - 1250) / 340, 0, 3.5);
    el.style.opacity = state === 'menu' || state === 'moving' ? fade : 0.25;
    el.style.filter = blur > 0.4 ? `blur(${blur.toFixed(2)}px)` : '';
  });
}

/* ================= interaction ================= */
let state = 'menu';
let active = 0, busy = false;
/* a handle for headless verification: an arrival is a state change, and waiting a fixed number
   of milliseconds for one is guesswork the moment the frame rate moves */
window.NAV = { get state() { return state; }, get busy() { return busy; },
  dests: () => DESTS.map((d) => ({ b: d.bearing, place: d.place.toArray().map(Math.round), eye: d.eye.toArray().map(Math.round) })),
  /* the camera rig itself. `applyCamera` rewrites camera.position from this every frame, so
     setting the camera object directly does nothing — any question about what a point on a
     flight path looks like has to be asked here. */
  get cam() { return cam; },
  /* letter the walk from outside, so the board-turn can be watched without a transition running
     over the top of it */
  reletter: (tile) => { if (WORLD_L3.REVIEW) WORLD_L3.REVIEW.letter(tile || '苦手札'); },
  /* the hover state of world level two, so a swing can be measured rather than eyeballed */
  swing: () => (worldL2 || { picks: [] }).picks.map((q) => ({
    jp: q.jp, x: +q.root.rotation.x.toFixed(3), em: +q.face.material.emissive.r.toFixed(3),
  })),
  /* HOW MUCH OF THE SCENE IS OUTSIDE WHAT THE CORNER CORRECTION CAN HANDLE.
     `dot(smooth, flat)` is 1 on a flat face and 0.577 at a cube corner. Below 0.5 the weld
     averaged two parts that only touch, so the direction belongs to neither of them — that is the
     population which first spiked (a 0.30 floor is a 3.3x multiplier) and then, when it was made
     to fall back to the face normal, went degenerate in screen space. It cannot be eyeballed and
     it does not show in a still frame, so count it. */
  /* WHAT IS ACTUALLY UNDER A SCREEN POINT. "The end of the tunnel looks flat" is a question about
     which object is filling forty pixels at nine thousand units, and looking at a screenshot
     cannot answer it — four separate guesses at that one window (a tree, a taller tree, a
     recoloured hall, a bigger hall) all failed because the thing being changed was not the thing
     in the way. A ray costs nothing and names it. */
  hit: (sx, sy) => {
    const r = new THREE.Raycaster();
    r.setFromCamera(new THREE.Vector2((sx / W()) * 2 - 1, -(sy / H()) * 2 + 1), camera);
    return r.intersectObjects(backScene.children, true).slice(0, 5).map((h) => ({
      /* WHAT IT IS, IF IT SAID. Vertex count and instance-ness were only ever a way of guessing
         at identity — "864 verts, instanced" meant "a tunnel gate" by inference. A mesh that
         bothers to name itself gets named back, which turns "is the veranda visible or has the
         eave above swallowed it" into a one-word answer. */
      name: h.object.name || '',
      dist: Math.round(h.distance),
      y: Math.round(h.point.y),
      verts: h.object.geometry ? h.object.geometry.attributes.position.count : 0,
      inst: h.object.isInstancedMesh ? 1 : 0,
    }));
  },
  /* WHAT A STAND-OFF ACTUALLY FRAMES. `stand`, `eyeLift` and the focus height are the three
     numbers that decide whether a place fits the screen, and until now the only way to settle
     them was edit, reload, look — which is how REVIEW's arrived, and how the sacred tree got
     placed three times. This parks the camera where a candidate set would put it, so a whole
     sweep is one page load: the trick `probe` plays for placement, applied to the shot. */
  tryStand: (i, off, lift, focusLift) => {
    const d = DESTS[i];
    const f = d.focus.clone();
    if (focusLift != null) f.y = d.place.y + focusLift;
    const e = standOff(f, off, lift);
    cam.px = e.x; cam.py = e.y; cam.pz = e.z;
    cam.tx = f.x; cam.ty = f.y; cam.tz = f.z;
    cam.roll = 0;
    return { eye: e.toArray().map(Math.round), focus: f.toArray().map(Math.round), dist: Math.round(e.distanceTo(f)) };
  },
  /* the screen box of a registered landmark, and of the name-board */
  rectOf: (k) => screenRect(MARKS[k]),
  /* where a point in a section's approach coordinates lands on screen, and how many pixels one
     world unit is worth there — which is the other half of "how big should it be" */
  probe: (key, f, sd, lift = 0) => {
    const at = PROBE[key];
    if (!at) return null;
    const v = at(f, sd, lift);
    const d = camera.position.distanceTo(v);
    const q = v.clone().project(camera);
    const up = at(f, sd, lift + 100).project(camera);
    return {
      x: Math.round((q.x * 0.5 + 0.5) * W()), y: Math.round((0.5 - q.y * 0.5) * H()),
      dist: Math.round(d), pxPerUnit: +(((q.y - up.y) * 0.5 * H()) / 100).toFixed(3),
      /* the ground itself, which is the other question asked of a station: a precinct's platform
         has to be set above the HIGHEST point it covers, and a site that turns out to be under
         the waterline is a different building */
      wy: Math.round(v.y - lift), wet: v.y - lift < LAKE_Y ? 1 : 0,
      /* and the point in world space, so a harness can PUT THE CAMERA THERE. A place with an
         interior cannot be checked from its arrival shot — four gardens round a hall means three
         of them are behind it — and standing in one meant hand-converting approach coordinates
         to world every time. */
      w: [v.x, v.y, v.z],
    };
  },
  /* WHERE A PLACE COULD GO AT ALL. A destination's bearing and distance settle three things at
     once — what the ground is doing there, whether it stands in the water, and whether it
     intrudes on the menu's frame — and all three have to agree before any of it is modelled.
     The shrine's site was found by asking them one reload at a time; this asks the whole shore
     in one, which is the difference between choosing a site and settling for the first one. */
  site: (bearing, dist, half = 620) => {
    const c = destPlace(bearing, dist, 0);
    const f0 = c.clone().sub(HOME_EYE).setY(0).normalize();
    const s0 = new THREE.Vector3(-f0.z, 0, f0.x);
    let top = -Infinity, low = Infinity, wet = 0, n = 0;
    /* WHICH WAY THE SHORE RUNS, not just how much of the site is under it. A site that is 40%
       water is two completely different pictures depending on which 40%: water on the near side
       puts the lake between the camera and the building and hands you the reflection for free,
       water on the far side puts it behind where the building itself hides it. The first pass
       reported one number for both and picked the wrong one. */
    let near = 0, nearN = 0, far = 0, farN = 0;
    for (let f = -half; f <= half; f += 80) {
      for (let s = -half; s <= half; s += 80) {
        const p = c.clone().addScaledVector(f0, f).addScaledVector(s0, s);
        const y = groundAt(p.x, p.z);
        top = Math.max(top, Math.max(y, LAKE_Y));
        low = Math.min(low, y);
        if (y < LAKE_Y) wet++;
        if (f < 0) { nearN++; if (y < LAKE_Y) near++; }
        if (f > 0) { farN++; if (y < LAKE_Y) far++; }
        n++;
      }
    }
    const q = c.clone().project(camera);
    const up = c.clone().setY(c.y + 100).project(camera);
    return {
      top: Math.round(top), low: Math.round(low), fall: Math.round(top - low),
      wet: +(wet / n).toFixed(2), near: +(near / nearN).toFixed(2), far: +(far / farN).toFixed(2),
      /* how far out along the approach the water reaches, which is what decides whether the
         camera stands on the shore looking across, or on the bank with the lake behind */
      reach: (() => {
        for (let f = -half * 5; f <= 0; f += 120) {
          const p = c.clone().addScaledVector(f0, f);
          if (groundAt(p.x, p.z) < LAKE_Y) return Math.round(-f);
        }
        return 0;
      })(),
      sx: Math.round((q.x * 0.5 + 0.5) * W()), sy: Math.round((0.5 - q.y * 0.5) * H()),
      px: +(((q.y - up.y) * 0.5 * H()) / 100).toFixed(4),
      behind: q.z > 1 ? 1 : 0,
    };
  },
  /* THE WORLD FROM A FILE, replacing the generated one. Opt-in: nothing loads unless asked,
     because every measurement in RESEARCH.md was taken against the analytic world and a page
     that silently swapped it would invalidate all of them without saying so.
       NAV.loadEnv()            the default ./models/environment.glb
       NAV.loadEnv(url, {grid}) anything else; grid is the heightfield resolution
       NAV.unloadEnv()          put the generated world back, same camera */
  loadEnv: (url, opts) => loadEnvironment(url, opts),
  unloadEnv: () => unloadEnvironment(),

  /* the ground query itself, so a loaded model's heightfield can be compared against the

  /* THE WORLD AS IT STANDS, AS A FILE. A modelling pass should start from the real massing rather
     than from a screenshot and a table of numbers — the export IS the scale spec, so nothing has
     to be converted by hand and nothing can be converted wrongly.
     Loaded on demand: the exporter is 93KB and no normal use of this page needs it.
     The transform is reset for the duration, so what comes out sits at the origin, axis-aligned,
     rather than four thousand units out on a bearing. Outline hulls are skipped. */
  exportGLB: async (key) => {
    const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
    const src = key ? MARKS[key] : backScene;
    if (!src) return null;
    const keep = { p: src.position.clone(), q: src.quaternion.clone() };
    src.position.set(0, 0, 0);
    src.quaternion.identity();
    src.updateMatrixWorld(true);
    /* a shallow clone that leaves the hulls behind. Cloning rather than hiding, because
       `visible = false` is exactly what the exporter is entitled to ignore or not. */
    const strip = (o) => {
      const c = o.clone(false);
      o.children.forEach((ch) => {
        if (ch.isMesh && ch.material && ch.material.userData && ch.material.userData.outline) return;
        c.add(strip(ch));
      });
      return c;
    };
    const clean = strip(src);
    const buf = await new GLTFExporter().parseAsync(clean, { binary: true, onlyVisible: false });
    src.position.copy(keep.p);
    src.quaternion.copy(keep.q);
    src.updateMatrixWorld(true);
    let n = 0, tris = 0;
    clean.traverse((o) => { if (o.isMesh) { n++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
    return { bytes: Array.from(new Uint8Array(buf)), meshes: n, tris: Math.round(tris) };
  },
  marks: () => Object.keys(MARKS),
  outlineAudit: () => {
    const r = { meshes: 0, verts: 0, under: 0, worst: 1 };
    backScene.traverse((o) => {
      const g = o.geometry;
      if (!g || !g.attributes || !g.attributes.aFlat) return;
      r.meshes++;
      const n = g.attributes.normal, f = g.attributes.aFlat;
      for (let i = 0; i < n.count; i++) {
        const d = n.getX(i) * f.getX(i) + n.getY(i) * f.getY(i) + n.getZ(i) * f.getZ(i);
        r.verts++;
        if (d < 0.5) r.under++;
        if (d < r.worst) r.worst = d;
      }
    });
    r.pct = +(100 * r.under / Math.max(r.verts, 1)).toFixed(2);
    r.worst = +r.worst.toFixed(3);
    return r;
  },
  /* where the name-board actually lands on screen. A 3D title cannot be measured with
     getBoundingClientRect, and "is the title inside the safe zone" is precisely the question that
     a 1400x880 test window answered wrongly for the DOM version — so project it here. */
  /* the stand-in massing's own numbers, so a measurement can be stated in the building's terms
     ("the eave is 34 below the deck above") rather than in screen pixels alone */
  mass: () => STUDY_MASS,
  titleRect: (key) => screenRect(WORLD_TITLE[key || 'REVIEW']) };

/* PROJECTION BEHIND THE CAMERA IS NOT A SMALL ERROR, IT IS A WRONG ANSWER. `project` divides by w,
   and for a point behind the eye w is negative — so the point comes back mirrored through the
   origin and lands somewhere plausible-looking on screen. That has now produced two confident
   wrong conclusions in this project: a compound sitting 170 degrees behind the menu camera
   reported a 1,406-pixel-wide rect across the type column, and an enclosure the camera was
   standing inside reported rects of tens of thousands of pixels. Neither was in shot at all.
   Everything behind the eye now returns null, and a caller that gets null has its answer. */
function screenRect(o) {
  if (!o) return null;
  const box = new THREE.Box3().setFromObject(o);
  const v = new THREE.Vector3();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, front = 0;
  for (let i = 0; i < 8; i++) {
    v.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z);
    v.applyMatrix4(camera.matrixWorldInverse);
    if (v.z >= -camera.near) continue;          /* behind the eye: contributes nothing */
    front++;
    v.applyMatrix4(camera.projectionMatrix);
    const sx = (v.x * 0.5 + 0.5) * W(), sy = (0.5 - v.y * 0.5) * H();
    x0 = Math.min(x0, sx); y0 = Math.min(y0, sy); x1 = Math.max(x1, sx); y1 = Math.max(y1, sy);
  }
  if (!front) return null;
  const r = [x0, y0, x1, y1].map(Math.round);
  /* a box straddling the eye plane has no honest screen box — say so rather than guess */
  r.partial = front < 8;
  return r;
}

/* section -> [{el, obj, base}] in build order: items…, sign, back.
   Entrances move the CSS3DObject in world space rather than transforming the DOM: the plane
   root's transform belongs to CSS3DRenderer, and .w-in's transform belongs to the hover
   transition — animating either from GSAP fights something. Moving the object is also simply
   more truthful here, since these are meant to be things in a room. */
const L2_PLANES = {};
/* `at` is [x, y, z, yaw, scale, roll, height] — roll and height are optional and exist so books
   can lean at their own angles and stand at their own heights, which is what makes a row of
   spines read as separate books rather than one repeated object */
function wPlane(grp, cls, html, [x, y, z, ry, s = 1, rz = 0, h = 0]) {
  const el = document.createElement('div');
  el.className = 'w-plane ' + cls;
  el.innerHTML = '<div class="w-in">' + html + '</div>';
  if (h) el.style.height = h + 'px';
  const obj = new CSS3DObject(el);
  obj.position.set(x, y, z);
  obj.rotation.set(0, ry, rz);
  obj.scale.setScalar(s);
  grp.add(obj);
  return { el, obj, base: obj.position.clone(), phase: Math.random() * 6.28, spin: 0.5 + Math.random() * 0.6 };
}
function buildWorldMenus() {
  ITEMS.forEach((it, idx) => {
    const spec = L2_WORLD[it.en];
    const grp = ENVS[idx];
    if (!spec || !grp) return;
    const [sec, lo, hi] = SECTION_ACCENT[it.en];
    const made = [];
    const picks = [];
    /* a section with world-geometry level two gets no DOM tiles at all — building them and then
       hiding them leaves four invisible click targets hanging in front of the scene */
    (WORLD_L2[it.en] ? [] : SUBTILES[it.en]).forEach(([jp, en, meta], j) => {
      const p = wPlane(grp, spec.cls, spec.tpl(jp, en, meta, j), spec.at[j]);
      if (L3DATA[it.en] && L3DATA[it.en][jp]) {
        p.el.dataset.tile = jp;
        p.el.addEventListener('click', () => enterL3(it.en, jp));
      }
      picks.push(p.el);
      made.push(p);
    });
    /* selection is an event for every item, not just the one under the cursor: the pick slams
       forward and brightens while the rest flatten, desaturate and skew away behind it */
    picks.forEach((el) => {
      el.addEventListener('mouseenter', () => {
        picks.forEach((o) => o.classList.toggle(o === el ? 'is-hot' : 'is-cold', true));
        el.classList.remove('is-cold');
      });
      el.addEventListener('mouseleave', () => picks.forEach((o) => o.classList.remove('is-hot', 'is-cold')));
    });
    /* a section whose name is a board in the world does not also get one floating in front of
       it — the whole point of moving it into the scene is that there is only one of it */
    if (!(it.en === 'REVIEW')) {
      made.push(wPlane(grp, 'w-sign',
        `<span class="w-jp">${it.jp}</span><span class="w-en">${it.en}</span>`, spec.sign));
    }
    /* every plane carries its section's colour so --sec resolves without a shared ancestor */
    made.forEach((p) => {
      p.el.style.setProperty('--sec', sec);
      p.el.style.setProperty('--sec-lo', lo);
      p.el.style.setProperty('--sec-hi', hi);
      p.el.style.opacity = 0;
    });
    L2_PLANES[it.en] = made;
  });
}

function buildSub(i) {
  const it = ITEMS[i];
  const [sec, lo, hi] = SECTION_ACCENT[it.en];
  subEl.style.setProperty('--sec', sec);
  subEl.style.setProperty('--sec-lo', lo);
  subEl.style.setProperty('--sec-hi', hi);
  subEl.dataset.sec = it.en;
  backTab.style.setProperty('--sec', sec);
  /* the element, not a lookup: CSS3DRenderer only appends a plane's element to the document the
     first time it renders it, so a plane that starts hidden has no id to find */
  subWmEl.textContent = it.kanji;
  /* the board is level three's alone now; it stays out of the room until you drill in */
  showSubBoard(false);
  subEl.style.opacity = 0;
  subLevel = 2;
  (L2_PLANES[it.en] || []).forEach((p) => { p.el.style.opacity = 0; p.obj.position.copy(p.base); });
  /* a section either has its level two in the world or in front of it; nothing has both */
  worldL2 = WORLD_L2[it.en] || null;
  /* the class only governs whether the focus twins are tabbable — the tablets themselves are
     always there, so there is nothing to show or reset */
  document.body.classList.toggle('world-l2', !!worldL2);
}

/* Entrances slam rather than glide: short, hard-eased, tightly staggered, thrown in along the
   axis the cascade runs. `p.idle` is only handed over once the move lands, so the tick's drift
   never fights the tween. */
function l2Arrive(p, i, pace, from, ease = 'power4.out', spacing = 0.075) {
  const d = (0.2 + i * spacing) * pace;
  gsap.fromTo(p.el, { opacity: 0 }, { opacity: 1, duration: 0.26 * pace, delay: d, ease: 'power2.out' });
  p.idle = false;
  gsap.fromTo(p.obj.position,
    { x: p.base.x + (from.x || 0), y: p.base.y + (from.y || 0), z: p.base.z + (from.z || 0) },
    { x: p.base.x, y: p.base.y, z: p.base.z, duration: 0.46 * pace, delay: d, ease,
      onComplete: () => { p.idle = true; } });
}
const L2_INTRO = {

  STUDY: (ps, p) => ps.forEach((q, i) => l2Arrive(q, i, p, { x: -520, y: 300 })),
  REVIEW: (ps, p) => ps.forEach((q, i) => l2Arrive(q, i, p, { x: -900 }, 'power4.out', 0.065)),
  READING: (ps, p) => ps.forEach((q, i) => l2Arrive(q, i, p, { y: 640 }, 'power4.out', 0.08)),

  JLPT: (ps, p) => ps.forEach((q, i) => l2Arrive(q, i, p, { y: -330 }, 'back.out(1.7)', 0.085)),
  RECORDS: (ps, p) => ps.forEach((q, i) => l2Arrive(q, i, p, { z: 520 }, 'power4.out', 0.07)),

/* ---- WHIP: anticipation → velocity-matched stitched pan, world-scraps smearing past ---- */
function whipTo(restPos, restTgt, dir, card, done) {
  const dx = cam.tx - cam.px, dz = cam.tz - cam.pz;
  const base = Math.atan2(dz, dx), R = Math.hypot(dx, dz);
  const ty0 = cam.ty;
  const az = { a: 0 };
  const setA = () => {
    cam.tx = cam.px + Math.cos(base + az.a) * R;
    cam.tz = cam.pz + Math.sin(base + az.a) * R;
    cam.ty = ty0;
  };
  const tl = gsap.timeline({ onComplete: done });
  /* anticipation: a small breath AGAINST the turn before the whip */
  tl.to(az, { a: dir * -0.11, duration: 0.09, ease: 'power2.out', onUpdate: setA }, 0);
  tl.to(cam, { roll: dir * -1.2, duration: 0.09, ease: 'power2.out' }, 0);
  /* the whip — exits at ~10 rad/s */
  tl.to(az, { a: dir * 1.5, duration: 0.30, ease: 'power2.in', onUpdate: setA }, 0.09);
  tl.to(cam, { px: cam.px + dir * 26, roll: dir * 2.4, duration: 0.3, ease: 'power2.in' }, 0.09);
  tl.to(mb, { v: 5.5, duration: 0.26, ease: 'power2.in', onUpdate: applyMB }, 0.12);
  tl.to('#speedlines', { opacity: 0.9, duration: 0.16, ease: 'power2.in' }, 0.16);
  tl.fromTo('#speedlines', { x: 0 }, { x: dir * -420, duration: 0.6, ease: 'none' }, 0.16);
  tl.add(() => { boldStreaks(-dir); spawnGhostStreaks(-dir); swanDash(-dir); }, 0.24);
  if (card != null) tl.add(() => cutCard(card), 0.27);
  /* the stitch, at peak blur — arrive already panning the same direction (~10 rad/s matched) */
  tl.add(() => {
    Object.assign(cam, { px: restPos.x, py: restPos.y, pz: restPos.z, fov: 45 });
    const dx2 = restTgt.x - cam.px, dz2 = restTgt.z - cam.pz;
    const base2 = Math.atan2(dz2, dx2), R2 = Math.hypot(dx2, dz2);
    const az2 = { a: dir * -1.1 };
    tl.to(az2, {
      a: 0, duration: 0.33, ease: 'power3.out',
      onUpdate: () => {
        cam.tx = cam.px + Math.cos(base2 + az2.a) * R2;
        cam.tz = cam.pz + Math.sin(base2 + az2.a) * R2;
        cam.ty = restTgt.y;
      },
    }, 0.405);
  }, 0.40);
  tl.to(cam, { roll: dir * -0.9, duration: 0.2, ease: 'power2.out' }, 0.43);
  tl.to(cam, { roll: 0, fov: 44, duration: 0.3, ease: 'power2.out' }, 0.6);
  tl.to(mb, { v: 0, duration: 0.3, ease: 'power2.out', onUpdate: applyMB }, 0.43);
  tl.to('#speedlines', { opacity: 0, duration: 0.2 }, 0.5);
  return tl;
}
function selectWhip(i) {

/* ---- TURN: yaw to face the place, then fly to it ----
   The move the brief always described: you look at where you are going before you set off. Yaw
   and fly overlap rather than running in sequence — the turn leads and is finished by 62% of
   the way through, the flight starts at 18% and carries on to the end — because a camera that
   completes its turn, pauses, and only then moves reads as two shots rather than one.

   The look direction is interpolated as YAW AND PITCH, not by lerping the target through space.
   Lerping a point gives non-constant angular velocity — fast through the middle of a wide turn
   and slow at its ends — and the eye reads angular velocity, so the old swing had to discount
   its own pacing to compensate. Rotating at a constant rate needs no such correction. */
const _tdir = new THREE.Vector3();
function turnDirTo(place) {
  const a0 = Math.atan2(cam.tz - cam.pz, cam.tx - cam.px);
  const a1 = Math.atan2(place.z - cam.pz, place.x - cam.px);
  let d = a1 - a0;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d >= 0 ? 1 : -1;
}
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const easeInOutSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;

function turnTo(endEye, endTgt, done, openFrac) {
  const px0 = cam.px, py0 = cam.py, pz0 = cam.pz;
  const d0x = cam.tx - px0, d0y = cam.ty - py0, d0z = cam.tz - pz0;
  const r0 = Math.hypot(d0x, d0y, d0z);
  const d1x = endTgt.x - endEye.x, d1y = endTgt.y - endEye.y, d1z = endTgt.z - endEye.z;
  const r1 = Math.hypot(d1x, d1y, d1z);
  const yaw0 = Math.atan2(d0z, d0x), pit0 = Math.asin(d0y / r0);
  const yaw1 = Math.atan2(d1z, d1x), pit1 = Math.asin(d1y / r1);
  let dYaw = yaw1 - yaw0;
  while (dYaw > Math.PI) dYaw -= Math.PI * 2;
  while (dYaw < -Math.PI) dYaw += Math.PI * 2;

  const travel = Math.hypot(endEye.x - px0, endEye.y - py0, endEye.z - pz0);
  /* paced off the turn and the distance together: a 160° swing and a 5,000-unit run are both
     journeys, and one without the other still has to feel like it took the time it took */
  const dur = THREE.MathUtils.clamp(0.70 + Math.abs(dYaw) * 0.42 + travel / 5200, 1.1, 2.1);
  const heel = THREE.MathUtils.clamp(Math.abs(dYaw) / 2.4, 0, 1);
  const drive = { p: 0 };
  const tl = gsap.timeline({ onComplete: done });
  tl.to(drive, {
    p: 1, duration: dur, ease: 'none',
    onUpdate: () => {
      const p = drive.p;
      const q = easeOutCubic(THREE.MathUtils.clamp(p / 0.62, 0, 1));          /* the turn */
      const f = easeInOutSine(THREE.MathUtils.clamp((p - 0.18) / 0.82, 0, 1)); /* the flight */
      cam.px = px0 + (endEye.x - px0) * f;
      cam.py = py0 + (endEye.y - py0) * f + Math.sin(f * Math.PI) * (54 * heel);
      cam.pz = pz0 + (endEye.z - pz0) * f;
      const yaw = yaw0 + dYaw * q, pit = pit0 + (pit1 - pit0) * q;
      const rr = r0 + (r1 - r0) * q;
      const ch = Math.cos(pit) * rr;
      cam.tx = cam.px + Math.cos(yaw) * ch;
      cam.ty = cam.py + Math.sin(pit) * rr;
      cam.tz = cam.pz + Math.sin(yaw) * ch;
      /* the bank belongs to the TURN, so it peaks with the yaw rather than halfway through the
         whole move — otherwise a long flight after a short turn heels over at nothing */
      cam.roll = -Math.sign(dYaw) * Math.sin(Math.min(p / 0.62, 1) * Math.PI) * 6.5 * heel;
    },
  }, 0);
  tl.add(() => {
    gsap.fromTo(moonEl, { filter: 'brightness(1)' }, { filter: 'brightness(1.5)', duration: 0.26, yoyo: true, repeat: 1, ease: 'sine.inOut' });
  }, dur * 0.4);
  /* the destination assembles as a fraction of the move, so pacing holds at any distance */
  if (openFrac != null) tl.add(() => openSub(1), dur * openFrac);
  return tl;
}

/* ---- picking world-geometry level two ----
   A raycast against a fixed proxy box replaces DOM hit-testing.

   HOVER IS A SWING, NOT A LUNGE. Translating the tablet toward the camera and scaling it up did
   read as "picked", but it read as picked by being yanked off its cord — and the return tween
   went to z 0, which was never where the tablet started (they hang proud of the backing board at
   z = W·0.07), so letting go filed each one back INSIDE the wall. Rotating about the peg cannot
   have that bug, because the rest pose is an angle of zero rather than a position that has to be
   remembered. The gesture is also the true one: the bottom edge comes out toward you and the
   face tips up, which is what happens when somebody lifts a votive tablet to read it, and it
   happens to aim the writing at a camera standing above it. */
const _pickRay = new THREE.Raycaster();
const _pickNdc = new THREE.Vector2();
let worldL2 = null, worldHot = null;
function worldL2Bodies() { return worldL2 ? worldL2.picks.map((q) => q.hit) : []; }
function setHot(q) {
  if (worldHot === q) return;
  if (worldHot) {
    /* OVERWRITE, ALWAYS. Two tweens on the same property do not queue, they both run, and with
       an elastic ease of one duration racing a shorter one of another the loser can finish last
       and leave the tablet parked at the wrong angle — which is exactly what a fast hover and
       unhover produced. `overwrite: true` kills whatever else is animating this object first, so
       there is only ever one tween per tablet and the rest pose cannot be overshot into. */
    gsap.to(worldHot.root.rotation, { x: 0, duration: 0.5, ease: 'elastic.out(1, 0.7)', overwrite: true });
    const r = worldHot.emRest;
    gsap.to(worldHot.face.material.emissive, { r: r.r, g: r.g, b: r.b, duration: 0.28, overwrite: true });
  }
  worldHot = q;
  if (q) {
    gsap.to(q.root.rotation, { x: -0.30, duration: 0.72, ease: 'elastic.out(1, 0.55)', overwrite: true });
    /* a lift, not a floodlight: at 3x the writing washed off the tablet, which is the opposite
       of what picking one is for */
    const h = q.emHot;
    gsap.to(q.face.material.emissive, { r: h.r, g: h.g, b: h.b, duration: 0.2, overwrite: true });
  }
  document.body.style.cursor = q ? 'pointer' : '';
}
function worldPickAt(cx, cy) {
  if (!worldL2) return null;
  _pickNdc.set((cx / W()) * 2 - 1, -(cy / H()) * 2 + 1);
  _pickRay.setFromCamera(_pickNdc, camera);
  const hit = _pickRay.intersectObjects(worldL2Bodies(), false)[0];
  return hit ? worldL2.picks.find((q) => q.hit === hit.object) : null;
}
/* ---- the scenery that answers ----
   Tested only after the tablets have said no, so a menu item can never be shadowed by a piece of
   scenery standing in front of it. */
function ambientAt(cx, cy) {
  if (!AMBIENT.length) return null;
  _pickNdc.set((cx / W()) * 2 - 1, -(cy / H()) * 2 + 1);
  _pickRay.setFromCamera(_pickNdc, camera);
  const h = _pickRay.intersectObjects(AMBIENT.map((a) => a.hit), false)[0];
  return h ? AMBIENT.find((a) => a.hit === h.object) : null;
}
addEventListener('pointermove', (e) => {
  if (!worldL2 || state !== 'sub' || busy || subLevel !== 2) { setHot(null); return; }
  const q = worldPickAt(e.clientX, e.clientY);
  setHot(q);
  if (!q && ambientAt(e.clientX, e.clientY)) document.body.style.cursor = 'pointer';
});
addEventListener('click', (e) => {
  if (!worldL2 || state !== 'sub' || busy || subLevel !== 2) return;
  const q = worldPickAt(e.clientX, e.clientY);
  if (q) { pickWorldTile(subEl.dataset.sec, q.jp); return; }
  const a = ambientAt(e.clientX, e.clientY);

/* the focus twins are placed by projecting each tablet, so they track it exactly however the
   camera drifts — a fixed screen rectangle would part company the moment anything breathes */
const _proj = new THREE.Vector3();
function placeWorldPicks() {
  if (walkSec) {
    const w = WORLD_L3[walkSec];
    w.signs.forEach((q, k) => {
      if (k >= w.rows) { q.el.style.display = 'none'; return; }
      q.el.style.display = '';
      q.face.getWorldPosition(_proj);
      const d = camera.position.distanceTo(_proj);
      _proj.project(camera);
      /* a point behind the camera projects to a flipped, meaningless place — the sign you have
         just walked past was landing a 560px focus rectangle in the middle of the screen */
      if (_proj.z > 1) { q.el.style.display = 'none'; return; }
      const s2 = (H() / 2) / Math.tan((camera.fov / 2) * D2R) / d;
      const ww = 168 * s2, hh = 102 * s2;
      q.el.style.left = `${(_proj.x * 0.5 + 0.5) * W() - ww / 2}px`;
      q.el.style.top = `${(-_proj.y * 0.5 + 0.5) * H() - hh / 2}px`;
      q.el.style.width = `${ww}px`;
      q.el.style.height = `${hh}px`;
    });
    return;
  }
  if (!worldL2) return;
  for (const q of worldL2.picks) {
    /* the tablet, not the peg — the group's origin moved up to the rail */
    q.body.getWorldPosition(_proj);
    const d = camera.position.distanceTo(_proj);
    _proj.project(camera);
    /* projected from the tablet's own width and height rather than from a constant tuned once
       against one wall — the constant was 236 units against tablets 42 wide, so every focus
       rectangle was five times the size of the thing it belonged to and they all overlapped */
    const k = (H() / 2) / Math.tan((camera.fov / 2) * D2R) / d;
    const w = q.tw * k, h = q.th * k;
    q.el.style.left = `${(_proj.x * 0.5 + 0.5) * W() - w / 2}px`;
    q.el.style.top = `${(-_proj.y * 0.5 + 0.5) * H() - h / 2}px`;
    q.el.style.width = `${w}px`;
    q.el.style.height = `${h}px`;
  }
}

    if (e.key === 'ArrowDown') { setActive((active + 1) % ITEMS.length); itemEls[active].focus({ preventScroll: true }); }
    else if (e.key === 'ArrowUp') { setActive((active + ITEMS.length - 1) % ITEMS.length); itemEls[active].focus({ preventScroll: true }); }
    else if (e.key === 'Enter') select(active);
    else if (e.key >= '1' && e.key <= '6') { const i = +e.key - 1; setActive(i); itemEls[i].focus({ preventScroll: true }); }
    else if (e.key === 't' || e.key === 'T') { if (!busy) setTmode(tmode === 1 ? 2 : 1); }
  } else if (state === 'sub' && walkSec) {
    /* moving IS the scrollbar down here */
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') walkGo(walkAt + 1);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') walkGo(walkAt - 1);
    else if (e.key === 'Escape' || e.key === 'Backspace') goBack();
  } else if (state === 'sub' && (e.key === 'Escape' || e.key === 'Backspace')) goBack();
});

/* Is the menu's own composition still in shot? Measured as the angle between the camera's view
   axis and the direction to what the menu is framed around, against the real horizontal half-cone
   plus a margin for the backdrop's own width. (HOME_LOOK itself now lives beside HOME_EYE, near
   the top — they are one pair, and having them two and a half thousand lines apart is what put
   the second of them inside its own dead zone when the boot sequence started composing home.) */
const _hv1 = new THREE.Vector3(), _hv2 = new THREE.Vector3(), _hv3 = new THREE.Vector3();
let dropHomeWhenClear = false;
function homeIsOffScreen() {
  _hv1.set(cam.px, cam.py, cam.pz);
  _hv2.copy(HOME_LOOK).sub(_hv1).setY(0);
  _hv3.set(cam.tx, cam.ty, cam.tz).sub(_hv1).setY(0);
  if (_hv2.lengthSq() < 1 || _hv3.lengthSq() < 1) return false;
  const halfH = Math.atan(Math.tan((cam.fov / 2) * D2R) * (innerWidth / innerHeight));
  return _hv2.angleTo(_hv3) > halfH + 0.38;
}

/* ================= frame loop ================= */
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* weather drifts across the valley — slow enough to read as cloud, not as a scrolling
     texture. The needsUpdate sweep is what actually gets the offset to the GPU; see the
     uniform trap above. */
  CLOUD.uCloudOff.value.set(t * 0.0075, t * -0.0028);
  for (const m of CLOUD_MATS) m.needsUpdate = true;
  lakeWater.material.uniforms.uTime.value = t;
  /* the lake is only in frame at the menu, and a rippled reflection at half rate is
     indistinguishable from one at full rate */
  /* COUNTED PER FRAME, NOT PER PASS. three resets renderer.info at the start of every
     render() call, so with autoReset on, `info.render.triangles` reports only the LAST pass —
     which meant every triangle count taken off this scene, including the 5.16M that started the
     optimisation work, silently excluded the reflection. It is reset once here instead, so the
     number means what anyone reading it would assume: the cost of this frame. */
  backRenderer.info.autoReset = false;
  backRenderer.info.reset();
  if ((state === 'menu' || busy) && (reflectTick++ & 1) === 0) renderReflection();

  if (dropHomeWhenClear && homeIsOffScreen()) {
    dropHomeWhenClear = false;
    showHome(false);
  }

  /* nothing rests: a settled level two keeps drifting and canting. Applied to the object, not
     the DOM, so it never collides with the hover transform — and only once the entrance has
     finished handing the object back (l2Idle), and only at level two, since the level-three
     unroll owns these positions while it is up. */
  if (!reduced && state === 'sub' && subLevel === 2) {
    const set = L2_PLANES[subEl.dataset.sec];
    if (set) {
      for (const p of set) {
        if (!p.idle) continue;
        p.obj.position.y = p.base.y + Math.sin(t * p.spin + p.phase) * 7;
        p.obj.position.x = p.base.x + Math.cos(t * p.spin * 0.7 + p.phase) * 4;
        p.obj.rotation.z = Math.sin(t * p.spin * 0.55 + p.phase) * 0.012;
      }
    }
  }

  if (!reduced) {
    const arr = pGeo.attributes.position.array;
    for (let i = 0; i < P_COUNT; i++) {
      arr[i*3]     += Math.sin(t * 0.3 + pVel[i*2]) * 2.4 * dt;
      arr[i*3 + 1] -= pVel[i*2 + 1] * dt;
      if (arr[i*3 + 1] < -950) arr[i*3 + 1] = 950;
    }
    pGeo.attributes.position.needsUpdate = true;

    const eArr = eGeo.attributes.position.array;
    for (let i = 0; i < E_COUNT; i++) {
      eArr[i*3 + 1] += (4 + (i % 5)) * dt;
      eArr[i*3]     += Math.sin(t * 0.5 + i) * 3 * dt;
      if (eArr[i*3 + 1] > 950) eArr[i*3 + 1] = -850;
    }
    eGeo.attributes.position.needsUpdate = true;

    const mArr = mGeo.attributes.position.array;
    for (let i = 0; i < M_COUNT; i++) {
      mArr[i*3]     += Math.sin(t * 0.6 + mVel[i*2]) * 5 * dt;
      mArr[i*3 + 1] += mVel[i*2 + 1] * dt;
      if (mArr[i*3 + 1] > 700) mArr[i*3 + 1] = -650;
    }
    mGeo.attributes.position.needsUpdate = true;

    clouds.forEach((c2) => {
      c2.material.rotation += c2.userData.rot;
      const b = 1 + Math.sin(t * 0.14 * c2.userData.breathe) * 0.05;
      c2.scale.set(c2.userData.base * b, c2.userData.base * 0.7 * b, 1);
    });
    ensoObj.rotation.z += 0.00045;

    /* ambient: the words breathe on the night air */
    itemObjs.forEach((obj, i) => {
      obj.position.y = itemBaseY[i] + Math.sin(t * 0.7 + i * 1.1) * 5;
      obj.rotation.z = (itemBaseRZ[i] + Math.sin(t * 0.5 + i * 2.3) * 0.28) * D2R;
    });
    /* watermark inhales */
    const wb = (1 + Math.sin(t * 0.32) * 0.02) * wmPulse.v;
    wmObj.scale.set(wb, wb, 1);
    /* thought-kanji drift */
    FLOATERS.forEach((f) => {
      f.obj.position.y = f.baseY + Math.sin(t * f.speed + f.phase) * 16;
      f.obj.position.x = f.baseX + Math.sin(t * f.speed * 0.6 + f.phase * 2) * 22;
    });
    /* mist slides */
    MISTS.forEach((m) => {
      m.obj.position.x = m.baseX + Math.sin(t * 0.08 + m.phase) * 160;
    });
    swanTick(dt, t);
  }

  applyCamera();
  depthDress();
  for (const q of WORLD_SWAY) q.root.rotation.z = Math.sin(t * q.swayR + q.swayP) * 0.045;
  placeWorldPicks();
  /* the sky travels with the eye, so it is never seen as the sphere it is */
  if (SKY_DOME) SKY_DOME.position.copy(camera.position);
  /* and the sun faces it, since nothing else is going to do that for a Mesh */
  if (SUN_MESH) SUN_MESH.quaternion.copy(camera.quaternion);
  for (let i = 0; i < SMALL_WATER.length; i++) {
    SMALL_WATER[i].uniforms.uTime.value = t;
    SMALL_WATER[i].uniforms.uSun.value.copy(SUN_DIR_LIVE);
  }
  /* the clouds walk round the ring. Slowly: at 0.001 rad/s a cloud crosses the frame in about
     four minutes, which is weather rather than a screensaver. */
  for (let i = 0; i < CLOUDS.length; i++) {
    const c = CLOUDS[i], u = c.userData;
    u.az += u.drift * dt;
    c.position.x = EYE.x + Math.cos(u.az) * u.dist;
    c.position.z = EYE.y + Math.sin(u.az) * u.dist;
  }
  /* one float, so no hand-written shader can ever be fogging at a density the scene left behind */
  FOG_U.fogDensity.value = backScene.fog.density;
  if (POST.on) renderPost(); else backRenderer.render(backScene, camera);
  /* the ink goes on OVER the finished frame, alpha-blended, so the main render still goes
     straight to the canvas and nothing about the colour path changes */
  renderInk();
  cssRenderer.render(cssScene, camera);
  frontRenderer.render(frontScene, camera);
  requestAnimationFrame(tick);
}

/* ================= THE LOOK BAR =================
   Every one of these was a URL parameter or a console line, which is a bad way to compare two
   versions of a picture: by the time you have typed it you are no longer looking at the first
   one. As buttons they are an A/B you can flip while staring at the same frame.
   Three of them are live because they are uniforms or a data texture, and one is not: the
   terrain repaint is baked into vertex colours by the loader, so it can only change by loading
   again. That one carries its state in the URL and reloads; the rest remember in localStorage.
   Declared here, at the end, so every const it touches is already initialised — the same
   temporal-dead-zone rule that has bitten this file eight times. */
{
  const CLOUD_BASE = CLOUD.uCloudAmt.value;
  const q = new URLSearchParams(location.search);
  const saved = (k, d) => {
    const v = localStorage.getItem('sumi3d-look-' + k);
    return v === null ? d : v === '1';
  };
  const LOOK = {
    cel: { get: () => CEL.mode === 'new', set: (on) => setCelMode(on ? 'new' : 'old') },
    ink: { get: () => INK.on, set: (on) => { INK.on = on; } },
    cloud: {
      get: () => CLOUD.uCloudAmt.value > 0,
      set: (on) => {
        CLOUD.uCloudAmt.value = on ? CLOUD_BASE : 0;
        CLOUD_MATS.forEach((m) => { m.needsUpdate = true; });
      },
    },
    post: { get: () => POST.on, set: (on) => { POST.on = on; } },
    /* the loader bakes this one into the terrain's vertex colours, so the only way to change it
       is to load again with the flag set */
    lift: {
      reloads: true,
      get: () => q.get('lift') === 'on',
      set: (on) => {
        const u = new URL(location.href);
        if (on) u.searchParams.set('lift', 'on'); else u.searchParams.delete('lift');
        location.href = u.toString();
      },
    },
  };
  const lookChips = [...document.querySelectorAll('.look-chip')];
  const paint = () => lookChips.forEach((c) => c.classList.toggle('on', LOOK[c.dataset.look].get()));
  /* restore the remembered state before the first paint, but never for the reloading one and
     never over an explicit URL parameter */
  for (const [k, o] of Object.entries(LOOK)) {
    if (o.reloads || q.has(k)) continue;
    const want = saved(k, o.get());
    if (want !== o.get()) o.set(want);
  }
  lookChips.forEach((c) => c.addEventListener('click', () => {
    const k = c.dataset.look, o = LOOK[k];
    const on = !o.get();
    if (!o.reloads) localStorage.setItem('sumi3d-look-' + k, on ? '1' : '0');
    o.set(on);
    paint();
  }));
  paint();
}

tick();
</script>
</body>
</html>
